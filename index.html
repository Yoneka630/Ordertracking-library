<!doctype html>
<html lang="zh-CN" data-page-node-id="FunhV63PNaLfHkr1kHUFxh">
<head data-page-node-id="tB8joMdTgw5XU4U8A6S7i2">
<meta charset="utf-8" data-page-node-id="iTOrAHcHmC5x6FNHHjD886">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" data-page-node-id="Ja1BDKMDLVRzLRExrICqlT">
<title>订单追踪工作台 · v0.28</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4b77cb">
<link rel="icon" href="icon-192.png">
<style>
/* ============ 扁平浅色设计系统 v0.4 ============ */
:root{
  /* v0.21 · 配色降饱和：语义色整体往灰调靠，长时间看数据不刺眼；
     涨跌语义不变（红=风险/未收，绿=正常/已收）。 */
  --bg:#f6f8fb; --panel:#fff; --line:#e8ecf2; --line-2:#f3f5f9;
  --text:#1a2433; --muted:#5f6c7e; --faint:#99a4b3;
  --primary:#4b77cb; --primary-600:#3d66b8; --primary-soft:#edf3fc;
  --red:#c9524a; --red-600:#a9433c; --red-soft:#faeeed;
  --orange:#cd8247; --orange-soft:#fcf2e9;
  --amber:#a17340; --amber-soft:#f9f1e4;
  --green:#3d8a5c; --green-soft:#eaf4ee;
  --teal:#3d8f89; --teal-soft:#e9f4f3;
  --slate:#5a6678; --slate-soft:#eff1f5;
  /* 圆角收小：默认 6px（卡片），控件统一 4px */
  --radius:6px; --radius-ctl:4px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03);
  --sw:216px; --topbar-h:50px; --ctl-h:32px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}

/* ---------- 侧边栏（浅色扁平） ---------- */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:70;
  transition:transform .2s ease}
.sb-logo{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.sb-logo .mark{width:28px;height:28px;border-radius:6px;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center}
.sb-logo .t{font-size:14px;font-weight:700;color:var(--text);line-height:1.2}
.sb-logo .s{font-size:10.5px;color:var(--faint)}
.sb-nav{flex:1;overflow-y:auto;padding:10px}
.sb-nav .grp{color:var(--faint);font-size:10.5px;padding:12px 10px 5px;letter-spacing:.8px;font-weight:600}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:5px;color:var(--muted);
  font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:background .12s,color .12s}
.sb-nav a:hover{background:var(--line-2);color:var(--text)}
.sb-nav a.on{background:var(--primary);color:#fff;font-weight:600}
.sb-nav a .ico{width:18px;text-align:center;font-size:15px}
.sb-nav a .cnt{margin-left:auto;background:var(--line-2);color:var(--muted);border-radius:10px;
  font-size:10px;padding:0 6px;min-width:18px;text-align:center}
.sb-nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sb-foot{padding:11px 14px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.7}
.sb-foot .ds{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sb-foot .dot.warn{background:var(--orange)}

/* ---------- 主区 / 粘性头部（顶栏 + 全局筛选一起钉住） ---------- */
#main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
header.stick{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line)}
#topbar{display:flex;align-items:center;gap:10px;height:var(--topbar-h);padding:0 18px;border-bottom:1px solid var(--line-2)}
#topbar .ttl{font-size:15.5px;font-weight:700}
#topbar .sub{font-size:11.5px;color:var(--faint)}
.spacer{flex:1}
.hamb{display:none;border:1px solid var(--line);border-radius:var(--radius-ctl);padding:5px 10px;font-size:15px;color:var(--muted)}

/* ---------- 全局筛选栏（所有页面可见可用） ---------- */
#gfilter{border-bottom:1px solid var(--line);background:var(--panel)}
#gfilter .inner{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:9px 18px}
.gf-label{font-size:10.5px;color:var(--faint);margin-bottom:3px;font-weight:600;letter-spacing:.3px}
.gf{min-width:120px}
.gf input,.gf select{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:5px 8px;background:var(--panel);font-size:13px;width:100%;height:var(--ctl-h)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-ctl);overflow:hidden;background:var(--panel);height:var(--ctl-h)}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--line-2);color:var(--text)}
.seg button.on{background:var(--primary-soft);color:var(--primary-600);font-weight:600}
#gfilter .tools{display:flex;gap:6px;align-items:center;margin-left:auto}

/* ---------- 按钮 ---------- */
/* 圆角统一收小；高度固定 32px 让同行按钮顶底对齐 */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-ctl);padding:6px 12px;font-size:13px;color:var(--muted);
  height:var(--ctl-h);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
.btn:hover{border-color:#d3dae4;color:var(--text);background:var(--line-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-600)}
.btn.sm{padding:2px 9px;font-size:12px;border-radius:3px;height:26px}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:#e5c9c6;background:var(--red-soft);color:var(--red-600)}

/* ---------- 布局 ---------- */
#page{padding:16px 20px 44px;max-width:1560px;width:100%}
.grid{display:grid;gap:12px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(370px,1fr))}
/* 订单详情：等宽两列网格；每行两张卡拉伸到同高（align-items:stretch），顶端/底端都对齐，排版整齐 */
.od2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;margin-top:14px}
.od2 > .card{display:flex;flex-direction:column}
.od2 > .card > .bd{flex:1}
.od-info{grid-column:1;grid-row:1}.od-trade{grid-column:2;grid-row:1}
.od-prod{grid-column:1;grid-row:2}.od-ship{grid-column:2;grid-row:2}
.od-pay{grid-column:1;grid-row:3}.od-follow{grid-column:2;grid-row:3}
@media(max-width:760px){.od2{grid-template-columns:1fr}.od-info,.od-trade,.od-prod,.od-ship,.od-pay,.od-follow{grid-column:1;grid-row:auto}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.card .hd{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hd h3{font-size:13.5px}
.card .bd{padding:15px}
.card .bd.np{padding:0}
.sec{font-size:11.5px;color:var(--faint);margin:20px 0 9px;font-weight:700;letter-spacing:.6px}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);background:var(--line-2);border:1px solid var(--line-2);
  border-radius:var(--radius-ctl);padding:9px 12px;margin-bottom:12px;line-height:1.7}
/* v0.27 · 「i」说明图标：说明文字仍留在 DOM 内（.ii-t），只是不铺在页面上；
   悬停浮出、点击钉住（.on）。用 position:fixed 是为了不被 .tw / .card 的 overflow 裁掉。 */
.ii{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;flex:none;
    border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--muted);
    font:italic 700 10.5px/1 Georgia,"Times New Roman",serif;cursor:help;vertical-align:middle;margin-left:6px;
    user-select:none;transition:border-color .12s,color .12s,background .12s}
.ii:hover,.ii.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.ii.warn{border-color:#e0b0ab;color:var(--red)}
.ii.warn:hover,.ii.warn.on{border-color:var(--red);background:var(--red);color:#fff}
.ii-t{position:fixed;left:0;top:0;z-index:300;width:max-content;max-width:330px;visibility:hidden;opacity:0;
    pointer-events:none;white-space:normal;text-align:left;font-size:11.5px;font-weight:400;font-style:normal;
    color:var(--text);line-height:1.7;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-ctl);padding:9px 11px;box-shadow:0 8px 24px rgba(15,23,42,.16);
    transition:opacity .12s}
.ii-t b{color:var(--text)}
.ii-t code{background:var(--line-2);border-radius:3px;padding:1px 4px;font-size:11px}
.ii.on>.ii-t{visibility:visible;opacity:1}
.toolbar .ii,.hd .ii,.selbar .ii{margin-left:2px}
/* 订单卡片：多行字段（思源数据库卡片的样子） */
.mc-line{font-size:11.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-kv{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.mc-kv .kv{font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
.mc-kv .kv em{font-style:normal;color:var(--faint);margin-right:3px}
.mc-kv .kv .ok{color:var(--green)} .mc-kv .kv .bad{color:var(--red)}
.cfrow{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12.5px;color:var(--text);cursor:pointer}
.cfrow:hover{background:var(--line-2)}
.cfrow input{margin:0}
.empty{text-align:center;padding:34px 16px;color:var(--faint);font-size:13px}

/* ---------- 标签：浅色为主，关键信息用实底突出 ---------- */
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:4px;white-space:nowrap;font-weight:500}
.t-gray{background:var(--slate-soft);color:var(--slate)}
.t-blue{background:var(--primary-soft);color:var(--primary-600)}
.t-orange{background:var(--orange-soft);color:var(--orange)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-red{background:var(--red-soft);color:var(--red)}
/* 实底 = 一眼抓住的关键信息 */
.tag.solid-green{background:var(--green);color:#fff}
.tag.solid-red{background:var(--red);color:#fff}
.tag.solid-slate{background:var(--slate);color:#fff}
.tag.solid-primary{background:var(--primary);color:#fff}

/* v0.20 · 数据历史页：快照 / 回收站行 */
.hrow{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow:first-child{padding-top:0}
.hmain{min-width:0;flex:1}
.htitle{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hact{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

/* KPI */
.kpi .card{padding:12px 15px;display:flex;flex-direction:column;gap:1px}
.kpi .lb{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.3px}
.kpi .vl{font-size:23px;font-weight:700;margin:2px 0 0;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .sb2{font-size:11px;color:var(--faint)}
.kpi .vl.good{color:var(--green)} .kpi .vl.warn{color:var(--orange)} .kpi .vl.bad{color:var(--red)}
.red{color:var(--red)} .green{color:var(--green)} .orange{color:var(--orange)}

/* 表格 */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--line-2);font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f7f9fc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;
  background:var(--line-2);font-size:10.5px;font-weight:700;color:var(--muted)}
.rank.r1{background:#f6e7b2;color:#8a6100} .rank.r2{background:#e6ecf3;color:#46586c} .rank.r3{background:#f6d9cf;color:#a53a18}

/* 进度 */
.pbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.pbar i.good{background:var(--green)} .pbar i.bad{background:var(--red)}

/* 弹层 */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:150;display:none;overflow-y:auto}
#mask.on{display:block}
#sheet{background:var(--bg);max-width:920px;margin:26px auto;border-radius:10px;overflow:hidden;
  box-shadow:0 20px 60px rgba(15,23,42,.18)}
/* 订单详情等宽两列布局需要更宽的面板，卡片才够宽、内容不被裁切 */
#sheet.wide{max-width:min(1360px,96vw)}
#sheet .hd{background:var(--panel);padding:13px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
#sheet .bd{padding:15px 18px 26px}
.close{font-size:20px;color:var(--faint);line-height:1;padding:2px 6px;border-radius:4px}
.close:hover{background:var(--line-2);color:var(--text)}

/* 表单 */
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:12px;align-items:start}
.fld{min-width:120px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;line-height:16px;min-height:16px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:6px 10px;
  background:var(--panel);width:100%;transition:border .12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)}
.fld input[readonly]{background:var(--line-2);color:var(--muted)}
.req{color:var(--red);margin-left:2px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red);background:#fdf7f6}
.fmsg{font-size:11px;color:var(--red);margin-top:3px;line-height:1.5}
.fld .tip{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.5}
.fld.full{grid-column:1/-1}
/* 字段显隐用 class 切换而非增删 DOM：避免输入过程中重建输入框导致光标/焦点丢失 */
.fld.hidden{display:none}
.fhint:empty{display:none}
code{background:var(--line-2);border-radius:3px;padding:1px 5px;font-size:12px}

/* ---------- v0.21 · 卡片与表单相对对齐 ---------- */
/* 所有输入类控件同高（--ctl-h=32px）：同一行内、以及跨卡片的填写框顶底都对齐。
   textarea 不锁高（多行内容要能撑开）。 */
.fld input:not([type=checkbox]):not([type=radio]),.fld select{height:var(--ctl-h);line-height:20px}
.fld textarea{line-height:1.6}
/* 字段里若只有一个复选框（如「启用同步」），补一个与输入框等高对齐的上边距，
   否则它会紧贴标签、比同行输入框高一截。 */
.fld > input[type=checkbox]{width:15px;height:15px;margin:9px 0 0;flex:none;accent-color:var(--primary)}
/* 卡片头 / 卡片体左右内边距统一为 15px，跨卡片的内容左边缘严格对齐 */
.card > .hd{padding:11px 15px}
.card > .bd{padding:15px}
/* 字段内出现提示行时不把控件顶歪：提示行统一贴在控件下方 */
.fld .tip,.fld .fmsg{margin-top:3px}

/* 文件控件 */
.filecard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:5px;
  padding:8px 11px;background:var(--panel)}
.filecard .fi{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary-600);font-size:10px;font-weight:700;flex:none}
.filecard .fn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .fs{font-size:11px;color:var(--faint)}
.drop{border:1.5px dashed #d7dde6;border-radius:5px;padding:15px;text-align:center;color:var(--muted);
  font-size:13px;background:#fcfdfe;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.fprev{margin-top:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.fprev img{display:block;max-width:100%}
.fprev iframe{display:block;width:100%;height:420px;border:0}

/* 更多菜单 */
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:30px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;box-shadow:0 10px 34px rgba(15,23,42,.14);min-width:132px;padding:5px;z-index:10;display:none}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:13px;border-radius:4px}
.menu .pop button:hover{background:var(--line-2)}
.menu .pop button.del{color:var(--red)}

.toast{position:fixed;right:18px;bottom:18px;z-index:300;background:var(--text);color:#fff;padding:9px 15px;
  border-radius:5px;font-size:13px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:none}
#tip{position:fixed;z-index:200;background:var(--text);color:#fff;border-radius:4px;padding:6px 9px;font-size:12px;
  pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ---------- 工具条 / 快捷筛选 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;
  font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip:hover{border-color:#d3dae4;color:var(--text)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.chip .n{opacity:.7;margin-left:4px;font-size:11px}
.chip.sm{padding:2px 10px;font-size:12px}

/* ---------- v0.23 · 多维多选筛选面板 ---------- */
.fpanel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:10px 15px 11px;margin-bottom:12px;box-shadow:var(--sh)}
.fp-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:9px;
  border-bottom:1px solid var(--line-2);margin-bottom:9px}
.fp-hd .t{font-size:13px;font-weight:700}
.fp-hd .muted{font-size:11.5px}
.fp-grp{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;padding:5px 0;
  border-top:1px dashed var(--line-2)}
.fp-grp:first-of-type{border-top:0;padding-top:1px}
.fp-grp > .lb{width:56px;flex:none;font-size:11.5px;color:var(--faint);font-weight:600;
  letter-spacing:.3px;padding-top:6px;line-height:16px}
.qk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;

/* ==========================================================================

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const fmt = d => { if(!d) return ''; const x = new Date(d); if(isNaN(x)) return '';
  return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const shift = n => { const d = today(); d.setDate(d.getDate()+n); return d; };
const diffToday = d => Math.round((new Date(d) - today())/86400000);
/* 金额显示：至少 2 位小数；若实际有 3 位小数则完整显示 3 位（不四舍五入丢精度）。
   旧实现 maximumFractionDigits:0 会把 10115.5 显示成 ¥10,116、丢失全部小数。 */
const money = n => {
  const x = Number(n || 0), neg = x < 0;
  let [i, f] = Math.abs(x).toFixed(3).split('.');
  f = f.replace(/0+$/, '');
  if (f.length < 2) f = (f + '00').slice(0, 2);
  i = Number(i).toLocaleString('zh-CN');
  return (neg ? '-' : '') + '¥' + i + (f ? '.' + f : '');
};
const moneyShort = n => { const a = Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(2)+'亿';
  if(a>=1e4) return (n/1e4).toFixed(a>=1e6?0:1)+'万';
  return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ==========================================================================
   模块 3.5 · 数据历史（整库快照 + 删除回收站）  ·  v0.20
   ---------------------------------------------------------------------------
   为什么需要：此前唯一的「回退」是批量修改的 `batchUndo` —— 内存态、只保留最近
   一次、只管批量修改；误删一笔订单或改错一批数据都退不回来。S3 云端虽然存了历史
   快照文件，但只有「合并」消费路径，没有回滚入口。

   设计取舍：
     · 粒度 = 整库快照（6 张业务表 + 回收站一起存）。200 单实测约 0.16MB，
       体积完全可以接受；换来的是「一定能救回来」——不依赖任何增量日志的正确性。
     · 打点 = 写库前自动打一份（10 分钟内的连续改动合并成一份）＋ 关键操作前强制
       打一份（清空 / 导入 / 批量改 / 拉取）。两者用同一套闸门，不会刷屏。
     · 存储 = 独立 IndexedDB 库 ot_history → 降级 localStorage → 降级内存。
       独立库是为了**不动 FileStore 的 ot_files**：给已有库加 store 要走
       onupgradeneeded，一旦用户那边库版本不一致就有打不开的风险。
     · 淘汰 = 总数上限 HIST_MAX；超了先丢「自动」，再丢「关键操作」，最后才动
       「手动」——自动快照最廉价，手动是用户亲自存的，最后丢。
     · 回收站 = 删除不再物理抹掉，而是把整条记录搬进库内 `_trash`。业务表零残留，
       所以**所有读取路径都不用改**（这是它比 `_deleted` 软标记更安全的地方）。
       删订单时把订单 + 它的排产/发货/跟进打包成一组，还原即可整组回来。
   ========================================================================== */
const LS_DB_KEY_DEFAULT = 'ot.localdb.v2';

const HIST_MAX = 30;                       /* 快照总数上限 */
const HIST_COALESCE_MS = 10 * 60 * 1000;   /* 自动打点合并窗口：10 分钟内连续改动只留一份 */
const HIST_QUIET_MS = 3000;                /* 强制打点后的静默窗口，避免紧随的自动打点重复 */
const HIST_KIND_LABEL = { auto:'自动', key:'关键操作', manual:'手动' };
const TRASH_KEY = '_trash';                /* 回收站在库内的键名（不是业务表，不进 SCHEMA） */
const TRASH_MAX = 200;                     /* 回收站条目上限 */

/* 保留淘汰策略（抽成纯函数，便于单测与复用）：
   超出上限时先丢「自动」（最廉价、数量最多），再丢「关键操作」，最后才动「手动」
   —— 手动快照是用户亲自按下去的，最后丢。同档内先丢最老的。 */
const HIST_KIND_RANK = { auto:0, key:1, manual:2 };
function histPickEvictions(list, max){
  if(!Array.isArray(list) || list.length <= max) return [];
  return list.slice().sort((a, b) => {
    const ra = HIST_KIND_RANK[a.kind] == null ? 0 : HIST_KIND_RANK[a.kind];
    const rb = HIST_KIND_RANK[b.kind] == null ? 0 : HIST_KIND_RANK[b.kind];
    return ra !== rb ? ra - rb : a.at - b.at;
  }).slice(0, list.length - max).map(m => m.id);
}

/* ---------- 快照存储：独立 IndexedDB 库 → 降级 localStorage → 降级内存 ---------- */
const SnapshotStore = (function(){
  const DB_NAME = 'ot_history', DB_VER = 1;
  const IDX_KEY = 'ot.hist.idx';            /* localStorage 后端的索引 */
  const ITEM_PREFIX = 'ot.hist.d.';
  const LS_MAX = 6;                         /* localStorage 只有 5MB，只留最近 6 份 */
  const memMeta = new Map(), memData = new Map();
  let mode = '', _idb = null, _idbTried = false, _ready = null;

  const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
  const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };

  function openIDB(){
    if(_idbTried) return Promise.resolve(_idb);
    _idbTried = true;
    return new Promise(res => {
      try{
        if(typeof indexedDB === 'undefined'){ _idb = null; return res(null); }
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = e => { const d = e.target.result;
          if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath:'id' });
          if(!d.objectStoreNames.contains('data')) d.createObjectStore('data', { keyPath:'id' });
        };
        r.onsuccess = e => { _idb = e.target.result; res(_idb); };
        r.onerror   = () => { _idb = null; res(null); };
        r.onblocked = () => { _idb = null; res(null); };
      }catch(e){ _idb = null; res(null); }
    });
  }
  const idbOp = (store, write, fn) => new Promise((res, rej) => {
    try{
      const tx = _idb.transaction(store, write ? 'readwrite' : 'readonly');
      const rq = fn(tx.objectStore(store));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror  = () => rej(tx.error || new Error('IDB 事务失败'));
      tx.onabort  = () => rej(tx.error || new Error('IDB 事务中止'));
    }catch(e){ rej(e); }
  });

  /* 初始化 = **探测**后端是否真的可用（open 成功但写不进去也算不可用），
     真机上若 IDB 有问题会自动降级，不会让整个功能卡死。 */
  async function init(){
    if(mode) return mode;
    if(_ready) return _ready;
    _ready = (async () => {
      const d = await openIDB();
      if(d){
        try{
          await idbOp('meta', true, s => s.put({ id:'__probe__', at:0 }));
          await idbOp('meta', true, s => s.delete('__probe__'));
          mode = 'idb'; return mode;
        }catch(e){ mode = ''; }
      }
      if(lsSet('ot.hist.probe', 1)){ lsDel('ot.hist.probe'); mode = 'local'; }
      else mode = 'mem';
      return mode;
    })();
    return _ready;
  }

  async function put(snap){
    await init();
    const meta = { id:snap.id, at:snap.at, kind:snap.kind, reason:snap.reason,
                   size:snap.size || 0, counts:snap.counts || {}, trash:snap.trash || 0 };
    if(mode === 'idb'){
      try{
        await idbOp('meta', true, s => s.put(meta));
        await idbOp('data', true, s => s.put({ id:snap.id, db:snap.db }));
        return meta;
      }catch(e){ return null; }
    }
    if(mode === 'local'){
      const idx = lsGet(IDX_KEY, []);
      const keep = idx.slice();
      /* 先写内容；配额不够就从最老的开始丢，直到写成功 */
      let wrote = lsSet(ITEM_PREFIX + meta.id, { id:meta.id, db:snap.db });
      const olds = idx.slice().sort((a,b) => a.at - b.at);
      while(!wrote && olds.length){
        const old = olds.shift();
        lsDel(ITEM_PREFIX + old.id);
        const i = keep.findIndex(x => x.id === old.id); if(i >= 0) keep.splice(i,1);
        wrote = lsSet(ITEM_PREFIX + meta.id, { id:meta.id, db:snap.db });
      }
      /* 实在放不下就放弃这份快照 —— 绝不能为了存档把 localStorage 撑爆，
         那会连带把主数据也写不进去，是拿安全网去害命。 */
      if(!wrote){ lsDel(ITEM_PREFIX + meta.id); return null; }
      keep.unshift(meta);
      while(keep.length > LS_MAX){ const old = keep.pop(); lsDel(ITEM_PREFIX + old.id); }
      lsSet(IDX_KEY, keep);
      return meta;
    }
    memMeta.set(meta.id, meta); memData.set(meta.id, snap.db);
    const list = [...memMeta.values()].sort((a,b) => a.at - b.at);
    while(list.length > LS_MAX){ const old = list.shift(); memMeta.delete(old.id); memData.delete(old.id); }
    return meta;
  }

  /* 列表只读元数据（轻），内容按 id 单独取（重）—— 避免列个清单就把所有快照读进内存 */
  async function all(){
    await init();
    let list = [];
    if(mode === 'idb'){ try{ list = (await idbOp('meta', false, s => s.getAll())) || []; }catch(e){ list = []; } }
    else if(mode === 'local'){ list = lsGet(IDX_KEY, []); }
    else list = [...memMeta.values()];
    return (list || []).filter(m => m && m.id !== '__probe__').sort((a,b) => b.at - a.at);
  }
  async function get(id){
    await init();
    if(mode === 'idb'){ try{ const r = await idbOp('data', false, s => s.get(id)); return r ? r.db : null; }catch(e){ return null; } }
    if(mode === 'local'){ const r = lsGet(ITEM_PREFIX + id, null); return r ? r.db : null; }
    return memData.get(id) || null;
  }
  async function del(id){
    await init();
    if(mode === 'idb'){ try{ await idbOp('meta', true, s => s.delete(id)); await idbOp('data', true, s => s.delete(id)); }catch(e){} return; }
    if(mode === 'local'){ lsDel(ITEM_PREFIX + id); lsSet(IDX_KEY, lsGet(IDX_KEY, []).filter(m => m.id !== id)); return; }
    memMeta.delete(id); memData.delete(id);
  }
  async function clear(){
    await init();
    if(mode === 'idb'){ try{ await idbOp('meta', true, s => s.clear()); await idbOp('data', true, s => s.clear()); }catch(e){} return; }
    if(mode === 'local'){ lsGet(IDX_KEY, []).forEach(m => lsDel(ITEM_PREFIX + m.id)); lsDel(IDX_KEY); return; }
    memMeta.clear(); memData.clear();
  }

  /* 保留策略：先丢自动 → 再丢关键操作 → 最后才动手动；同档丢最老的 */
  async function enforce(){
    const list = await all();
    const victims = histPickEvictions(list, HIST_MAX);
    for(const id of victims) await del(id);
    return victims.length;
  }

  return { init, put, all, get, del, clear, enforce,
    bytes: list => (list || []).reduce((n, m) => n + (m.size || 0), 0),
    get mode(){ return mode || ''; },
    get label(){ return mode === 'idb' ? 'IndexedDB'
      : mode === 'local' ? 'localStorage（降级）'
      : mode === 'mem' ? '内存（刷新即失效）' : '（未初始化）'; } };
})();

/* ---------- 打点：自动（带合并窗口）· 关键操作强制 · 手动 ---------- */
let _histLastAutoAt = 0, _histQuietUntil = 0, _histPending = false;

function histReadDB(){
  /* 快照打的是「这次改动之前」的状态，所以必须在写库**前**读旧库 */
  try{ return JSON.parse(localStorage.getItem(LS_DB_KEY_DEFAULT)) || null; }catch(e){ return null; }
}
function histCounts(db){
  const c = {};
  Object.keys(SCHEMA).forEach(k => { c[k] = Array.isArray(db && db[k]) ? db[k].length : 0; });
  c[TRASH_KEY] = ((db && db[TRASH_KEY]) || []).length;
  return c;
}
async function histPush(db, kind, reason){
  if(!db) return null;
  try{
    const payload = JSON.parse(JSON.stringify(db));
    const size = JSON.stringify(payload).length;
    const meta = await SnapshotStore.put({ id: uid('HS'), at: Date.now(), kind: kind || 'auto',
      reason: reason || '自动存档', size, counts: histCounts(payload),
      trash: ((payload[TRASH_KEY]) || []).length, db: payload });
    if(meta) SnapshotStore.enforce();      /* 淘汰丢到后台，不拖慢调用方 */
    return meta;
  }catch(e){ return null; }        /* 打点失败绝不能影响主流程 */
}
/* 写库前自动打点：10 分钟内只留一份。并发写库由 _histPending 闸门合并 ——
   否则批量修改的 137 次 _write 会各自读到「还没有自动快照」而打出 137 份。 */
async function histMaybeAuto(db, reason){
  const now = Date.now();
  if(now < _histQuietUntil || _histPending) return null;
  if(_histLastAutoAt && now - _histLastAutoAt < HIST_COALESCE_MS) return null;
  _histLastAutoAt = now; _histPending = true;
  try{ return await histPush(db, 'auto', reason); }
  finally{ _histPending = false; }
}
/* 关键操作前强制打点（忽略合并窗口）：保证「清空 / 导入 / 批量改 / 拉取」都有一份
   操作前的精确回退点 —— 只靠自动打点会被 10 分钟窗口挡掉，最多退回 10 分钟前。 */
async function histForceMark(reason){
  _histQuietUntil = Date.now() + HIST_QUIET_MS;
  _histLastAutoAt = Date.now();
  return histPush(histReadDB(), 'key', reason);
}
async function histManualMark(reason){ return histPush(histReadDB(), 'manual', reason || '手动存档'); }
/* 启动时同步一次「最近自动打点时刻」，避免刷新后第一笔改动立刻重复打点 */
async function histPrime(){
  try{ const a = (await SnapshotStore.all()).find(m => m.kind === 'auto'); if(a) _histLastAutoAt = a.at; }catch(e){}
}
/* 清空快照后重置闸门：否则「刚清完快照 → 立刻改数据」会被 10 分钟合并窗口挡住，
   白白丢一次打点机会，用户会以为清空把自动存档一起关掉了。 */
function histResetGate(){ _histLastAutoAt = 0; _histQuietUntil = 0; }

const fmtStamp = ts => { const d = new Date(ts); return (!ts || isNaN(d)) ? '—'
  : d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const fmtAgo = ts => { const s = Math.max(0, Math.round((Date.now() - (ts || 0)) / 1000));
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.round(s / 60) + ' 分钟前';
  if(s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前'; };
const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB'
  : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : (n || 0) + ' B';

/* 回滚前的差异预览：对比「当前库」与「目标快照」各表记录数，让用户知道会改什么 */
function histDiff(snap){
  const cur = histReadDB() || {};
  const out = [];
  Object.keys(SCHEMA).forEach(k => {
    const a = (cur[k] || []).length, b = (snap && snap[k] || []).length;
    if(a !== b) out.push({ res:k, label:RES_LABEL[k] || k, cur:a, snap:b });
  });
  return out;
}

/* 整库回滚到某个快照。关键点：回滚**本身**也先打一份「回滚前」快照 ——
   否则用户点错了就再也回不来，那是把安全网做成了陷阱。 */
async function histRestore(snapId, reason){
  const snap = await SnapshotStore.get(snapId);
  if(!snap) return { ok:false, msg:'快照内容已丢失（可能已被清理或存储降级导致）' };
  const src = Store.state.source;
  if(!src || typeof src.replaceAll !== 'function') return { ok:false, msg:'当前数据源不支持整库写入' };
  if(!src.capabilities || !src.capabilities.write) return { ok:false, msg:'当前数据源只读，无法回滚' };
  /* 注意：强制打点交给 replaceAll 内部做（它本来就会存一份「操作前」），
     这里不再单独调 → 否则一次回滚会留下两份内容完全相同的快照。 */
  const next = JSON.parse(JSON.stringify(snap));
  delete next._dropped;
  await src.replaceAll(next, '回滚前（即将回到「' + (reason || '快照') + '」）');
  await reload();
  return { ok:true };
}

/* ---------- 回收站 ---------- */
const RES_LABEL = { orders:'订单', production:'排产', shipments:'发货', followups:'跟进', customers:'客户', owners:'业务员' };
function rowTitle(res, row){
  row = row || {};
  if(res === 'orders')     return '订单 ' + (row.orderNo || row.id);
  if(res === 'production') return '排产 ' + (row.moNo || row.id);
  if(res === 'shipments')  return '发货 ' + (row.shipNo || row.id);
  if(res === 'followups')  return '跟进 ' + (row.date || row.id);
  if(res === 'customers')  return '客户 ' + (row.name || row.id);
  if(res === 'owners')     return '业务员 ' + (row.name || row.id);
  return (RES_LABEL[res] || res) + ' ' + row.id;
}
function pushTrash(db, items, label, files){
  db[TRASH_KEY] = db[TRASH_KEY] || [];
  const entry = { id: uid('TR'), at: Date.now(), label: label || '记录',
                  count: (items || []).length, files: (files || []).slice(),
                  items: (items || []).map(x => ({ res: x.res, row: x.row })) };
  db[TRASH_KEY].unshift(entry);
  /* 超上限：丢最老的，连同它的附件二进制一起清（否则文件会永久占空间） */
  while(db[TRASH_KEY].length > TRASH_MAX){
    const old = db[TRASH_KEY].pop();
    (old.files || []).forEach(f => { try{ FileStore.del(f); }catch(e){} });
  }
  return entry;
}
function trashSummary(entry){
  const by = {};
  ((entry && entry.items) || []).forEach(it => { by[it.res] = (by[it.res] || 0) + 1; });
  return Object.keys(by).map(r => (RES_LABEL[r] || r) + ' ' + by[r]).join(' · ');
}

class LocalDataSource extends DataSource {
  constructor(cfg){ super(cfg); this.key = (cfg && cfg.key) || 'ot.localdb.v2'; }
  get id(){ return 'local'; }
  get label(){ return '本地手工录入'; }
  get capabilities(){ return { read:true, write:true, realtime:false }; }
  _read(){ try{ return JSON.parse(localStorage.getItem(this.key)) || null; }catch(e){ return null; } }
  /* 落盘 + 写前打点：快照要存的是「这次改动之前」的状态，所以先读旧库再写。
     打点是异步的（IndexedDB），这里 fire-and-forget —— 绝不能让它拖慢或阻断写库。 */
  _write(db, reason){
    let prev = null;
    try{ prev = this._read(); }catch(e){}
    localStorage.setItem(this.key, JSON.stringify(db));
    if(prev) histMaybeAuto(prev, reason || '自动存档');
  }
  _migrate(db){
    if(!db || !Array.isArray(db.orders)) return db;
    const dirty = db.orders.some(o => LEGACY_MAP[o.status] !== undefined);
    if(!dirty) return db;
    const kept = [];
    let dropped = 0;
    db.orders.forEach(o => {
      const m = LEGACY_MAP[o.status];
      if(m === null){ dropped++; return; }
      if(m) o.status = m;
      kept.push(o);
    });
    db.orders = kept;
    db._dropped = dropped;
    return db;
  }
  async init(){
    let db = this._read();
    if(!db){ db = buildDemoData(); db._v = 4; this._write(db); return db; }
    const m = this._migrate(db);
    if(m._dropped) this._write(m);
    return m;
  }
  async list(res){ const db = await this.init(); return db[res] ? JSON.parse(JSON.stringify(db[res])) : []; }
  async create(res, row){ const db = await this.init(); db[res] = db[res] || []; db[res].push(stampRecord(row, true)); this._write(db); return row; }
  async update(res, id, patch){
    const db = await this.init(); const i = (db[res]||[]).findIndex(x => x.id === id);
    if(i < 0) throw new Error('记录不存在：'+id);
    const merged = { ...db[res][i], ...patch };
    stampRecord(merged, false);
    db[res][i] = merged; this._write(db); return db[res][i];
  }
  async remove(res, id){
    const db = await this.init();
    const row = (db[res]||[]).find(x => x.id === id);
    if(!row) return true;
    /* 移入回收站而非物理删除（详见模块 3.5）——附件二进制先留着，还原时还在 */
    pushTrash(db, [{ res, row }], rowTitle(res, row), (row.attachments||[]).map(a => a.id));
    db[res] = (db[res]||[]).filter(x => x.id !== id);
    this._write(db, '删除' + (RES_LABEL[res] || res)); return true;
  }
  /* 整组删除（订单 + 它的排产/发货/跟进）：打包成**同一条**回收站记录，
     这样还原时是整组回来，而不是散成一条条各还原各的。 */
  async removeGroup(items, label){
    const db = await this.init();
    const kept = [], files = [];
    (items || []).forEach(it => {
      const cur = (db[it.res]||[]).find(x => x.id === it.row.id);
      if(!cur) return;
      kept.push({ res: it.res, row: cur });
      (cur.attachments || []).forEach(a => files.push(a.id));
    });
    if(!kept.length) return { ok:false, n:0 };
    pushTrash(db, kept, label, files);
    kept.forEach(it => { db[it.res] = (db[it.res]||[]).filter(x => x.id !== it.row.id); });
    this._write(db, '删除' + (label || '记录'));
    return { ok:true, n: kept.length };
  }
  /* 附件二进制已被清空时调用：抹掉回收站里的文件引用，避免还原后出现断链附件 */
  async dropTrashFiles(){
    const db = await this.init();
    let n = 0;
    (db[TRASH_KEY] || []).forEach(e => { if(e.files && e.files.length){ n += e.files.length; e.files = []; } });
    if(n) this._write(db, '清理回收站附件引用');
    return n;
  }

  /* ---- 回收站：读 / 还原 / 彻底删除 ---- */
  /* 硬删除（不进回收站）：用于「清理演示数据」这类**不是误操作**的批量维护 ——
     否则 68 笔演示数据会把回收站 200 条上限灌满，把真实的误删记录挤掉。 */
  async hardRemove(res, ids){
    const db = await this.init();
    const set = new Set(Array.isArray(ids) ? ids : [ids]);
    const before = (db[res] || []).length;
    db[res] = (db[res] || []).filter(x => !set.has(x.id));
    const n = before - db[res].length;
    if(n) this._write(db, '清理' + (RES_LABEL[res] || res));
    return n;
  }
  async listTrash(){ const db = await this.init(); return JSON.parse(JSON.stringify(db[TRASH_KEY] || [])); }
  async restoreTrash(entryId){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    const i = list.findIndex(e => e.id === entryId);
    if(i < 0) return { ok:false, msg:'回收站里没有这条记录' };
    const e = list[i];
    let n = 0, skipped = 0;
    (e.items || []).forEach(it => {
      db[it.res] = db[it.res] || [];
      /* 同 id 已存在 → 不重复放回（用户可能已经手工重建了这笔） */
      if(db[it.res].some(x => x.id === it.row.id)){ skipped++; return; }
      db[it.res].push(it.row); n++;
    });
    list.splice(i, 1); db[TRASH_KEY] = list;
    this._write(db, '回收站还原');
    return { ok:true, n, skipped, label:e.label };
  }
  async purgeTrash(entryId){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    const i = list.findIndex(e => e.id === entryId);
    if(i < 0) return { ok:false };
    const e = list[i];
    /* 彻底删除才真正清附件二进制 */
    (e.files || []).forEach(f => { try{ FileStore.del(f); }catch(err){} });
    list.splice(i, 1); db[TRASH_KEY] = list;
    this._write(db, '彻底删除');
    return { ok:true, label:e.label, files:(e.files || []).length };
  }
  async clearTrash(){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    let files = 0;
    list.forEach(e => (e.files || []).forEach(f => { files++; try{ FileStore.del(f); }catch(err){} }));
    db[TRASH_KEY] = [];
    this._write(db, '清空回收站');
    return { ok:true, entries:list.length, files };
  }
  async bulkCreate(res, rows){ const db = await this.init(); const stamped = rows.map(r => stampRecord(r, true)); db[res] = (db[res]||[]).concat(stamped); this._write(db); return stamped.length; }
  async replaceAll(db, reason){
    await histForceMark(reason || '整库替换前（导入 / 恢复 / 云端合并）');
    /* 回收站是本地安全网：整库替换时保留本地那份（除非新库自带），
       否则一次云端拉取就会把还没处理的删除记录抹掉。 */
    if(db && db[TRASH_KEY] === undefined){
      const prev = this._read();
      if(prev && prev[TRASH_KEY]) db[TRASH_KEY] = prev[TRASH_KEY];
    }
    this._write(db, '整库替换');
  }
  /* 清空数据：keepMaster=true 时保留客户/业务员档案，只清业务数据。
     写库时打上 _seeded 标记，init() 检测到已有库就不会再灌演示数据。 */
  async clearAll(keepMaster){
    const db = await this.init();
    /* 清空是最需要「操作前精确回退点」的操作，强制打点（不吃 10 分钟合并窗口） */
    await histForceMark(keepMaster ? '清空业务数据前' : '清空全部数据前');
    const next = { _v:5, _seeded:true, _clearedAt:new Date().toISOString() };
    Object.keys(SCHEMA).forEach(k => { next[k] = []; });
    if(keepMaster){ next.customers = db.customers || []; next.owners = db.owners || []; }
    /* 回收站保留：清空本身正是最需要能救回来的操作 */
    next[TRASH_KEY] = db[TRASH_KEY] || [];
    this._write(next, '清空数据');
    return next;
  }
  async healthCheck(){ const db = await this.init();
    return { ok:true, msg:'localStorage 已就绪，'+ (db.orders||[]).length +' 笔订单' }; }
}
class SiyuanDataSource extends DataSource {
  constructor(cfg){
    super(cfg);
    this.cfg = Object.assign({
      baseUrl: 'http://127.0.0.1:6806', token: '',
      avIds: { orders:'', customers:'' },
      /* 视图：填「视图 ID」；留空 = 用数据库默认视图（推荐，避免 view not found） */
      defaultView: '',
      allowWrite: false,
      /* 端点可按需覆盖：不同思源版本命名略有差异 */
      endpoints: {
        render:   '/api/av/renderAttributeView',
        meta:     '/api/av/getAttributeView',
        append:   '/api/av/appendAttributeViewDetachedBlocksWithValues',
        batchSet: '/api/av/batchSetAttributeViewBlockAttrs',
        remove:   '/api/av/removeAttributeViewBlocks',
        version:  '/api/system/version'
      },
      mapping: {
        /* 键 = 思源数据库的列名，值 = 本系统字段名；列名不同只改这里，不动页面代码 */
        orders: { 'PI No.':'orderNo', 排产单号:'moNo', 客户代号:'customerName', 总货款:'amount',
                  '税金':'taxAmount', 预付款:'depositAmount', 交货日期:'contractDelivery',
                  排产日期:'planDate', 完成情况:'status', 条款:'term', 出货方式:'ship',
                  '合同/信用证资料':'attachments', 备注:'remark', 创建时间:'signDate',
                  完成状况:'done', 行号:'_line' },
        customers: { 客户编码:'code', 客户名称:'name', 简称:'shortName', 行业:'industry',
                     等级:'level', 账期天数:'settleDays', 电话:'phone', 地址:'address' }
      }
    }, cfg || {});
  }
  get id(){ return 'siyuan'; }
  get label(){ return '思源笔记订单库'; }
  get configured(){ const a = this.cfg.avIds || {}; return !!(this.cfg.baseUrl && this.cfg.token && (a.orders || a.customers)); }
  get capabilities(){
    return { read: this.configured, write: this.configured && !!this.cfg.allowWrite, realtime:false, reserved: !this.configured };
  }
  _api(path, body){
    const headers = { 'Content-Type':'application/json' };
    if(this.cfg.token) headers['Authorization'] = 'Token ' + this.cfg.token;
    return fetch(this.cfg.baseUrl.replace(/\/$/,'') + path, {
      method:'POST', headers, body: JSON.stringify(body || {})
    }).then(async r => {
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      if(j && j.code && j.code !== 0) throw new Error(j.msg || ('思源返回 code='+j.code));
      return j.data;
    });
  }
  async init(){}
  _avId(res){ const id = (this.cfg.avIds || {})[res];
    if(!id) throw new Error('未配置「'+res+'」对应的思源数据库 avId'); return id; }
  /* v0.24：这里的 id 可能是「数据库块 id」——内核只认 avID，用块 id 会读到空骨架。
     真实纠正放在保存配置时（见 bindSource 的 sySave）与「① 列出思源里的数据库」，
     这里只做一次形状提示，避免用户对着「0 列」发呆。 */
  _avIdHint(res){ const id = (this.cfg.avIds || {})[res] || ''; return id; }
  /* 列定义：{ 列名 -> { keyID, type } }，写入时靠它把字段值转成单元格 */
  async meta(res, force){
    const avId = this._avId(res);
    if(this._meta && this._meta[res] && !force) return this._meta[res];
    const data = await this._api(this.cfg.endpoints.meta, { id: avId });
    const av = (data && data.av) ? data.av : data;
    const cols = {};
    ((av && av.keyValues) || []).forEach(kv => {
      const k = kv.key || kv.Key || {};
      /* 同名多列（如「税金」既有公式列又有复选框列）取第一个，与导出的 HTML 表「同名列取首」保持一致 */
      if(k && k.name && !cols[k.name]) cols[k.name] = { keyID: k.id, type: String(k.type || 'text').toLowerCase() };
    });
    this._meta = this._meta || {}; this._meta[res] = cols;
    return cols;
  }
  /* 分页拉取全部行：内核单次最多返回 pageSize 条（实测 100 有效），行数多时必须循环 */
  async _fetchAll(avId, viewID, pageSize){
    const out = []; let page = 1, total = Infinity, guard = 0;
    const PS = pageSize || 100;
    while(out.length < total && guard++ < 200){
      const body = { id: avId, page, pageSize: PS };
      if(viewID) body.viewID = viewID;
      const d = await this._api(this.cfg.endpoints.render, body);
      const v = (d && (d.view || d)) || {};
      if(v.rowCount != null) total = Number(v.rowCount) || 0;
      const rows = v.rows || [];
      out.push.apply(out, rows);
      if(!rows.length || rows.length < PS) break;
      page++;
    }
    return out;
  }
  /* 思源单元格值 → JS 值（覆盖 block/text/number/date/select/mSelect/checkbox/mAsset/created/template） */
  static cellValue(v){
    if(v == null) return '';
    switch(String(v.type || '')){
      case 'block':      return (v.block && v.block.content) || '';
      case 'text':       return (v.text && v.text.content) || '';
      case 'number':
      case 'lineNumber': return v.number ? v.number.content : '';
      case 'date':       return v.date ? v.date.content : '';
      case 'created':
      case 'updated':    return (v.created && v.created.content) || (v.updated && v.updated.content) || '';
      case 'select':     return (v.mSelect && v.mSelect[0] && v.mSelect[0].content) || '';
      case 'mSelect':    return (v.mSelect || []).map(x => x.content).filter(Boolean).join(',');
      case 'checkbox':   return !!(v.checkbox && v.checkbox.checked);
      case 'mAsset':     return (v.mAsset || []).map(x => x.content || x.name).filter(Boolean);
      case 'template':   return (v.template && v.template.content) || '';
      default:           return '';
    }
  }
  /* 返回「按列名」的原始记录：{ id, 列名:值, _raw, _assets, <映射字段名>:值 } */
  async list(res){
    const avId = this._avId(res);
    const cols = await this.meta(res);                 // 列名 → { keyID, type }
    const byKey = {};                                  // keyID → 列名
    Object.keys(cols).forEach(n => { const k = cols[n].keyID; if(k && !byKey[k]) byKey[k] = n; });
    const map = (this.cfg.mapping || {})[res] || {};
    const raw = await this._fetchAll(avId, this.cfg.defaultView);
    return raw.map(r => {
      const o = { id: r.id, _src:'siyuan', _raw:{}, _assets:[] };
      (r.cells || []).forEach(c => {
        const v = c.value; if(!v) return;
        const name = byKey[v.keyID]; if(!name) return;
        if(o._raw[name] !== undefined) return;         // 同名多列（如「税金」template+checkbox）取首个
        const val = SiyuanDataSource.cellValue(v);
        o._raw[name] = val; o[name] = val;
        if(v.type === 'mAsset') o._assets = o._assets.concat(Array.isArray(val) ? val : [val]);
      });
      Object.keys(map).forEach(n => { if(o._raw[n] !== undefined) o[map[n]] = o._raw[n]; });
      return o;
    });
  }
  /* 字段值 → 思源单元格值：{ keyID, value } */
  _cell(colName, val, cols){
    const c = cols[colName]; if(!c) return null;
    const t = c.type;
    /* 内核自算列不写入：模板(距离交期/税金公式)、创建时间、行号；附件列也不支持回写 */
    if(t === 'template' || t === 'created' || t === 'updated' || t === 'linenumber' || t === 'masset') return null;
    if(t === 'number') return { keyID:c.keyID, value:{ number:{ content: Number(val) || 0, isNotEmpty: val != null && val !== '' } } };
    if(t === 'date'){
      const d = val ? new Date(String(val).replace(/-/g, '/')) : null;
      const ok = !!(d && !isNaN(d.getTime()));
      return { keyID:c.keyID, value:{ date:{ content: ok ? d.getTime() : null, isNotEmpty: ok } } };
    }
    if(t === 'checkbox') return { keyID:c.keyID, value:{ checkbox:{ checked: !!val } } };
    if(t === 'mselect' || t === 'select') return { keyID:c.keyID, value:{ mSelect:[{ content: String(val == null ? '' : val) }] } };
    if(t === 'block')   return { keyID:c.keyID, value:{ block:{ content: String(val == null ? '' : val) } } };
    return { keyID:c.keyID, value:{ text:{ content: val == null ? '' : String(val) } } };
  }
  _rowCells(res, obj, cols){
    const map = (this.cfg.mapping || {})[res] || {}, out = [];
    Object.keys(map).forEach(colName => {
      const field = map[colName];
      if(!(field in obj)) return;
      const cell = this._cell(colName, obj[field], cols);
      if(cell) out.push(cell);
    });
    return out;
  }
  async create(res, row){
    if(!this.capabilities.write) throw new Error('思源数据源未开启写入（请在配置里勾选「允许写入」）');
    const avId = this._avId(res), cols = await this.meta(res);
    const cells = this._rowCells(res, row, cols);
    if(!cells.length) throw new Error('没有可写入的字段：请检查思源数据库列名与映射是否一致');
    return this._api(this.cfg.endpoints.append, {
      avID: avId, blocksValues: [ cells.map(c => Object.assign({ keyID: c.keyID }, c.value)) ] });
  }
  async update(res, id, patch){
    if(!this.capabilities.write) throw new Error('思源数据源未开启写入');
    const avId = this._avId(res), cols = await this.meta(res);
    const cells = this._rowCells(res, patch, cols);
    if(!cells.length) return null;
    return this._api(this.cfg.endpoints.batchSet, {
      avID: avId, values: cells.map(c => ({ keyID: c.keyID, itemID: id, value: c.value })) });
  }
  async remove(res, id){
    if(!this.capabilities.write) throw new Error('思源数据源未开启写入');
    return this._api(this.cfg.endpoints.remove, { avID: this._avId(res), srcs: [{ id, isDetached:false }] });
  }
  /* 旧版按 name 反查单元格的 normalize 已废弃（真实返回体的单元格只带 keyID），
     读取统一走 list() + syRowsFromSiyuan()，不再保留死代码。 */
  async healthCheck(){
    if(!this.cfg.baseUrl) return { ok:false, msg:'未配置思源地址' };
    try{
      const v = await this._api(this.cfg.endpoints.version, {});
      const head = '思源内核可连通' + (v ? '（v' + v + '）' : '');
      /* v0.24：Token 允许留空 —— 本机思源若没设置「访问授权码」，不带 Token 也能调用。
         真需要鉴权时下面的调用会返回 401，那时的报错更具体，不用在这儿提前拦。 */
      const av = this.cfg.avIds || {};
      if(!av.orders && !av.customers) return { ok:true,
        msg: head + '，请到「思源双向同步」卡片点「① 列出思源里的数据库」绑定一个库' };
      const parts = [head];
      try{
        const cols = await this.meta('orders', true);
        const names = Object.keys(cols);
        parts.push('订单库 ' + names.length + ' 列');
        const miss = Object.keys((this.cfg.mapping || {}).orders || {}).filter(n => !cols[n]);
        if(miss.length) parts.push('缺少列：' + miss.join('、'));
      }catch(e){ parts.push('读取列定义失败：' + e.message); }
      parts.push(this.cfg.allowWrite ? '写入已开启（可双向）' : '写入未开启（只读）');
      return { ok:true, msg: parts.join(' ｜ ') };
    }catch(e){ return { ok:false, msg:'无法连接：' + e.message }; }
  }
}

    else status = pick(['04 已收款','05 已完结','05 已完结']);

    const orderNo = base + (orders.some(x=>x.orderNo===base) ? '-'+i : '');
    const closed = status === DONE;

    if(['04 已收款','05 已完结'].includes(status)){
      const d1 = new Date(sign); d1.setDate(d1.getDate()+3);

      channel: pick(['电话','微信','邮件','现场']),

      nextDate: fmt(shift(between(1,14))), _src:'demo' });

  return { owners, customers, orders, production, shipments, followups };

   - 'prod'  ：排产页专用。订单页的筛选**不会**再顺带把排产列表筛掉（v0.22 之前的耦合点：

   v0.23 · 多维「多选」筛选模型

function selList(v){
  if(v == null || v === '' || v === 'ALL') return [];
  const a = Array.isArray(v) ? v.slice() : [v];
  return a.filter(x => x != null && x !== '' && x !== 'ALL');

/* 订单的交期维度（互斥）：已交付 > 已逾期 > 7天内 > 15天内 > 正常 */
function ordDateKey(o){
  if(o && o.actualDelivery) return 'delivered';
  if(!o || !o.contractDelivery) return 'normal';
  const d = diffToday(o.contractDelivery);
  if(d < 0) return 'overdue';
  if(d <= 7) return 'd7';
  if(d <= 15) return 't15';
  return 'normal';

/* 订单的回款维度（可多值：一笔单可能同时「未收齐 + 订金未收」），命中任一即算匹配 */
function ordPayKeys(o){
  o = o || {};
  const r = [isFullyPaid(o) ? 'done' : 'todo'];
  if(writeOffOf(o) > 0) r.push('wo');
  const dep = Number(o.depositAmount || 0);
  if(dep > 0 && !o.depositPaidDate) r.push('nodep');
  if(!isFullyPaid(o) && o.contractDelivery && diffToday(o.contractDelivery) < 0) r.push('dun');
  return r;

function ordProdStateOf(recs){
  if(!recs || !recs.length) return 'none';
  if(recs.some(p => p.opStatus === '已暂停')) return 'pause';
  if(recs.every(p => prodDone(p))) return 'done';

  const idx = {};
  Object.keys(groups).forEach(k => { idx[k] = ordProdStateOf(groups[k]); });
  return idx;

function fRelRange(op){
  const t = today();

  if(op === 'thisMonth')   return { from: fmt(new Date(t.getFullYear(), t.getMonth(), 1)), to: fmt(new Date(t.getFullYear(), t.getMonth()+1, 0)) };

function condMatch(st, o, c, ctx){

    case 'empty':    return blank;
    case 'notEmpty': return !blank;

    case 'notIn':    if(!L.length) return true;

    case 'contains':    return !L.length || sRaw.toLowerCase().indexOf(String(L[0]).toLowerCase()) >= 0;
    case 'notContains': return !L.length || sRaw.toLowerCase().indexOf(String(L[0]).toLowerCase()) < 0;
    case 'eq':  return F.type === 'number' ? Number(raw || 0) === Number(L[0]) : sRaw === String(L[0]);
    case 'ne':  return F.type === 'number' ? Number(raw || 0) !== Number(L[0]) : sRaw !== String(L[0]);
    case 'gt':  return Number(raw || 0) >  Number(L[0]);

    case 'lt':  return Number(raw || 0) <  Number(L[0]);
    case 'lte': return Number(raw || 0) <= Number(L[0]);

function resolveRange(f){
  const t = today();
  if(f.preset === 'custom') return { from: f.from || '0000-01-01', to: f.to || '9999-12-31' };
  if(f.preset === 'all')    return { from: '0000-01-01', to: '9999-12-31' };
  /* ★ 日历区间 = 整段（到期末），不是「期初…今天」。
     筛「本月交期」就是为了找出本月要交货 / 要完工的单，而交期大量落在今天之后；
     截到今天会把它们整片漏掉 —— 实测「本月」只出 1 条，自定义 9/1~9/30 才全出。
     只有真正滚动的窗口（近 90 天 / 近 12 月）才以今天为终点。 */
  if(f.preset === 'month')   return { from: fmt(new Date(t.getFullYear(), t.getMonth(), 1)),
                                      to:   fmt(new Date(t.getFullYear(), t.getMonth()+1, 0)) };
  if(f.preset === 'quarter') return { from: fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3, 1)),
                                      to:   fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3+3, 0)) };
  if(f.preset === 'year')    return { from: fmt(new Date(t.getFullYear(), 0, 1)),
                                      to:   fmt(new Date(t.getFullYear(), 11, 31)) };
  if(f.preset === 'last12')  return { from: fmt(new Date(t.getFullYear()-1, t.getMonth(), t.getDate())), to: fmt(t) };
  if(f.preset === 'last90')  return { from: fmt(new Date(t.getTime() - 90*86400000)), to: fmt(t) };
  return { from: '0000-01-01', to: '9999-12-31' };
}

/* 多维度筛选 + 关键字 + 时间范围。

function filteredOrders(st, scope){
  const f = scopeFilters(st, scope), { from, to } = resolveRange(f);
  let list = st.data.orders.slice();
  /* v0.23 多维多选：同一维度内「或」，维度之间「与」；空 = 该维度不设限 */
  const own = selList(f.ownerId), cus = selList(f.customerId);
  const sta = selList(f.status),  pay = selList(f.pay);
  const prd = selList(f.prod),    rsk = selList(f.risk);
  if(own.length) list = list.filter(o => own.indexOf(o.ownerId) >= 0);
  if(cus.length) list = list.filter(o => cus.indexOf(o.customerId) >= 0);
  if(sta.length) list = list.filter(o => sta.indexOf(o.status) >= 0);
  if(pay.length) list = list.filter(o => ordPayKeys(o).some(k => pay.indexOf(k) >= 0));
  if(prd.length){ const pid = prodStateIndex(st); list = list.filter(o => prd.indexOf(pid[o.id] || 'none') >= 0); }
  if(rsk.length) list = list.filter(o => rsk.indexOf(ordDateKey(o)) >= 0);
  /* v0.24 条件行（新 UI 的唯一出口）：与上面的兼容维度是「与」的关系。
     ★ 只有 global 作用域的条件在这里生效 —— 它的字段是**订单级**的。
       排产页那份条件行是**记录级**的（工单号 / 排产状态 / 交期对比 / 计划完工…），
       由 prodViewList 逐条排产记录求值；放到这里算会把订单整片筛空
       （订单上没有 opStatus 这类字段 → 恒不匹配）。 */
  if(f.conds && f.conds.length && scope !== 'prod'){
    const cctx = filterCtx(st, scope);
    list = list.filter(o => condsMatch(st, o, f.conds, cctx));
  }
  if(f.quick){ const QP = quickPlan(f.quick); if(QP) list = list.filter(o => QP.test(st, o)); }
  if(f.keyword){
    const k = f.keyword.toLowerCase();
    /* 关键字匹配：订单号 + 客户（全称/简称/编码）+ 业务员 + 产品摘要
       —— 之前只匹配客户「法定全称」，而订单列表展示的是「简称」，导致用看到的简称搜不到，
          只有打首字命中全称首字时才搜得到。这里补齐 shortName/code，与「客户档案」页搜索口径一致。 */
    const cText = id => {
      const c = st.data.customers.find(x => x.id === id) || {};
      return ((c.name||'') + ' ' + (c.shortName||'') + ' ' + (c.code||'')).toLowerCase();
    };
    const oText = id => {
      const u = st.data.owners.find(x => x.id === id) || {};
      return (u.name || '').toLowerCase();
    };
    list = list.filter(o => (o.orderNo + ' ' + cText(o.customerId) + ' ' + oText(o.ownerId) + ' ' + (o.productSummary||'')).toLowerCase().includes(k));
  }
  if(f.basis === 'sign')     list = list.filter(o => o.signDate && o.signDate >= from && o.signDate <= to);
  if(f.basis === 'delivery') list = list.filter(o => o.contractDelivery && o.contractDelivery >= from && o.contractDelivery <= to);
  if(f.basis === 'pay'){
    list = list.filter(o => orderPaidInRange(o, from, to) > 0);

function calcKPI(st, orders){
  const basis = st.filters.basis;
  const { from, to } = resolveRange(st.filters);
  const amount   = orders.reduce((a,b) => a + (b.amount||0), 0);
  /* 实收额：按「回款日」口径时按回款实收日归集，其余口径直接用订单实收到账额 */
  const recv     = orders.reduce((a,o) => a + (basis === 'pay' ? orderPaidInRange(o, from, to) : receivedOf(o)), 0);
  const writeoff = orders.reduce((a,o) => a + writeOffOf(o), 0);
  const paid     = recv + writeoff;                       // 已回款（核销口径）：实收 + 已结清手续费
  const unpaid   = Math.max(0, amount - orders.reduce((a,o) => a + paidTotalOf(o), 0));
  const overdue = orders.filter(o => ACTIVE_STATUS(o.status) && o.contractDelivery &&
                    diffToday(o.contractDelivery) < 0 && !o.actualDelivery).length;
  const active = orders.filter(o => ACTIVE_STATUS(o.status)).length;
  return { amount, count: orders.length, recv, writeoff, paid, unpaid, avg: orders.length ? amount/orders.length : 0, overdue, active };
}
function aggBy(st, orders, dim){
  const keyOf = {
    customer : o => o.customerId,
    owner    : o => o.ownerId,
    status   : o => o.status,
    industry : o => ((st.data.customers.find(c => c.id === o.customerId) || {}).industry || '未分类'),
    month    : o => (o.signDate || '').slice(0,7) || '未知',
    level    : o => ((st.data.customers.find(c => c.id === o.customerId) || {}).level || '未分级')
  }[dim] || (o => o.customerId);
  const labelOf = {
    customer : k => ((st.data.customers.find(c => c.id === k) || {}).shortName || '未知'),
    owner    : k => ((st.data.owners.find(u => u.id === k) || {}).name || '未分配'),
    status   : k => String(k).slice(3),
    industry : k => k, month: k => k, level: k => k + ' 级'
  }[dim] || (k => k);
  const map = new Map();
  orders.forEach(o => {
    const k = keyOf(o) || '未知';
    if(!map.has(k)) map.set(k, { key:k, label:labelOf(k), amount:0, count:0, paid:0, unpaid:0 });
    const r = map.get(k); r.amount += o.amount; r.count += 1;
  });
  const ids = new Set(orders.map(o => o.id));
  orders.forEach(o => {
    const r = map.get(keyOf(o)); if(!r) return;
    r.paid += paidTotalOf(o); r.unpaid += unpaidOf(o);
  });
  let rows = [...map.values()];
  if(dim === 'month') rows.sort((a,b) => a.key.localeCompare(b.key));
  else if(dim === 'status') rows.sort((a,b) => FLOW.indexOf(a.key) - FLOW.indexOf(b.key));
  else rows.sort((a,b) => b.amount - a.amount);
  return rows;
}

function ownerStats(st, orders, uid){
  const mine = orders.filter(o => (o.ownerId || '未分配') === uid);
  return rollup(st, mine);
}
function customerStats(st, orders, cid){
  return rollup(st, orders.filter(o => o.customerId === cid));
}
function rollup(st, list){
  let amount = 0, paid = 0;
  list.forEach(o => { amount += (o.amount || 0); paid += paidTotalOf(o); });
  const unpaid = Math.max(0, amount - paid);
  const overdue = list.filter(o => ACTIVE_STATUS(o.status) && o.contractDelivery &&
              diffToday(o.contractDelivery) < 0 && !o.actualDelivery).length;
  return { amount, count:list.length, paid, unpaid, active: list.length, overdue };
}
/* ---------- v0.13 · 客户等级自动定级（ABC 分类，按销售额占比） ----------
   规则：某客户「订单金额合计」÷「全公司订单金额合计」
        > 20% → A ｜ > 10% → B ｜ 其余 → C
   在每次数据载入入口（reload → loadData）自动重算并写回 level 字段；
   仅对本地可写源（LocalDataSource）持久化，思源/模拟源仅当次会话生效。 */
const LEVEL_A = 0.20, LEVEL_B = 0.10;
function totalSalesAmount(data){
  return (data.orders || []).reduce((s, o) => s + (Number(o.amount) || 0), 0);
}
function customerSalesAmount(data, cid){
  return (data.orders || []).filter(o => o.customerId === cid)
    .reduce((s, o) => s + (Number(o.amount) || 0), 0);
}
function custAutoLevelByShare(share){
  return share > LEVEL_A ? 'A' : share > LEVEL_B ? 'B' : 'C';
}
function custShare(st, c){ const t = totalSalesAmount(st.data); return t > 0 ? customerSalesAmount(st.data, c.id) / t : 0; }
function custAutoLevel(st, c){ return custAutoLevelByShare(custShare(st, c)); }
async function applyAutoLevels(data, src){
  const total = totalSalesAmount(data);
  const tasks = [];
  (data.customers || []).forEach(c => {
    const amt = customerSalesAmount(data, c.id);
    const share = total > 0 ? amt / total : 0;
    const lv = custAutoLevelByShare(share);
    if(c.level !== lv){
      c.level = lv;
      /* 仅本地可写源持久化；思源/模拟源为只读，只在本次会话的内存对象上生效 */
      if(src && src.id === 'local') tasks.push(src.update('customers', c.id, { level: lv }).catch(() => {}));
    }
  });
  if(tasks.length) await Promise.all(tasks);
}
/* 关联引用计数：删除前的完整性检查 */
function refCounts(st, kind, id){
  if(kind === 'customer') return st.data.orders.filter(o => o.customerId === id).length;
  if(kind === 'owner')    return st.data.orders.filter(o => o.ownerId === id).length;
  return 0;
}

/* ---------- v0.5 · 预警引擎：交期 T-30 / T-15 / 逾期 + 发货未收款 + 到期应收款 ---------- */
function computeAlerts(st){
  const cfg = st.alertCfg || ALERT_DEFAULTS;
  if(cfg.enabled === false) return [];
  const out = [];
  // ① 交期预警：做 appetite 未完工（无实际交付）且状态未到「已完结」
  st.data.orders.forEach(o => {
    if(!ACTIVE_STATUS(o.status) || !o.contractDelivery) return;
    const d = diffToday(o.contractDelivery);
    const short = !o.actualDelivery;
    if(!short) return;
    if(d < 0){
      out.push({ lvl:'red', type:'交期逾期', orderId:o.id, title:`已过合同交期 ${-d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 当前状态 ${String(o.status).slice(3)}`, days:d });
    }else if(d <= (cfg.lead15 || 15)){
      out.push({ lvl:'orange', type:'临近交期', orderId:o.id, title:`距交期仅 ${d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 请确认排产与发货准备`, days:d });
    }else if(d <= (cfg.lead30 || 30)){
      out.push({ lvl:'blue', type:'交期提醒', orderId:o.id, title:`距交期 ${d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 提前跟进生产进度`, days:d });
    }
  });
  // ② 已发货未收齐超期：已发货且仍有未收金额，最晚发货日距今超过阈值
  const shippedOrders = st.data.orders.filter(o => ACTIVE_STATUS(o.status) && st.data.shipments.some(s => s.orderId === o.id));
  shippedOrders.forEach(o => {
    const ss = st.data.shipments.filter(s => s.orderId === o.id);
    const lastShip = ss.map(s => s.shipDate).filter(Boolean).sort().pop();
    const un = unpaidOf(o);
    if(un > 0.005 && lastShip){
      const age = -diffToday(lastShip);
      if(age >= (cfg.shipUnpaidDays || 30)){
        out.push({ lvl:'red', type:'发货未收款', orderId:o.id, title:`发货 ${age} 天仍未收齐 · ${o.orderNo}`,
          meta:`发货日 ${lastShip} ｜ 未收 ${money(un)} ｜ 超阈值 ${cfg.shipUnpaidDays} 天`, days:age });
      }
    }
  });
  // ③ 回款逾期 / 待收：以合同交期为收款预期基准，未收齐且临近/超过交期则警示
  st.data.orders.forEach(o => {
    if(o.status === DONE || !ACTIVE_STATUS(o.status) || !o.contractDelivery) return;
    const un = unpaidOf(o);
    if(un <= 0.005) return;
    const d = diffToday(o.contractDelivery);
    if(d < 0){
      out.push({ lvl:'red', type:'回款逾期', orderId:o.id, title:`回款逾期 ${-d} 天 · ${o.orderNo}`,
        meta:`合同交期 ${o.contractDelivery} ｜ 待收 ${money(un)}`, days:d });
    }else if(d <= (cfg.payDueSoon || 7)){
      out.push({ lvl:'orange', type:'回款待收', orderId:o.id, title:`回款${d===0?'今日到期':'T-'+d+' 天'} · ${o.orderNo}`,
        meta:`合同交期 ${o.contractDelivery} ｜ 待收 ${money(un)}`, days:d });
    }
  });
  const rank = { red:0, orange:1, blue:2 };
  return out.sort((a,b) => rank[a.lvl] - rank[b.lvl] || (a.days - b.days));
}
function custName(st, id){
  const c = st.data.customers.find(x => x.id === id);
  return c ? (c.shortName || c.name) : '未知客户';
}
/* 订金取值：直接取订单字段（重构后收款数据落在订单上） */
function depositOf(st, o){
  return Number((o && o.depositAmount) || 0);
}

/* ==========================================================================
   模块 7 · 图表引擎
   ========================================================================== */
const Chart = (() => {
  function showTip(e, html){
    const t = $('#tip'); if(!t) return;
    t.innerHTML = html; t.style.opacity = 1;
    t.style.left = Math.min(e.clientX + 14, innerWidth - 220) + 'px';
    t.style.top  = (e.clientY - 10) + 'px';
  }
  function hideTip(){ const t = $('#tip'); if(t) t.style.opacity = 0; }
  const W = 860, H = 300, PL = 62, PR = 56, PT = 16, PB = 44;
  const moneyShortV = (v, metric) => metric === 'count' ? String(v) : moneyShort(v);
  function bar(rows, metric){
    const n = rows.length, iw = W - PL - PR, ih = H - PT - PB;
    const maxA = Math.max(1, ...rows.map(r => r.amount));
    const maxC = Math.max(1, ...rows.map(r => r.count));
    const step = iw / Math.max(1, n), bw = Math.min(44, step * 0.55);
    const yA = v => PT + ih - (v / maxA) * ih;
    const yC = v => PT + ih - (v / maxC) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    for(let i=0;i<=4;i++){ const y = PT + ih - (ih/4)*i;
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef1f6"/>`;
      s += `<text x="${PL-8}" y="${y+4}" font-size="10" fill="#99a4b3" text-anchor="end">${moneyShort(maxA/4*i)}</text>`;
      if(metric === 'both') s += `<text x="${W-PR+8}" y="${y+4}" font-size="10" fill="#99a4b3">${Math.round(maxC/4*i)}</text>`; }
    rows.forEach((r,i) => {
      const cx = PL + step*i + step/2;
      const h = Math.max(2, PT + ih - yA(r.amount));
      s += `<rect x="${cx-bw/2}" y="${yA(r.amount)}" width="${bw}" height="${h}" rx="3" fill="${PALETTE[i % PALETTE.length]}"
             opacity=".94" data-tip="${esc(r.label)}｜金额 ${money(r.amount)}｜订单 ${r.count} 单"><title>${esc(r.label)}</title></rect>`;
      if(metric === 'both'){
        s += `<circle cx="${cx}" cy="${yC(r.count)}" r="4" fill="#1a2433"/>`;
        s += `<text x="${cx}" y="${yC(r.count)-9}" font-size="10" fill="#1a2433" text-anchor="middle">${r.count}</text>`;
      }
      s += `<text x="${cx}" y="${H-PB+16}" font-size="10.5" fill="#5f6c7e" text-anchor="middle">${esc(String(r.label).slice(0,7))}</text>`;
      if(metric !== 'both') s += `<text x="${cx}" y="${yA(r.amount)-6}" font-size="10" fill="#99a4b3" text-anchor="middle">${moneyShortV(metric==='count'?r.count:r.amount, metric)}</text>`;
    });
    return s + `<line x1="${PL}" y1="${PT+ih}" x2="${W-PR}" y2="${PT+ih}" stroke="#dfe6ef"/></svg>`;
  }
  function pie(rows, metric, donut){
    const total = rows.reduce((a,b) => a + (metric === 'count' ? b.count : b.amount), 0) || 1;
    const cx = W/2, cy = H/2, R = Math.min(H/2 - 24, 124), r0 = donut ? R*0.56 : 0;
    let a0 = -Math.PI/2, s = `<svg viewBox="0 0 ${W} ${H}">`;
    rows.forEach((r,i) => {
      const v = metric === 'count' ? r.count : r.amount;
      const a1 = a0 + (v/total) * Math.PI * 2;
      const big = (a1-a0) > Math.PI ? 1 : 0;
      const p = [
        `M ${cx+r0*Math.cos(a0)} ${cy+r0*Math.sin(a0)}`,
        `L ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}`,
        `A ${R} ${R} 0 ${big} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}`,
        `L ${cx+r0*Math.cos(a1)} ${cy+r0*Math.sin(a1)}`,
        r0 ? `A ${r0} ${r0} 0 ${big} 0 ${cx+r0*Math.cos(a0)} ${cy+r0*Math.sin(a0)}` : '', 'Z'
      ].join(' ');
      s += `<path d="${p}" fill="${PALETTE[i%PALETTE.length]}" stroke="#fff" stroke-width="1.5"
             data-tip="${esc(r.label)}｜${metric==='count'?r.count+' 单':money(r.amount)}｜占比 ${(v/total*100).toFixed(1)}%"><title>${esc(r.label)}</title></path>`;
      a0 = a1;
    });
    if(donut){
      s += `<text x="${cx}" y="${cy-4}" font-size="11" fill="#99a4b3" text-anchor="middle">合计</text>`;
      s += `<text x="${cx}" y="${cy+18}" font-size="19" font-weight="700" fill="#1a2433" text-anchor="middle">${metric==='count'?total+' 单':moneyShort(total)}</text>`;
    }
    return s + '</svg>';
  }
  function line(rows, metric, area){
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxA = Math.max(1, ...rows.map(r => r.amount));
    const maxC = Math.max(1, ...rows.map(r => r.count));
    const step = rows.length > 1 ? iw/(rows.length-1) : 0;
    const X = i => PL + step*i;
    const YA = v => PT + ih - (v/maxA)*ih;
    const YC = v => PT + ih - (v/maxC)*ih;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for(let i=0;i<=4;i++){ const y = PT + ih - (ih/4)*i;
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#eef1f6"/>`;
      s += `<text x="${PL-8}" y="${y+4}" font-size="10" fill="#99a4b3" text-anchor="end">${moneyShort(maxA/4*i)}</text>`; }
    const ptsA = rows.map((r,i) => `${X(i)},${YA(r.amount)}`).join(' ');
    if(area) s += `<polygon points="${PL},${PT+ih} ${ptsA} ${X(rows.length-1)},${PT+ih}" fill="rgba(37,99,235,.10)"/>`;
    s += `<polyline points="${ptsA}" fill="none" stroke="${PALETTE[0]}" stroke-width="2.4" stroke-linejoin="round"/>`;
    if(metric === 'both'){
      const ptsC = rows.map((r,i) => `${X(i)},${YC(r.count)}`).join(' ');
      s += `<polyline points="${ptsC}" fill="none" stroke="#1a2433" stroke-width="2" stroke-dasharray="5 4"/>`;
    }
    rows.forEach((r,i) => {
      s += `<circle cx="${X(i)}" cy="${YA(r.amount)}" r="3.6" fill="#fff" stroke="${PALETTE[0]}" stroke-width="2"
             data-tip="${esc(r.label)}｜金额 ${money(r.amount)}｜订单 ${r.count} 单"><title>${esc(r.label)}</title></circle>`;
      s += `<text x="${X(i)}" y="${H-PB+16}" font-size="10" fill="#5f6c7e" text-anchor="middle">${esc(String(r.label).slice(-5))}</text>`;
    });
    return s + `<line x1="${PL}" y1="${PT+ih}" x2="${W-PR}" y2="${PT+ih}" stroke="#dfe6ef"/></svg>`;
  }
  function table(rows){
    const total = rows.reduce((a,b) => a + b.amount, 0) || 1;
    return `<div class="tw"><table><thead><tr><th>#</th><th>维度</th><th class="num">订单金额</th>
      <th class="num">占比</th><th class="num">订单数</th><th class="num">已回款</th><th class="num">未回款</th></tr></thead><tbody>` +
      rows.map((r,i) => `<tr><td>${i+1}</td><td><span class="rank ${i<3?'r'+(i+1):''}" style="margin-right:6px">${i+1}</span>${esc(r.label)}</td>
        <td class="num">${money(r.amount)}</td><td class="num">${(r.amount/total*100).toFixed(1)}%</td>
        <td class="num">${r.count}</td><td class="num green">${money(r.paid)}</td>
        <td class="num ${r.unpaid>0?'red':''}">${money(r.unpaid)}</td></tr>`).join('') + '</tbody></table></div>';
  }
  return {
    render(el, rows, opt){
      if(!el) return;
      if(!rows.length){ el.innerHTML = '<div class="empty">当前筛选条件下没有数据</div>'; return; }
      const t = opt.type, m = opt.metric;
      if(t === 'table'){ el.innerHTML = table(rows); return; }
      el.innerHTML = `<div class="tw"><div style="min-width:520px">${
        t === 'bar' ? bar(rows, m) :
        t === 'pie' ? pie(rows, m, false) :
        t === 'donut' ? pie(rows, m, true) :
        t === 'line' ? line(rows, m, false) : line(rows, m, true)
      }</div></div>`;
      el.querySelectorAll('[data-tip]').forEach(n => {
        n.onmouseenter = e => showTip(e, n.getAttribute('data-tip'));
        n.onmousemove  = e => showTip(e, n.getAttribute('data-tip'));
        n.onmouseleave = hideTip;
      });
    },
    legend(rows){
      const total = rows.reduce((a,b) => a + b.amount, 0) || 1;
      return rows.map((r,i) => `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PALETTE[i%PALETTE.length]};margin-right:5px"></i>${esc(r.label)}
        <span class="muted">${(r.amount/total*100).toFixed(1)}%</span></span>`).join('');
    }
  };
})();

    '口令<b>只存在这台设备的浏览器里</b>，用本机设备标识混淆后存放（不是明文，但也不是加密，仅为避免肉眼可见）；它<b>不会写进导出文件、也不会随仓库分发</b>，仓库里那份 HTML 依旧不含任何 S3 / 思源凭据。',
    '★ <b>修复「换了加密口令后导出的配置，在另一台设备被提示『内容与当前一致，无需导入』」</b>：原先密钥类只比「已配置 / 未配置」四个字，两份完全不同的密文会被判成相等，于是新密钥永远进不来、旧口令一直报错。现在按<b>原始密文</b>比对，会正常识别为已更新，并顺带清掉本机记住的旧口令。',
    '<b>口令错了会说清楚</b>：不再只回一句「加密口令错误」，而是明说本机记住的口令已失效并已清除，避免反复用同一枚错口令重试；并且<b>只有验证通过的口令才会被记住</b>。',
    '「清除同步配置」现在会<b>连带清掉本机记住的口令</b>；把「记住口令」开关关掉也会即时清除，不留残影。',
    '「口令记忆」区实时显示<b>已记住 / 未记住</b>状态，并可一键「清除已记住的口令」——换设备前想清干净时不必去翻浏览器设置。'
  ]},
  { v:'v0.24', date:'2026-09-16', cat:'筛选重构 · 同步修复', items:[
    '筛选改成<b>思源式条件行</b>：[字段 ▾] [关系 ▾] [值]，可加多行；<b>第 2 行起可选「且 / 或」</b>，按顺序从左到右计算。chips 只能表达「等于某个枚举值」，条件行能表达<b>「订单金额 > 10 万」「合同交期 早于 某日」「签约日在 本月」「工单进度 ≥ 80」</b>这类比较——有范围、有阈值的筛选才谈得上灵活。',
    '字段覆盖 <b>15 个订单字段</b>（订单号 / 客户 / 业务员 / 订单状态 / 回款状态 / 排产状态 / 交期状态 / 金额 / 未收金额 / 税金 / 签约日 / 合同交期 / 实际交付 / 产品摘要 / 备注）与 <b>10 个排产字段</b>（工单号 / 订单号 / 客户 / 排产状态 / 交期对比 / 进度 / 车间 / 计划开工 / 计划完工 / 实际完工）。',
    '关系运算符按字段类型给：文本<b>包含 / 不包含 / 等于 / 不等于</b>；枚举<b>是其中之一 / 不是其中之一</b>；数值 <b>= ≠ &gt; ≥ &lt; ≤</b>；日期<b>等于 / 早于 / 晚于 / 本月 / 本季 / 本年 / 近 30 天 / 近 90 天</b>；各类型都支持<b>为空 / 不为空</b>。',
    '顶栏业务员从 chips 改成<b>多选下拉</b>；<b>取消快捷方案按钮</b>——「待跟进 / 风险单 / 本月新签」用条件行直接拼即可，还能顺手改条件。',
    '条件行输入时<b>列表实时刷新且不丢焦点</b>（边打金额边看结果）。排产页与订单页依旧<b>各筛各的</b>：订单页那份作用于订单，排产页那份作用于排产记录。',
    '★ <b>修复思源同步「按说明建了列名，还是提示没有相同列名」</b>：思源里<b>数据库块 id 与属性视图 avID 是两个不同的 id</b>，而工作台过去拿块 id 当 avID 用，内核只回一个空骨架（「主键 + 单选」两列），于是你建多少列都读不到。现在任何入口都先解析成真 avID。',
    '列名匹配改为<b>「同名优先，中文别名兜底」</b>：交货日期 / 交期 → contractDelivery、总货款 / 金额 → amount、客户代号 → customerName、PI No. → orderNo …… 你库里原有的中文列可以直接用，不必再建一套英文列。',
    '思源同步<b>不再需要手抄 avId</b>：点「① 列出思源里的数据库」→ 在列表里点一下库名，自动绑定并读出列名，<b>逐列显示匹配方式</b>（同名 / 中文别名 / 缺列），缺哪些列直接列清单。思源 <b>Token 放宽为可留空</b>（本机未设「访问授权码」时无需 Token）。'
  ]},
  { v:'v0.23', date:'2026-09-15', cat:'筛选能力', items:[
    '筛选<b>全面改为多选</b>：<b>同一行内多选 =「或」，跨行之间 =「与」</b>。例如「状态行点已排产 + 回款行点未收齐」= 已排产且未收齐；「交期行同时点已逾期和 7 天内」= 两者都要。此前每类条件只能选一个值，这类组合根本筛不出来。',
    '筛选维度从「订单状态 + 客户 + 回款」扩成<b>五组</b>：<b>状态 / 回款 / 排产 / 交期 / 客户</b>；顶栏的业务员也改为多选，可同时看两个业务员的单，并且仍然<b>订单页与排产页各存各的</b>。',
    '每行 chip 上的数字是<b>分面计数</b>——算的是「其他条件都满足时，这一项有多少条」，所以能提前看出某个组合点了会不会变空，不会点出一片空白还不知道为什么。',
    '新增<b>快捷方案</b>：待跟进 / 风险单 / 待收款 / 缺交期 / 本月新签，点一下套用整组条件，仍可继续叠加下面的维度继续收窄；再点一次或点「不限」取消。这些方案含「或」的组合（如待跟进 = 未排产 或 15 天内到期），是单靠多选表达不出来的。',
    '面板底部有<b>「已选条件」实时汇总</b>，把当前生效的所有条件（含方案）列成一行，一眼看清为什么只剩这几笔；点「清空」一键回到全部。',
    '排产页的「交期风险」下拉升级为多选，并新增<b>排产状态</b>多选（待排产 / 生产中 / 已完工 / 已暂停）；两页都支持按客户多选。',
    '客户候选超过 8 家时，行内出现搜索框，按名称（简称或全称）过滤可选项 —— 只改显隐、不重渲染，不影响已经选好的条件。'
  ]},
  { v:'v0.22', date:'2026-09-15', cat:'体验优化', items:[
    '修<b>「订单页一筛，排产页跟着空」</b>：排产的基准集合原本走的是订单的筛选结果，所以顶栏一设条件，排产列表就被连带筛掉（且看不出原因）。现在<b>排产页有自己独立的一份筛选</b>——在排产页改筛选栏只影响排产，订单页 / 看板 / 预警 / 回款 那边纹丝不动，反之亦然。',
    '筛选栏在排产页会挂一个<b>「本页独立」</b>标记，页面顶部也写明这条规则，避免「改了没反应」的误判；订单页仍与看板联动（在订单页筛出本月，回看板看的就是这批单的汇总，这是刻意保留的）。',
    '顶栏右上的 <b>「载入」改名为「重新载入」</b>并补悬停说明：它的作用是从当前数据源<b>重新读一遍全部数据并刷新界面</b>（纯读、不改数据）。还加了反馈——点击后按钮进入「载入中…」禁用态，结束提示实际读到的订单条数与数据源名称，不再让人猜它到底做了什么。',
    '侧栏副标题文案改为<b>单点维护</b>（<code>APP_TAG</code>）：此前 JS 与静态兜底各写一份，改版本时容易漏掉一处、显示成旧说明。'
  ]},
  { v:'v0.21', date:'2026-09-15', cat:'体验优化', items:[
    '「云端同步」页新增<b>配置导入 / 导出</b>：把连接参数（Endpoint / Region / Bucket / Prefix / 地址风格 / 触发模式 / 同步内容勾选等）导出成一个 JSON 文件，换设备或换浏览器时导入即可，不用再手抄一遍。',
    '导出<b>默认不含密钥</b>；需要连密钥一起搬时，勾选「导出时包含 AccessKey 与密钥密文」—— 密钥在文件里仍是<b>加密密文</b>，没有原「加密口令」解不开。导出文件等同于一份凭据，请妥善保管。',
    '导入是<b>先看差异再落盘</b>：弹窗逐项列出「字段：旧值 → 新值」，确认后才写入；格式不对直接拒绝，<b>白名单外的键一律忽略</b>（不会把 <code>_resolved*</code> 之类的运行时字段写进本地配置）。',
    '界面配色<b>整体降饱和</b>：主色与红 / 橙 / 绿 / 青等语义色统一往灰调靠，长时间看数据更柔和；<b>红绿语义不变</b>（红 = 风险 / 未收，绿 = 正常 / 已收）。',
    '按钮与输入框<b>圆角收小</b>（8px → 4px，卡片 10px → 6px，小按钮 3px），整体更利落。',
    '卡片与填写框<b>相对对齐</b>：输入类控件统一 32px 高、标签统一行高，同一行内与跨卡片的填写框顶底对齐；字段里的单个复选框（如「启用同步」）不再比同行输入框高一截；卡片头 / 卡片体左右内边距统一为 15px。'
  ]},
  { v:'v0.20', date:'2026-09-14', cat:'数据安全', items:[
    '新增「<b>数据历史</b>」页：把整个数据库按时间点存成<b>整库快照</b>，可回滚到任意一份。此前唯一的回退手段是批量修改的一步撤销（内存态、仅最近一次），<b>误删一笔订单或改错一批数据都退不回来</b>。',
    '快照<b>自动打点</b>：每次写库前存一份，10 分钟内连续改动合并成一份（不会刷屏）；<b>清空数据 / 导入 JSON / 批量修改 / 云端拉取前强制再存一份</b>，保证这些大范围操作都有一个「操作前」的精确回退点 —— 只靠自动打点会被合并窗口挡掉，最多退回 10 分钟前。',
    '回滚前会<b>先自动存一份当前状态</b>，所以回滚本身也能再回滚回来，不会因为点错就彻底回不去；确认框里给出<b>各表记录数变化预览</b>（如「订单 68 → 65」）。',
    '新增<b>回收站</b>：删除不再是物理抹掉，而是把记录移入回收站，可<b>单独还原某一笔</b>而不牵连其他改动。删订单时它的排产 / 发货 / 跟进<b>整组</b>一起进去、一起回来。',
    '附件语义跟回收站对齐：删除订单<b>不再立即删附件二进制</b>，还原后附件仍在；只有「彻底删除」或「清空回收站」才真正清理文件。',
    '快照存储走<b>独立 IndexedDB 库</b>（不去动附件用的那个库，避免版本升级把用户数据卡住），不可用时依次降级 localStorage → 内存，页面上标明当前实际后端。',
    '快照份数上限 30，超出时按 <b>自动 → 关键操作 → 手动</b> 的顺序淘汰最老的：自动快照最廉价先丢，手动存的最后丢。',
    '「清理演示数据」走<b>硬删除、不进回收站</b> —— 批量维护不是误操作，否则演示数据会把回收站灌满、把真实的误删记录挤掉。'
  ]},
  { v:'v0.19.3', date:'2026-09-14', cat:'思源同步', items:[
    '<b>查明「已建 0 列」的真正原因</b>：不是限流。实测思源 3.8.3 的数据库写接口（建库 / 建列）在本机<b>静默失效</b> —— HTTP 200 却什么也不落地，参数形态与认证头换遍均无效。v0.19.2 那套「轮次补试」建立在错误前提上，已废弃。',
    '同步方式改为<b>「思源手动建库建列 + 工作台绑定读写」</b>：工作台<b>不再自动建库、不再自动补列</b>，只负责校验列是否齐全、建立列映射、以及拉取 / 推送行数据。',
    '新增「<b>列出思源里的数据库</b>」按钮：直接查思源底层块表，列出全部真实数据库，点 avId 即可填入，不用再手抄。',
    '新增<b>真实库闸门</b>：绑定前先确认该 avId 在思源里真实存在（游离库的写操作会被静默丢弃），避免绑上了却写不进。',
    '读列改用正确接口 <code>getAttributeViewKeysByAvID</code>：此前用的 <code>getAttributeView</code> 对真实库返回空，只对游离库有内容，是读数错乱的根源。',
    '缺列时给出<b>可照抄的建列清单</b>（列名 + 类型），用户照着在思源里补；校验通过（列齐全）后按钮状态与徽标转绿。',
    '修一处映射漏建：<code>orderNo</code> 同时属于订单组与排产组，旧代码用「取首条」匹配导致排产组外键列永远建不起来，已改为全量匹配。'
  ]},
  { v:'v0.19.2', date:'2026-09-14', cat:'思源同步', items:[
    '尝试用「轮次补试 + 单列 30 秒等待」修复「已建 0 列」，未奏效 —— 该问题真实成因见 v0.19.3（写接口静默失效），本版方案已废弃。',
    '期间补齐诊断工具：真机探活、列定义读取、建列接口行为逐项验证等脚本，为定位真相提供依据。'
  ]},
  { v:'v0.19.1', date:'2026-09-14', cat:'思源同步', items:[
    '修「创建/绑定同步库」报 <b>HTTP 429</b>：新建库里一列都没有，补列会连发 15 个建列请求且零间隔，被思源内核限流掐断。',
    '思源调用加<b>节流 + 指数退避重试</b>：写请求之间保底间隔，429 / 5xx 自动退避重试（优先用内核返回的 `Retry-After`），最多 4 次。',
    '建列改<b>断点续做</b>：avId 先落盘、每建一列即持久化，中断后重跑只补缺列、不重建库也不重复建列。',
    '补列中途被打断时给出明确提示（已建 N 列，稍后再点一次续做），不再笼统报「创建失败」；推送时同步显示 `i / n` 进度。'
  ]},
  { v:'v0.19', date:'2026-09-12', cat:'版本管理', items:[
    '版本号统一：界面标题 / 侧栏 / 「系统版本」页均取自单一常量 `APP_VERSION`，此前界面停在 v0.8、与内部迭代号脱节。',
    '新增「系统版本」页：完整收录 v0.1 起每个版本的更新内容。',
    '清空默认配置里落盘的明文 Token 与订单库 avId，改为留空、运行时手填。'
  ]},
  { v:'v0.18', date:'2026-09-12', cat:'思源同步', items:[
    '新增「订单跟踪·工作台同步库」：列名 = 工作台字段名（零翻译），缺列自动补齐（`/api/av/addAttributeViewColumn`）。',
    '字段映射以 `keyID` 为锚，思源那边改列名不会误配；字段分级——共享字段双向，回款 / 附件 / 跟进等本地字段永不出网络。',
    '一张表放两类行：订单行按订单号定位；排产行以<b>订单号作外键</b>，定位键 = 订单号 + 工单号，同一订单可挂多条排产互不覆盖。',
    '推送前分页拉取全行（兼容分组视图），避免「远端已有、本地没读到」造成重复新增；冲突按 `updatedAt` 后写覆盖。'
  ]},
  { v:'v0.17', date:'2026-09-11', cat:'排产', items:[
    '排产记录由只读改为可增删改：详情页「排产进度」卡 + 排产页行末「操作」列。',
    '新增「完成进度 %」字段；统一算子 `prodPct`——有数量按 已完成÷数量，无数量且已完工记 100%，其余取手填百分比。',
    '修「状态=已完工却被判已逾期」：完工口径改为「有实际完工日 <b>或</b> 状态=已完工」。',
    '修「已完工进度显示 0%」：展示层与落库统一走 `prodPct`（此前只改了一半）。'
  ]},
  { v:'v0.16', date:'2026-09-11', cat:'列表', items:[
    '订单页：新增客户 / 回款筛选下拉 + 排序方向 ↑↓。',
    '排产页：新增关键字、交期风险筛选（带计数）、排序字段 + 方向。',
    '全选 / 反选作用于<b>当前可见列表</b>（受筛选影响），不再作用于全量。'
  ]},
  { v:'v0.15', date:'2026-09-11', cat:'详情', items:[
    '订单详情改<b>等宽两列</b>网格（订单信息 | 贸易与付款 / 排产 | 发货 / 回款 | 跟进），一页看完。',
    '弹层加宽至 `min(1360px, 96vw)`；每行两张卡片按行等高对齐。'
  ]},
  { v:'v0.14', date:'2026-09-11', cat:'体验修复', items:[
    '金额精度：至少 2 位小数，若有第 3 位则完整显示（此前 10115.5 被显示成 ¥10,116）。',
    '思源导入保留业务员；发货记录可编辑 / 删除，承运方支持增删。',
    '修思源客户匹配导致的「重复建档、原客户订单丢失」：改为 `siyuanCode` → `shortName` → `name` 三级匹配。'
  ]},
  { v:'v0.13', date:'2026-09-11', cat:'搜索 / 档案', items:[
    '修关键字搜索：补齐客户简称 / 编码、业务员名匹配，与档案页口径对齐。',
    '客户等级按销售额占比自动定级 A/B/C（≥20% A、≥10% B、其余 C），不再手工设置。'
  ]},
  { v:'v0.12', date:'2026-09-10', cat:'思源 / 批量', items:[
    '思源真同步实连打通：真实库 68 单可一键拉取。',

function renderSidebar(st){
  let h = '', last = null;
  PAGES.forEach(p => {
    const g = NAV_GRP[p.id] || '业务';
    if(g !== last){ h += `<div class="grp">${g}</div>`; last = g; }
    let cnt = '';
    if(p.id === 'orders') cnt = `<span class="cnt">${st.data.orders.length}</span>`;
    if(p.id === 'cust')   cnt = `<span class="cnt">${st.data.customers.length}</span>`;
    if(p.id === 'owners') cnt = `<span class="cnt">${st.data.owners.length}</span>`;
    if(p.id === 'pay')    cnt = `<span class="cnt">${st.data.orders.filter(o=>!isFullyPaid(o)).length}</span>`;
    if(p.id === 'alert'){
      const n = Store.alerts ? Store.alerts.filter(a => a.lvl === 'red').length : 0;
      if(n) cnt = `<span class="cnt" style="background:var(--red);color:#fff">${n}</span>`;
    }
    h += `<a data-pg="${p.id}" class="${st.ui.page===p.id?'on':''}"><span class="ico">${p.ico}</span>${p.name}${cnt}</a>`;
  });
  $('#sbNav').innerHTML = h;
  $$('#sbNav a').forEach(a => a.onclick = () => goto(a.dataset.pg));
  const src = st.source ? st.source.label : '—';
  $('#dsName').textContent = src;
  $('#dsMeta').textContent = st.source && st.source.capabilities.write ? '读写就绪' : '只读';
  $('#dsDot').className = 'dot' + (st.health && st.health.ok === false ? ' warn' : '');
}
function goto(pg){
  Store.setUI({ page: pg, sidebarOpen:false });
  const p = PAGES.find(x => x.id === pg) || PAGES[0];
  $('#pgTitle').textContent = p.title; $('#pgSub').textContent = p.sub;
  /* 切页后筛选栏要换成「该页作用域」的值：订单页/看板 = 业务统计口径，排产页 = 独立筛选。
     只有切页才重建 DOM；输入过程中只走 syncFilterBar（不重建节点）→ 不会丢焦点。 */
  initGlobalFilter();
  window.scrollTo(0,0);
}

      <button class="btn" id="fReset">重置</button>
      ${scope === 'prod' ? `<span class="tag t-gray" style="height:var(--ctl-h);display:inline-flex;align-items:center;font-weight:400"
        title="排产页的筛选是独立的：在这里改不会影响订单页与看板，反之亦然">本页独立</span>` : ''}
