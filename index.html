/* 同步卡片事件绑定（连接 / 比对 / 应用 / 解绑 / 清旧库） */
function bindSyncSiyuan(){
  const setLog = m => { const el = $('#syLog'); if(el) el.innerHTML = m; };
  const setApply = on => { const a = $('#syApply'); if(a) a.disabled = !on; };
  const refreshBadge = () => {
    const b = $('#syBadge'); if(!b) return;
    b.textContent = SY_BIND ? ('已连接 · ' + (SY_BIND.title || SY_BIND.avID)) : '未连接';
    b.className = 'tag ' + (SY_BIND ? 't-green' : 't-amber');
  };
  const readCfg = () => {
    Store.state.dsCfg.siyuan = Object.assign({}, syCfg(), {
      baseUrl: (($('#syUrl') || {}).value || 'http://127.0.0.1:6806').trim(),
      token: (($('#syTok') || {}).value || '').trim()
    });
  };

  const c = $('#syConnect'); if(c) c.onclick = async () => {
    readCfg(); setLog('连接中…（必要时会新建库并补齐 8 列）');
    try{
      const r = await syEnsureDB();
      if(!r.ok){ setLog('<span class="warn">❌ ' + esc(r.msg) + '</span>'); toast('连接失败'); return; }
      refreshBadge();
      setLog('✅ ' + (r.created ? '已新建「' + SY_DB_NAME + '」库' : '已连接既有「' + SY_DB_NAME + '」库') +
        '（' + esc(r.title || r.avID) + '）· ' +
        (r.colsAdded && r.colsAdded.length ? ('本次补齐列：' + esc(r.colsAdded.join('、'))) : '列已齐全') +
        '。<br>接着点「② 读取并比对」。');
      toast(r.created ? '已新建同步库' : '已连接同步库');
    }catch(e){ setLog('<span class="warn">连接失败：' + esc((e && e.message) || e) + '</span>'); }
  };

  const u = $('#syUnbind'); if(u) u.onclick = () => {
    syClearBind(); refreshBadge(); setApply(false);
    setLog('已解除绑定（不影响思源里的数据）。'); toast('已解除绑定');
  };

  const cl = $('#syCleanLegacy'); if(cl) cl.onclick = async () => {
    if(!confirm('确认删除思源里那个历史遗留的空壳库「' + SY_LEGACY_HINT + '」？\n\n它只有「主键 + 单选」两列、0 行，删除不影响任何订单数据。')) return;
    setLog('清除中…');
    const r = await syRemoveLegacyDB();
    setLog(r.ok ? ('✅ 已清除 ' + r.n + ' 个遗留库。') : ('<span class="warn">清除失败：' + esc(r.msg || '') + '</span>'));
  };

  const cmp = $('#syCompare'); if(cmp) cmp.onclick = async () => {
    readCfg();
    if(!SY_BIND){ setLog('尚未连接，请先点「① 一键连接」。'); return; }
    cmp.disabled = true; setLog('读取思源数据并比对中…');
    try{
      const remote = await syReadRows(SY_BIND);
      const local = syLocalRows(Store.state);
      SY_S.diff = syDiff(local, remote); SY_S.remote = remote; SY_S.local = local; SY_S.at = Date.now();
      const d = SY_S.diff;
      setLog('✅ 比对完成：思源 ' + remote.length + ' 行 · 工作台 ' + local.length + ' 单。' +
        ((d.conflicts.length || d.remoteOnly.length) ? ' <b>有需要你决策的项</b>，见下表。' : ' 无需决策，可直接应用。'));
      syRenderDiff(); setApply(true);
    }catch(e){ setLog('<span class="warn">读取失败：' + esc((e && e.message) || e) + '</span>'); }
    finally{ cmp.disabled = false; }
  };

  const ap = $('#syApply'); if(ap) ap.onclick = async () => {
    const d = SY_S.diff;
    if(!d){ setLog('请先点「② 读取并比对」。'); return; }
    if(!SY_BIND) return;
    ap.disabled = true; setLog('应用中…');
    const out = { push:0, pull:0, byRemote:0, imported:0, errors:[] };
    try{
      /* 1) 合并人工决策 → 推送 / 回填 两个队列 */
      const pushByNo = new Map(), pullByNo = new Map();
      d.toPush.forEach(p => pushByNo.set(p.orderNo, Object.assign({}, p.fields)));
      d.toPull.forEach(p => pullByNo.set(p.orderNo, Object.assign({}, p.fields)));
      d.conflicts.forEach((cf, i) => {
        const sel = ($$('#syDiffBox [data-cf]').find(x => x.dataset.cf === String(i)) || {}).value || 'local';
        const cur = pushByNo.get(cf.orderNo) || {};
        if(sel === 'local'){ cur[cf.key] = cf.local; pushByNo.set(cf.orderNo, cur); out.byRemote += 0; }
        else{
          delete cur[cf.key];
          const cp = pullByNo.get(cf.orderNo) || {};
          cp[cf.key] = cf.remote; pullByNo.set(cf.orderNo, cp);
          out.byRemote++;
        }
      });
      const rByNo = new Map((SY_S.remote || []).map(r => [String(r.orderNo || '').trim(), r]));

      /* 2a) 「仅工作台有」的订单一次性建行（批量；避免逐单往返全表读，行数多时是 O(n²)） */
      const toAdd = [];
      for(const entry of pushByNo){
        if(!Object.keys(entry[1]).length) continue;
        const r = rByNo.get(entry[0]);
        if(!r || !r.itemID) toAdd.push(entry[0]);
      }
      if(toAdd.length){
        try{
          await syAddRows(SY_BIND, toAdd.map(no => ({ orderNo:no })));
          const nr = await syReadRows(SY_BIND);
          nr.forEach(r => { const no = String(r.orderNo || '').trim(); if(no && !rByNo.has(no)) rByNo.set(no, r); });
        }catch(e){ out.errors.push('建行失败：' + ((e && e.message) || e)); }
      }
      /* 2b) 逐行写值（sySetCells 自身不等待，可连续调用） */
      for(const entry of pushByNo){
        const no = entry[0], fields = entry[1];
        if(!Object.keys(fields).length) continue;
        const r = rByNo.get(no);
        if(!r || !r.itemID) continue;
        try{ await sySetCells(SY_BIND, r.itemID, fields); out.push++; }
        catch(e){ out.errors.push(no + ' 推送失败：' + ((e && e.message) || e)); }
      }

      /* 3) 回填（思源 → 工作台） */
      if(pullByNo.size){
        const src = Store.state.source;
        const custCache = new Map();
        const findCust = name => {
          const key = String(name || '').trim().toLowerCase();
          const hit = (Store.state.data.customers || []).find(c =>
            [c.siyuanCode, c.shortName, c.name].some(v => String(v || '').trim().toLowerCase() === key));
          if(hit) return hit;
          if(custCache.has(key)) return custCache.get(key);
          const nc = { id: uid('C'), code:'', name:String(name).trim(), shortName:String(name).trim(),
            siyuanCode:String(name).trim(), industry:'未分类', level:'B', settleDays:0, contact:'',
            phone:'', email:'', address:'', creditNote:'由思源同步自动建档', active:true,
            createdAt: fmt(today()), _src:'siyuan' };
          custCache.set(key, nc);
          return nc;
        };
        for(const entry of pullByNo){
          const no = entry[0], f = entry[1];
          const o = (Store.state.data.orders || []).find(x => String(x.orderNo || '').trim() === no);
          if(!o) continue;
          const patch = {};
          if('amount' in f)   patch.amount = Number(f.amount) || 0;
          if('delivery' in f) patch.contractDelivery = String(f.delivery || '');
          if('status' in f)   patch.status = syMapStatus({ status: f.status });
          if('product' in f)  patch.productSummary = String(f.product || '');
          if('owner' in f){
            const nm = String(f.owner || '').trim().toLowerCase();
            const hit = (Store.state.data.owners || []).find(u => String(u.name || '').trim().toLowerCase() === nm);
            if(hit) patch.ownerId = hit.id;
          }
          if('customer' in f){
            const c2 = findCust(f.customer);
            if(!c2.id || !(Store.state.data.customers || []).some(x => x.id === c2.id)){
              await src.create('customers', c2);
              (Store.state.data.customers = Store.state.data.customers || []).push(c2);
            }
            patch.customerId = c2.id;
          }
          if('moNo' in f){
            /* v0.43：分隔符改走 splitMoNos（兼容「/」，与手填同一口径）；
               单号全局唯一 —— 已被别的订单占用时不覆盖，记下来在日志里报。 */
            const mos = splitMoNos(f.moNo);
            for(const m of mos){
              const has = (Store.state.data.production || []).some(p => p.orderId === o.id && String(p.moNo || '').trim() === m);
              if(has) continue;
              const taken = moNoOwner(Store.state, m, null);
              if(taken){
                (out.moDup = out.moDup || []).push({ moNo:m, orderNo:no,
                  other:((Store.state.data.orders || []).find(x => x.id === taken.orderId) || {}).orderNo || taken.orderId });
                continue;
              }
              const np = { id: uid('P'), orderId:o.id, moNo:m, workshop:'', planStart:'',
                planFinish:String(o.contractDelivery || ''), actualStart:'', actualFinish:'',
                qty:0, doneQty:0, progressPct:0, opStatus:'待排产' };
              await src.create('production', np);
              (Store.state.data.production = Store.state.data.production || []).push(np);
            }
          }
          if(Object.keys(patch).length){ await src.update('orders', o.id, patch); out.pull++; }
        }
      }

      /* 4) 仅思源有 → 按选择导入为新单 */
      const importRows = d.remoteOnly.filter((r, i) =>
        (($$('#syDiffBox [data-ro]').find(x => x.dataset.ro === String(i)) || {}).value || 'import') === 'import');
      if(importRows.length){
        const plan = syBuildPlan(importRows, Store.state);
        const rr = await syRunImport(plan, { label:'思源导入' });
        out.imported = importRows.length;
      }else{
        await reload();
      }

      setLog('✅ 应用完成：推送 <b>' + out.push + '</b> · 回填 <b>' + out.pull + '</b> · 冲突采用思源 <b>' + out.byRemote +
        '</b> · 导入 <b>' + out.imported + '</b>' +
        (out.moDup && out.moDup.length
          ? '<br><span class="warn">⚠ 排产单号冲突跳过 ' + out.moDup.length + ' 条（已被别的订单占用）：'
            + esc(out.moDup.slice(0, 5).map(d => d.moNo + '（订单 ' + d.other + '）').join('；')) + '</span>' : '') +
        (out.errors.length ? '<br><span class="warn">' + esc(out.errors.slice(0, 5).join('；')) + '</span>' : ''));
      toast('同步完成：推送 ' + out.push + ' · 回填 ' + out.pull);
      SY_S.diff = null; syRenderDiff(); setApply(false);
    }catch(e){
      setLog('<span class="warn">应用失败：' + esc((e && e.message) || e) + '</span>');
    }finally{ ap.disabled = false; }
  };
}

/* ---------- 抽屉卡片宽度：拖左缘把手 + 记忆（详情 / 表单各一份） ---------- */
const SHEET_W_LS      = 'ot.sheet.w.v1';        /* 表单类宽度 */
const SHEET_W_LS_WIDE = 'ot.sheet.wide.v1';     /* 详情类（.wide）宽度 */
const SHEET_W_DEF     = { form: 520, wide: 840 };
const SHEET_W_MIN     = 380;
const SHEET_NARROW    = 920;                    /* ≤ 此宽度整屏、隐藏把手，与 CSS 断点一致 */
function sheetWClamp(w){
  const vw  = (window.innerWidth || 1024);
  const max = Math.max(SHEET_W_MIN, Math.min(1280, vw - 72));
  const n   = Math.round(Number(w) || 0);
  return Math.max(SHEET_W_MIN, Math.min(max, n || SHEET_W_MIN));
}
function sheetWStored(wide){
  try{
    const n = parseInt(localStorage.getItem(wide ? SHEET_W_LS_WIDE : SHEET_W_LS), 10);
    return isFinite(n) && n >= SHEET_W_MIN ? n : 0;
  }catch(e){ return 0; }
}
/* 本次应使用的宽度；窄屏返回 0 = 交给 CSS 的 100% */
function sheetW(wide){
  if((window.innerWidth || 1024) <= SHEET_NARROW) return 0;
  return sheetWClamp(sheetWStored(wide) || (wide ? SHEET_W_DEF.wide : SHEET_W_DEF.form));
}
function applySheetW(){
  const w = sheetW(!!($('#sheet') && $('#sheet').classList.contains('wide')));
  const v = w ? w + 'px' : '';
  [$('#mask'), document.getElementById('stage')].forEach(c => { if(!c) return;
    if(v) c.style.setProperty('--sheet-w', v); else c.style.removeProperty('--sheet-w'); });
  return w;
}
function sheetWSet(w, wide){
  const v = sheetWClamp(w);
  try{ localStorage.setItem(wide ? SHEET_W_LS_WIDE : SHEET_W_LS, String(v)); }catch(e){}
  if((window.innerWidth || 1024) > SHEET_NARROW)
    [$('#mask'), document.getElementById('stage')].forEach(c => { if(c) c.style.setProperty('--sheet-w', v + 'px'); });
  return v;
}
/* 把手只建一次，拖拽监听挂在 document 上（卡片重渲染不影响拖拽） */
let sheetDrag = null;
function sheetHandle(){
  const m = $('#mask'); if(!m) return null;
  let dz = m.querySelector('[data-dz]');
  if(dz) return dz;
  dz = document.createElement('div');
  dz.className = 'dz'; dz.setAttribute('data-dz', '1');
  dz.title = '拖动调整卡片宽度';
  dz.onpointerdown = e => { const el = $('#sheet'); startSheetDrag(e, el, m); };
  m.appendChild(dz);
  return dz;
}
document.addEventListener('pointermove', e => {
  if(!sheetDrag) return;
  const wide = (window.innerWidth || 1024) > SHEET_NARROW;
  const host = wide ? document.getElementById('stage') : $('#mask');
  if(!host) return;
  const w = sheetWClamp(sheetDrag.from + (sheetDrag.x - e.clientX));   /* 向左拖 = 变宽 */
  sheetDrag.w = w;
  if(wide) host.style.setProperty('--sheet-w', w + 'px');
  if(e.preventDefault) e.preventDefault();
});
function sheetDragEnd(){
  if(!sheetDrag) return;
  const d = sheetDrag; sheetDrag = null;
  const wide = (window.innerWidth || 1024) > SHEET_NARROW;
  const handle = wide ? document.querySelector('.dvh') : ($('#mask') && $('#mask').querySelector('[data-dz]'));
  if(handle) handle.classList.remove('on');
  document.body.classList.remove('col-resizing');
  if(d.w) sheetWSet(d.w, d.wide);                                      /* 松手才落盘 */
  fitPageH();                       /* v0.36：#page 宽度变了，内容高要重新实测 */
}
document.addEventListener('pointerup', sheetDragEnd);
document.addEventListener('pointercancel', sheetDragEnd);
window.addEventListener('resize', () => {
  const cur = sheetMode(); if(!cur) return;
  const want = (window.innerWidth || 1024) > SHEET_NARROW ? 'split' : 'overlay';
  if(want !== cur) remountSheet(); else applySheetW();
});

function sheet(html, opts){
  const wide = !!(opts && opts.wide);
  const mode = (window.innerWidth || 1024) > SHEET_NARROW ? 'split' : 'overlay';
  const el = $('#sheet');
  el.innerHTML = html;
  el.classList.toggle('wide', wide);
  mountSheet(mode);
  if(mode === 'split'){ const m = $('#mask'); if(m) m.classList.remove('on'); document.getElementById('main').classList.add('split'); sheetHandleSplit(); document.body.style.overflow = ''; }
  else { $('#mask').classList.add('on'); document.getElementById('main').classList.remove('split'); sheetHandle(); document.body.style.overflow = 'hidden'; }
  applySheetW();
  bindClose();
}
function bindClose(){ $$('#sheet [data-close]').forEach(b => b.onclick = closeSheet); }
let FORM = null;
function closeSheet(){
  if(FORM){
    (FORM.pendingNew || []).forEach(id => FileStore.del(id));
    FORM = null;
  }
  const main = document.getElementById('main');
  if(main && main.classList.contains('split')) main.classList.remove('split');
  else { const m = $('#mask'); if(m) m.classList.remove('on'); }
  document.body.style.overflow = '';
  const el = $('#sheet'); if(el) el.classList.remove('wide');
}
$('#mask').onclick = e => { if(e.target.id === 'mask') closeSheet(); };
function sheetMode(){ const main = document.getElementById('main'); if(main && main.classList.contains('split')) return 'split'; return ($('#mask') && $('#mask').classList.contains('on')) ? 'overlay' : null; }
function sheetOpen(){ return sheetMode() !== null; }
function sheetEl(){ const m = sheetMode(); if(m === 'split') return document.getElementById('dpane'); if(m === 'overlay') return $('#sheet'); return null; }
function mountSheet(mode){ const el = $('#sheet'); if(!el) return; (mode === 'split' ? document.getElementById('dpane') : $('#mask')).appendChild(el); }
function remountSheet(){
  const el = $('#sheet'); if(!el) return;
  const want = (window.innerWidth || 1024) > SHEET_NARROW ? 'split' : 'overlay';
  if(want === 'split'){
    document.getElementById('dpane').appendChild(el);
    document.getElementById('main').classList.add('split');
    const m = $('#mask'); if(m) m.classList.remove('on');
    document.body.style.overflow = '';
    sheetHandleSplit();
  } else {
    $('#mask').appendChild(el);
    $('#mask').classList.add('on');
    document.getElementById('main').classList.remove('split');
    document.body.style.overflow = 'hidden';
    sheetHandle();
  }
  applySheetW();
}
function sheetHandleSplit(){
  const s = document.getElementById('stage'); if(!s) return null;
  const dv = s.querySelector('.dvh'); if(!dv || dv.onpointerdown) return dv;
  dv.onpointerdown = e => { const el = $('#sheet'); startSheetDrag(e, el, s); };
  return dv;
}
function startSheetDrag(e, el, host){
  if(!el || !host) return;
  const cur = parseInt(host.style.getPropertyValue('--sheet-w'), 10)
           || sheetW(el.classList.contains('wide')) || SHEET_W_DEF.form;
  sheetDrag = { wide: el.classList.contains('wide'), x: e.clientX, from: cur, w: 0 };
  const handle = host === document.getElementById('stage') ? document.querySelector('.dvh') : host.querySelector('[data-dz]');
  if(handle) handle.classList.add('on');
  document.body.classList.add('col-resizing');
  if(e.preventDefault) e.preventDefault();
}
let toastT; function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- FileStore ---------- */
const FileStore = (() => {
  const mem = new Map();
  let dbp = null;
  const mode = (typeof indexedDB !== 'undefined' && indexedDB) ? 'idb'
             : (typeof localStorage !== 'undefined' && localStorage) ? 'local' : 'mem';
  function openIDB(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try{
        const r = indexedDB.open('ot_files', 1);
        r.onupgradeneeded = e => { const d = e.target.result;
          if(!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(new Error('IndexedDB 打开失败'));
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function readDataURL(file){ return new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('文件读取失败')); r.readAsDataURL(file); }); }
  /* v0.47：allow 是可选的白名单 —— 包装文件要收 Excel / Word / ZIP，
     但订单附件仍只收 PDF / JPG / PNG。不传 allow 时行为与旧版完全一致。
     提示文案对 JPEG 去重成 JPG，保持原有「PDF / JPG / PNG」的读法。 */
  function check(file, allow){
    if(!file) return '未选择文件';
    const ext = String(file.name || '').toLowerCase().split('.').pop();
    const ok = (allow && allow.length) ? allow : FILE_EXT;
    if(!ok.includes(ext)){
      const label = [...new Set(ok.map(x => String(x).toUpperCase() === 'JPEG' ? 'JPG' : String(x).toUpperCase()))].join(' / ');
      return '格式不支持，仅允许 ' + label;
    }
    if(file.size === 0) return '文件内容为空';
    if(file.size > FILE_MAX) return '文件不能超过 10MB（当前 ' + sizeTxt(file.size) + '）';
    return null;
  }
  async function put(file, allow){
    const bad = check(file, allow); if(bad) throw new Error(bad);
    const meta = { id: uid('F'), name: file.name, size: file.size,
      type: file.type || ('.' + String(file.name).toLowerCase().split('.').pop()),
      uploadedAt: new Date().toISOString() };
    if(mode === 'idb'){
      const db = await openIDB();
      await new Promise((res, rej) => { const tx = db.transaction('files','readwrite');
        tx.objectStore('files').put(file, meta.id); tx.oncomplete = res; tx.onerror = () => rej(new Error('写入失败')); });
    }else if(mode === 'local'){
      const data = await readDataURL(file);
      try{ localStorage.setItem('ot.file.' + meta.id, JSON.stringify({ ...meta, data })); }
      catch(e){ throw new Error('本地存储空间不足，请压缩文件'); }
    }else{ mem.set(meta.id, { meta, blob: file }); }
    return meta;
  }
  async function url(id){
    if(!id) return null;
    if(mode === 'idb'){
      try{ const db = await openIDB();
        const blob = await new Promise((res, rej) => { const tx = db.transaction('files','readonly');
          const q = tx.objectStore('files').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(new Error('读取失败')); });
        return blob ? URL.createObjectURL(blob) : null; }catch(e){ return null; }
    }
    if(mode === 'local'){ const raw = localStorage.getItem('ot.file.' + id); return raw ? JSON.parse(raw).data : null; }
    const it = mem.get(id); return it ? URL.createObjectURL(it.blob) : null;
  }
  async function del(id){
    if(!id) return;
    try{
      if(mode === 'idb'){ const db = await openIDB(); await new Promise(res => {
        const tx = db.transaction('files','readwrite'); tx.objectStore('files').delete(id);
        tx.oncomplete = res; tx.onerror = res; }); }
      else if(mode === 'local'){ localStorage.removeItem('ot.file.' + id); }
      else { mem.delete(id); }
    }catch(e){}
  }
  /* 清空全部附件：清库时调用，避免订单删了、附件还留在浏览器里成为孤儿文件 */
  async function clear(){
    try{
      if(mode === 'idb'){ const db = await openIDB(); await new Promise(res => {
        const tx = db.transaction('files','readwrite'); tx.objectStore('files').clear();
        tx.oncomplete = res; tx.onerror = res; }); }
      else if(mode === 'local'){
        Object.keys(localStorage).filter(k => k.indexOf('ot.file.') === 0)
          .forEach(k => localStorage.removeItem(k));
      } else { mem.clear(); }
    }catch(e){}
  }
  /* 读取附件为 dataURL（同步快照用，附件随快照一起加密上传） */
  async function dataUrl(id){
    if(!id) return null;
    if(mode === 'idb'){
      try{ const db = await openIDB(); const blob = await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const q=tx.objectStore('files').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(new Error('读取失败'));});
        if(!blob) return null;
        return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);}); }
      catch(e){ return null; }
    }
    if(mode === 'local'){ const raw = localStorage.getItem('ot.file.' + id); return raw ? JSON.parse(raw).data : null; }
    const it = mem.get(id);
    if(it) return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(it.blob);});
    return null;
  }
  /* 从 dataURL 写回附件（同步恢复用），强制使用给定 id，避免覆盖既有同 id 记录 */
  async function importFromDataUrl(id, dataUrlStr, meta){
    const blob = await (await fetch(dataUrlStr)).blob();
    const file = new File([blob], (meta && meta.name) || id, { type:(meta && meta.type) || 'application/octet-stream' });
    if(mode === 'idb'){
      const db = await openIDB();
      await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file, id);tx.oncomplete=res;tx.onerror=()=>rej(new Error('写入失败'));});
    }else if(mode === 'local'){
      const m = Object.assign({ id }, meta || {});
      try{ localStorage.setItem('ot.file.' + id, JSON.stringify({ ...m, data:dataUrlStr })); }
      catch(e){ throw new Error('本地存储空间不足'); }
    }else{ mem.set(id, { meta:Object.assign({id},meta||{}), blob:file }); }
  }
  return { mode, put, url, del, clear, check, dataUrl, importFromDataUrl, FILE_MAX, FILE_EXT };
})();

/* ---------- 表单引擎 ---------- */
const RULES = {
  code   : v => !v ? null : (CODE_RE.test(v) ? null : CODE_MSG),
  /* v0.43：排产单号是**多值**（chips，值以「、」拼接存放）——
     整串过 CODE_RE 必然失败（「、」不在允许字符集里），必须逐个单号校验。 */
  moNos  : v => {
    if(!v) return null;
    const bad = splitMoNos(v).find(m => !CODE_RE.test(m));
    return bad ? CODE_MSG : null;
  },
  amount : v => (v === '' || v == null) ? '请填写订单金额' : (Number(v) > 0 ? null : '订单金额须大于 0'),
  deposit: (v, vals) => {
    if(v === '' || v == null) return null;                       // 允许留空 = 无订金
    const n = Number(v);
    if(isNaN(n) || n < 0) return '订金金额不能为负数';
    const total = Number(vals.amount || 0);
    if(total > 0 && n > total) return '订金不能超过订单金额（' + money(total) + '）';
    return null;
  }
};
/* ==========================================================================
   v0.55 · 回款流水（一笔到账一条记录）
   --------------------------------------------------------------------------
   数据落在 payments 表：{ orderId, payDate, amount, kind, method, ref, note }。
   ★ 口径优先级：**有回款流水的订单以流水为准**；没有流水的订单退回原来的
     「订金 + 尾款 + 实收尾款 + 差额结清」四字段口径 —— 历史订单与既有回归断言
     因此完全不受影响（老数据的数字一个不变）。
   ★ PAY_AGG 是为了让 receivedOf(o) 这类「只收一个订单对象」的纯函数也能读到流水：
     按 payments 数组的**引用 + 长度**判断要不要重建，避免每笔订单都重扫一遍。
   ★ 全部用 function 声明（而非常量箭头函数）：调用方散落在文件各处，
     函数声明会被提升，不存在「初始化前调用」的时序坑。
   ========================================================================== */
const PAY_KINDS   = ['订金','尾款','货款','其他'];

let _payArr = null, _payLen = -1, _payIdx = new Map();
function payRows(){ const d = Store.state && Store.state.data; return (d && d.payments) || []; }
function reindexPays(force){
  const arr = payRows();
  if(!force && arr === _payArr && arr.length === _payLen) return _payIdx;
  _payArr = arr; _payLen = arr.length;
  const m = new Map();
  arr.forEach(p => {
    if(!p || !p.orderId) return;
    let a = m.get(p.orderId);
    if(!a){ a = { n:0, sum:0, last:'', list:[] }; m.set(p.orderId, a); }
    a.n++; a.sum += Number(p.amount || 0) || 0;
    if(p.payDate && String(p.payDate) > a.last) a.last = String(p.payDate);
    a.list.push(p);
  });
  /* 明细按「日期升序 → id」排：同一天登记的多笔顺序稳定，不随写入顺序抖动 */
  m.forEach(a => a.list.sort((x, y) =>
    String(x.payDate || '').localeCompare(String(y.payDate || '')) || String(x.id).localeCompare(String(y.id))));
  _payIdx = m;

function payAggOf(o){ return (o && o.id != null) ? (reindexPays().get(o.id) || null) : null; }
function hasPayRows(o){ return !!payAggOf(o); }
function payListOf(o){ const a = payAggOf(o); return a ? a.list : []; }
function paySumOf(o){ const a = payAggOf(o); return a ? a.sum : 0; }

function payPctOf(o){
  const amt = Number((o && o.amount) || 0);
  if(amt <= 0) return isFullyPaid(o) ? 100 : 0;
  return Math.max(0, Math.min(100, Math.round(paidTotalOf(o) / amt * 100)));
}
/* 把「流水列表」折算成订单上的镜像字段（订金付款日 / 尾款付款日 / 实收尾款）。
   镜像只为兼容思源推送、CSV 导出与老的「订金未付」筛选 —— 数学口径一律以流水为准。
   一笔都没有时返回空值组（删除最后一笔 → 该单回到「未收」）。 */
function legacyPatchOf(list){
  const sum = a => a.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const rows = list || [];
  if(!rows.length) return { depositPaidDate:'', balancePaidDate:'', balanceReceived:0 };
  const dep = rows.filter(p => p.kind === '订金' && p.payDate);
  const bal = rows.filter(p => p.kind === '尾款' && p.payDate);
  const dates = rows.map(p => p.payDate).filter(Boolean).sort();
  const depDate = dep.length ? dep.map(p => p.payDate).sort()[0] : '';
  /* 没有尾款笔时，把「最后一笔到账日」当尾款日、全部流水之和当实收 ——
     免得只登记了一笔「货款」的单在思源那边看起来像一分没收。 */
  const balDate = bal.length ? bal.map(p => p.payDate).sort().pop() : (dates[dates.length - 1] || '');
  return {
    depositPaidDate: depDate,
    balancePaidDate: balDate,
    balanceReceived: bal.length ? sum(bal) : sum(rows)

/* 把老口径（订金 / 尾款付款日）补成两笔流水 —— 只在「该单还没有任何流水」时执行。
   不补的话，第一次登记第三笔时口径会从「流水合计」重算，已收的订金尾款凭空消失。 */
async function ensureLegacyPays(o){
  const st = Store.state, src = st.source;
  if(!o || !src || !src.capabilities || !src.capabilities.write) return 0;
  if(payListOf(o).length) return 0;
  const rows = [];
  const dep = Number(o.depositAmount || 0);
  if(dep > 0 && o.depositPaidDate)
    rows.push({ id:uid('PM'), orderId:o.id, payDate:o.depositPaidDate, amount:dep, kind:'订金',
      method:'', ref:'', note:'由原「订金付款日」自动补录', _src:'migrate' });
  const bal = balanceOf(o);
  if(o.balancePaidDate && bal > 0)
    rows.push({ id:uid('PM'), orderId:o.id, payDate:o.balancePaidDate, amount:balReceivedOf(o), kind:'尾款',
      method:'', ref:'', note:'由原「尾款付款日」自动补录', _src:'migrate' });
  for(const r of rows) await src.create('payments', r);
  if(rows.length){ await reload(); reindexPays(true); }
  return rows.length;
}
/* 回款流水变更后：把镜像字段写回订单（流水为空则清空镜像，回到未收） */
async function syncLegacyFromPays(orderId){
  const st = Store.state, src = st.source;
  const o = (st.data.orders || []).find(x => x.id === orderId); if(!o) return;
  const list = (st.data.payments || []).filter(p => p.orderId === orderId);
  const patch = legacyPatchOf(list);
  if(list.length === 0) patch.balanceSettled = false;
  await src.update('orders', orderId, patch);
  await reload();
}
/* 登记一笔回款：先补老口径 → 落流水 → 回写镜像。返回新建的流水行。 */

  const o = (st.data.orders || []).find(x => x.id === orderId); if(!o) return null;
  await ensureLegacyPays(o);
  const row = { id:uid('PM'), orderId,
    payDate: v.payDate || fmt(today()),
    amount: Number(v.amount || 0) || 0,
    kind: PAY_KINDS.indexOf(v.kind) >= 0 ? v.kind : '货款',
    method: String(v.method || ''), ref: String(v.ref || '').trim(),
    note: String(v.note || '').trim(), _src:'manual' };
  await src.create('payments', row);
  await reload();
  await syncLegacyFromPays(orderId);
  reindexPays(true);

async function deletePayment(orderId, payId){
  const st = Store.state, src = st.source;
  await src.remove('payments', payId);

  await syncLegacyFromPays(orderId);
  reindexPays(true);

/* 订金 / 尾款派生：唯一计算入口，页面与保存逻辑都走它，避免两处口径不一致 */
const balanceOf = o => Math.max(0, Number((o && o.amount) || 0) - Number((o && o.depositAmount) || 0));
/* 尾款实收到账金额：记录「实收尾款金额」则按实收计，否则按合同尾款（未登记手续费时退化为合同额） */
const balReceivedOf = o => {
  const r = Number((o && o.balanceReceived) || 0);
  return r > 0 ? r : balanceOf(o);
};
/* 尾差已结清（手续费 / 折让 / 尾差已确认，不再追收） */
const isBalSettled = o => !!(o && o.balanceSettled);
/* ---- v0.10：销售额 / 实收额 分离 ----
   实收额(receivedOf) = 真实到账的钱，绝不含任何核销；
   核销额(writeOffOf) = 手续费 / 尾差，勾选「差额已结清」后不再追收，但不算真金白银到账；
   已回款(paidTotalOf) = 实收 + 核销，仅用于「未收多少」「是否已收齐」判断。
   这样「货款 10125、实收 10115」时，实收额显示 10115，而不是 10125。
   ★ v0.55：有回款流水的单 → 实收 = 流水合计；无流水 → 沿用下面的四字段口径。 */
const depReceivedOf = o => Number((o && o.depositAmount) || 0);
const receivedOf = o => {
  if(hasPayRows(o)) return paySumOf(o);
  const dep = depReceivedOf(o);
  let s = 0;
  if(dep === 0 || (o && o.depositPaidDate)) s += dep;   // 订金为 0 → 视为已收（无需登记）
  if(o && o.balancePaidDate) s += balReceivedOf(o);
  return s;
};
const writeOffOf = o => {
  if(!o) return 0;
  if(hasPayRows(o)) return isBalSettled(o) ? Math.max(0, Number(o.amount || 0) - paySumOf(o)) : 0;
  if(!o.balancePaidDate || !isBalSettled(o)) return 0;
  return Math.max(0, balanceOf(o) - balReceivedOf(o));

const paidTotalOf = o => receivedOf(o) + writeOffOf(o);
const unpaidOf = o => Math.max(0, Number((o && o.amount) || 0) - paidTotalOf(o));
const isFullyPaid = o => {
  const amt = Number((o && o.amount) || 0);
  if(hasPayRows(o)) return paidTotalOf(o) >= amt - 0.005;
  const dep = Number((o && o.depositAmount) || 0);
  const depOk = (dep === 0 || (o && o.depositPaidDate));
  if(!depOk || !(o && o.balancePaidDate)) return false;
  return balReceivedOf(o) >= balanceOf(o) || isBalSettled(o);

/* 按「回款实收日」归集区间内的已收金额（用于看板按回款日筛选）

  if(hasPayRows(o)){
    return payListOf(o).filter(p => p.payDate && p.payDate >= from && p.payDate <= to)
      .reduce((s, p) => s + (Number(p.amount) || 0), 0);
  }
  const dep = Number((o && o.depositAmount) || 0);
  let s = 0; const inR = d => d && d >= from && d <= to;

/* 计算新增订单的插入排序键：front/end/在某订单之前 */
function computeInsertSortKey(st, pos){
  const orders = st.data.orders || [];
  if(pos === 'front'){ const mn = orders.length ? Math.min(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mn - 1; }
  if(pos === 'end' || !pos){ const mx = orders.length ? Math.max(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mx + 1; }
  const t = orders.find(o => o.id === pos);
  if(!t){ const mx = orders.length ? Math.max(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mx + 1; }
  const tk = (t.sortKey != null ? t.sortKey : 0);
  const smaller = orders.map(o => o.sortKey != null ? o.sortKey : 0).filter(k => k < tk).sort((a,b)=>b-a);
  const prevK = smaller.length ? smaller[0] : tk - 1;
  return (tk + prevK) / 2;

function validateForm(fields, vals){
  const errs = {};
  fields.forEach(f => {
    if(!isVisible(f, vals)) return;
    const v = vals[f.key];
    const empty = (v == null) || (typeof v !== 'object' && String(v).trim() === '');
    if(f.rule && RULES[f.rule]){
      const m = RULES[f.rule](v == null ? '' : String(v).trim(), vals);
      if(m){ errs[f.key] = m; return; }
    }
    if(empty){ if(isRequired(f, vals)) errs[f.key] = '此项为必填'; return; }
  });
  return errs;
}

/* ---------- v0.43 · 排产单号 chips：一个订单可以有多个单号 ----------
   值仍然以「、」拼接的**字符串**存放在 FORM.values.moNo 里（与历史数据、导出、

   绝不重建整个表单 —— 重建会把正在输入的输入框换掉、丢焦点。 */
function moNosFieldHTML(f, vals, err, req, hint, hide, ih){

    + '<span>' + esc(m) + '</span>'

  return '<div class="' + cls + '" data-fld="' + f.key + '">'

/* 只重绘标签区，输入框节点原样保留（焦点不丢） */
function redrawMoChips(){
  const f = FORM; if(!f) return;
  const box = document.getElementById('moBox'); if(!box) return;
  const key = box.dataset.mokey || 'moNo';
  const inp = document.getElementById('moInput');
  box.querySelectorAll('.mo-chip').forEach(x => x.remove());
  splitMoNos(f.values[key]).slice().reverse().forEach(m => {
    const sp = document.createElement('span');
    sp.className = 'mo-chip'; sp.dataset.mo = m;
    sp.innerHTML = '<span>' + esc(m) + '</span>'
      + '<button type="button" class="mo-x" data-mod="' + esc(m) + '" title="移除该单号">×</button>';
    box.insertBefore(sp, inp);
  });
  if(inp) inp.placeholder = splitMoNos(f.values[key]).length ? '继续添加…' : '输入单号后回车';
  bindMoChipRemove();
}
function bindMoChipRemove(){
  const f = FORM; if(!f) return;
  const box = document.getElementById('moBox'); if(!box) return;
  const key = box.dataset.mokey || 'moNo';
  box.querySelectorAll('[data-mod]').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    f.values[key] = splitMoNos(f.values[key]).filter(x => x !== b.dataset.mod).join('、');
    delete f.errors[key];
    redrawMoChips();
    refreshForm();
  });
}
function bindMoField(){
  const f = FORM; if(!f) return;
  const box = document.getElementById('moBox'); if(!box) return;
  const key = box.dataset.mokey || 'moNo';
  const inp = document.getElementById('moInput');
  if(!inp) return;
  const commit = () => {
    const add = splitMoNos(inp.value);
    if(!add.length) return;
    const cur = splitMoNos(f.values[key]);
    /* 同一单号只留一个 —— 系统层面单号是全局唯一的，重复填没有意义 */
    const seen = Object.create(null);
    cur.forEach(x => { seen[x] = 1; });
    add.forEach(x => { if(!seen[x]){ seen[x] = 1; cur.push(x); } });
    f.values[key] = cur.join('、');
    inp.value = '';
    delete f.errors[key];
    redrawMoChips();
    refreshForm();
  };
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === '、'){ e.preventDefault(); commit(); return; }
    if(e.key === '/' ){ e.preventDefault(); commit(); return; }
    /* 退格为空时删掉最后一个标签，跟常见 chips 控件一致 */
    if(e.key === 'Backspace' && !inp.value){
      const cur = splitMoNos(f.values[key]);
      if(cur.length){ cur.pop(); f.values[key] = cur.join('、'); redrawMoChips(); refreshForm(); }
    }
  });
  inp.addEventListener('blur', commit);
  bindMoChipRemove();
}

/* 删除档案：带引用完整性检查（有订单不允许删，避免脏数据） */
/* v0.47：kind 扩展到 supplier —— 供应商档案与客户 / 业务员走同一条删除保护链路。
   引用保护分两层：订单（refCounts）+ 产品（客户产品 / 供应商产品）。
   产品还在的档案不允许删，否则产品会变成挂不到人的孤儿记录。 */
const DEL_RES = { customer:'customers', owner:'owners', supplier:'suppliers' };
const DEL_LABEL = { customer:'客户', owner:'业务员', supplier:'供应商' };
async function deleteResource(kind, id){
  const st = Store.state;
  if(!st.source || !st.source.capabilities.write){ toast('当前数据源只读，无法删除（请切到本地录入）'); return; }
  const res = DEL_RES[kind]; if(!res) return;
  const r = (st.data[res] || []).find(x => x.id === id); if(!r) return;
  const LAB = DEL_LABEL[kind] || '记录';
  const n = refCounts(st, kind, id);
  const nm = kind === 'customer' ? (r.shortName || r.name) : r.name;
  const nProd = kind === 'customer'  ? (st.data.custProducts || []).filter(p => p.customerId === id).length
              : kind === 'supplier' ? (st.data.supplierProducts || []).filter(p => p.supplierId === id).length
              : 0;
  if(n > 0){
    toast(LAB + ' ' + nm + ' 已关联 ' + n + ' 笔订单，不能删除。请先变更这些订单的归属，或停用该档案。');
    return;
  }
  if(nProd > 0){
    toast(LAB + ' ' + nm + ' 下还有 ' + nProd + ' 个' + (kind === 'customer' ? '客户产品' : '供应商产品')
      + '，不能删除。请先移除这些产品，或停用该档案。');
    return;
  }
  if(!confirm('确定删除' + LAB + '「' + nm + '」？\n该档案无关联订单与产品，删除后会移入「回收站」，可在「数据历史」页还原。')) return;
  await st.source.remove(res, id);
  if(kind === 'owner')    st.filters.ownerId    = selList(st.filters.ownerId).filter(x => x !== id);
  if(kind === 'customer') st.filters.customerId = selList(st.filters.customerId).filter(x => x !== id);
  closeSheet(); await reload(); toast('已移入回收站：' + nm);
}

/* 回款登记预览条：随订单金额 / 订金 / 付款日实时刷新 */
function syncPlanBar(f){
  const box = $('#planBar'); if(!box) return;
  const v = f.values, amt = Number(v.amount || 0);
  const dep = Number(v.depositAmount || 0), bal = Math.max(0, amt - dep);
  const rate = amt ? (dep / amt * 100).toFixed(1) : '0.0';
  /* v0.56 · 已用流水记账的单，预览条也换成流水口径 —— 否则表单里显示「订金未付 / 尾款未付」，
     而回款页明明已经收到钱了，两处对不上。 */
  if(f.id && hasPayRows({ id: f.id })){
    const rows = payListOf({ id: f.id });
    const recv = paySumOf({ id: f.id }), un = Math.max(0, amt - recv);
    box.innerHTML = `<div class="planbar">
        <span class="it">订单金额 <b>${money(amt)}</b></span>
        <span class="it">订金条款 <b class="green">${money(dep)}</b>（${rate}%）</span>
        <span class="it">已收 <b class="green">${money(recv)}</b>　<span class="muted">${rows.length} 笔流水</span></span>
        <span class="it">未收 <b class="${un ? 'red' : ''}">${money(un)}</b></span>
        <span class="muted" style="font-size:11.5px">　回款请到「回款」页逐笔登记</span>
      </div>`;
    return;
  }
  const depPaid = v.depositPaidDate ? `已付 ${v.depositPaidDate}` : '未付';
  const balPaid = v.balancePaidDate ? `已付 ${v.balancePaidDate}` : '未付';
  const got = v.balancePaidDate ? (Number(v.balanceReceived || 0) || 0) : 0;
  const fee = Math.max(0, bal - got);
  const feeLine = (v.balancePaidDate && got > 0 && fee > 0)
    ? `<span class="it">实收尾款 <b class="green">${money(got)}</b><span class="muted">手续费/尾差 ${money(fee)}${v.balanceSettled ? ' · 已结清' : ' · 未结清'}</span></span>`
    : '';
  box.innerHTML = `<div class="planbar">
      <span class="it">订单金额 <b>${money(amt)}</b></span>
      <span class="it">订金 <b class="green">${money(dep)}</b>（${rate}%）<span class="muted">${depPaid}</span></span>
      <span class="it">尾款 <b class="green">${money(bal)}</b>（${amt ? (100 - rate*1).toFixed(1) : '0.0'}%）<span class="muted">${balPaid}</span></span>
      ${feeLine}
      ${dep > amt && amt > 0 ? '<span class="tag solid-red">订金超过订单金额</span>' : ''}
    </div>`;
}
/* 回款计划行生成逻辑已移除：回款改为订单级字段（订金 / 尾款 + 各自付款日），见 openOrderForm / saveOrderForm */
function drawForm(){
  const f = FORM; if(!f) return;
  const body = $('#formBody'); if(!body) return;
  // 分组渲染：遇到 group 分隔段则另起一块；stack=true 时组内两列紧凑排列（纵向填写、不横向铺开）
  let html = '', buf = [];
  const flush = () => { if(buf.length) html += '<div class="frow' + (f.stack ? ' two' : '') + '">' + buf.join('') + '</div>'; buf = []; };
  f.fields.forEach(x => {
    if(x.type === 'group'){ flush(); html += `<div class="fsec">${esc(x.label)}</div>`; return; }
    buf.push(fieldHTML(x, f.values, f.errors));
  });
  flush();
  body.innerHTML = html;
  body.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    const evt = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
    el.addEventListener(evt, () => {
      f.values[k] = (el.type === 'checkbox') ? el.checked : el.value;
      delete f.errors[k];
      // 订单金额变化 → 尾款自动联动，同时重算「订金不能超额」这条跨字段校验
      if(k === 'amount'){
        const e2 = validateForm(f.fields.filter(x => x.key === 'depositAmount'), f.values);
        if(e2.depositAmount) f.errors.depositAmount = e2.depositAmount;
        else delete f.errors.depositAmount;
      }
      refreshForm();   // 局部刷新，绝不重建输入框
    });
  });
  bindFileField();
  bindMoField();       /* v0.43：排产单号 chips（值以「、」拼接的字符串存放） */
  /* v0.47：自定义块的事件按字段回绑 —— drawForm 会重建 DOM，不重绑就变成死块 */
  (f.fields || []).forEach(x => {
    if(x.type === 'custom' && typeof x.bind === 'function'){ try{ x.bind(f); }catch(e){} }
  });
  if(typeof f.onRedraw === 'function') f.onRedraw(f);
}
/* 输入过程中的局部刷新：只更新「显隐 / 必填星号 / 错误提示 / 派生值 / 预览条」。
   不能用 drawForm() 整体重建 —— 那会把正在输入的 <input> 换成新节点，
   焦点和光标位置全丢，表现为「每敲一个字就被踢出输入框，只能一个字一个字输入」。 */
function refreshForm(){
  const f = FORM; if(!f) return;
  const body = $('#formBody'); if(!body) return;
  f.fields.forEach(fld => {
    if(!fld.key) return;
    const el = body.querySelector('[data-fld="' + fld.key + '"]');
    if(!el) return;
    const err = f.errors[fld.key];
    el.classList.toggle('hidden', !isVisible(fld, f.values));
    el.classList.toggle('err', !!err);
    const lab = el.querySelector('label');
    if(lab) lab.innerHTML = esc(fld.label) + (isRequired(fld, f.values) ? '<span class="req">*</span>' : '') + infoI(esc(fld.help));
    const hint = el.querySelector('.fhint');
    if(hint) hint.innerHTML = err ? `<div class="fmsg">${esc(err)}</div>` : '';
    if(fld.type === 'calc' && typeof fld.compute === 'function'){
      const cv = fld.compute(f.values), box = el.querySelector('.calcbox .v');
      if(box) box.textContent = (typeof fld.format === 'function' ? fld.format(cv) : (cv == null ? '-' : cv));
    }
  });
  if(typeof f.onRedraw === 'function') f.onRedraw(f);
}
function bindFileField(){
  const f = FORM; if(!f) return;
  const attInput = $('#attInput'), attDrop = $('#attDrop');
  const attTrigger = () => attInput && attInput.click();
  if(attDrop){
    attDrop.onclick = attTrigger;
    attDrop.ondragover = e => { e.preventDefault(); attDrop.classList.add('over'); };
    attDrop.ondragleave = () => attDrop.classList.remove('over');
    attDrop.ondrop = e => { e.preventDefault(); attDrop.classList.remove('over');
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addAttachments(e.dataTransfer.files); };
  }
  if(attInput) attInput.onchange = () => { if(attInput.files && attInput.files.length) addAttachments(attInput.files); attInput.value = ''; };
  const attBox = $('#attBox');
  if(attBox){
    attBox.onclick = e => {
      const t = e.target, i = t.dataset && t.dataset.i;
      if(i == null) return;
      if(t.classList.contains('attPrev')) previewFile((f.values.attachments||[])[+i], $('#attPrevBox'));
      else if(t.classList.contains('attDel')) deleteAttachment(+i);
    };
    attBox.onchange = e => {
      const t = e.target, i = t.dataset && t.dataset.i;
      if(t.classList.contains('attKind') && i != null && (f.values.attachments||[])[+i]) (f.values.attachments)[+i].kind = t.value;
    };
  }
}
async function addAttachments(fileList){
  const f = FORM; if(!f) return;
  for(const file of Array.from(fileList)){
    const bad = FileStore.check(file);
    if(bad){ toast(bad); continue; }
    try{
      const meta = await FileStore.put(file);
      if(!Array.isArray(f.values.attachments)) f.values.attachments = [];
      f.values.attachments.push(meta);
      f.pendingNew.push(meta.id);
      delete f.errors.attachments;
    }catch(e){ toast('上传失败：' + (e && e.message ? e.message : e)); }
  }
  drawForm();
}
async function deleteAttachment(i){
  const f = FORM; if(!f) return;
  const arr = Array.isArray(f.values.attachments) ? f.values.attachments : [];
  const m = arr[i]; if(!m) return;
  f.orphans.push(m.id);
  f.pendingNew = f.pendingNew.filter(id => id !== m.id);
  arr.splice(i, 1);
  f.values.attachments = arr;
  delete f.errors.attachments; drawForm();
}
async function previewFile(meta, box){
  if(!meta || !box) return;
  const u = await FileStore.url(meta.id);
  if(!u){ box.innerHTML = '<div class="fprev" style="padding:14px;color:var(--muted);font-size:12px">文件不存在或已被删除</div>'; return; }
  const isImg = /image\//.test(meta.type || '') || /\.(jpg|jpeg|png)$/i.test(meta.name || '');
  box.innerHTML = `<div class="fprev">${isImg
    ? `<img src="${u}" alt="${esc(meta.name)}">`
    : `<iframe src="${u}" title="${esc(meta.name)}"></iframe>`}</div>`;
}
async function saveOrderForm(){
  const f = FORM, st = Store.state; if(!f) return;
  if(f.kind && f.kind !== 'order') return await saveResourceForm(f);
  const errs = validateForm(f.fields, f.values);
  if(Object.keys(errs).length){ f.errors = errs; drawForm(); toast('请检查表单中标红的项'); return; }
  const v = f.values, amt = Number(v.amount);
  const dep = Number(v.depositAmount || 0);
  const payload = {
    orderNo: String(v.orderNo || '').trim(),
    customerId: v.customerId, ownerId: v.ownerId, status: v.status,
    signDate: v.signDate, amount: amt, currency: 'CNY',
    taxAmount: Number(v.taxAmount || 0) || 0,
    contractDelivery: v.contractDelivery,
    productSummary: String(v.productSummary || '').trim(),
    paymentTerm: v.paymentTerm, tradeTerm: v.tradeTerm,
    attachments: Array.isArray(v.attachments) ? v.attachments.filter(a => a && a.id) : [],
    remark: String(v.remark || '').trim(),
    depositAmount: dep
  };
  /* v0.56 · 已经开始用流水记账的单，表单里没有这四个老字段（buildOrderFields 收起来了）。
     ★ 绝不能因为「表单里没有」就写成空值：那会把镜像付款日抹掉、把「差额已结清」重置成
       未结清，未收金额凭空跳高。这类单回款一律以流水为准，这里直接不碰这些键。 */
  if(!(f.id && hasPayRows({ id: f.id }))){
    payload.depositPaidDate = dep > 0 ? (v.depositPaidDate || '') : '';
    payload.balancePaidDate = v.balancePaidDate || '';
    payload.balanceReceived = v.balancePaidDate ? (Number(v.balanceReceived || 0) || 0) : 0;
    payload.balanceSettled  = !!(v.balancePaidDate && v.balanceSettled);
  }
  /* v0.43 · 排产单号：唯一可编辑来源是 production 表，payload 不再直写 moNo。
     先按 chips 的差异算出「新增 / 移除」计划（含全局唯一校验、有进度移除的确认），
     **校验不通过时订单一个字段都不动**；通过后才写订单、落排产记录，
     最后把 orders.moNo 回写成派生快照。新建订单给空串占位，避免导出读到 undefined。 */
  const plan = planOrderMoNos(st, f.id || '', v.moNo);
  if(!plan.ok){ if(plan.msg) toast(plan.msg); return; }
  if(!f.id) payload.moNo = '';
  const src = st.source;
  if(f.id){
    await src.update('orders', f.id, payload);
    const res = await runOrderMoNos(st, plan);
    await cleanupFiles(f); closeSheet(); await reload();
    await syncOrderMoNo(st, f.id);
    toast('订单已更新：' + payload.orderNo
      + (res.added || res.removed ? `（排产单号 +${res.added} / −${res.removed}）` : ''));
    return;
  }
  if(!payload.orderNo){
    payload.orderNo = 'SO-' + fmt(today()).replace(/-/g,'').slice(2) + '-' + Math.floor(Math.random()*900 + 100);
  }
  const id = uid('O'); payload.id = id; payload.actualDelivery = ''; payload.tags = ''; payload._src = 'manual';
  payload.sortKey = computeInsertSortKey(st, 'end');
  plan.orderId = id;
  await src.create('orders', payload);
  const res0 = await runOrderMoNos(st, plan);
  await cleanupFiles(f); closeSheet(); await reload();
  await syncOrderMoNo(st, id);
  const bal = balanceOf(payload);
  toast('订单已创建：' + payload.orderNo + (dep > 0 ? `（订金 ${money(dep)} / 尾款 ${money(bal)}）` : '（无订金）')
    + (res0.added ? ` · 已建 ${res0.added} 条排产记录` : ''));
}
async function saveResourceForm(f){
  const errs = validateForm(f.fields, f.values);
  if(Object.keys(errs).length){ f.errors = errs; drawForm(); toast('请检查表单中标红的项'); return; }
  try{
    const ok = await f.onSave(f.values);
    if(ok === false) return;
    closeSheet(); await reload();
  }catch(e){ toast('保存失败：' + (e && e.message ? e.message : e)); }
}
async function cleanupFiles(f){
  for(const id of (f.orphans || [])) await FileStore.del(id);
  f.orphans = []; f.pendingNew = [];
}

async function deleteOrder(id){
  const st = Store.state;
  const o = st.data.orders.find(x => x.id === id); if(!o) return;
  if(!st.source.capabilities.write){ toast('当前数据源只读，无法删除（请切到本地录入）'); return; }
  if(!confirm('确定删除订单 ' + o.orderNo + '？\n\n其排产 / 发货 / 回款流水 / 跟进记录会一并移入「回收站」，可在「数据历史」页整组还原。\n附件文件会保留，直到你在回收站里彻底删除。')) return;
  const src = st.source;
  /* v0.20：不再物理删除，整组移入回收站 —— 误删可救，这是本次改动的主要目的 */
  const items = [{ res:'orders', row:o }];
  for(const res of ['production','shipments','payments','followups']){
    st.data[res].filter(x => x.orderId === id).forEach(r => items.push({ res, row:r }));
  }
  if(typeof src.removeGroup === 'function') await src.removeGroup(items, '订单 ' + o.orderNo);
  else { for(const it of items) await src.remove(it.res, it.row.id).catch(()=>{}); }
  closeSheet(); await reload(); toast('订单已移入回收站：' + o.orderNo);
}

/* 行内按钮直接绑定：列表异步渲染，且规模有限（快照 ≤30、回收站 ≤200），不必用委托 */

async function histDoRestore(id){
  const list = await SnapshotStore.all();
  const m = list.find(x => x.id === id);
  if(!m){ toast('快照不存在（可能已被清理）'); return; }
  const snap = await SnapshotStore.get(id);
  if(!snap){ toast('快照内容已丢失（存储降级或被清理）'); return; }
  const diff = histDiff(snap);
  const lines = diff.length ? diff.map(d => '　' + d.label + '：' + d.cur + ' → ' + d.snap).join('\n')
                            : '　（各表记录数与当前一致）';
  if(!confirm('回滚到 ' + fmtStamp(m.at) + ' 的快照？\n\n快照内容：' + (m.reason || '自动存档') +
    '\n各表记录数变化：\n' + lines +
    '\n\n回滚会把整个数据库替换成这份快照的状态。\n（回滚前会自动先存一份当前状态，所以可以再回滚回来。）')) return;
  const r = await histRestore(id, m.reason);
  toast(r.ok ? ('已回滚到 ' + fmtStamp(m.at)) : ('回滚失败：' + r.msg));
  histRefresh();
}
async function histDoDropSnap(id){
  const list = await SnapshotStore.all();

/* ==========================================================================
   v0.38 · 智能录入助手（自然语言 → 订单字段 → 人工确认 → 落库）
   --------------------------------------------------------------------------
   设计取舍（纯本地规则引擎：单文件离线、零 CDN、不依赖任何模型服务）：
   ① 顺序无关 —— 不按固定句式切词，而是「各自扫关键词锚点 + 就近取值」，
      所以「单号是123456，金额是222.00」与「金额222，单号123456」等价。
   ② 同义说法 —— 每个字段一张同义词表（货款/金额/总价…、交货日期/交期/交付…）。
   ③ 值在前也在后 —— 关键词后面取不到值时，再对「没被任何字段吃掉的那段文字」做一次
      兜底扫描（¥/元/万 的金额、各种写法的日期），所以「9月30号交货」也认得出。
   ④ 缺字段 / 歧义只提示不猜 —— 认不出的进 missing[]，同一字段读到两个不同值的进
      ambiguous[]，确认卡上标红追问；客户名对不上则给候选列表，**不擅自建档**。
   ⑤ 确认后才写库，且写库前自动打一份快照（可从「数据历史」回滚）。
   已知边界：中文数量词（「两万」）、相对日期（「月底」）不认；值里夹空格的名字会整段收下。
   ========================================================================== */
const NL_SYNS = [
  { k:'moNo',     ws:['排产单号','生产单号','制令单号','工单号','排产号','MO号'] },
  { k:'orderNo',  ws:['订单编号','订单号','合同编号','合同号','采购单号','采购编号','单号','PO号','编号'] },
  { k:'taxAmount',ws:['税金','税费','税额'] },
  { k:'amount',   ws:['订单金额','合同金额','合同额','总金额','货款','金额','总价','总额','价款','货值','价格'] },
  { k:'customer', ws:['客户名称','客户名','买方单位','买方','甲方','客户','公司名称','公司','单位','下单方'] },
  { k:'delivery', ws:['合同交期','交货日期','交付日期','交货时间','要求交期','出货日期','交货期','交期','交货'] },
  { k:'signDate', ws:['签订日期','签约日期','下单日期','签单日期','签单日','下单日','签约日'] },
  { k:'status',   ws:['订单状态','状态','进度'] },
  { k:'product',  ws:['产品摘要','产品名称','产品','品名','货品','规格','货物'] },
  { k:'owner',    ws:['业务员','跟单员','负责人','销售','业务'] },
  { k:'payment',  ws:['付款条件','付款方式','结算方式','账期','付款'] },
  { k:'trade',    ws:['贸易条款','贸易术语','贸易方式','价格条款'] }
];
/* 字段键 → 中文名（数组用的是真实字段名，命中用的是别名，两套都在这里对齐） */
const NL_LABEL = {
  orderNo:'订单号', moNo:'排产单号', amount:'订单金额', taxAmount:'税金',
  customerId:'客户', customer:'客户', contractDelivery:'合同交期', delivery:'合同交期',
  signDate:'签订日期', status:'订单状态', productSummary:'产品摘要', product:'产品摘要',
  ownerId:'业务员', owner:'业务员', paymentTerm:'付款条件', payment:'付款条件',
  tradeTerm:'贸易条款', trade:'贸易条款'
};
/* 必填项用真实字段名，避免「读取用别名、校验用字段名」两套导致漏判 */
const NL_REQUIRED = ['customerId', 'amount', 'contractDelivery'];
/* 名字类字段：值里一旦出现日期 / 金额的痕迹就断开，免得把「甲 9月30号」整个当客户名 */
const NL_NAME_BREAK = /[¥￥]|\d{1,4}\s*[-/.年]\s*\d{1,2}|\d{1,2}\s*[日月号]|\d[\d,]*\s*(?:元|万|块)/;

/* 全角 → 半角（数字 / 拉丁字母 / : , ; /）——1:1 映射，不改变长度，偏移量仍可复用 */
function nlWiden(s){
  let out = '';
  for(const ch of String(s || '')){
    const c = ch.charCodeAt(0);
    if(c >= 0xFF01 && c <= 0xFF5E) out += String.fromCharCode(c - 0xFEE0);
    else if(c === 0x3000) out += ' ';
    else out += ch;
  }
  return out;
}
function nlClean(s){
  let t = String(s || '').trim();
  for(let i = 0; i < 4; i++){
    t = t.replace(/^[\s:：=,，;；、·\-—>》【】\[\]]+/, '').replace(/^(等于|是|为|叫)/, '').trim();
  }
  return t.replace(/[\s。;；,，、]+$/, '').trim();
}
/* 关键词命中：所有同义词全量扫描 → 按「起点升序、同起点长者优先」去重叠 */
function nlHits(text){
  const low = text.toLowerCase();
  const raw = [];
  NL_SYNS.forEach(g => g.ws.forEach(w => {
    const kw = w.toLowerCase();
    let i = low.indexOf(kw);
    while(i >= 0){ raw.push({ k:g.k, start:i, end:i + kw.length }); i = low.indexOf(kw, i + 1); }
  }));
  raw.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const kept = [];
  raw.forEach(h => { if(!kept.some(x => h.start < x.end && x.start < h.end)) kept.push(h); });
  return kept.sort((a, b) => a.start - b.start);
}
/* 逗号只有在「不像千分位」时才当分隔符 —— 否则「88,000」会被腰斩成 88 */
function nlCommaCuts(text, from){
  const out = [];
  for(let i = from; i < text.length; i++){
    if(text[i] !== ',') continue;
    const before = /\d/.test(text[i - 1] || ''), after = /^\d{3}(?!\d)/.test(text.slice(i + 1, i + 4));
    if(before && after) continue;                 /* 千分位 → 不当分隔 */
    out.push(i);
  }
  return out;
}
/* 取值：从关键词之后切到「下一个字段关键词」或「句子分隔符」为止 */
function nlCut(text, from, stop, keepDun, nameField){
  let end = text.length;
  const seps = keepDun ? [';', '\n', '。'] : [';', '\n', '。', '、'];
  seps.forEach(ch => { const i = text.indexOf(ch, from); if(i >= 0 && i < end) end = i; });
  const iFw = text.indexOf('，', from);            /* 全角逗号永远算分隔（不会当千分位） */
  if(iFw >= 0 && iFw < end) end = iFw;
  const mc = nlCommaCuts(text, from);              /* 半角逗号：千分位不算分隔 */
  if(mc.length && mc[0] < end) end = mc[0];
  if(nameField){
    const m = text.slice(from).match(NL_NAME_BREAK);
    if(m && from + m.index < end) end = from + m.index;
  }
  if(stop != null && stop > from && stop < end) end = stop;
  return text.slice(from, end);
}
/* 数值：容忍 ¥ / 千分位 / 元 / 万 / k */
function nlNum(s){
  const t = String(s || '').replace(/[,，\s¥￥$]/g, '');
  const m = t.match(/([0-9]+(?:\.[0-9]+)?)\s*(万|w|W|k|K)?/);
  if(!m) return NaN;
  let v = Number(m[1]);
  const u = m[2] || '';
  if(u === '万' || u === 'w' || u === 'W') v *= 10000;
  if(u === 'k' || u === 'K') v *= 1000;
  return v;
}
/* 日期：2026.6.30 / 2026-06-30 / 2026年6月30日 / 6月30日 / 6/30 / 6.30（当年） */
function nlDate(s){
  const t = String(s || '').replace(/\s/g, '');
  const two = n => String(n).padStart(2, '0');
  const valid = (m, d) => m >= 1 && m <= 12 && d >= 1 && d <= 31;
  let m = t.match(/(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*[日号]?/);
  if(m && valid(+m[2], +m[3])) return m[1] + '-' + two(+m[2]) + '-' + two(+m[3]);
  m = t.match(/(\d{4})\s*[-/.年]\s*(\d{1,2})\s*月?\s*$/);
  if(m && +m[2] >= 1 && +m[2] <= 12) return m[1] + '-' + two(+m[2]) + '-01';
  m = t.match(/(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*[日号]?$/);
  if(m && valid(+m[1], +m[2])) return new Date().getFullYear() + '-' + two(+m[1]) + '-' + two(+m[2]);
  if(/今天|今日/.test(t)) return fmt(today());
  if(/明天/.test(t)) return fmt(shift(1));
  if(/后天/.test(t)) return fmt(shift(2));
  return '';
}
/* 兜底扫描：把「没被字段吃掉」片段里的日期 / 金额捞出来（应对「9月30号交货」这种值在前的说法）。
   返回「字面值 + 在片段中的偏移」，好把用掉的位置标出来，免得既被采用、又显示成「未识别」。 */
function nlScanDates(seg){
  const res = [];
  const two = n => String(n).padStart(2, '0');
  const push = (v, i, len) => { if(v && !res.some(x => x.v === v)) res.push({ v, i, len }); };
  let m;
  const full = /(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*[日号]?/g;
  while((m = full.exec(seg))){
    if(+m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31)
      push(m[1] + '-' + two(+m[2]) + '-' + two(+m[3]), m.index, m[0].length);
  }
  const md = /(?<![\d.\-/])(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*[日号]/g;   /* 负向回顾：别把 2026.6.30 的尾巴再捞一遍 */
  while((m = md.exec(seg))){
    if(+m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1 && +m[2] <= 31)
      push(new Date().getFullYear() + '-' + two(+m[1]) + '-' + two(+m[2]), m.index, m[0].length);
  }
  return res;
}
function nlScanAmounts(seg){
  const res = [];
  const push = (v, raw, i, len) => { if(isFinite(v) && v > 0 && !res.some(x => x.v === v)) res.push({ v, i, len }); };
  const re = /[¥￥]\s*([0-9][0-9,]*(?:\.[0-9]+)?)|([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:万元|块钱|元|万|块)/g;
  let m;
  while((m = re.exec(seg))){
    let v = Number(String(m[1] || m[2]).replace(/,/g, ''));
    if(/万/.test(m[0])) v *= 10000;
    push(v, m[0], m.index, m[0].length);
  }
  return res;
}
/* 状态：先认工作台全称，再认口语（已出货 / 已排产 …） */
function nlStatus(s){
  const t = String(s || '').trim();
  if(STATUS.indexOf(t) >= 0) return t;
  if(/完结|结清|完成|结束/.test(t)) return '06 已完结';
  if(/收款|回款|收讫|到账|收齐/.test(t)) return '05 已收款';
  if(/发货|出货|已出|发出|离厂/.test(t))  return '04 已发货';
  if(/完工|待发/.test(t))                 return '03 已完工待发货';
  if(/排产|在产|投产|生产中/.test(t))     return '02 已排产';
  if(/签约|已签|下单|新建/.test(t))       return '01 已签约';
  return '';
}
function nlPay(s){
  const t = String(s || '').toUpperCase();
  if(/信用证|L\/C|\bLC\b/.test(t)) return 'LC';
  if(/电汇|T\/T|\bTT\b/.test(t))    return 'TT';
  if(/预付|全款先付|先款/.test(t))  return 'PRE';
  if(/付款交单|\bDP\b/.test(t))     return 'DP';
  if(/承兑交单|\bDA\b/.test(t))     return 'DA';
  if(/赊销|\bOA\b/.test(t))         return 'OA';
  return '';
}
function nlTrade(s){
  const t = String(s || '').toUpperCase();
  const hit = TRADE_TERMS.find(x => new RegExp('(^|[^A-Z])' + x.v + '([^A-Z]|$)').test(t));
  return hit ? hit.v : '';
}
function nlCode(s){
  return String(s || '').replace(/[\s,，。;；:：]/g, '').replace(/^[=:：]+/, '');
}
/* 客户候选：精确命中优先；否则「互相包含」的近似项；再否则共享字符最多者 */
function nlCustCandidates(name, customers){
  const key = String(name || '').trim().toLowerCase();
  if(!key) return [];
  const fieldsOf = c => [c.name, c.shortName, c.code, c.siyuanCode].map(v => String(v || '').trim()).filter(Boolean);
  const out = [];
  (customers || []).forEach(c => {
    const fs = fieldsOf(c);
    const ex = fs.some(v => v.toLowerCase() === key);
    const near = !ex && fs.some(v => {
      const lv = v.toLowerCase();
      return lv.length >= 2 && (lv.indexOf(key) >= 0 || key.indexOf(lv) >= 0);
    });
    if(ex || near) out.push({ id:c.id, name:String(c.name || '').trim(), exact:ex });
  });
  if(out.some(o => o.exact)) return out.filter(o => o.exact).slice(0, 8);
  if(out.length) return out.slice(0, 8);
  const chars = new Set(key.split(''));
  const scored = (customers || []).map(c => {
    const nm = String(c.name || '').trim();
    let n = 0; new Set(nm.toLowerCase().split('')).forEach(ch => { if(chars.has(ch)) n++; });
    return { id:c.id, name:nm, exact:false, score:n };
  }).filter(x => x.score >= 2).sort((a, b) => b.score - a.score);
  return scored.slice(0, 5);
}
function nlOwnerCandidates(name, owners){
  const key = String(name || '').trim().toLowerCase();
  if(!key) return [];
  return (owners || []).map(u => {
    const nm = String(u.name || '').trim().toLowerCase();
    const score = nm === key ? 3 : (nm.indexOf(key) >= 0 || key.indexOf(nm) >= 0 ? 2 : 0);
    return { id:u.id, name:String(u.name || '').trim(), score };
  }).filter(x => x.score).sort((a, b) => b.score - a.score).slice(0, 5);
}

function nlParseOrder(text){
  const st = Store.state;
  const t = nlWiden(text);
  const hits = nlHits(t);
  const literal = {}, consumed = [], ambiguous = [], unparsed = [];
  const NAME_FIELDS = { customer:1, owner:1, product:1 };
  hits.forEach((h, i) => {
    const next = hits[i + 1] ? hits[i + 1].start : null;
    const seg = nlCut(t, h.end, next, h.k === 'moNo', NAME_FIELDS[h.k]);   /* 排产单号允许多个（顿号分隔） */
    consumed.push([h.start, h.end + seg.length]);
    const v = nlClean(seg);
    if(!v) return;
    if(literal[h.k] != null && literal[h.k] !== v){
      const ex = ambiguous.find(a => a.k === h.k);
      if(ex){ if(ex.values.indexOf(v) < 0) ex.values.push(v); }
      else ambiguous.push({ k:h.k, values:[literal[h.k], v] });
      return;
    }
    literal[h.k] = v;
  });
  /* 未被任何字段吃掉的内容 = 多余信息。其中的日期/金额痕迹稍后会被兜底采用，
     所以先按位置留出「空隙」，最后统一扣掉，避免同一串字既被采用又显示成「未识别」。 */
  const gaps = [];
  {
    let last = 0;
    consumed.slice().sort((a, b) => a[0] - b[0]).forEach(([s, e]) => {
      if(s > last) gaps.push([last, s]);
      last = Math.max(last, e);
    });
    if(last < t.length) gaps.push([last, t.length]);
  }
  const extras = [];                       /* 兜底用掉的位置 */
  const scanIn = fn => {
    const out = [];
    gaps.forEach(([gs, ge]) => fn(t.slice(gs, ge)).forEach(sp => out.push({ v:sp.v, s:gs + sp.i, e:gs + sp.i + sp.len })));
    return out;
  };

  /* 逐字段定型 —— 定了型才算「识别到」，认不出的一律进 missing / unparsed */
  const fields = { status:'01 已签约', signDate:fmt(today()) };
  const note = k => { literal[k] = null; unparsed.push({ k, label:NL_LABEL[k] || k }); };
  if(literal.orderNo)  fields.orderNo = nlCode(literal.orderNo);
  if(literal.moNo){
    const ms = String(literal.moNo).split(/[、,，]/).map(nlCode).filter(Boolean);
    if(ms.length) fields.moNo = ms.join('、');
  }
  if(literal.amount != null){
    const n = nlNum(literal.amount);
    if(isFinite(n) && n > 0) fields.amount = n; else note('amount');
  }
  if(literal.taxAmount != null){
    const n = nlNum(literal.taxAmount);
    if(isFinite(n) && n >= 0) fields.taxAmount = n;
  }
  if(literal.delivery != null){
    const d = nlDate(literal.delivery);
    if(d) fields.contractDelivery = d; else note('delivery');
  }
  if(literal.signDate != null){
    const d = nlDate(literal.signDate);
    if(d) fields.signDate = d; else note('signDate');
  }
  if(literal.status){ const s = nlStatus(literal.status); if(s) fields.status = s; }
  if(literal.payment){ const p = nlPay(literal.payment); if(p) fields.paymentTerm = p; }
  if(literal.trade){ const tr = nlTrade(literal.trade); if(tr) fields.tradeTerm = tr; }
  if(literal.product) fields.productSummary = String(literal.product).trim();

  /* 兜底：值写在关键词之前时（「9月30号交货」「¥8800 订单」）上面取不到，这里补 */
  if(fields.amount == null){
    const as = scanIn(nlScanAmounts);
    if(as.length){
      fields.amount = as[0].v;
      const uniq = [];
      as.forEach(a => { if(uniq.indexOf(a.v) < 0) uniq.push(a.v); });
      if(uniq.length > 1) ambiguous.push({ k:'amount', values:uniq.map(String) });
      as.filter(a => a.v === as[0].v).forEach(a => extras.push([a.s, a.e]));
    }
  }
  if(!fields.contractDelivery){
    const ds = scanIn(nlScanDates);
    if(ds.length){
      fields.contractDelivery = ds[0].v;
      const uniq = [];
      ds.forEach(a => { if(uniq.indexOf(a.v) < 0) uniq.push(a.v); });
      if(uniq.length > 1) ambiguous.push({ k:'contractDelivery', values:uniq });
      ds.filter(a => a.v === ds[0].v).forEach(a => extras.push([a.s, a.e]));
    }
  }
  /* 真正「没派上用场」的文字才显示成未识别 */
  const rest = [];
  {
    let last = 0;
    consumed.concat(extras).sort((a, b) => a[0] - b[0]).forEach(([s, e]) => {
      if(s > last) rest.push(t.slice(last, s));
      last = Math.max(last, e);
    });
    if(last < t.length) rest.push(t.slice(last));
  }
  const leftover = rest.join(' ').replace(/[\s,;。、·\-—]+/g, ' ').replace(/\s+/g, ' ').trim();
  /* 客户 / 业务员：只做「匹配」，绝不自动建档 */
  const custCand = literal.customer ? nlCustCandidates(literal.customer, st.data.customers) : [];
  const ownerCand = literal.owner ? nlOwnerCandidates(literal.owner, st.data.owners) : [];
  if(custCand.length === 1) fields.customerId = custCand[0].id;
  if(ownerCand.length)      fields.ownerId    = ownerCand[0].id;

  const missing = NL_REQUIRED.filter(k => fields[k] == null || fields[k] === '')
    .map(k => ({ k, label:NL_LABEL[k] || k }));
  return {
    text:t, fields, literal, ambiguous, unparsed, missing, leftover,
    custName: literal.customer ? String(literal.customer).trim() : '',
    custCand, ownerCand,
    recognized: Object.keys(fields).filter(k => k !== 'signDate' && k !== 'status').length
  };
}

/* ==========================================================================
   v0.54 · 顶栏当日日期（星期）
   --------------------------------------------------------------------------
   ★ 用本地时区取日期（new Date()），不走 UTC —— 否则东八区早上 8 点前会显示前一天。
   ★ 每 30 秒只比一次日期串，跨零点才重写 DOM；页面从后台回来（睡眠过夜）时补一次。
   ========================================================================== */
const DOW_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function todayParts(d){
  const t = d || new Date();
  const y = t.getFullYear(), m = t.getMonth() + 1, dd = t.getDate(), w = t.getDay();
  const p2 = n => String(n).padStart(2, '0');
  const dowShort = '周' + DOW_CN[w].slice(2);       /* 星期三 → 周三 */
  return {
    y, m, d: dd, w, dow: DOW_CN[w], dowShort,
    iso: y + '-' + p2(m) + '-' + p2(dd),
    long:  y + '年' + m + '月' + dd + '日 ' + DOW_CN[w],
    short: p2(m) + '-' + p2(dd) + ' ' + dowShort,
    weekend: w === 0 || w === 6
  };
}
let _todayKey = '';
function applyToday(force){
  const p = todayParts();
  if(!force && p.iso === _todayKey) return p;     /* 同一天：不碰 DOM */
  _todayKey = p.iso;
  const l = $('#todayLong'), s = $('#todayShort'), m = $('#todayMin'), chip = $('#todayChip');
  if(l) l.textContent = p.long;
  if(s) s.textContent = p.short;
  if(m) m.textContent = p.dowShort;      /* ≤600px 只留「周二」：再宽一点会把页面标题挤成一个字 */
  if(chip){
    chip.title = p.long;
    chip.setAttribute('data-iso', p.iso);
    chip.classList.toggle('today-red', p.weekend);   /* 周末把「星期几」标红 */
  }
  return p;
}
function bindToday(){
  applyToday(true);
  /* ★ 刻意**不用 setInterval 轮询**：长驻定时器会让 jsdom 回归的 node 进程永不退出
     （全部 50+ 个套件都会在跑到最后一行后挂死，只能 kill）。改成事件驱动：
     用户任何操作 / 切回标签页 / 从后台恢复时校准一次；applyToday 内部有「同一天直接
     return」的短路，命中时只花一次 new Date()，点击与滚动都感知不到。
     长时间静止跨零点的情况由 render() 里的同一次调用兜住（任何重渲染都会校准）。 */
  const kick = () => applyToday(false);
  ['pointerdown', 'keydown', 'wheel', 'focus', 'pageshow', 'visibilitychange']
    .forEach(ev => window.addEventListener(ev, kick, { passive: true, capture: true }));
}

/* ==========================================================================
   v0.36 · 内容区高度自适应（消除底部留白 / 让列表在首屏内撑满）
   --------------------------------------------------------------------------
   症状：列表页卡片底边停在半空，下面留 80~270px 空白（@1440×900 实测：
         订单 111 / 排产 152 / 卡片视图 101 / 预警 246 / 客户 273）。
   做法：把「#page 内边距盒底」当目标线，实测各滚动区能占多高并写回；滚动区撑满
         后若仍有富余，让末个内容容器长到目标线。
   ★ 只增不减：内容本来装不下时一律不动，绝不制造溢出。
   ★ jsdom 无布局（clientHeight=0）直接跳过；窄屏（≤920）整页滚动是既定设计，不接管。 */
const FIT_ZONE = '.tw.tscroll, .vbox, .mkan, .alcols>.card';
function fitPageH(){
  try{
    const page = $('#page'); if(!page) return;
    /* 1) 先复位上一轮写进去的内联值 —— 切页后不复位会逐次累积 */
    $$('#page [data-fit]').forEach(el => { el.style.maxHeight = ''; el.style.minHeight = ''; el.removeAttribute('data-fit'); });
    if(!page.clientHeight) return;
    if(window.matchMedia && !window.matchMedia('(min-width:921px)').matches) return;
    const pr   = page.getBoundingClientRect();
    const padB = parseFloat(getComputedStyle(page).paddingBottom) || 0;
    const line = pr.top + page.clientHeight - padB;          /* 目标线（视口坐标，随滚动自适应） */
    /* 2) 滚动区：夹到「可用高」，让列表在首屏内吃掉全部剩余高度。
       注意必须先 max-height:none 松绑 CSS 里写死的值，否则量到的是「已被限住」的高度、
       自然高永远测不出来（踩过一次：断言算通过，但表格区没长高、多出的空间变成卡片内空白）。 */
    $$('#page ' + FIT_ZONE).forEach(z => {
      const avail = line - z.getBoundingClientRect().top - 2;   /* 2px 容边框/圆角 */
      if(avail < 120) return;                                   /* 太矮不接管，免得夹出个不可用的滚动区 */
      z.style.maxHeight = 'none';                               /* 松绑，量真实自然高 */
      const nat = z.getBoundingClientRect().height;
      z.style.maxHeight = Math.round(Math.min(nat, avail)) + 'px';
      z.setAttribute('data-fit', '1');
    });
    /* 3) 滚动区撑满后仍有富余 → 末个内容容器长到目标线（客户页 / 卡片视图这类短内容页） */
    const kids = Array.prototype.filter.call(page.children, el => {
      if(getComputedStyle(el).display === 'none') return false;
      return el.getBoundingClientRect().height > 0;
    });
    const last = kids[kids.length - 1];
    /* 智能录入页（v0.38）：末个容器是空的 #nlOut（确认卡挂载点），**不能**把上一张输入卡撑到
       整页高 —— 那一版首屏是「内容只在顶部、下面近 400px 空卡」。该页高度交给表单自身决定。 */
    if(last && Store.state.ui.page !== 'assist'){
      const cs    = getComputedStyle(last);
      const slack = line - last.getBoundingClientRect().bottom - (parseFloat(cs.marginBottom) || 0);
      if(slack > 12){
        last.style.minHeight = Math.round(last.getBoundingClientRect().height + slack) + 'px';
        last.setAttribute('data-fit', '1');
      }
    }
  }catch(e){ /* 布局自适应失败绝不能影响渲染 */ }
}

/* ==========================================================================
   v0.50 · 滚动位置保持（重渲染不再把人踢回顶部）
   --------------------------------------------------------------------------
   症状：改一个订购状态、点「重新载入」、切一下排序、在筛选里敲个字，页面就跳回最上面。
   根因：render() 用 innerHTML 整块换掉 #page 的子节点 —— 内容在一瞬间变空，
         scrollHeight 归零，浏览器把 scrollTop 钳到 0；新内容填回来以后也不会自己回去。
         refreshProdList / refreshCustList 换 tbody 时，卡内那张表（.tw.tscroll）同理。
   做法：重建前把「已经滚过的容器」连同 scrollTop / scrollLeft 记下来
         （按 DOM 路径做 key，只记 >0 的，正常也就 1~3 个），重建后按同一路径找回来写回。
   ★ 只认路径，不认节点 —— 节点每次重建都是新的，路径不变就能命中。
   ★ 路径对不上（结构真的变了：切页、列表被筛短、区块增删）就放弃那一条：
     宁可不动，也不乱滚。
   ★ 切页 goto() 会置 _scrollReset —— 新页从顶部开始，这是用户主动的视图切换，
     不该继承上一页的位置。
   ★ 恢复时机必须在 fitPageH() 之后（它会改表格与末卡高度），再补一帧
     （缩略图 / 字体撑开高度常晚一帧落地）。 */
function scrollKey(el){
  const parts = [];
  let n = el;
  while(n && n !== document.body && n.parentElement){
    const p = n.parentElement;
    let i = 0;
    for(let c = p.firstElementChild; c; c = c.nextElementSibling){ if(c === n) break; i++; }
    parts.unshift(n.tagName + ':' + i);
    n = p;
  }
  return parts.join('>');
}
function findByScrollKey(key){
  const segs = String(key == null ? '' : key).split('>');
  if(!segs.length || !segs[0]) return null;
  let cur = document.body;
  for(let s = 0; s < segs.length; s++){
    const cut = segs[s].lastIndexOf(':');
    if(cut < 0) return null;
    const tag = segs[s].slice(0, cut);
    const idx = parseInt(segs[s].slice(cut + 1), 10) || 0;
    let c = cur.firstElementChild;
    for(let k = 0; k < idx && c; k++) c = c.nextElementSibling;
    if(!c || c.tagName !== tag) return null;      /* 同位置换了标签 → 结构变了，这条不恢复 */
    cur = c;
  }
  return cur === document.body ? null : cur;
}
function snapScroll(){
  const out = [];
  if(_scrollReset || !document.body) return out;
  const all = document.body.getElementsByTagName('*');
  for(let i = 0; i < all.length; i++){
    const el = all[i];
    if(el.scrollTop > 0 || el.scrollLeft > 0)
      out.push({ k: scrollKey(el), t: el.scrollTop, l: el.scrollLeft });
  }
  return out;
}
/* onlyZero=true：只补「还是 0」的那几处 —— 用在 rAF 补帧，避免覆盖用户在这一帧里的主动滚动 */
function restoreScroll(snap, onlyZero){
  if(!snap || !snap.length) return 0;
  let n = 0;
  for(let i = 0; i < snap.length; i++){
    const s = snap[i], el = findByScrollKey(s.k);
    if(!el) continue;
    if(s.t > 0 && (!onlyZero || el.scrollTop === 0)){ el.scrollTop = s.t; n++; }
    if(s.l > 0 && (!onlyZero || el.scrollLeft === 0)) el.scrollLeft = s.l;
  }
  return n;
}
/* 局部重绘专用：换 tbody / 换表头的那一小段包在 fn 里，进出各存/取一次滚动位置。
   卡片内那张表（.tw.tscroll）的路径不随 tbody 重建而变，所以按路径找回得来。 */
function keepScroll(fn){
  const sc = snapScroll();
  try{ return fn(); }
  finally{
    if(sc.length){
      restoreScroll(sc);
      if(window.requestAnimationFrame)
        window.requestAnimationFrame(function(){ restoreScroll(sc, true); });
    }
  }
}

(function bindToTop(){

})();

    m=s.match(/cos[.-]([a-z0-9-]+)\.myqcloud\.com/i); if(m) return m[1];

    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),(cfg.timeoutSec||30)*1000); init.signal=ctrl.signal;
    let resp;
    try{ resp=await fetch(sig.url,init); }
    catch(e){ clearTimeout(t); if(attempt<(cfg.maxRetry||0)){ await new Promise(r=>setTimeout(r,(cfg.retryBackoffSec||5)*1000)); return s3Request(method,key,body,extraHeaders,query,attempt+1); } throw new Error('网络错误：'+(e.message||e)); }

    const data=new TextEncoder().encode(JSON.stringify(obj)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);
