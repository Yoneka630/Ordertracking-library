  </div>`;

function initGlobalFilter(){
  const wrap = $('#gfilter'); if(!wrap) return;
  /* 当前页面用哪个作用域：订单页/看板/回款… = global（业务统计口径）；排产页 = prod（独立） */
  const scope = filterScopeOf(Store.state.ui.page);
  wrap.innerHTML = gfilterHTML(Store.state, scope);
  const sf = patch => Store.setFilter(patch, scope);
  bindMsel('#fOwner', L => sf({ ownerId:L }));
  const b = $('#fBasis'); if(b) b.onchange = e => sf({ basis:e.target.value });
  const kw = $('#fKw'); if(kw) kw.oninput = e => sf({ keyword:e.target.value });
  const frm = $('#fFrom'); if(frm) frm.onchange = e => sf({ from:e.target.value });
  const to = $('#fTo'); if(to) to.onchange = e => sf({ to:e.target.value });
  $$('#fPreset button').forEach(x => x.onclick = () => sf({ preset:x.dataset.p }));
  const r = $('#fReset'); if(r) r.onclick = () => sf(blankFilter());
}
/* ---------- v0.24 · 面板绑定：订单页 / 排产页共用同一套条件行组件 ----------
   组件的实现（字段表 / 求值 / 渲染 / 多选下拉）都在「模块 6 · Selectors」上方，
   这里只保留「订单页」这一侧的薄封装；排产页走 bindCondPanel('prod')。 */
function ordersPanelHTML(st){ return condPanelHTML(st, 'global'); }
function bindOrdersPanel(st){ bindCondPanel('global'); }
/* 当前页面正在生效的那份筛选（订单页/看板 = global，排产页 = prod） */
function pageFilter(st){
  st = st || Store.state;
  return scopeFilters(st, filterScopeOf(st.ui.page));
}
/* 顶栏业务员下拉只刷文字与勾选态，不重建节点（重建会让关键字输入框丢焦点） */
function syncOwnerMsel(cur){
  const box = $('#fOwner'); if(!box) return;
  const L = selList(cur), opts = fOptOwner(Store.state);
  const t = box.querySelector('.msel-t');
  if(t) t.textContent = L.length
    ? (L.length <= 2 ? L.map(v => selLabel(opts, v)).join('、') : ('已选 ' + L.length + ' 项'))
    : '全部业务员';
  const btn = box.querySelector('.msel-btn'); if(btn) btn.classList.toggle('on', L.length > 0);
  $$('#fOwner input[type=checkbox]').forEach(cb => { cb.checked = L.indexOf(cb.value) >= 0; });
}
/* 把「当前页作用域」的筛选值刷回筛选栏 DOM（不重建节点 → 输入不丢焦点） */
function syncFilterBar(){
  const f = pageFilter(Store.state);
  syncOwnerMsel(f.ownerId);
  const b = $('#fBasis'); if(b) b.value = f.basis;
  const kw = $('#fKw'); if(kw && document.activeElement !== kw) kw.value = f.keyword || '';
  const dFrom = $('#fFrom'); if(dFrom) dFrom.value = f.from || '';
  const dTo = $('#fTo');     if(dTo)   dTo.value = f.to || '';
  $$('#fPreset button').forEach(x => x.classList.toggle('on', x.dataset.p === f.preset));
  const d1 = $('#custDates'), d2 = $('#custDates2');
  if(d1) d1.style.display = (f.preset === 'custom') ? '' : 'none';
  if(d2) d2.style.display = (f.preset === 'custom') ? '' : 'none';
}

function viewDashboard(st){
  const orders = filteredOrders(st);

  const rows = aggBy(st, orders, c.dim);
  const statusRows = aggBy(st, orders, 'status');

    ? [['bar','柱状图'],['line','折线图'],['area','面积图'],['table','表格']]
    : [['bar','柱状图'],['pie','饼图'],['donut','环形图'],['table','表格']];
  const dims = [['customer','按客户'],['owner','按业务员'],['status','按状态'],['industry','按行业'],['level','按客户等级'],['month','月度趋势']];

  const pct = n => k.amount ? (n / k.amount * 100).toFixed(1) : '0.0';
  let h = `<div class="grid kpi">
    <div class="card"><div class="lb">销售总额</div><div class="vl">${money(k.amount)}</div><div class="sb2">${k.count} 笔订单 · 合同金额</div></div>
    <div class="card"><div class="lb">订单数量</div><div class="vl">${k.count}</div><div class="sb2">进行中 ${k.active} 笔</div></div>
    <div class="card"><div class="lb">实收金额</div><div class="vl good">${money(k.recv)}</div><div class="sb2">真实到账 · 实收率 ${pct(k.recv)}%</div></div>
    <div class="card"><div class="lb">未回款</div><div class="vl ${k.unpaid?'bad':''}">${money(k.unpaid)}</div><div class="sb2">${k.writeoff>0?'已剔除结清手续费':'含未到期部分'}</div></div>
    <div class="card"><div class="lb">手续费 · 尾差核销</div><div class="vl ${k.writeoff?'warn':''}">${money(k.writeoff)}</div><div class="sb2">已结清不追收 · 不计入实收</div></div>
    <div class="card"><div class="lb">客单价</div><div class="vl">${money(Math.round(k.avg))}</div><div class="sb2">销售额 ÷ 订单数</div></div>
    <div class="card"><div class="lb">逾期未交付</div><div class="vl ${k.overdue?'bad':''}">${k.overdue}</div><div class="sb2">已过交期仍未完工</div></div>
  </div>`;
  h += `<div class="sec">维度分析 · 与顶部筛选实时联动</div>
  <div class="card"><div class="hd">
    <div class="seg" id="cDim">${dims.map(d=>`<button data-d="${d[0]}" class="${c.dim===d[0]?'on':''}">${d[1]}</button>`).join('')}</div>
    <div class="seg" id="cType">${types.map(t=>`<button data-t="${t[0]}" class="${c.type===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <div class="seg" id="cMetric">
      <button data-m="amount" class="${c.metric==='amount'?'on':''}">金额</button>
      <button data-m="count"  class="${c.metric==='count'?'on':''}">数量</button>
      <button data-m="both"   class="${c.metric==='both'?'on':''}">金额+数量</button>
    </div>
    <div class="spacer"></div><span class="muted" style="font-size:11.5px">${rows.length} 个分组</span>
  </div>
  <div class="bd" style="padding:10px 4px 0"><div id="chartMain"></div></div>
  <div class="legend" style="display:flex;flex-wrap:wrap;gap:9px;padding:9px 15px 13px;font-size:12px">${Chart.legend(rows.slice(0,12))}</div></div>`;

  h += `<div class="grid c2" style="margin-top:14px">
    <div class="card"><div class="hd"><h3>客户销售排行</h3><span class="muted" style="font-size:11px">Top 10</span></div><div class="bd np">${custRank(st, orders)}</div></div>
    <div class="card"><div class="hd"><h3>订单状态分布</h3></div>
      <div class="bd" style="padding:10px 4px 0"><div id="chartStatus"></div></div>
      <div class="legend" style="display:flex;flex-wrap:wrap;gap:9px;padding:9px 15px 13px;font-size:12px">${Chart.legend(statusRows)}</div></div>
  </div>`;
  h += `<div class="card" style="margin-top:14px"><div class="hd"><h3>月度销售趋势</h3>
      <span class="muted" style="font-size:11px">按${ {sign:'签订日',delivery:'合同交期',pay:'回款实收日'}[st.filters.basis] }归集</span></div>
    <div class="bd" style="padding:10px 4px 0"><div id="chartTrend"></div></div></div>`;
  return h;
}
function custRank(st, orders){
  const rows = aggBy(st, orders, 'customer');
  if(!rows.length) return '<div class="empty">当前筛选条件下没有数据</div>';
  const total = rows.reduce((a,b) => a + b.amount, 0) || 1;
  return `<div class="tw"><table><thead><tr><th>#</th><th>客户</th><th class="num">订单金额</th>
    <th class="num">订单数</th><th class="num">已回款</th><th class="num">未回款</th><th style="width:110px">占比</th></tr></thead><tbody>` +
    rows.map((r,i) => `<tr><td><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span></td>
      <td>${esc(r.label)}</td><td class="num">${money(r.amount)}</td><td class="num">${r.count}</td>
      <td class="num green">${money(r.paid)}</td><td class="num ${r.unpaid>0?'red':''}">${money(r.unpaid)}</td>
      <td><div class="pbar"><i style="width:${(r.amount/total*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}"></i></div></td></tr>`).join('')
    + '</tbody></table></div>';
}
function bindDashboard(st){
  $$('#cDim button').forEach(x => x.onclick = () => {
    const d = x.dataset.d;
    const t = d === 'month'
      ? (['pie','donut'].includes(st.chart.type) ? 'line' : st.chart.type)
      : (['line','area'].includes(st.chart.type) ? 'bar' : st.chart.type);
    Store.setChart({ dim:d, type:t });
  });
  $$('#cType button').forEach(x => x.onclick = () => Store.setChart({ type:x.dataset.t }));
  $$('#cMetric button').forEach(x => x.onclick = () => Store.setChart({ metric:x.dataset.m }));
  const orders = filteredOrders(st);
  Chart.render($('#chartMain'), aggBy(st, orders, st.chart.dim).slice(0,12), { type:st.chart.type, metric:st.chart.metric, dim:st.chart.dim });
  Chart.render($('#chartStatus'), aggBy(st, orders, 'status'), { type:'donut', metric:'amount', dim:'status' });
  Chart.render($('#chartTrend'), aggBy(st, orders, 'month'), { type:'area', metric:'both', dim:'month' });
}

  { k:'workshop',     t:'车间',     d:'asc'  },
  { k:'planStart',    t:'计划开工', d:'asc'  },
  { k:'planFinish',   t:'计划完工', d:'asc'  },
  { k:'actualStart',  t:'实际开工', d:'asc'  },
  { k:'actualFinish', t:'实际完工', d:'asc'  },
  { k:'progress',     t:'进度',     d:'desc' },
  { k:'cmp',          t:'交期对比', d:'asc'  }
];
/* 各字段默认方向由字段表派生 —— 避免「表里写着 desc、默认方向表里写着 asc」这种两处对不上 */
const ORD_DIR_DEFAULT  = {}; ORD_SORT_FIELDS.forEach(f => { ORD_DIR_DEFAULT[f.k]  = f.d; });
const PROD_DIR_DEFAULT = {}; PROD_SORT_FIELDS.forEach(f => { PROD_DIR_DEFAULT[f.k] = f.d; });
/* 两个页面的排序状态放进同一张表：列头点击 / 卡片下拉 / toggleSort 都只认 kind。 */
const SORT_DEF = {
  ord:  { fields:ORD_SORT_FIELDS,  cur:() => ordSort, curDir:() => ordDir, set:(k, d) => { ordSort = k; ordDir = d; } },
  prod: { fields:PROD_SORT_FIELDS, cur:() => pSort,   curDir:() => pDir,  set:(k, d) => { pSort = k;  pDir = d; } }
};
function sortField(kind, key){ const m = SORT_DEF[kind]; return m ? m.fields.find(f => f.k === key) : null; }
/* 点同一列 = 翻方向；点别的列 = 换列并套该列默认方向 */
function toggleSort(kind, key){
  const m = SORT_DEF[kind]; const f = sortField(kind, key);
  if(!m || !f) return;
  if(m.cur() === key) m.set(key, m.curDir() === 'asc' ? 'desc' : 'asc');
  else                m.set(key, f.d || 'asc');
  Store.set({});
}
/* 列头：当前排序列高亮 + ▲/▼；其余列留箭头位（悬停才显），暗示可点。 */
function thSort(kind, key, label, extraCls){
  const m = SORT_DEF[kind]; const on = !!m && m.cur() === key;
  const d = on ? m.curDir() : 'asc';
  const arw = on ? (d === 'desc' ? '▼' : '▲') : '';
  const cls = 'th-sort' + (on ? ' on' : '') + (extraCls ? ' ' + extraCls : '');
  const tip = on ? `当前按「${label}」${d === 'desc' ? '降序' : '升序'}，点一下切${d === 'desc' ? '升序' : '降序'}`
                 : `按「${label}」排序`;
  return `<th class="${cls}" data-sort="${kind}:${key}" title="${tip}">${label}<i class="sarw">${arw}</i></th>`;
}
/* 卡片视图的「排序」下拉：卡片没有列头，字段与方向都从这里选。 */
function sortMenuBtnHTML(id, kind){
  const m = SORT_DEF[kind];
  return `<div class="menu" id="${id}">
      <button class="btn sm" data-sortbtn="1">⇅ 排序</button>
      <div class="pop" style="min-width:150px">${m.fields.map(f => {
        const on = m.cur() === f.k;
        return `<button class="srow${on ? ' on' : ''}" data-sf="${kind}:${f.k}">${f.t}<i class="sarw">${on ? (m.curDir() === 'desc' ? '▼' : '▲') : ''}</i></button>`;
      }).join('')}</div></div>`;
}
/* 通用比较：数字按大小、其余按中文字典序（numeric 让 O2 排在 O10 前面）。 */
function cmpSortVal(a, b){
  if(typeof a === 'number' && typeof b === 'number') return a - b;
  const as = String(a), bs = String(b);
  if(!as && !bs) return 0;
  if(!as) return 1;
  if(!bs) return -1;
  return as.localeCompare(bs, 'zh-Hans-CN', { numeric:true });
}
/* 未填值（'' / null）恒排最后 —— 不随升降序翻到最前，否则一降序满屏空行。 */
function cmpWithDir(va, vb, dir){
  const ea = (va === '' || va == null), eb = (vb === '' || vb == null);
  if(ea || eb) return (ea && eb) ? 0 : (ea ? 1 : -1);
  return cmpSortVal(va, vb) * dir;
}
/* 列头点击 + 卡片下拉：一处绑定，两种视图都覆盖 */
function bindSortClicks(root){
  const box = root || $('#page'); if(!box) return;
  box.querySelectorAll('th.th-sort').forEach(th => th.onclick = () => {
    const p = String(th.dataset.sort || '').split(':'); toggleSort(p[0], p[1]);
  });
  box.querySelectorAll('[data-sortbtn]').forEach(b => {
    const menu = b.closest('.menu'); if(!menu) return;
    b.onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  });
  box.querySelectorAll('[data-sf]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = String(b.dataset.sf || '').split(':'); toggleSort(p[0], p[1]);
  });
}

let ordSort = 'delivery';   /* 排序字段：见 ORD_SORT_FIELDS */
let ordDir  = 'asc';        /* 排序方向：asc 升序 | desc 降序 */
/* v0.23：客户 / 回款筛选并入统一的多维筛选对象（filters.customerId / filters.pay）。
   下面两个兼容读写口子保留，老脚本仍可用 setOrdFCust('C1') / setOrdFPay('todo') 这类单选写法。 */
function setOrdFCust(v){ Store.setFilter({ customerId: selList(v) }); }
function setOrdFPay(v){ Store.setFilter({ pay: selList(v) }); }
/* 取排序值：数字保持数字，其余转字符串；「已收」与列上显示口径一致（实收 + 核销）。 */
function ordSortVal(o, k, st){
  switch(k){
    case 'orderNo':  return o.orderNo || '';
    case 'customer': { const c = st.data.customers.find(x => x.id === o.customerId); return c ? (c.shortName || c.name || '') : ''; }
    case 'owner':    { const u = st.data.owners.find(x => x.id === o.ownerId);       return u ? (u.name || '') : ''; }
    case 'status':   return String(o.status || '');
    case 'delivery': return o.contractDelivery || '';
    case 'amount':   return Number(o.amount) || 0;
    case 'got':      return paidTotalOf(o);
    case 'unpaid':   return unpaidOf(o);
    case 'sign':     return o.signDate || '';
    default:         return o.sortKey != null ? o.sortKey : 0;   /* manual */
  }
}
/* 订单页当前可见列表：全局筛选（含客户 / 回款多维）→ 排序（含方向） */
function ordViewList(st){
  const list = filteredOrders(st).slice();
  const dir = ordDir === 'desc' ? -1 : 1;
  list.sort((a, b) => cmpWithDir(ordSortVal(a, ordSort, st), ordSortVal(b, ordSort, st), dir));
  return list;
}
function exportCSV(rows, name){
  const csv = '\ufeff' + rows.map(r => r.map(c =>
    '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = name + '_' + fmt(today()) + '.csv'; a.click();
}
function exportOrders(st){

  const head = ['订单号','客户','业务员','状态','签订日','合同交期','实际交付','订单金额','税金','实收','已回款','未回款','手续费核销','付款条件','贸易条款','排产单号','产品摘要'];

}

/* ==========================================================================
   模块 8.5 · 批量修改（Excel 式查找替换 · 勾选生效 · 一步撤销）
   - ordSel：订单页勾选集合（跨重渲染保留）
   - 直接赋值：把选中订单的某个字段整批改成新值（业务员 / 状态 / 客户 / 条款 / 日期 / 金额 / 文本）
   - 查找替换：对文本字段做子串替换，支持「区分大小写」「单元格匹配」
   - 执行前先算差异表（旧值 → 新值）预览，新旧值相同的记录自动跳过、不写库
   - 执行后保留一次撤销快照，仅回滚被改字段，不影响其它改动
   ========================================================================== */
const BATCH_FIELDS = [
  { k:'ownerId',          t:'业务员',     type:'ref',    src:'owners' },
  { k:'status',           t:'状态',       type:'status' },
  { k:'customerId',       t:'客户',       type:'ref',    src:'customers' },
  { k:'paymentTerm',      t:'付款条件',   type:'enum',   opts:PAY_TERMS },
  { k:'tradeTerm',        t:'贸易条款',   type:'enum',   opts:TRADE_TERMS },
  { k:'contractDelivery', t:'合同交期',   type:'date' },
  { k:'actualDelivery',   t:'实际交付日', type:'date' },
  { k:'amount',           t:'订单金额',   type:'number' },
  { k:'taxAmount',        t:'税金',       type:'number' },
  { k:'productSummary',   t:'产品摘要',   type:'text' },
  { k:'remark',           t:'备注',       type:'text' },
  { k:'tags',             t:'标签',       type:'text' },
  { k:'orderNo',          t:'订单号',     type:'text' },
  { k:'moNo',             t:'排产单号',   type:'text' }
];
/* 查找替换只作用于文本字段：避免把「状态 / 条款 / 枚举」替换成非法值 */
const BATCH_TEXT_FIELDS = ['productSummary','remark','tags','orderNo','moNo'];
const BATCH_NUMBER_FIELDS = ['amount','taxAmount'];

let ordSel = new Set();   /* 已勾选订单 id */
let batchUndo = null;     /* { at, label, rows:[{id,field,old}] } 仅保留最近一次 */
let BX = null;            /* 批量弹窗内的临时编辑状态 */

function batchTargetList(st){
  const all = st.data.orders;
  return all.filter(o => ordSel.has(o.id));
}
/* 字段值 → 展示文案（id 还原成名称，金额加币种） */
function bxLabel(st, field, v){
  if(v == null || v === '') return '';
  if(field === 'ownerId'){ const u = st.data.owners.find(x => x.id === v); return u ? u.name : String(v); }
  if(field === 'customerId'){ const c = st.data.customers.find(x => x.id === v); return c ? (c.shortName || c.name) : String(v); }
  if(field === 'paymentTerm') return payTermLabel(v);
  if(field === 'tradeTerm')   return tradeTermLabel(v);
  if(BATCH_NUMBER_FIELDS.indexOf(field) >= 0) return money(Number(v) || 0);
  return String(v);
}
function bxCell(st, field, v){
  const t = bxLabel(st, field, v);
  return t === '' ? '<span class="muted">（空）</span>' : esc(t);
}
function bxCast(f, raw){
  if(!f) return String(raw == null ? '' : raw);
  if(f.type === 'number'){ const n = Number(raw); return isFinite(n) ? n : 0; }
  return String(raw == null ? '' : raw);
}
function bxFieldLabel(k){ const f = BATCH_FIELDS.find(x => x.k === k); return f ? f.t : k; }
function bxEscRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* 计算差异集：只返回「值真的会变」的记录 */
function bxCompute(st){
  const rows = batchTargetList(st);
  const out = [];
  if(!BX || !rows.length) return out;
  if(BX.mode === 'replace'){
    const k = BX.rfield;
    if(!BX.find) return [];
    const re = new RegExp(bxEscRe(BX.find), BX.cs ? 'g' : 'gi');
    rows.forEach(o => {
      const ov = String(o[k] == null ? '' : o[k]);
      let nv = null;
      if(BX.whole){
        const hit = BX.cs ? ov === BX.find : ov.toLowerCase() === BX.find.toLowerCase();
        if(hit) nv = String(BX.to == null ? '' : BX.to);
      }else{
        re.lastIndex = 0;
        if(re.test(ov)){ re.lastIndex = 0; nv = ov.replace(re, String(BX.to == null ? '' : BX.to)); }
      }
      if(nv !== null && nv !== ov) out.push({ o, field:k, ft:bxFieldLabel(k), ov, nv });
    });
    return out;
  }
  const f = BATCH_FIELDS.find(x => x.k === BX.field);
  if(!f) return [];
  if(BX.value === '' || BX.value == null) return [];   /* 未选新值 → 不产生变更 */
  const nv = bxCast(f, BX.value);
  rows.forEach(o => {
    const ov = o[f.k] == null ? '' : o[f.k];
    if(String(ov) !== String(nv)) out.push({ o, field:f.k, ft:f.t, ov, nv });
  });
  return out;
}

/* ---------- 弹窗：设置规则 + 差异预览 ---------- */
function bxValueHTML(st){
  const f = BATCH_FIELDS.find(x => x.k === BX.field) || BATCH_FIELDS[0];

      list.map(x => `<option value="${x.id}" ${v === x.id ? 'selected' : ''}>${esc(lab(x))}</option>`).join('') + `</select>`;
  }
  if(f.type === 'status')
    return `<select id="bxValue"><option value="">— 请选择 —</option>` +
      STATUS.map(s => `<option value="${s}" ${v === s ? 'selected' : ''}>${String(s).slice(3)}</option>`).join('') + `</select>`;
  if(f.type === 'enum')
    return `<select id="bxValue"><option value="">— 请选择 —</option>` +
      f.opts.map(o => `<option value="${o.v}" ${v === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('') + `</select>`;
  if(f.type === 'date')   return `<input type="date" id="bxValue" value="${esc(v)}">`;
  if(f.type === 'number') return `<input type="number" id="bxValue" value="${esc(v)}" placeholder="输入数字">`;
  return `<input id="bxValue" value="${esc(v)}" placeholder="输入新值">`;
}
function bxPanelHTML(st){
  if(!BX) return '';
  if(BX.mode === 'replace'){
    const opts = BATCH_TEXT_FIELDS.map(k =>
      `<option value="${k}" ${BX.rfield === k ? 'selected' : ''}>${esc(bxFieldLabel(k))}</option>`).join('');
    return `<div class="frow" style="grid-template-columns:1fr 1.15fr 1.15fr">
        <div class="fld"><label>目标字段</label><select id="bxRField">${opts}</select></div>
        <div class="fld"><label>查找内容</label><input id="bxFind" value="${esc(BX.find)}" placeholder="要查找的文字"></div>
        <div class="fld"><label>替换为（留空 = 删除该内容）</label><input id="bxTo" value="${esc(BX.to)}" placeholder="替换后的文字"></div>

/* ---------- 执行 / 撤销 ---------- */
async function bxRun(){
  const st = Store.state;
  const rows = bxCompute(st);
  if(!BX || !rows.length){ toast('没有需要修改的记录'); return; }
  const label = BX.mode === 'replace'
    ? `查找替换「${BX.find}」→「${BX.to}」（${bxFieldLabel(BX.rfield)}）`
    : `批量改「${bxFieldLabel(BX.field)}」→ ${bxLabel(st, BX.field, bxCast(BATCH_FIELDS.find(x => x.k === BX.field), BX.value)) || '（空）'}`;
  if(!confirm(`即将修改 ${rows.length} 笔订单，是否继续？\n\n${label}`)) return;
  /* v0.20：批量修改是大范围改动，强制存一份「操作前」的回退点（不吃 10 分钟合并窗口） */
  await histForceMark('批量修改前（' + String(label).slice(0, 40) + '）');
  const btn = $('#bxRun'); if(btn){ btn.disabled = true; btn.textContent = '执行中…'; }
  const undoRows = rows.map(r => ({ id:r.o.id, field:r.field, old:r.ov }));
  let n = 0, err = 0;
  for(const r of rows){
    try{ await st.source.update('orders', r.o.id, { [r.field]: r.nv }); n++; }catch(e){ err++; }
  }
  batchUndo = { at: Date.now(), label, rows: undoRows };
  closeSheet();
  await reload();
  Store.set({});
  toast(`已修改 ${n} 笔订单` + (err ? `（失败 ${err} 笔）` : '') + ' · 可点「↩ 撤销批量修改」回滚');
}
async function bxUndo(){
  if(!batchUndo){ toast('没有可撤销的批量修改'); return; }
  const u = batchUndo;
  if(!confirm(`撤销上一次批量修改？\n\n${u.label}\n将把 ${u.rows.length} 笔订单还原为修改前的值。`)) return;
  let n = 0, err = 0;
  for(const r of u.rows){
    try{ await Store.state.source.update('orders', r.id, { [r.field]: r.old }); n++; }catch(e){ err++; }
  }
  batchUndo = null;
  await reload();
  Store.set({});
  toast(`已撤销 ${n} 笔订单的修改` + (err ? `（失败 ${err} 笔）` : ''));
}

/* ==========================================================================
   v0.27 · 订单卡片视图（思源数据库式看板）+「i」说明图标
   - 卡片与表格看的是同一份 ordViewList：筛选 / 关键字 / 排序对两者同时生效，
     不另写一套取数，两个视图不可能给出不一致的说法。
   - 分列逻辑与排产卡片完全共用（boardColumns）：按合同交期月份升序铺开。
   - 卡片上显示哪些字段由用户自己勾（参考思源数据库的字段显隐），只存本机。
   ========================================================================== */
/* ---------- 「i」说明图标 ---------- */
function infoI(tip, cls){
  if(!tip) return '';
  return `<span class="ii${cls ? ' ' + cls : ''}"><span class="dot">i</span><span class="ii-t">${tip}</span></span>`;
}
let _iiOn = null, _iiPinned = false;
function iiPlace(el){
  const t = el.querySelector('.ii-t'); if(!t) return;
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, vw - w - 8));
  let top = r.bottom + 7;
  if(top + h > vh - 8) top = Math.max(8, r.top - h - 7);
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function iiShow(el){
  if(_iiOn && _iiOn !== el) _iiOn.classList.remove('on');
  _iiOn = el; el.classList.add('on'); iiPlace(el);
}
function iiClose(){
  if(_iiOn){ _iiOn.classList.remove('on'); _iiOn = null; }
  _iiPinned = false;
}
function bindInfoIcons(){
  if(bindInfoIcons._done) return; bindInfoIcons._done = true;
  document.addEventListener('mouseover', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el || el === _iiOn || _iiPinned) return;
    iiShow(el);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el || el !== _iiOn || _iiPinned) return;
    if(el.contains(e.relatedTarget)) return;
    iiClose();
  });
  /* 捕获阶段：点到图标不该连带触发所在行 / 卡片的打开订单 */
  document.addEventListener('click', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el){ iiClose(); return; }
    e.stopPropagation(); e.preventDefault();
    if(_iiPinned && _iiOn === el){ iiClose(); return; }
    _iiPinned = true; iiShow(el);
  }, true);
  window.addEventListener('resize', () => { if(!_iiPinned) iiClose(); });
}

/* ---------- 通用「按月分列」：升序、空月补列、跨度 >15 月退化、无日期进末列 ---------- */
function boardColumns(list, getKey){
  const groups = {}, noDate = [];
  list.forEach(x => {
    const k = getKey(x) || '';
    if(!k){ noDate.push(x); return; }
    (groups[k] = groups[k] || []).push(x);
  });
  const present = Object.keys(groups).sort();
  let keys = present;
  if(present.length > 1){
    const ix = k => Number(k.slice(0,4)) * 12 + (Number(k.slice(5,7)) - 1);
    const a = ix(present[0]), b = ix(present[present.length - 1]);
    if(b - a + 1 <= 15){
      keys = [];
      for(let i = a; i <= b; i++)
        keys.push(String(Math.floor(i/12)).padStart(4,'0') + '-' + String(i % 12 + 1).padStart(2,'0'));
    }
  }
  const cols = keys.map(k => ({ key:k, list: groups[k] || [] }));
  if(noDate.length) cols.push({ key:'', list: noDate });
  return cols;
}

    h += `</div></div>`;
  });
  return h + `</div>`;
}
const PROD_RISK_LABEL = { ALL:'全部状态', overdue:'已逾期未完工', late:'预计晚于交期', tight:'卡交期', normal:'正常', done:'已完工' };
const PROD_STATUS = ['待排产','生产中','已完工','已暂停'];
/* 是否已完工：优先看「实际完工日」；思源过来的记录没有实际完工日，
   但状态已写成「已完工」（导入时按完工类状态落库），同样算已完工——
   否则会被误报成「已逾期」，出现「状态=已完工 却显示逾期」的矛盾。 */
function prodDone(p){ return !!(p && (p.actualFinish || p.opStatus === '已完工')); }
/* 排产进度（0-100）。⚠ 必须与表单保存口径完全一致，否则会出现
   「状态=已完工，进度却 0%」的矛盾（老思源数据 progressPct 存的正是 0）。
   ① 有「生产数量」→ 已完成 ÷ 生产数量（数量口径优先）
   ② 没有数量但已完工（有实际完工日 或 状态=已完工）→ 100%
   ③ 其余 → 手填的「完成进度」百分比 */
function prodPct(p){
  if(!p) return 0;
  const q = Number(p.qty) || 0, d = Number(p.doneQty) || 0;
  if(q > 0) return Math.max(0, Math.min(100, Math.round(d / q * 100)));
  if(prodDone(p)) return 100;
  const f = Number(p.progressPct);
  return isFinite(f) ? Math.max(0, Math.min(100, Math.round(f))) : 0;
}
/* 计划完工 − 合同交期（天），无数据返回 null */
function prodGap(p, o){
  if(!p.planFinish || !o.contractDelivery) return null;
  return Math.round((new Date(p.planFinish) - new Date(o.contractDelivery)) / 86400000);
}
/* 交期风险归类（互斥，优先级 done > overdue > late > tight > normal） */
function prodRisk(p, o){
  if(prodDone(p)) return 'done';
  const g = prodGap(p, o);
  if(p.planFinish && diffToday(p.planFinish) < 0) return 'overdue';
  if(g != null && g > 0) return 'late';
  if(g === 0) return 'tight';
  return 'normal';
}
/* 交期对比展示（tag 文案 + 配色）
   已完工 → 看「实际完工日 vs 合同交期」；未完工 → 看「计划完工日 vs 合同交期」（属预测，标「预计」）。 */
function prodCmpTag(p, o){
  if(prodDone(p)){
    if(p.actualFinish && o.contractDelivery){
      const d = Math.round((new Date(p.actualFinish) - new Date(o.contractDelivery)) / 86400000);
      if(d > 0)   return { cmp:'完工晚 ' + d + ' 天', cls:'t-red' };
      if(d === 0) return { cmp:'卡交期完工', cls:'t-orange' };
      return { cmp:'提前 ' + (-d) + ' 天', cls:'t-green' };
    }
    return { cmp:'已完工', cls:'t-green' };
  }
  const g = prodGap(p, o);
  if(p.planFinish && diffToday(p.planFinish) < 0)
    return { cmp:'已逾期 ' + (-diffToday(p.planFinish)) + ' 天', cls:'t-red' };
  if(g == null) return { cmp:'—', cls:'t-gray' };
  if(g > 0)   return { cmp:'预计晚 ' + g + ' 天', cls:'t-red' };
  if(g === 0) return { cmp:'卡交期', cls:'t-orange' };
  return { cmp:'预计提前 ' + (-g) + ' 天', cls:'t-green' };
}
/* 关键字过滤后的基准集（未套用风险筛选），用于计数。
   v0.22：走排产页自己的筛选作用域（'prod'）—— 订单页的筛选不再连带影响排产列表。 */

  const kw = pKw.trim().toLowerCase();
  if(kw) list = list.filter(p => {
    const o = st.data.orders.find(x => x.id === p.orderId) || {};
    const c = st.data.customers.find(x => x.id === o.customerId) || {};
    return `${p.moNo||''} ${o.orderNo||''} ${c.shortName||''} ${c.name||''}`.toLowerCase().includes(kw);
  });
  return list;
}
/* 排产页筛选面板（写 prod 作用域）—— v0.24：条件行作用于「排产记录」 */
function prodPanelHTML(st){ return condPanelHTML(st, 'prod'); }
/* 排产页当前可见列表：全局筛选 → 关键字 → 状态/风险 → 排序（含方向） */
function prodViewList(st){
  let list = prodBaseList(st);
  const byId = id => st.data.orders.find(x => x.id === id) || {};
  const rk = selList(pRisk), rw = selList(pRow);
  if(rw.length) list = list.filter(p => rw.indexOf(p.opStatus || '') >= 0);
  if(rk.length) list = list.filter(p => rk.indexOf(prodRisk(p, byId(p.orderId))) >= 0);
  /* v0.24：排产页的条件行作用于「排产记录」 */
  const pf = scopeFilters(st, 'prod');
  if(pf.conds && pf.conds.length){
    const pctx = filterCtx(st, 'prod');
    list = list.filter(p => condsMatch(st, p, pf.conds, pctx));
  }
  const dir = pDir === 'desc' ? -1 : 1;
  list.sort((a, b) => cmpWithDir(prodSortVal(a, pSort, st), prodSortVal(b, pSort, st), dir));
  return list;
}
/* 取排序值：日期 / 文本原样比，进度与交期差按数值比（与列上显示口径一致）。 */
function prodSortVal(p, k, st){
  const o = (st.data.orders.find(x => x.id === p.orderId)) || {};
  switch(k){
    case 'moNo':         return p.moNo || '';
    case 'orderNo':      return o.orderNo || '';
    case 'customer':     { const c = st.data.customers.find(x => x.id === o.customerId); return c ? (c.shortName || c.name || '') : ''; }
    case 'workshop':     return p.workshop || '';
    case 'planStart':    return p.planStart || '';
    case 'actualStart':  return p.actualStart || '';
    case 'actualFinish': return p.actualFinish || '';
    case 'progress':     return prodPct(p);
    case 'cmp':          return prodGap(p, o) || 0;
    default:             return p.planFinish || '';
  }
}

/* ---------- 预警中心：交期 T-30 / T-15 / 逾期 + 发货未收款 + 到期回款 ---------- */
let alertLevel = 'ALL';
const ALERT_LEVELS = [['ALL','全部'],['red','严重'],['orange','警示'],['blue','提醒']];
const PAY_ALERT_TYPES = ['发货未收款','回款逾期','回款待收'];
const DLV_ALERT_TYPES = ['交期逾期','临近交期','交期提醒'];
const LVL_RANK = { red:0, orange:1, blue:2 };
function sortAlerts(rows){
  return rows.slice().sort((a,b) =>
    (LVL_RANK[a.lvl] - LVL_RANK[b.lvl]) || ((b.days || 0) - (a.days || 0)));
}
function alertColHTML(title, ico, hint, rows){
  const n = rows.length, r = rows.filter(x => x.lvl === 'red').length;
  let h = `<div class="card"><div class="hd"><h3>${ico} ${title}</h3>
      <span class="tag ${r ? 'solid-red' : n ? 't-gray' : 't-green'}">${n} 条${r ? ` · 严重 ${r}` : ''}</span>
      <div class="spacer"></div>
      <span class="muted" style="font-size:11.5px">${hint}</span></div><div class="bd np">`;
  if(!n){ return h + '<div class="empty">🎉 当前没有该类预警</div></div></div>'; }
  sortAlerts(rows).forEach(a => {
    const badge = a.lvl === 'red' ? '<span class="tag solid-red">严重</span>'
      : a.lvl === 'orange' ? '<span class="tag t-orange">警示</span>' : '<span class="tag t-blue">提醒</span>';
    h += `<div class="al ${a.lvl}" data-aid="${a.orderId}"><div class="bar"></div>
      <div style="flex:1;min-width:0">
        <div class="ttl">${esc(a.title)}</div>
        <div class="meta">${esc(a.meta)}</div></div>
      <div class="rt">${badge}<div class="muted" style="font-size:11px;margin-top:3px">${esc(a.type)}</div></div></div>`;
  });
  return h + '</div></div>';
}
function viewAlert(st){
  const cfg = st.alertCfg;
  const all = Store.alerts || [];
  const list = alertLevel === 'ALL' ? all.slice() : all.filter(a => a.lvl === alertLevel);
  const red = all.filter(a => a.lvl === 'red').length;
  const org = all.filter(a => a.lvl === 'orange').length;
  const blu = all.filter(a => a.lvl === 'blue').length;

  let h = `<div class="grid kpi">
    <div class="card"><div class="lb">严重（需立即处理）</div><div class="vl ${red?'bad':''}">${red}</div><div class="sb2">逾期类预警</div></div>
    <div class="card"><div class="lb">警示（T-${cfg.lead15} 内）</div><div class="vl ${org?'warn':''}">${org}</div><div class="sb2">临近交期 / 待收</div></div>
    <div class="card"><div class="lb">提醒（T-${cfg.lead30} 内）</div><div class="vl">${blu}</div><div class="sb2">提前跟进</div></div>
    <div class="card"><div class="lb">预警总数</div><div class="vl">${all.length}</div><div class="sb2">${cfg.enabled===false?'引擎已关闭':'引擎运行中'}</div></div>
  </div>`;

  h += `<div class="card" style="margin-top:14px"><div class="hd"><h3>预警规则</h3>
      ${infoI('阈值改后即时重算；点「保存规则」写入本地存储，重启后仍生效。')}</div><div class="bd">
      <div class="frow">
        <div class="fld"><label>第一轮提醒（天）</label><input id="al30" type="number" value="${cfg.lead30}"></div>
        <div class="fld"><label>第二轮提醒（天）</label><input id="al15" type="number" value="${cfg.lead15}"></div>
        <div class="fld"><label>发货未收款阈值（天）</label><input id="alShip" type="number" value="${cfg.shipUnpaidDays}"></div>
        <div class="fld"><label>回款到期提前（天）</label><input id="alPay" type="number" value="${cfg.payDueSoon}"></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <label class="switch"><input type="checkbox" id="alEn" ${cfg.enabled!==false?'checked':''}> 启用预警引擎</label>
        <label class="switch"><input type="checkbox" id="alNf" ${cfg.notify?'checked':''}> 桌面通知</label>
        <button class="btn sm" id="alNotify">测试桌面通知</button>
        <button class="btn primary sm" id="alSave">保存规则</button>
      </div>
      <div style="margin-top:8px">${infoI(`规则：① 距合同交期 ≤${cfg.lead30} 天提醒、≤${cfg.lead15} 天警示、过期即为逾期；② 已发货超 ${cfg.shipUnpaidDays} 天仍未收齐 → 严重；③ 计划收款日 ${cfg.payDueSoon} 天内到期或已逾期 → 警示 / 严重。`)}</div>
    </div></div>`;

  h += `<div class="toolbar" style="margin-top:16px">
      <div class="chipbar" id="alertTabs">
        ${ALERT_LEVELS.map(l => `<button class="chip ${alertLevel===l[0]?'on':''}" data-at="${l[0]}">${l[1]} <span class="n">${l[0]==='ALL' ? all.length : all.filter(a=>a.lvl===l[0]).length}</span></button>`).join('')}
      </div><div class="spacer"></div>
      ${infoI('点击任一行跳转到订单详情（按严重程度排序，严重的在上）。')}
    </div>`;
  const pay = list.filter(a => PAY_ALERT_TYPES.indexOf(a.type) >= 0);
  const dlv = list.filter(a => DLV_ALERT_TYPES.indexOf(a.type) >= 0);
  h += `<div class="alcols">`
     + alertColHTML('回款预警', '💰', '发货未收款 · 回款逾期 · 回款待收', pay)
     + alertColHTML('交期预警', '🗓️', '交期逾期 · 临近交期 · 交期提醒', dlv)
     + `</div>`;
  return h;
}
function bindAlert(){
  $$('#alertTabs .chip').forEach(x => x.onclick = () => { alertLevel = x.dataset.at; Store.set({}); });
  $$('[data-aid]').forEach(el => el.onclick = () => { const id = el.dataset.aid; if(id) openOrder(id); });

/* ---------- 桌面通知 ---------- */
function askNotify(test){
  if(typeof Notification === 'undefined'){ toast('当前环境不支持桌面通知'); return; }
  if(Notification.permission === 'denied'){ toast('桌面通知已被浏览器拒绝，请在站点权限里手动允许'); return; }
  Notification.requestPermission().then(p => {
    const granted = (p === 'granted');
    if(granted !== Store.state.alertCfg.notify || test) Store.setAlert({ notify: granted });
    if(granted){
      if(test) new Notification('订单追踪工作台', { body:'桌面通知已开启：交期 / 回款预警将在此弹出', tag:'ot-test' });
      else toast('桌面通知已开启');
    }else toast('未授权桌面通知');
  });
}
function fireDesktopAlerts(){
  const st = Store.state;
  if(st.alertCfg.enabled === false || st.alertCfg.notify !== true) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const red = (Store.alerts || []).filter(a => a.lvl === 'red');
  if(!red.length) return;
  try{
    new Notification('订单追踪工作台 · 严重预警 ' + red.length + ' 条', {
      body: red.slice(0, 5).map(a => '· ' + a.title).join('\n'),
      tag: 'ot-alert-' + fmt(today())
    });
  }catch(e){}
}

/* 承运方可新增 / 删除：在发货表单的承运方下拉旁挂两个按钮，动态改选项并同步回 FORM.values。 */
function wireCarrierManage(){
  const sel = document.querySelector('#formBody [data-k="carrier"]'); if(!sel) return;
  if(sel.parentNode.querySelector('.carrier-ops')) return;
  const ops = document.createElement('span');
  ops.className = 'carrier-ops';
  ops.style.cssText = 'margin-left:8px;display:inline-flex;gap:4px';
  ops.innerHTML = `<button type="button" class="btn" style="padding:2px 8px;font-size:11px" data-cop="add">＋承运方</button>`
    + `<button type="button" class="btn" style="padding:2px 8px;font-size:11px" data-cop="del">删除</button>`;
  sel.parentNode.appendChild(ops);
  ops.querySelector('[data-cop="add"]').onclick = () => {
    const name = (window.prompt('新增承运方名称：') || '').trim();
    if(!name) return;
    if(CARRIERS.indexOf(name) >= 0){ sel.value = name; FORM.values.carrier = name; toast('承运方已存在'); return; }
    CARRIERS.push(name); saveCarriers();
    sel.innerHTML = CARRIERS.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = name; FORM.values.carrier = name;
    toast('已新增承运方：' + name);
  };
  ops.querySelector('[data-cop="del"]').onclick = () => {
    if(CARRIERS.length <= 1){ toast('至少保留一个承运方'); return; }
    const cur = sel.value;
    if(!window.confirm('删除承运方「' + cur + '」？已有的发货记录仍保留该名称，仅从下拉选项中移除。')) return;
    const i = CARRIERS.indexOf(cur); if(i >= 0) CARRIERS.splice(i, 1); saveCarriers();
    sel.innerHTML = CARRIERS.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = CARRIERS[0]; FORM.values.carrier = CARRIERS[0];
    toast('已删除承运方：' + cur);
  };
}

   与 clearData 的区别：这是「精准清理」，只删自动生成的演示数据，
   用户手工录入（_src 非 demo）与其他来源的数据一律保留。拉取真实数据前调用。 */
async function syDropDemoData(){
  const st = Store.state, src = st.source;
  if(!src || !src.capabilities.write) return { ok:false, n:0, msg:'当前数据源只读，无法清理' };
  const isDemo = x => !!(x && x._src === 'demo');
  let n = 0;
  for(const t of ['orders','customers','production','shipments','followups']){
    const targets = (st.data[t] || []).filter(isDemo);
    if(!targets.length) continue;
    if(t === 'orders'){ for(const r of targets) for(const a of (r.attachments || [])){ try{ await FileStore.del(a.id); }catch(e){} } }
    /* 走硬删除：清理演示数据不是误操作，不该灌进回收站 */
    try{
      if(typeof src.hardRemove === 'function') n += await src.hardRemove(t, targets.map(r => r.id));
      else for(const r of targets){ try{ await src.remove(t, r.id); n++; }catch(e){} }
    }catch(e){}
  }
  if(n) await reload();
  return { ok:true, n };
}
/* ---------- v0.11 · 思源导出导入器（静态 HTML 快照 → 订单库） ----------
   思源「导出 HTML」是一次性快照：没有 API、没有行级 ID，改了订单库也回写不进思源。
   所以这里做的是「可重复执行的导入」——以 PI No. 为唯一键，已存在则更新、不存在则新增。
   真·双向同步请走上面的 SiyuanDataSource（需要思源本地 API + 属性视图 avId）。 */
const SY_COLS = {
  pi:'PI No.', customer:'客户代号', mo:'排产单号', planDate:'排产日期', delivery:'交货日期',
  amount:'总货款', tax:'税金', deposit:'预付款', ship:'出货方式', status:'完成情况',
  term:'条款', att:'合同/信用证资料', done:'完成状况', remark:'备注', created:'创建时间'
};
const SY_STATUS_MAP = { '未排产':'01 已签约', '已排产':'02 已排产', '已出货':'03 已完工待发货', '已收款':'04 已收款' };
/* 从思源状态码（'01'~'05'）反查工作台全称，供专用同步库推送时归一使用 */
const SY_STATUS_BY_CODE = { '01':'01 已签约', '02':'02 已排产', '03':'03 已完工待发货', '04':'04 已收款', '05':'05 已完结' };
const syMoney = s => { const n = Number(String(s == null ? '' : s).replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const syDate  = s => { const t = String(s == null ? '' : s).trim(); return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : ''; };

function syParseExport(htmlText){
  const doc = new DOMParser().parseFromString(String(htmlText || ''), 'text/html');
  const tables = [...doc.querySelectorAll('table')];
  const t = tables.find(tb => [...tb.querySelectorAll('thead th')]
              .some(th => String(th.textContent || '').trim() === SY_COLS.pi)) || tables[0];
  if(!t) return { ok:false, msg:'导出文件里没找到订单表格' };
  const heads = [...t.querySelectorAll('thead th')].map(x => String(x.textContent || '').trim());
  const idx = {}; heads.forEach((h, i) => { if(!(h in idx)) idx[h] = i; });   // 同名列（税金）取第一个
  const missing = Object.keys(SY_COLS).filter(k => !(SY_COLS[k] in idx)).map(k => SY_COLS[k]);
  const rows = [...t.querySelectorAll('tbody tr')].map(tr => {
    const tds = [...tr.querySelectorAll('td')];
    const cell = h => { const i = idx[h]; return i == null ? '' : String((tds[i] && tds[i].textContent) || '').trim(); };
    const attTd = tds[idx[SY_COLS.att]];
    const imgs = attTd ? [...attTd.querySelectorAll('img')]
      .map(im => im.getAttribute('src') || im.getAttribute('data-src') || '').filter(Boolean) : [];
    return { pi: cell(SY_COLS.pi), customer: cell(SY_COLS.customer), mo: cell(SY_COLS.mo),
      planDate: syDate(cell(SY_COLS.planDate)), delivery: syDate(cell(SY_COLS.delivery)),
      amount: syMoney(cell(SY_COLS.amount)), tax: syMoney(cell(SY_COLS.tax)),
      deposit: syMoney(cell(SY_COLS.deposit)), ship: cell(SY_COLS.ship), status: cell(SY_COLS.status),
      term: cell(SY_COLS.term), done: cell(SY_COLS.done) === '√',
      remark: cell(SY_COLS.remark), created: syDate(cell(SY_COLS.created)), imgs };
  }).filter(r => r.pi);
  return { ok:true, heads, rows, missing, tableCount: tables.length };
}
function syMapStatus(r){
  const s = String(r.status == null ? '' : r.status).trim();
  /* 容错：思源里偶有脏值（如「已收␀␀」），按前缀归位，避免整行掉到默认状态 */
  let base = SY_STATUS_MAP[s];
  if(!base){
    if(/^已收/.test(s)) base = '04 已收款';
    else if(/^已出/.test(s)) base = '03 已完工待发货';
    else if(/^已排/.test(s)) base = '02 已排产';
    else base = '01 已签约';
  }
  /* 「完成状况」打 √ = 已完结：已收款 / 已出货 且打勾 → 05 已完结 */
  if(r.done && (base === '04 已收款' || base === '03 已完工待发货')) return '05 已完结';
  return base;
}
function syMapTerms(r){
  const t = String(r.term || '').trim();
  if(t === '信用证') return { paymentTerm:'LC', tradeTerm:'FOB' };
  const hit = (TRADE_TERMS.find(x => x.v === t) || {}).v;
  return { paymentTerm:'TT', tradeTerm: hit || 'FOB' };
}
/* 思源数据库记录（SiyuanDataSource.list 的输出）→ 导入器 rows 结构。
   这样「直连 API 拉取」与「导出 HTML 导入」走同一条落库管线，映射/回款推断/附件规则完全一致。 */
function syRowsFromSiyuan(recs){
  const d = v => {
    if(typeof v === 'number' && isFinite(v)){ const x = new Date(v); return isNaN(x.getTime()) ? '' : fmt(x); }
    return syDate(v);
  };
  return (recs || []).map(r => {
    const g = k => (r && r[k] !== undefined ? r[k] : '');
    const pi = String(g(SY_COLS.pi) || '').trim();
    if(!pi) return null;
    const doneRaw = g(SY_COLS.done);
    return {
      pi, customer: String(g(SY_COLS.customer) || '').trim(), mo: String(g(SY_COLS.mo) || '').trim(),
      planDate: d(g(SY_COLS.planDate)), delivery: d(g(SY_COLS.delivery)),
      amount: syMoney(g(SY_COLS.amount)), tax: syMoney(g(SY_COLS.tax)),
      deposit: syMoney(g(SY_COLS.deposit)), ship: String(g(SY_COLS.ship) || '').trim(),
      status: g(SY_COLS.status), term: String(g(SY_COLS.term) || '').trim(),
      done: doneRaw === true || doneRaw === 'true' || String(doneRaw).trim() === '√',
      remark: String(g(SY_COLS.remark) || '').trim(), created: d(g(SY_COLS.created)),
      imgs: ((r && r._assets) || []).slice()
    };
  }).filter(Boolean);
}
function syBuildPlan(rows, st){
  const norm = s => String(s || '').trim().toLowerCase();
  /* 思源库没有「客户名称」字段：拉取时客户标识取自「客户代号」列。
     工作台编辑客户后常把「名称」改成与思源不同的全称、但保留「简称」与思源一致，
     若只按 name 匹配就会匹配不到、重复建档，导致原客户订单丢失。
     故改为按 siyuanCode(拉取时写入) → shortName → name 三级匹配（大小写/空白归一）。 */
  const byCode = new Map(), byShort = new Map(), byName = new Map();
  st.data.customers.forEach(c => {
    const sk = norm(c.siyuanCode), sn = norm(c.shortName), nm = norm(c.name);
    if(sk) byCode.set(sk, c);
    if(sn) byShort.set(sn, c);
    if(nm) byName.set(nm, c);
  });
  const orderByNo  = new Map(st.data.orders.map(o => [String(o.orderNo || '').trim(), o]));
  const newCustomers = [], items = [];
  rows.forEach(r => {
    const cname = String(r.customer || '').trim() || '未命名客户';
    const key = norm(cname);
    let c = byCode.get(key) || byShort.get(key) || byName.get(key);
    if(!c){
      c = newCustomers.find(x => norm(x.siyuanCode) === key || norm(x.shortName) === key || norm(x.name) === key);
      if(!c){
        c = { id: uid('C'), code:'', name:cname, shortName:cname, siyuanCode:cname, industry:'未分类', level:'B',
              settleDays:0, contact:'', phone:'', email:'', address:'',
              creditNote:'由思源导出导入自动建档', active:true, createdAt: fmt(today()), _src:'siyuan' };
        newCustomers.push(c);
      }
    }
    const status = syMapStatus(r), terms = syMapTerms(r);
    const paid = (status === '04 已收款' || status === '05 已完结');
    /* 思源表里没有真实付款日，按约定用「交货日期」推断（可重复导入，结果稳定） */
    const payDate = paid ? (r.delivery || r.created || '') : '';
    const dep = r.deposit;
    const remark = [ r.ship ? '出货方式：' + r.ship : '', r.remark ? '备注：' + r.remark : '',
      paid && payDate ? '尾款付款日按交货日期登记（思源导入推断值）' : '' ].filter(Boolean).join(' ｜ ');
    const exist = orderByNo.get(r.pi);
    /* 思源库没有「业务员」字段：拉取时只覆盖源库存在的字段，本地已设的业务员保留（不回退默认）。
       仅全新订单（本地无对应记录）才用首个业务员作为默认归属。 */
    const ownerId = (exist && exist.ownerId) ? exist.ownerId : ((st.data.owners[0] || {}).id || '');
    const order = {
      orderNo: r.pi, moNo: r.mo, customerId: c.id, ownerId,
      status, signDate: r.created || r.planDate || '', amount: r.amount, taxAmount: r.tax, currency:'CNY',
      contractDelivery: r.delivery, actualDelivery:'', productSummary:'', tags:'', remark,
      paymentTerm: terms.paymentTerm, tradeTerm: terms.tradeTerm,
      depositAmount: dep, depositPaidDate: (dep > 0 && paid) ? payDate : '',
      balancePaidDate: paid ? payDate : '', balanceReceived: 0, balanceSettled: false, _src:'siyuan'
    };
    /* 思源没有数量字段，故 qty/doneQty 留 0；完工类状态直接把进度记为 100%，
       其余交给用户在工作台「排产进度 → 编辑」里补填数量或百分比。 */
    const opStatus = status === '01 已签约' ? '待排产' : (status === '02 已排产' ? '生产中' : '已完工');
    const prod = r.mo ? { moNo: r.mo, workshop:'', planStart: r.planDate, planFinish: r.delivery,
      actualStart:'', actualFinish:'', qty:0, doneQty:0, progressPct: opStatus === '已完工' ? 100 : 0,
      opStatus } : null;
    items.push({ act: exist ? '更新' : '新增', id: exist ? exist.id : null, row: r,
      orderNo: r.pi, customer: cname, amount: r.amount, tax: r.tax, status, mo: r.mo,
      order, prod, imgs: r.imgs });
  });
  const stats = { total: items.length, add: items.filter(i => i.act === '新增').length,
    upd: items.filter(i => i.act === '更新').length, newCust: newCustomers.length,
    prod: items.filter(i => !!i.prod).length, img: items.reduce((a, i) => a + (i.imgs || []).length, 0),
    amount: items.reduce((a, i) => a + (i.amount || 0), 0) };
  return { ok:true, items, newCustomers, stats };
}
async function syRunImport(plan, opts){

    const payload = Object.assign({}, it.order, {
      attachments: atts.length ? old.filter(a => !atts.some(n => n.name === a.name)).concat(atts) : old
    });
    let oid;
    if(it.act === '新增'){
      payload.id = uid('O'); payload.sortKey = maxSort + (++seq);
      await src.create('orders', payload); oid = payload.id; nO++;
    }else{
      await src.update('orders', it.id, payload); oid = it.id; uO++;
    }
    if(it.prod && !st.data.production.some(p => p.orderId === oid && p.moNo === it.prod.moNo)){
      await src.create('production', Object.assign({}, it.prod, { id: uid('P'), orderId: oid })); nP++;
    }
  }
  await reload();
  return { ok:true, msg:'导入完成：新增订单 ' + nO + ' · 更新 ' + uO + ' · 新建客户 ' + nC + ' · 排产 ' + nP + ' · 附件 ' + nF,
    warns, counts:{ nO, uO, nC, nP, nF } };
}
/* ---------- v0.11 · 与思源数据库（属性视图）双向合并 ----------
   拉取：思源 → 本地，按订单号去重（已存在更新、否则新增），客户按名称自动建档。
   推送：本地 → 思源，同样按订单号去重。两端都以订单号为唯一键，可重复执行。 */
/* 把思源「合同/信用证资料」列的附件路径（assets/xxx.png）经 /api/file/getFile 取回为 File，
   交给 FileStore 校验（≤10MB、pdf/jpg/png）后作为订单附件落库。取不到的静默跳过。 */
async function syFetchAssets(cfg, rows){
  const map = new Map(), want = [];
  (rows || []).forEach(r => (r.imgs || []).forEach(p => {
    const s = String(p || '').trim();
    if(/^(assets\/|\/data\/|\.\/)/.test(s) && want.indexOf(s) < 0) want.push(s);
  }));
  if(!want.length) return map;
  const base = String(cfg.baseUrl || '').replace(/\/$/, '');
  const headers = { 'Content-Type':'application/json' };
  if(cfg.token) headers['Authorization'] = 'Token ' + cfg.token;
  for(const rel of want){
    const path = /^\//.test(rel) ? rel : ('/data/' + rel.replace(/^\.\//,''));
    try{
      const res = await fetch(base + '/api/file/getFile', { method:'POST', headers, body: JSON.stringify({ path }) });
      if(!res.ok) continue;
      const blob = await res.blob();
      if(!blob || !blob.size) continue;
      const name = rel.split('/').pop();
      const f = new File([blob], name, { type: blob.type || 'image/png' });
      map.set(name, f); map.set(rel, f);
    }catch(e){ /* 单张失败不影响整体拉取 */ }
  }
  return map;
}
/* 拉取：思源数据库 → 本地。解析后复用「导出导入」同一条管线（客户建档 / 状态映射 / 回款推断 / 排产 / 附件） */
async function syPullFromSiyuan(opts){
  const cfg = Store.state.dsCfg.siyuan, src = createSource('siyuan', cfg);
  if(!src.capabilities.read) return { ok:false, msg:'配置不完整：需要 思源地址 + Token + 订单库 avId' };
  const st = Store.state, ls = st.source;
  if(!ls || !ls.capabilities.write) return { ok:false, msg:'本地数据源只读，无法写入（请切到「本地手工录入」）' };
  /* 可选：先清掉演示种子数据，避免真实订单与演示数据混在一起（只删 _src=demo） */
  let dropped = 0;
  if(opts && opts.dropDemo){ const d = await syDropDemoData(); dropped = d.n || 0; }
  let recs;
  try{ recs = await src.list('orders'); }
  catch(e){ return { ok:false, msg:'读取思源失败：' + ((e && e.message) || e) }; }
  const rows = syRowsFromSiyuan(recs);
  if(!rows.length) return { ok:false, msg:'思源读到 0 条有效订单：请确认 avId 正确、且库里「' + SY_COLS.pi + '」列有值' };
  const plan = syBuildPlan(rows, st);
  const assets = await syFetchAssets(cfg, rows);
  const r = await syRunImport(plan, { assets });
  r.msg = '从思源拉取 ' + rows.length + ' 行 → ' + (r.msg || '');
  r.pull = { rows: rows.length, assets: assets.size, dropped };
  if(dropped) r.msg += ' · 已清除演示数据 ' + dropped + ' 条';
  /* 兼容旧字段名：调用方与回归脚本按 add/upd/nc 统计 */
  if(r.counts) r.counts = Object.assign({}, r.counts,
    { add: r.counts.nO || 0, upd: r.counts.uO || 0, nc: r.counts.nC || 0 });
  return r;
}
async function syPushToSiyuan(){
  const cfg = Store.state.dsCfg.siyuan, src = createSource('siyuan', cfg);
  if(!src.capabilities.read) return { ok:false, msg:'配置不完整：需要 思源地址 + Token + 订单库 avId' };
  if(!src.capabilities.write) return { ok:false, msg:'未勾选「允许写入思源」，当前为只读' };

  for(const o of st.data.orders){

const syNormName = s => String(s == null ? '' : s).trim().toLowerCase();

function syDbTitle(content, hpath){

/* 在思源返回的列定义 keys([{id,name,type}]) 里为某个工作台字段找列。
   返回 { keyID, name, via:'exact'|'alias' } | null */
function syMatchCol(keys, col){
  const list = keys || [], t = syNormName(col);
  const hit = list.find(k => syNormName(k.name) === t);
  if(hit) return { keyID:hit.id, name:hit.name, via:'exact' };
  const al = SYNC_ALIAS[col] || [];
  for(let i = 0; i < al.length; i++){
    const h = list.find(k => syNormName(k.name) === syNormName(al[i]));
    if(h) return { keyID:h.id, name:h.name, via:'alias' };
  }

}
/* 每个工作台字段一条记录（同一列被多组共用时合并 grps），供校验结果逐条展示 */
function syncMatchReport(keys){
  const seen = new Set(), rows = [];
  SYNC_FIELDS.forEach(f => {
    if(seen.has(f.col)){ const r = rows.find(x => x.col === f.col); if(r) r.grps.push(f.grp); return; }
    seen.add(f.col);
    rows.push({ col:f.col, type:f.type || 'text', grps:[f.grp], hit:syMatchCol(keys, f.col) });
  });
  return rows;
}

const SYNC_AV_KEY = 'ot.syAvId';

let SYNC_AV = '';        /* 专用同步库 avId */
let SYNC_MAP = {};       /* { grp: { keyID: wbKey } } */

/* 可注入的传输函数：默认 fetch，测试可替换为 stub */
let _syTransport = (typeof fetch === 'function')
  ? (path, body, cfg) => {
      const headers = { 'Content-Type':'application/json' };

        { method:'POST', headers, body: JSON.stringify(body || {}) })
        .then(async r => { if(!r.ok){ const e = new Error('HTTP '+r.status); e.status = r.status;
            e.retryAfter = Number(r.headers.get('Retry-After')) || 0; throw e; } const j = await r.json();
          if(j && j.code && j.code !== 0) throw new Error(j.msg || ('思源返回 code='+j.code)); return j.data; });
    }

const SY_ENDPOINTS = {

/* ---------------------------------------------------------------------------
   思源内核限流保护（v0.19.1）
   背景：思源桌面端内核（127.0.0.1:6806）对高频写入有限流。新建同步库里一列都
   没有，`ensureSyncDB` 会连发 15 个 addAttributeViewColumn（零间隔）→ 触发
   HTTP 429，表现为「创建失败」，但此时库其实已经建好、avId 也回填了。
   对策三层：① 写入之间强制保底间隔（节流）；② 429/5xx 指数退避重试；
            ③ 建列结果逐列落盘，重跑只补缺列（断点续做，不重复建列）。
   --------------------------------------------------------------------------- */
const SY_MIN_GAP_MS = 260;      /* 两个思源写请求之间的最小间隔 */
const SY_MAX_RETRY  = 4;        /* 429 / 5xx 在**单次调用内**的最大重试次数 */
/* v0.19.3：已放弃「工作台自动建库/建列」——
   实测思源 3.8.3 的 AV 写接口在本机静默失效（返回成功但不落地），
   无论怎么调参数 / 间隔 / 认证头都不生效。改为「思源手动建库建列 + 工作台绑定读写」。
   下面这层节流与退避重试仍然保留：推送行数据（batchSet / addRow）走的是它，
   对真实的网络抖动与限流仍有保护作用。 */
let _syLastCallAt = 0;
const sySleep = ms => new Promise(r => setTimeout(r, ms));

/* 判定是否值得重试：HTTP 429 / 5xx / 网络抖动；业务错误码（code≠0）不重试 */
function syIsRetryable(e){
  const m = String((e && e.message) || e || '');
  if(/HTTP\s+(429|5\d\d)/.test(m)) return true;
  if(/Failed to fetch|NetworkError|ECONNRESET|timeout/i.test(m)) return true;
  return false;
}

function syCfg(){ return (Store.state.dsCfg && Store.state.dsCfg.siyuan) || {}; }

/* 带节流 + 退避重试的思源调用。所有写操作都应走它，避免打满内核被限流。 */
async function syApiRetry(path, body, opts){
  const o = opts || {};
  const maxRetry = o.maxRetry == null ? SY_MAX_RETRY : o.maxRetry;
  let lastErr = null;
  for(let i = 0; i <= maxRetry; i++){
    /* 节流：距上次调用不足 SY_MIN_GAP_MS 就等一等（首次不受影响） */
    const wait = _syLastCallAt ? (SY_MIN_GAP_MS - (Date.now() - _syLastCallAt)) : 0;
    if(wait > 0) await sySleep(wait);
    try{
      _syLastCallAt = Date.now();
      return await syApi(path, body);
    }catch(e){
      lastErr = e;
      if(i >= maxRetry || !syIsRetryable(e)) throw e;
      /* 429：优先用内核给的 Retry-After；否则指数退避 400 / 800 / 1600 / 3200 */
      const ra = Number(e && e.retryAfter) || 0;
      const backoff = ra ? (ra * 1000) : (400 * Math.pow(2, i));
      if(o.onRetry) o.onRetry(i + 1, backoff, e);
      await sySleep(backoff);
    }
  }
  throw lastErr;
}
function syApi(path, body){ if(!_syTransport) throw new Error('无可用传输（请用浏览器打开）'); return _syTransport(path, body, syCfg()); }

/* 断点续做用缓存：「已在思源建好的列名 → keyID」+ 所属 avId。
   只会**缩小**要建的列集合，因此必须与当前 avId 绑定、且以 avId 为作用域 ——
   否则换库后旧库的列名会把这边的列误判成「已存在」而漏建。
   缓存条目形如 { avId, cols:{列名:keyID} }。 */
function syLoadKnownCols(avId){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(SYNC_KNOWN_COLS_KEY) || 'null'); }catch(e){ return {}; }
  if(!raw || typeof raw !== 'object') return {};
  /* 旧结构（无 avId 作用域）一律作废：宁可贵一点重建，也不能漏列 */
  if(!raw.avId || !raw.cols) return {};
  if(avId && raw.avId !== avId) return {};        /* 缓存属于另一个库 */
  return raw.cols;
}
/* 每建好一列就调用：把最新映射落到该 avId 作用域下（中断后重跑不必重来） */
function sySaveKnownCols(avId, map){
  if(!avId) return {};
  const cols = {};
  Object.keys(map || {}).forEach(g => Object.keys(map[g] || {}).forEach(c => {
    if(map[g][c]) cols[c] = map[g][c];
  }));
  try{ localStorage.setItem(SYNC_KNOWN_COLS_KEY, JSON.stringify({ avId, cols })); }catch(e){}
  return cols;
}
/* 解绑 / 建新库时清掉，避免上一轮的列名缓存干扰 */
function syClearKnownCols(){ try{ localStorage.removeItem(SYNC_KNOWN_COLS_KEY); }catch(e){} }

/* 让 row 的 cells 同时按 keyID 和列名两种键挂上，兼容不同思源版本的返回体 */
function syNormalizeRow(row){
  const byKey = {};
  (SYNC_FIELDS || []).forEach(f => {
    const k = (SYNC_MAP[f.grp] || {})[f.col];
    if(k) byKey[String(k)] = row[f.col];
  });
  row.cells = Object.assign({}, byKey, row);
  return row;
}
function syItemID(row){ return (row && (row.itemID || row.id || row.rowID)) || ''; }
function syAdjust(row){
  if(!row) return row;
  row.updatedAt = Number(row.updatedAt) || 0;
  if(row.status && !String(row.status).includes(' ')){
    const hit = Object.keys(SY_STATUS_MAP).find(k => k.slice(0,2) === String(row.status).slice(0,2));
    if(hit) row.status = SY_STATUS_MAP[hit];
  }
  return row;
}
/* 专用库是「单表两行类」：排产行必带工单号（moNo），订单行不带 —— 以此为两类行的判别依据。
   排产行定位键 = 订单号 + 工单号，保证同一订单下多条排产能各自对上、不互相覆盖。 */
function syIsProdRow(row){ return !!(row && String(row.moNo == null ? '' : row.moNo).trim()); }
function syProdRowKey(orderNo, moNo){
  const o = String(orderNo == null ? '' : orderNo).trim().toLowerCase();
  const m = String(moNo == null ? '' : moNo).trim().toLowerCase();
  return (o && m) ? (o + '#' + m) : '';
}
/* 兼容两种行容器：默认视图取 view.rows；分组视图真实行在 view.groups[*].rows（顶层 rows 可能为空） */
function syFlattenRows(v){
  if(!v) return [];
  if(Array.isArray(v.rows) && v.rows.length) return v.rows;
  const acc = [];
  (((v.groups || v.viewGroups) || [])).forEach(g => { ((g && g.rows) || []).forEach(r => acc.push(r)); });
  return acc.length ? acc : (v.rows || []);
}
/* 分页取全专用库的行：内核单页上限有限（实测 100~200 有效），行数多时必须翻页，
   否则只看首屏会「本地有、远端没读到」→ 重复新增。 */
async function syFetchAllRows(avId, viewID, pageSize, max){
  const out = []; let page = 1, total = Infinity, guard = 0;
  const PS = pageSize || 200, LIM = max || 5000;
  while(out.length < total && out.length < LIM && guard++ < 300){
    const body = { id:avId, page, pageSize:PS };
    if(viewID) body.viewID = viewID;
    const d = await syApi(SY_ENDPOINTS.render, body);
    const v = (d && (d.view || d)) || {};
    if(v.rowCount != null) total = Number(v.rowCount) || 0;
    const rows = syFlattenRows(v);
    out.push.apply(out, rows);
    if(!rows.length || rows.length < PS) break;
    page++;
  }
  return out;
}

/* 从 getAttributeView 返回体构建 SYNC_MAP：{ grp: { keyID: wbKey } }。
   以 keyID 为锚 —— 思源里改列名不影响同步；列不存在时该字段被跳过（下次 ensureSyncDB 补列）。 */
function buildSyncMap(avDef){
  const av = (avDef && avDef.av) ? avDef.av : (avDef || {});
  const groups = {};
  const byName = new Map();
  (((av && av.keyValues) || [])).forEach(kv => {
    const k = kv.key || kv.Key || {};
    if(k && k.name && !byName.has(k.name)) byName.set(k.name, k.id);
  });
  SYNC_FIELDS.forEach(f => {
    const keyID = byName.get(f.col);
    if(!keyID) return;
    groups[f.grp] = groups[f.grp] || {};
    groups[f.grp][f.col] = keyID;
  });
  SYNC_MAP = groups;
  try{ localStorage.setItem(SYNC_MAP_KEY, JSON.stringify(SYNC_MAP)); }catch(e){}
  return SYNC_MAP;
}
function loadSyncMap(){ try{ const raw = localStorage.getItem(SYNC_MAP_KEY); if(raw) SYNC_MAP = JSON.parse(raw) || {}; }catch(e){}
  try{ const av = localStorage.getItem(SYNC_AV_KEY); if(av) SYNC_AV = av; }catch(e){} }
function saveSyncAvId(id){
  const next = id || '';
  /* 换库时清掉断点续做缓存：那是「上一个库已建哪些列」的记录，留着会让新库漏建列 */
  if(next && SYNC_AV && next !== SYNC_AV) syClearKnownCols();
  SYNC_AV = next;
  try{ localStorage.setItem(SYNC_AV_KEY, SYNC_AV); }catch(e){}
}

/* 诊断：思源库缺哪些列（用于建库/补列提示） */
function diffFieldNames(existingNames){
  const have = new Set((existingNames || []).map(s => String(s).trim()));
  /* 同一列可能被两个组共用（如 orderNo：订单的主键 + 排产的外键），按列名去重后再比较 */
  const seen = new Set(), missing = [];
  SYNC_FIELDS.forEach(f => {
    if(seen.has(f.col)) return;
    seen.add(f.col);
    if(!have.has(f.col)) missing.push(f.col);
  });
  return missing;
}

/* ---------------------------------------------------------------------------
   v0.24 · avID 解析 —— 这是「按说明建了列名，还是说没有相同列名」的根因。

   思源 3.8.3 里，「数据库块 id」和「属性视图 avID」是**两个不同的 id**：
     · blocks 表里 type='av' 的那一行是**块 id**，形如 20260912170225-r9qas46；
     · 内核真正认的 **avID** 藏在那一行的 markdown 里 —— data-av-id="20260914092423-w6k8kz"。
   工作台过去直接把块 id 当 avID 用，于是 getAttributeViewKeysByAvID 返回一个空骨架
   （只回「主键 + 单选」两列），表现就是：你在思源里明明建了列，它还说没有相同列名。

   现在统一：任何入口拿到的 id（块 id 或 avID）都先过 syResolveAvId() 转成真 avID 再用。
   --------------------------------------------------------------------------- */
async function syResolveAvId(id){
  const raw = String(id == null ? '' : id).trim();
  if(!raw) return { ok:false, avId:'', blockId:'', real:false, reason:'未提供 id' };
  const safe = raw.replace(/'/g, '');
  try{
    /* 两种入口都要能命中：① 用户填的是块 id；② 用户填的是真 avID（反查 markdown） */
    const q = await syApiRetry(SY_ENDPOINTS.sql, { stmt:
      "SELECT id, markdown, content, hpath FROM blocks WHERE type='av' AND (id='" + safe +
      "' OR markdown LIKE '%data-av-id=\"" + safe + "\"%') LIMIT 5" });
    const rows = (q && Array.isArray(q.data)) ? q.data
               : (q && Array.isArray(q.rows)) ? q.rows
               : (Array.isArray(q) ? q : []);
    if(!rows.length) return { ok:true, avId:raw, blockId:'', real:false,
      reason:'思源里没有这个数据库（块 id 与 avID 都对不上）' };
    const r = rows[0];
    const m = /data-av-id="([^"]+)"/.exec(String(r.markdown || ''));
    const avId = m ? m[1] : r.id;
    /* swapped = 你填进来的 id 被改写了（块 id → 真 avID）；填的若本来就是 avID 则为 false */
    return { ok:true, avId, blockId:r.id, real:true, swapped:(avId !== raw),
      title:syDbTitle(r.content, r.hpath), hpath:r.hpath || '' };
  }catch(e){
    const m = String((e && e.message) || '');
    return { ok:false, avId:raw, blockId:'', real:false,
      reason: /401|Auth failed/i.test(m)
        ? '思源拒绝了请求（鉴权失败）：请在「数据源」页填上 API Token（思源 设置 → 关于 里能复制）。'
        : ('查询失败（SQL 接口不可用？）：' + m) };
  }
}
/* 向后兼容的判定入口：能在 blocks 里对应到一个真实数据库块就算「真实库」。
   判据仍是 SQL（不会像「试探建列」那样留垃圾列），只是先做 avID 归一化。 */
async function syProbeRealDB(avId){
  const r = await syResolveAvId(avId);
  if(!r.ok) return { real:false, reason:r.reason, avId:String(avId == null ? '' : avId) };
  return { real:r.real, via:'sql', avId:r.avId, blockId:r.blockId, title:r.title, hpath:r.hpath };
}

/* 列出思源里所有真实数据库（type='av' 的块）。
   返回 [{ id, blockId, title, hpath, updated }]，其中 id 是**真 avID**（v0.24 修正：
   写接口只认 data-av-id，拿块 id 去写会静默失败）。
   注意：syApi 已经把响应里的 `data` 剥出来了，所以这里 `q` **本身就是行数组**。 */
async function syListRealDBs(){
  const q = await syApiRetry(SY_ENDPOINTS.sql,
    { stmt:"SELECT id, markdown, content, hpath, updated FROM blocks WHERE type='av' ORDER BY updated DESC" });
  const rows = Array.isArray(q) ? q : ((q && Array.isArray(q.data)) ? q.data : ((q && Array.isArray(q.rows)) ? q.rows : []));
  return rows.map(r => {
    const m = /data-av-id="([^"]+)"/.exec(String(r.markdown || ''));
    return {
      id: m ? m[1] : r.id,        /* 真 avID：拉取 / 推送 / 读列都用它 */
      blockId: r.id,              /* 数据库块 id：仅用于展示与排查 */
      title: syDbTitle(r.content, r.hpath),
      hpath: r.hpath || '',
      updated: r.updated || ''
    };
  });
}

/* 读取某个数据库（AV）当前的列定义。
   v0.19.3 修正读取接口 —— 实测（思源 3.8.3）：
     · `getAttributeView` 对**真实库**返回 `{av:null}`，只对游离库才有内容 → 不能用它读列
     · `/api/av/getAttributeViewKeysByAvID` 返回干净的 `[{id,name,type}]` 数组 → 用这个
   返回值统一为 `[{ name, id, type }]`。 */
async function syReadKeys(avId){
  /* 首选 getAttributeViewKeysByAvID */
  try{
    const r = await syApiRetry(SY_ENDPOINTS.keys, { avID:avId });
    const arr = Array.isArray(r) ? r : (r && Array.isArray(r.data) ? r.data : null);
    if(arr) return arr.map(k => ({ name:String(k.name || '').trim(), id:k.id || '', type:k.type || '' })).filter(k => k.name);
  }catch(e){ /* 落到下一条 */ }
  /* 兜底：renderAttributeView 的 data.view.columns */
  try{
    const r = await syApiRetry(SY_ENDPOINTS.render, { id:avId, page:1, pageSize:1 });
    const d = r && (r.data || r);
    const cols = d && d.view && d.view.columns;
    if(Array.isArray(cols)) return cols.map(c => ({ name:String(c.name || '').trim(), id:c.id || '', type:c.type || '' })).filter(k => k.name);
  }catch(e){}
  return [];
}

/* 校验同步库：先把 avId 归一化成真 avID → 读列 → 按「精确列名优先、中文别名兜底」建映射。
   v0.19.3 起**不再自动建库、也不再自动补列**（思源 3.8.3 的 AV 写接口在本机静默失效：
   返回成功但不落地），改为「在思源客户端手动建库建列 → 工作台绑定 + 校验 + 读写行」。
   本函数不发起任何写请求。 */
async function ensureSyncDB(opts){
  const o = opts || {}, cfg = syCfg();
  if(!String(cfg.baseUrl || '').trim()) return { ok:false, msg:'请先填写思源地址' };
  /* Token 允许留空（本机思源常见情况）；真需要鉴权时，思源会回 401，这里把它翻译成人话 */
  const rawId = String(o.avId || SYNC_AV || '').trim();
  if(!rawId){
    return { ok:false, needManualDB:true,
      msg:'请点「① 列出思源里的数据库」从列表里挑一个库（推荐，不用手抄 id）；' +
          '或在思源客户端里新建数据库后再绑定。' +
          '（工作台不再自动建库：思源 3.8.3 的建库 / 建列接口在本机不落地。）' };
  }
  /* 闸门 1：把「块 id / avID」统一解析成内核真正认的 avID */
  const rs = await syResolveAvId(rawId);
  if(!rs.ok)   return { ok:false, msg:rs.reason };
  if(!rs.real) return { ok:false, notWritable:true, avId:rawId, needManualDB:true,
    msg:'思源里找不到这个数据库（' + rawId + '）。请点「列出思源里的数据库」，直接点列表里的库名绑定。' };
  const avId = rs.avId;
  /* 闸门 2：读列定义（走正确接口） */
  let keys = [];
  try{ keys = await syReadKeys(avId); }
  catch(e){ return { ok:false, msg:'读数据库列失败：' + ((e && e.message) || '未知错误') }; }
  saveSyncAvId(avId);
  /* 建映射：精确列名优先、中文别名兜底 */
  const report = syncMatchReport(keys);
  SYNC_MAP = {};
  report.forEach(r => {
    if(!r.hit) return;
    /* 注意：一列可能被两组共用（orderNo 同时是 orders 的主键与 production 的外键），
       所以按 grps 全量挂，不能只挂首个组。 */
    r.grps.forEach(g => { SYNC_MAP[g] = SYNC_MAP[g] || {}; SYNC_MAP[g][r.col] = r.hit.keyID; });
  });
  try{ localStorage.setItem(SYNC_MAP_KEY, JSON.stringify(SYNC_MAP)); }catch(e){}
  const missing   = report.filter(r => !r.hit).map(r => r.col);
  const aliasHits = report.filter(r => r.hit && r.hit.via === 'alias');
  const needType  = missing.map(nm => {
    const f = SYNC_FIELDS.find(x => x.col === nm) || { type:'text' };
    return { name:nm, type:f.type || 'text', alias:(SYNC_ALIAS[nm] || []) };
  });
  const okAll = missing.length === 0;
  const viaTxt = aliasHits.length
    ? '，其中 ' + aliasHits.length + ' 个靠中文别名认到（' +
      aliasHits.map(r => r.hit.name + '→' + r.col).join('、') + '）'
    : '';
  const msg = okAll
    ? '同步库校验通过：思源侧共 ' + keys.length + ' 列，' + report.length + ' 个字段全部对上' + viaTxt + '，可以拉取 / 推送了。'
    : '已绑定「' + (rs.title || avId) + '」：思源侧共 ' + keys.length + ' 列，对上 ' +
      (report.length - missing.length) + ' / ' + report.length + ' 个字段' + viaTxt +
      '，还缺 ' + missing.length + ' 个：' + needType.map(x => x.name + '(' + x.type + ')').join('、') +
      '。请在思源里手动补上这些列，补完回到本页再点一次校验。';
  return { ok:true, avId, blockId:rs.blockId, title:rs.title, hpath:rs.hpath,
    missing, needType, report, aliasHits:aliasHits.map(r => ({ from:r.hit.name, to:r.col })),
    made:[], failed:[], partial:!okAll, ready:okAll, msg,
    totalCols:keys.length, existing:keys.map(k => k.name), keys };
}

/* 值 → 思源单元格 value（与适配器 _cell 同构，独立一份便于单测） */
function syCellValue(col, val, type){
  const t = String(type || 'text').toLowerCase();
  if(t === 'number')   return { number:{ content: Number(val) || 0, isNotEmpty: val != null && val !== '' } };
  if(t === 'date'){ const d = val ? new Date(String(val).replace(/-/g,'/')) : null;
    const ok = !!(d && !isNaN(d.getTime()));
    return { date:{ content: ok ? d.getTime() : null, isNotEmpty: ok } }; }
  if(t === 'checkbox') return { checkbox:{ checked: !!val } };
  if(t === 'select' || t === 'mselect') return { mSelect:[{ content: String(val == null ? '' : val) }] };
  if(t === 'block')    return { block:{ content: String(val == null ? '' : val) } };
  return { text:{ content: val == null ? '' : String(val) } };
}

/* 推送：把工作台的共享字段写回专用同步库（单表两行类）。
   - 订单行按 orderNo 定位；排产行按「订单号#工单号」定位，orderNo 作外键写进排产行；
   - 远端行自带 itemID 优先、本地 siyuanItemID 兜底 → 走更新（batchSet），都无则新增（append）；
   - 冲突按 updatedAt「后写覆盖」：两端都有值且本地更旧 → 跳过（保留思源）；
   - 只推 dir:'both' 字段，「工作台独有」字段永不外发。 */
async function pushToSiyuan2(opts){
  const o = opts || {}, cfg = syCfg();
  if(!SYNC_AV) return { ok:false, msg:'尚未绑定同步库，请先点「创建/绑定思源同步库」' };
  const st = Store.state;
  let rRows;
  try{ rRows = await syFetchAllRows(SYNC_AV, 0, 200); }
  catch(e){ return { ok:false, msg:'读取思源失败：'+((e && e.message) || e) }; }
  /* 分类远端行：带 moNo 的是排产行，其余是订单行（订单组不含 moNo，故不会误判） */
  const rOrders = [], rProds = [];
  rRows.forEach(r => { syNormalizeRow(r); (syIsProdRow(r) ? rProds : rOrders).push(r); });
  const rByNo = new Map();
  rOrders.forEach(r => { const n = String(r.orderNo || '').trim(); if(n && !rByNo.has(n)) rByNo.set(n, r); });
  const rByProd = new Map();
  rProds.forEach(r => { const k = syProdRowKey(r.orderNo, r.moNo); if(k && !rByProd.has(k)) rByProd.set(k, r); });

  let add = 0, upd = 0, skip = 0, conflict = 0; const errs = [];
  const rowsToPush = [];
  /* ---- 订单行 ---- */
  for(const ord of st.data.orders){
    const no = String(ord.orderNo || '').trim();
    if(!no){ skip++; continue; }
    const cust = st.data.customers.find(c => c.id === ord.customerId) || {};
    const own  = st.data.owners.find(u => u.id === ord.ownerId) || {};
    const pay  = Object.assign({}, ord, { customerName:cust.name || cust.shortName || '', ownerName:own.name || '' });
    const ex = rByNo.get(no);
    if(ex && (Number(ex.updatedAt) || 0) > (Number(ord.updatedAt) || 0)){ conflict++; continue; }
    const cells = [];
    SYNC_FIELDS.filter(f => f.grp === 'orders' && f.dir === 'both').forEach(f => {
      const keyID = (SYNC_MAP.orders || {})[f.col]; if(!keyID) return;
      const val = pay[f.wbKey]; if(val == null || val === '') return;
      cells.push(Object.assign({ keyID }, syCellValue(f.col, val, f.type)));
    });
    if(!cells.length){ skip++; continue; }
    const iid = syItemID(ex) || String(ord.siyuanItemID || '');
    if(iid) rowsToPush.push({ kind:'order', itemID:iid, cells, mode:'upd', no });
    else rowsToPush.push({ kind:'order', cells, mode:'add', no });
  }
  /* ---- 排产行（orderNo 为外键，定位键 = 订单号 + 工单号） ---- */
  const ordById = new Map(st.data.orders.map(x => [x.id, x]));
  for(const p of st.data.production){
    const ord = ordById.get(p.orderId) || {};
    const oNo = String(ord.orderNo || '').trim();
    const mo  = String(p.moNo || '').trim();
    if(!oNo || !mo){ skip++; continue; }          /* 无外键（订单号）或工单号 → 无法定位，跳过 */
    const ex = rByProd.get(syProdRowKey(oNo, mo));
    if(ex && (Number(ex.updatedAt) || 0) > (Number(p.updatedAt) || 0)){ conflict++; continue; }
    /* 进度按 prodPct 落库（数量口径优先，避免把库里过期的手填值推出去） */
    const pv = Object.assign({}, p, { orderNo:oNo, progressPct:prodPct(p) });
    const cells = [];
    SYNC_FIELDS.filter(f => f.grp === 'production' && f.dir === 'both').forEach(f => {
      /* 外键列 orderNo 与订单组共用同一列，映射在其中任一组都能取到 */
      const keyID = (SYNC_MAP.production || {})[f.col] || (SYNC_MAP.orders || {})[f.col]; if(!keyID) return;
      const val = pv[f.wbKey]; if(val == null || val === '') return;
      cells.push(Object.assign({ keyID }, syCellValue(f.col, val, f.type)));
    });
    if(!cells.length){ skip++; continue; }
    const iid = syItemID(ex) || String(p.siyuanItemID || '');
    if(iid) rowsToPush.push({ kind:'prod', itemID:iid, cells, mode:'upd', no:oNo + ' / ' + mo });
    else rowsToPush.push({ kind:'prod', cells, mode:'add', no:oNo + ' / ' + mo });
  }
  if(o.dryRun) return { ok:true, dryRun:true, add:rowsToPush.filter(r=>r.mode==='add').length,
    upd:rowsToPush.filter(r=>r.mode==='upd').length, skip, conflict,
    addOrder:rowsToPush.filter(r=>r.kind==='order'&&r.mode==='add').length,
    addProd:rowsToPush.filter(r=>r.kind==='prod'&&r.mode==='add').length };

  /* cells 元素形如 { keyID, number:{...} } / { keyID, text:{...} }：
     拆出 keyID 与 value 供 batchSet / append 两种载荷复用 */
  const splitCell = c => { const o = Object.assign({}, c); const keyID = o.keyID; delete o.keyID; return { keyID, value:o }; };
  let addOrder = 0, addProd = 0, updOrder = 0, updProd = 0;
  let done = 0;
  for(const it of rowsToPush){
    if(o.onProgress) o.onProgress(++done, rowsToPush.length);
    try{
      /* 走带节流 + 退避重试的调用：行数多时连发会打满内核被 429 掐断 */
      if(it.mode === 'upd'){
        await syApiRetry(SY_ENDPOINTS.batchSet, { avID:SYNC_AV,
          values:it.cells.map(c => { const s = splitCell(c); return { keyID:s.keyID, itemID:it.itemID, value:s.value }; }) });
        upd++; if(it.kind === 'prod') updProd++; else updOrder++;
      } else {
        await syApiRetry(SY_ENDPOINTS.addRow, { avID:SYNC_AV,
          blocksValues:[ it.cells.map(c => { const s = splitCell(c); return Object.assign({ keyID:s.keyID }, s.value); }) ] });
        add++; if(it.kind === 'prod') addProd++; else addOrder++;
      }
    }catch(e){ errs.push(it.no + '：' + ((e && e.message) || '写入失败')); }
  }
  const msg = '推送完成：订单 新增 ' + addOrder + ' · 更新 ' + updOrder +
    ' ｜ 排产 新增 ' + addProd + ' · 更新 ' + updProd +
    (conflict ? ' · 冲突跳过 ' + conflict : '') + (skip ? ' · 跳过 ' + skip : '');
  Store.state.dsCfg.siyuan.lastPushAt = Date.now();
  return { ok:true, msg, add, upd, skip, conflict, errs,
    addOrder, addProd, updOrder, updProd };
}

/* 拉取：复用旧管线（syPullFromSiyuan），额外回填思源行 ID 与 updatedAt（供下次推送定位/比对） */
async function pullWithItemID(opts){
  const r = await syPullFromSiyuan(opts);
  if(!r || !r.ok) return r;
  try{
    const src = createSource('siyuan', syCfg());
    const remote = await src.list('orders');
    const byNo = new Map((remote || []).map(x => [String(x.orderNo || '').trim(), x]));
    const upd = [];
    Store.state.data.orders.forEach(o => { const ex = byNo.get(String(o.orderNo || '').trim());
      if(ex){ upd.push({ id:o.id, siyuanItemID:syItemID(ex), updatedAt:o.updatedAt || Date.now() }); } });
    for(const p of upd) await Store.state.source.update('orders', p.id, p);
    await reload();
    r.itemIDFilled = upd.length;
  }catch(e){ r.itemIDWarn = (e && e.message) || '回填行 ID 失败'; }
  return r;
}

/* 导入 UI 的中间态（仅存于当前会话，不落库） */
const SY = { state:null };
function syRenderPlan(){

  if(!s || !s.plan){ box.innerHTML = '<div class="muted" style="font-size:12px">尚未选择文件</div>'; return; }

  let h = `<div class="hint" style="margin-bottom:10px">

  };
}

function bindSource(){
  $$('[data-ds]').forEach(x => x.onclick = async () => { Store.set({ dsId:x.dataset.ds }); await reload(); });
  const s = $('#sySave'); if(s) s.onclick = async () => {
    const oRaw = ($('#syAvO').value || '').trim(), cRaw = ($('#syAvC').value || '').trim();
    Store.state.dsCfg.siyuan = { baseUrl:$('#syUrl').value, token:$('#syTok').value, defaultView:$('#syView').value,
      avIds:{ orders:oRaw, customers:cRaw }, allowWrite: !!($('#syWrite') && $('#syWrite').checked) };
    /* v0.24：这两个框里如果填的是「数据库块 id」，一键拉取会读到空骨架 —— 保存时顺手纠正成真 avID */
    const fixed = [];
    for(const pair of [['orders', oRaw, '#syAvO'], ['customers', cRaw, '#syAvC']]){
      if(!pair[1]) continue;
      try{
        const r = await syResolveAvId(pair[1]);
        if(r.real && r.avId !== pair[1]){
          Store.state.dsCfg.siyuan.avIds[pair[0]] = r.avId;
          const el = $(pair[2]); if(el) el.value = r.avId;
          fixed.push(pair[0] + '：' + pair[1] + ' → ' + r.avId);
        }
      }catch(e){}
    }
    toast(fixed.length ? ('已保存，并把块 id 纠正为真 avID —— ' + fixed.join('；')) : '思源配置已保存');
  };
  const c = $('#syCheck'); if(c) c.onclick = async () => {
    const src = createSource('siyuan', Store.state.dsCfg.siyuan);
    $('#syHealth').textContent = '检测中…';
    const r = await src.healthCheck();
    Store.set({ health:r });
    $('#syHealth').innerHTML = (r.ok?'✅ ':'❌ ') + esc(r.msg);
  };
  const pull = $('#syPull'); if(pull) pull.onclick = async () => {
    const info = $('#sySyncInfo'); if(info) info.textContent = '拉取中…';
    const dropDemo = !!($('#syDropDemo') && $('#syDropDemo').checked);
    try{
      const r = await syPullFromSiyuan({ dropDemo });
      if(info) info.innerHTML = (r.ok ? '✅ ' : '❌ ') + esc(r.msg);
      toast(r.msg);
    }catch(e){ if(info) info.innerHTML = '<span class="warn">拉取失败：' + esc(e.message) + '</span>'; }
  };
  const push = $('#syPush'); if(push) push.onclick = async () => {
    const info = $('#sySyncInfo'); if(info) info.textContent = '推送中…';
    try{
      const r = await syPushToSiyuan();
      if(info) info.innerHTML = (r.ok ? '✅ ' : '❌ ') + esc(r.msg) +
        (r.errs && r.errs.length ? '<br>' + esc(r.errs.slice(0, 3).join('；')) : '');
      toast(r.msg);
    }catch(e){ if(info) info.innerHTML = '<span class="warn">推送失败：' + esc(e.message) + '</span>'; }
  };
  const sguide = $('#syColGuide'); if(sguide) sguide.onclick = () => {
    const box = $('#syColList');
    /* 同一列只列一次（orderNo 被订单组与排产组共用），并标注所属组，方便用户核对 */
    const seen = {}, rows = [];
    SYNC_FIELDS.forEach(f => { if(seen[f.col]) { seen[f.col].grps.push(f.grp); return; }
      seen[f.col] = { col:f.col, type:f.type || 'text', grps:[f.grp] }; rows.push(seen[f.col]); });
    const li = rows.map(x => '<li style="margin:3px 0"><code>' + esc(x.col) + '</code>' +
      '　<span class="muted">类型：' + esc(x.type) + '　用于：' + esc(x.grps.join(' / ')) + '</span></li>').join('');
    if(box) box.innerHTML = '<div class="hint"><b>在思源里新建数据库后，需要建这 ' + rows.length + ' 个列（列名要一字不差）：</b>' +
      '<ol style="margin:6px 0 0 18px;padding:0">' + li + '</ol>' +
      '<div style="margin-top:8px">列名与工作台字段<b>完全同名</b>（零翻译）；<b>列 ID</b> 才是映射锚点，' +
      '建好后你随时可以在思源里改列名，只要别删列。</div></div>';
    toast('已列出 ' + rows.length + ' 个需建列');
  };
  /* ---- v0.24 专用同步库：列出 · 绑定并校验 · 拉取 · 推送 ----
     不再自动建库/建列（思源 3.8.3 的写接口在本机不落地）；
     也不要求用户手抄 avId —— 列表点选即可，内部统一解析成真 avID。 */
  /* 逐列匹配报告：一眼看出哪个字段对上了、靠同名还是靠中文别名、还缺哪些 */
  const syRenderMatch = (r, info, box) => {
    if(info) info.innerHTML = (r.ready ? '<span style="color:var(--green)">✅ ' : '<span class="warn">⚠️ ') + esc(r.msg) + '</span>';
    if(!box) return;
    const rows = r.report.map(x => {
      const tag = x.hit
        ? (x.hit.via === 'alias' ? '<span class="tag t-amber">中文别名</span>' : '<span class="tag t-green">同名</span>')
        : '<span class="tag t-red">缺列</span>';
      const src = x.hit ? esc(x.hit.name) : '<span class="muted">—</span>';

    }).join('');
    let h = '<div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr>' +
      '<th>工作台字段</th><th>思源里对应的列</th><th>匹配方式</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    if(!r.ready){
      const li = r.needType.map(x => '<li style="margin:3px 0"><code>' + esc(x.name) + '</code>' +
        '　<span class="muted">类型 ' + esc(x.type) +
        (x.alias && x.alias.length ? '　或直接叫：' + esc(x.alias.slice(0, 3).join(' / ')) : '') + '</span></li>').join('');
      h += '<div class="hint" style="margin-top:10px;border-color:var(--amber)">' +
        '<b>还需要在思源里补 ' + r.missing.length + ' 个列</b>（列名照抄，或改成上面括号里的中文列名也行）：' +
        '<ol style="margin:6px 0 0 18px;padding:0">' + li + '</ol>' +
        '<div style="margin-top:6px">补完回到本页，再点一次「② 绑定并校验」。</div></div>';

    box.innerHTML = h;

  const syBindAndCheck = async (avId, info, box) => {

      const b = $('#sySyncBadge');
      if(b){ b.textContent = (r.ready ? '已绑定 · ' : '待补列 · ') + (r.title || r.avId);
             b.className = 'tag ' + (r.ready ? 't-green' : 't-amber'); }

/* ---------- FileStore ---------- */
const FileStore = (() => {
  const mem = new Map();
  let dbp = null;
  const mode = (typeof indexedDB !== 'undefined' && indexedDB) ? 'idb'
             : (typeof localStorage !== 'undefined' && localStorage) ? 'local' : 'mem';
  function openIDB(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try{
        const r = indexedDB.open('ot_files', 1);
        r.onupgradeneeded = e => { const d = e.target.result;
          if(!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(new Error('IndexedDB 打开失败'));
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function readDataURL(file){ return new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('文件读取失败')); r.readAsDataURL(file); }); }
  function check(file){
    if(!file) return '未选择文件';
    const ext = String(file.name || '').toLowerCase().split('.').pop();
    if(!FILE_EXT.includes(ext)) return '格式不支持，仅允许 PDF / JPG / PNG';
    if(file.size === 0) return '文件内容为空';
    if(file.size > FILE_MAX) return '文件不能超过 10MB（当前 ' + sizeTxt(file.size) + '）';
    return null;
  }
  async function put(file){
    const bad = check(file); if(bad) throw new Error(bad);
    const meta = { id: uid('F'), name: file.name, size: file.size,
      type: file.type || ('.' + String(file.name).toLowerCase().split('.').pop()),
      uploadedAt: new Date().toISOString() };
    if(mode === 'idb'){
      const db = await openIDB();
      await new Promise((res, rej) => { const tx = db.transaction('files','readwrite');
        tx.objectStore('files').put(file, meta.id); tx.oncomplete = res; tx.onerror = () => rej(new Error('写入失败')); });
    }else if(mode === 'local'){
      const data = await readDataURL(file);
      try{ localStorage.setItem('ot.file.' + meta.id, JSON.stringify({ ...meta, data })); }
      catch(e){ throw new Error('本地存储空间不足，请压缩文件'); }
    }else{ mem.set(meta.id, { meta, blob: file }); }
    return meta;
  }
  async function url(id){
    if(!id) return null;
    if(mode === 'idb'){
      try{ const db = await openIDB();
        const blob = await new Promise((res, rej) => { const tx = db.transaction('files','readonly');
          const q = tx.objectStore('files').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(new Error('读取失败')); });
        return blob ? URL.createObjectURL(blob) : null; }catch(e){ return null; }
    }
    if(mode === 'local'){ const raw = localStorage.getItem('ot.file.' + id); return raw ? JSON.parse(raw).data : null; }
    const it = mem.get(id); return it ? URL.createObjectURL(it.blob) : null;
  }
  async function del(id){
    if(!id) return;
    try{
      if(mode === 'idb'){ const db = await openIDB(); await new Promise(res => {
        const tx = db.transaction('files','readwrite'); tx.objectStore('files').delete(id);
        tx.oncomplete = res; tx.onerror = res; }); }
      else if(mode === 'local'){ localStorage.removeItem('ot.file.' + id); }
      else { mem.delete(id); }
    }catch(e){}
  }
  /* 清空全部附件：清库时调用，避免订单删了、附件还留在浏览器里成为孤儿文件 */
  async function clear(){
    try{
      if(mode === 'idb'){ const db = await openIDB(); await new Promise(res => {
        const tx = db.transaction('files','readwrite'); tx.objectStore('files').clear();
        tx.oncomplete = res; tx.onerror = res; }); }
      else if(mode === 'local'){
        Object.keys(localStorage).filter(k => k.indexOf('ot.file.') === 0)
