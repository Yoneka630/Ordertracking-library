/* ==========================================================================
   模块 3.5 · 数据历史（整库快照 + 删除回收站）  ·  v0.20
   ---------------------------------------------------------------------------
   为什么需要：此前唯一的「回退」是批量修改的 `batchUndo` —— 内存态、只保留最近
   一次、只管批量修改；误删一笔订单或改错一批数据都退不回来。S3 云端虽然存了历史
   快照文件，但只有「合并」消费路径，没有回滚入口。

   设计取舍：
     · 粒度 = 整库快照（6 张业务表 + 回收站一起存）。200 单实测约 0.16MB，
       体积完全可以接受；换来的是「一定能救回来」——不依赖任何增量日志的正确性。
     · 打点 = 写库前自动打一份（10 分钟内的连续改动合并成一份）＋ 关键操作前强制
       打一份（清空 / 导入 / 批量改 / 拉取）。两者用同一套闸门，不会刷屏。
     · 存储 = 独立 IndexedDB 库 ot_history → 降级 localStorage → 降级内存。
       独立库是为了**不动 FileStore 的 ot_files**：给已有库加 store 要走
       onupgradeneeded，一旦用户那边库版本不一致就有打不开的风险。
     · 淘汰 = 总数上限 HIST_MAX；超了先丢「自动」，再丢「关键操作」，最后才动
       「手动」——自动快照最廉价，手动是用户亲自存的，最后丢。
     · 回收站 = 删除不再物理抹掉，而是把整条记录搬进库内 `_trash`。业务表零残留，
       所以**所有读取路径都不用改**（这是它比 `_deleted` 软标记更安全的地方）。
       删订单时把订单 + 它的排产/发货/跟进打包成一组，还原即可整组回来。
   ========================================================================== */
const LS_DB_KEY_DEFAULT = 'ot.localdb.v2';

const HIST_MAX = 30;                       /* 快照总数上限 */
const HIST_COALESCE_MS = 10 * 60 * 1000;   /* 自动打点合并窗口：10 分钟内连续改动只留一份 */
const HIST_QUIET_MS = 3000;                /* 强制打点后的静默窗口，避免紧随的自动打点重复 */
const HIST_KIND_LABEL = { auto:'自动', key:'关键操作', manual:'手动' };
const TRASH_KEY = '_trash';                /* 回收站在库内的键名（不是业务表，不进 SCHEMA） */
const TRASH_MAX = 200;                     /* 回收站条目上限 */

/* 保留淘汰策略（抽成纯函数，便于单测与复用）：
   超出上限时先丢「自动」（最廉价、数量最多），再丢「关键操作」，最后才动「手动」
   —— 手动快照是用户亲自按下去的，最后丢。同档内先丢最老的。 */
const HIST_KIND_RANK = { auto:0, key:1, manual:2 };
function histPickEvictions(list, max){
  if(!Array.isArray(list) || list.length <= max) return [];
  return list.slice().sort((a, b) => {
    const ra = HIST_KIND_RANK[a.kind] == null ? 0 : HIST_KIND_RANK[a.kind];
    const rb = HIST_KIND_RANK[b.kind] == null ? 0 : HIST_KIND_RANK[b.kind];
    return ra !== rb ? ra - rb : a.at - b.at;
  }).slice(0, list.length - max).map(m => m.id);
}

/* ---------- 快照存储：独立 IndexedDB 库 → 降级 localStorage → 降级内存 ---------- */
const SnapshotStore = (function(){
  const DB_NAME = 'ot_history', DB_VER = 1;
  const IDX_KEY = 'ot.hist.idx';            /* localStorage 后端的索引 */
  const ITEM_PREFIX = 'ot.hist.d.';
  const LS_MAX = 6;                         /* localStorage 只有 5MB，只留最近 6 份 */
  const memMeta = new Map(), memData = new Map();
  let mode = '', _idb = null, _idbTried = false, _ready = null;

  const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
  const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
  const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };

  function openIDB(){
    if(_idbTried) return Promise.resolve(_idb);
    _idbTried = true;
    return new Promise(res => {
      try{
        if(typeof indexedDB === 'undefined'){ _idb = null; return res(null); }
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = e => { const d = e.target.result;
          if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath:'id' });
          if(!d.objectStoreNames.contains('data')) d.createObjectStore('data', { keyPath:'id' });
        };
        r.onsuccess = e => { _idb = e.target.result; res(_idb); };
        r.onerror   = () => { _idb = null; res(null); };
        r.onblocked = () => { _idb = null; res(null); };
      }catch(e){ _idb = null; res(null); }
    });
  }
  const idbOp = (store, write, fn) => new Promise((res, rej) => {
    try{
      const tx = _idb.transaction(store, write ? 'readwrite' : 'readonly');
      const rq = fn(tx.objectStore(store));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror  = () => rej(tx.error || new Error('IDB 事务失败'));
      tx.onabort  = () => rej(tx.error || new Error('IDB 事务中止'));
    }catch(e){ rej(e); }
  });

  /* 初始化 = **探测**后端是否真的可用（open 成功但写不进去也算不可用），
     真机上若 IDB 有问题会自动降级，不会让整个功能卡死。 */
  async function init(){
    if(mode) return mode;
    if(_ready) return _ready;
    _ready = (async () => {
      const d = await openIDB();
      if(d){
        try{
          await idbOp('meta', true, s => s.put({ id:'__probe__', at:0 }));
          await idbOp('meta', true, s => s.delete('__probe__'));
          mode = 'idb'; return mode;
        }catch(e){ mode = ''; }
      }
      if(lsSet('ot.hist.probe', 1)){ lsDel('ot.hist.probe'); mode = 'local'; }
      else mode = 'mem';
      return mode;
    })();
    return _ready;
  }

  async function put(snap){
    await init();
    const meta = { id:snap.id, at:snap.at, kind:snap.kind, reason:snap.reason,
                   size:snap.size || 0, counts:snap.counts || {}, trash:snap.trash || 0 };
    if(mode === 'idb'){
      try{
        await idbOp('meta', true, s => s.put(meta));
        await idbOp('data', true, s => s.put({ id:snap.id, db:snap.db }));
        return meta;
      }catch(e){ return null; }
    }
    if(mode === 'local'){
      const idx = lsGet(IDX_KEY, []);
      const keep = idx.slice();
      /* 先写内容；配额不够就从最老的开始丢，直到写成功 */
      let wrote = lsSet(ITEM_PREFIX + meta.id, { id:meta.id, db:snap.db });
      const olds = idx.slice().sort((a,b) => a.at - b.at);
      while(!wrote && olds.length){
        const old = olds.shift();
        lsDel(ITEM_PREFIX + old.id);
        const i = keep.findIndex(x => x.id === old.id); if(i >= 0) keep.splice(i,1);
        wrote = lsSet(ITEM_PREFIX + meta.id, { id:meta.id, db:snap.db });
      }
      /* 实在放不下就放弃这份快照 —— 绝不能为了存档把 localStorage 撑爆，
         那会连带把主数据也写不进去，是拿安全网去害命。 */
      if(!wrote){ lsDel(ITEM_PREFIX + meta.id); return null; }
      keep.unshift(meta);
      while(keep.length > LS_MAX){ const old = keep.pop(); lsDel(ITEM_PREFIX + old.id); }
      lsSet(IDX_KEY, keep);
      return meta;
    }
    memMeta.set(meta.id, meta); memData.set(meta.id, snap.db);
    const list = [...memMeta.values()].sort((a,b) => a.at - b.at);
    while(list.length > LS_MAX){ const old = list.shift(); memMeta.delete(old.id); memData.delete(old.id); }
    return meta;
  }

  /* 列表只读元数据（轻），内容按 id 单独取（重）—— 避免列个清单就把所有快照读进内存 */
  async function all(){
    await init();
    let list = [];
    if(mode === 'idb'){ try{ list = (await idbOp('meta', false, s => s.getAll())) || []; }catch(e){ list = []; } }
    else if(mode === 'local'){ list = lsGet(IDX_KEY, []); }
    else list = [...memMeta.values()];
    return (list || []).filter(m => m && m.id !== '__probe__').sort((a,b) => b.at - a.at);
  }
  async function get(id){
    await init();
    if(mode === 'idb'){ try{ const r = await idbOp('data', false, s => s.get(id)); return r ? r.db : null; }catch(e){ return null; } }
    if(mode === 'local'){ const r = lsGet(ITEM_PREFIX + id, null); return r ? r.db : null; }
    return memData.get(id) || null;
  }
  async function del(id){
    await init();
    if(mode === 'idb'){ try{ await idbOp('meta', true, s => s.delete(id)); await idbOp('data', true, s => s.delete(id)); }catch(e){} return; }
    if(mode === 'local'){ lsDel(ITEM_PREFIX + id); lsSet(IDX_KEY, lsGet(IDX_KEY, []).filter(m => m.id !== id)); return; }
    memMeta.delete(id); memData.delete(id);
  }
  async function clear(){
    await init();
    if(mode === 'idb'){ try{ await idbOp('meta', true, s => s.clear()); await idbOp('data', true, s => s.clear()); }catch(e){} return; }
    if(mode === 'local'){ lsGet(IDX_KEY, []).forEach(m => lsDel(ITEM_PREFIX + m.id)); lsDel(IDX_KEY); return; }
    memMeta.clear(); memData.clear();
  }

  /* 保留策略：先丢自动 → 再丢关键操作 → 最后才动手动；同档丢最老的 */
  async function enforce(){
    const list = await all();
    const victims = histPickEvictions(list, HIST_MAX);
    for(const id of victims) await del(id);
    return victims.length;
  }

  return { init, put, all, get, del, clear, enforce,
    bytes: list => (list || []).reduce((n, m) => n + (m.size || 0), 0),
    get mode(){ return mode || ''; },
    get label(){ return mode === 'idb' ? 'IndexedDB'
      : mode === 'local' ? 'localStorage（降级）'
      : mode === 'mem' ? '内存（刷新即失效）' : '（未初始化）'; } };
})();

/* ---------- 打点：自动（带合并窗口）· 关键操作强制 · 手动 ---------- */
let _histLastAutoAt = 0, _histQuietUntil = 0, _histPending = false;

function histReadDB(){
  /* 快照打的是「这次改动之前」的状态，所以必须在写库**前**读旧库 */
  try{ return JSON.parse(localStorage.getItem(LS_DB_KEY_DEFAULT)) || null; }catch(e){ return null; }
}
function histCounts(db){
  const c = {};
  Object.keys(SCHEMA).forEach(k => { c[k] = Array.isArray(db && db[k]) ? db[k].length : 0; });
  c[TRASH_KEY] = ((db && db[TRASH_KEY]) || []).length;
  return c;
}
async function histPush(db, kind, reason){
  if(!db) return null;
  try{
    const payload = JSON.parse(JSON.stringify(db));
    const size = JSON.stringify(payload).length;
    const meta = await SnapshotStore.put({ id: uid('HS'), at: Date.now(), kind: kind || 'auto',
      reason: reason || '自动存档', size, counts: histCounts(payload),
      trash: ((payload[TRASH_KEY]) || []).length, db: payload });
    if(meta) SnapshotStore.enforce();      /* 淘汰丢到后台，不拖慢调用方 */
    return meta;
  }catch(e){ return null; }        /* 打点失败绝不能影响主流程 */
}
/* 写库前自动打点：10 分钟内只留一份。并发写库由 _histPending 闸门合并 ——
   否则批量修改的 137 次 _write 会各自读到「还没有自动快照」而打出 137 份。 */
async function histMaybeAuto(db, reason){
  const now = Date.now();
  if(now < _histQuietUntil || _histPending) return null;
  if(_histLastAutoAt && now - _histLastAutoAt < HIST_COALESCE_MS) return null;
  _histLastAutoAt = now; _histPending = true;
  try{ return await histPush(db, 'auto', reason); }
  finally{ _histPending = false; }
}
/* 关键操作前强制打点（忽略合并窗口）：保证「清空 / 导入 / 批量改 / 拉取」都有一份
   操作前的精确回退点 —— 只靠自动打点会被 10 分钟窗口挡掉，最多退回 10 分钟前。 */
async function histForceMark(reason){
  _histQuietUntil = Date.now() + HIST_QUIET_MS;
  _histLastAutoAt = Date.now();
  return histPush(histReadDB(), 'key', reason);
}
async function histManualMark(reason){ return histPush(histReadDB(), 'manual', reason || '手动存档'); }
/* 启动时同步一次「最近自动打点时刻」，避免刷新后第一笔改动立刻重复打点 */
async function histPrime(){
  try{ const a = (await SnapshotStore.all()).find(m => m.kind === 'auto'); if(a) _histLastAutoAt = a.at; }catch(e){}
}
/* 清空快照后重置闸门：否则「刚清完快照 → 立刻改数据」会被 10 分钟合并窗口挡住，
   白白丢一次打点机会，用户会以为清空把自动存档一起关掉了。 */
function histResetGate(){ _histLastAutoAt = 0; _histQuietUntil = 0; }

const fmtStamp = ts => { const d = new Date(ts); return (!ts || isNaN(d)) ? '—'
  : d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const fmtAgo = ts => { const s = Math.max(0, Math.round((Date.now() - (ts || 0)) / 1000));
  if(s < 60) return s + ' 秒前';
  if(s < 3600) return Math.round(s / 60) + ' 分钟前';
  if(s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前'; };
const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB'
  : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : (n || 0) + ' B';

/* 回滚前的差异预览：对比「当前库」与「目标快照」各表记录数，让用户知道会改什么 */
function histDiff(snap){
  const cur = histReadDB() || {};
  const out = [];
  Object.keys(SCHEMA).forEach(k => {
    const a = (cur[k] || []).length, b = (snap && snap[k] || []).length;
    if(a !== b) out.push({ res:k, label:RES_LABEL[k] || k, cur:a, snap:b });
  });
  return out;
}

/* 整库回滚到某个快照。关键点：回滚**本身**也先打一份「回滚前」快照 ——
   否则用户点错了就再也回不来，那是把安全网做成了陷阱。 */
async function histRestore(snapId, reason){
  const snap = await SnapshotStore.get(snapId);
  if(!snap) return { ok:false, msg:'快照内容已丢失（可能已被清理或存储降级导致）' };
  const src = Store.state.source;
  if(!src || typeof src.replaceAll !== 'function') return { ok:false, msg:'当前数据源不支持整库写入' };
  if(!src.capabilities || !src.capabilities.write) return { ok:false, msg:'当前数据源只读，无法回滚' };
  /* 注意：强制打点交给 replaceAll 内部做（它本来就会存一份「操作前」），
     这里不再单独调 → 否则一次回滚会留下两份内容完全相同的快照。 */
  const next = JSON.parse(JSON.stringify(snap));
  delete next._dropped;
  await src.replaceAll(next, '回滚前（即将回到「' + (reason || '快照') + '」）');
  await reload();
  return { ok:true };
}

/* ---------- 回收站 ---------- */
const RES_LABEL = { orders:'订单', production:'排产', shipments:'发货', payments:'回款', followups:'跟进', customers:'客户', owners:'业务员',
  suppliers:'供应商', custProducts:'客户产品', supplierProducts:'供应商产品' };
function rowTitle(res, row){
  row = row || {};
  if(res === 'orders')     return '订单 ' + (row.orderNo || row.id);
  if(res === 'production') return '排产 ' + (row.moNo || row.id);
  if(res === 'shipments')  return '发货 ' + (row.shipNo || row.id);
  if(res === 'payments')   return '回款 ' + (row.payDate || '') + (row.amount != null ? ' · ' + row.amount : '');
  if(res === 'followups')  return '跟进 ' + (row.date || row.id);
  if(res === 'customers')  return '客户 ' + (row.name || row.id);
  if(res === 'owners')     return '业务员 ' + (row.name || row.id);
  if(res === 'suppliers')  return '供应商 ' + (row.name || row.id);
  if(res === 'custProducts')     return '客户产品 ' + (row.sku || row.name || row.id);
  if(res === 'supplierProducts') return '供应商产品 ' + (row.sku || row.name || row.id);
  return (RES_LABEL[res] || res) + ' ' + row.id;
}
/* v0.47：一行记录上挂的**全部**文件 id。
   以前只有订单有附件（attachments），回收站与 S3 快照都把 attachments 写死；
   产品库上来之后图片（images）与包装文件（packingFiles）也是 FileStore 里的二进制，
   漏掉就意味着「换设备后产品图全裂 / 删产品不回收文件」—— 统一从这一个出口取。 */
function rowFileIds(row){
  if(!row) return [];
  const out = [];
  (row.attachments || []).forEach(a => { if(a && a.id) out.push(a.id); });
  (row.images || []).forEach(id => { if(id) out.push(id); });
  (row.packingFiles || []).forEach(f => { if(f && f.id) out.push(f.id); });
  return out;
}
function pushTrash(db, items, label, files){
  db[TRASH_KEY] = db[TRASH_KEY] || [];
  const entry = { id: uid('TR'), at: Date.now(), label: label || '记录',
                  count: (items || []).length, files: (files || []).slice(),
                  items: (items || []).map(x => ({ res: x.res, row: x.row })) };
  db[TRASH_KEY].unshift(entry);
  /* 超上限：丢最老的，连同它的附件二进制一起清（否则文件会永久占空间） */
  while(db[TRASH_KEY].length > TRASH_MAX){
    const old = db[TRASH_KEY].pop();
    (old.files || []).forEach(f => { try{ FileStore.del(f); }catch(e){} });
  }
  return entry;
}
function trashSummary(entry){
  const by = {};
  ((entry && entry.items) || []).forEach(it => { by[it.res] = (by[it.res] || 0) + 1; });
  return Object.keys(by).map(r => (RES_LABEL[r] || r) + ' ' + by[r]).join(' · ');
}

class DataSource {
  constructor(cfg){ this.cfg = cfg || {}; }
  get id(){ return 'abstract'; }
  get label(){ return '抽象数据源'; }
  get capabilities(){ return { read:false, write:false, realtime:false }; }
  async init(){}
  async list(){ throw new Error('未实现 list'); }
  async create(){ throw new Error('该数据源只读'); }
  async update(){ throw new Error('该数据源只读'); }
  async remove(){ throw new Error('该数据源只读'); }
  async healthCheck(){ return { ok:false, msg:'未实现' }; }
}
class MockDataSource extends DataSource {
  constructor(cfg){ super(cfg); this._cache = null; }
  get id(){ return 'mock'; }
  get label(){ return '内置模拟数据'; }
  get capabilities(){ return { read:true, write:false, realtime:false }; }
  async init(){ if(!this._cache) this._cache = buildDemoData(); }
  async list(res){ await this.init(); return this._cache[res] ? JSON.parse(JSON.stringify(this._cache[res])) : []; }
  async healthCheck(){ return { ok:true, msg:'内存模拟数据，'+ (this._cache?this._cache.orders.length:0) +' 笔订单' }; }
}
class LocalDataSource extends DataSource {
  constructor(cfg){ super(cfg); this.key = (cfg && cfg.key) || 'ot.localdb.v2'; }
  get id(){ return 'local'; }
  get label(){ return '本地手工录入'; }
  get capabilities(){ return { read:true, write:true, realtime:false }; }
  _read(){ try{ return JSON.parse(localStorage.getItem(this.key)) || null; }catch(e){ return null; } }
  /* 落盘 + 写前打点：快照要存的是「这次改动之前」的状态，所以先读旧库再写。
     打点是异步的（IndexedDB），这里 fire-and-forget —— 绝不能让它拖慢或阻断写库。 */
  _write(db, reason){
    let prev = null;
    try{ prev = this._read(); }catch(e){}
    localStorage.setItem(this.key, JSON.stringify(db));
    if(prev) histMaybeAuto(prev, reason || '自动存档');
  }
  _migrate(db){
    if(!db || !Array.isArray(db.orders)) return db;
    const dirty = db.orders.some(o => LEGACY_MAP[o.status] !== undefined);
    if(!dirty) return db;
    const kept = [];
    let dropped = 0;
    db.orders.forEach(o => {
      const m = LEGACY_MAP[o.status];
      if(m === null){ dropped++; return; }
      if(m) o.status = m;
      kept.push(o);
    });
    db.orders = kept;
    db._dropped = dropped;
    return db;
  }
  async init(){
    let db = this._read();
    if(!db){ db = buildDemoData(); db._v = 4; this._write(db); return db; }
    const m = this._migrate(db);
    if(m._dropped) this._write(m);
    return m;
  }
  async list(res){ const db = await this.init(); return db[res] ? JSON.parse(JSON.stringify(db[res])) : []; }
  async create(res, row){ const db = await this.init(); db[res] = db[res] || []; db[res].push(stampRecord(row, true)); this._write(db); return row; }
  async update(res, id, patch){
    const db = await this.init(); const i = (db[res]||[]).findIndex(x => x.id === id);
    if(i < 0) throw new Error('记录不存在：'+id);
    const merged = { ...db[res][i], ...patch };
    stampRecord(merged, false);
    db[res][i] = merged; this._write(db); return db[res][i];
  }
  async remove(res, id){
    const db = await this.init();
    const row = (db[res]||[]).find(x => x.id === id);
    if(!row) return true;
    /* 移入回收站而非物理删除（详见模块 3.5）——附件二进制先留着，还原时还在 */
    pushTrash(db, [{ res, row }], rowTitle(res, row), rowFileIds(row));
    db[res] = (db[res]||[]).filter(x => x.id !== id);
    this._write(db, '删除' + (RES_LABEL[res] || res)); return true;
  }
  /* 整组删除（订单 + 它的排产/发货/跟进）：打包成**同一条**回收站记录，
     这样还原时是整组回来，而不是散成一条条各还原各的。 */
  async removeGroup(items, label){
    const db = await this.init();
    const kept = [], files = [];
    (items || []).forEach(it => {
      const cur = (db[it.res]||[]).find(x => x.id === it.row.id);
      if(!cur) return;
      kept.push({ res: it.res, row: cur });
      rowFileIds(cur).forEach(id => files.push(id));
    });
    if(!kept.length) return { ok:false, n:0 };
    pushTrash(db, kept, label, files);
    kept.forEach(it => { db[it.res] = (db[it.res]||[]).filter(x => x.id !== it.row.id); });
    this._write(db, '删除' + (label || '记录'));
    return { ok:true, n: kept.length };
  }
  /* 附件二进制已被清空时调用：抹掉回收站里的文件引用，避免还原后出现断链附件 */
  async dropTrashFiles(){
    const db = await this.init();
    let n = 0;
    (db[TRASH_KEY] || []).forEach(e => { if(e.files && e.files.length){ n += e.files.length; e.files = []; } });
    if(n) this._write(db, '清理回收站附件引用');
    return n;
  }

  /* ---- 回收站：读 / 还原 / 彻底删除 ---- */
  /* 硬删除（不进回收站）：用于「清理演示数据」这类**不是误操作**的批量维护 ——
     否则 68 笔演示数据会把回收站 200 条上限灌满，把真实的误删记录挤掉。 */
  async hardRemove(res, ids){
    const db = await this.init();
    const set = new Set(Array.isArray(ids) ? ids : [ids]);
    const before = (db[res] || []).length;
    db[res] = (db[res] || []).filter(x => !set.has(x.id));
    const n = before - db[res].length;
    if(n) this._write(db, '清理' + (RES_LABEL[res] || res));
    return n;
  }
  async listTrash(){ const db = await this.init(); return JSON.parse(JSON.stringify(db[TRASH_KEY] || [])); }
  async restoreTrash(entryId){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    const i = list.findIndex(e => e.id === entryId);
    if(i < 0) return { ok:false, msg:'回收站里没有这条记录' };
    const e = list[i];
    let n = 0, skipped = 0;
    (e.items || []).forEach(it => {
      db[it.res] = db[it.res] || [];
      /* 同 id 已存在 → 不重复放回（用户可能已经手工重建了这笔） */
      if(db[it.res].some(x => x.id === it.row.id)){ skipped++; return; }
      db[it.res].push(it.row); n++;
    });
    list.splice(i, 1); db[TRASH_KEY] = list;
    this._write(db, '回收站还原');
    return { ok:true, n, skipped, label:e.label };
  }
  async purgeTrash(entryId){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    const i = list.findIndex(e => e.id === entryId);
    if(i < 0) return { ok:false };
    const e = list[i];
    /* 彻底删除才真正清附件二进制 */
    (e.files || []).forEach(f => { try{ FileStore.del(f); }catch(err){} });
    list.splice(i, 1); db[TRASH_KEY] = list;
    this._write(db, '彻底删除');
    return { ok:true, label:e.label, files:(e.files || []).length };
  }
  async clearTrash(){
    const db = await this.init();
    const list = db[TRASH_KEY] || [];
    let files = 0;
    list.forEach(e => (e.files || []).forEach(f => { files++; try{ FileStore.del(f); }catch(err){} }));
    db[TRASH_KEY] = [];
    this._write(db, '清空回收站');
    return { ok:true, entries:list.length, files };
  }
  async bulkCreate(res, rows){ const db = await this.init(); const stamped = rows.map(r => stampRecord(r, true)); db[res] = (db[res]||[]).concat(stamped); this._write(db); return stamped.length; }
  async replaceAll(db, reason){
    await histForceMark(reason || '整库替换前（导入 / 恢复 / 云端合并）');
    /* 回收站是本地安全网：整库替换时保留本地那份（除非新库自带），
       否则一次云端拉取就会把还没处理的删除记录抹掉。 */
    if(db && db[TRASH_KEY] === undefined){
      const prev = this._read();
      if(prev && prev[TRASH_KEY]) db[TRASH_KEY] = prev[TRASH_KEY];
    }
    this._write(db, '整库替换');
  }
  /* 清空数据：keepMaster=true 时保留客户/业务员档案，只清业务数据。
     写库时打上 _seeded 标记，init() 检测到已有库就不会再灌演示数据。 */
  async clearAll(keepMaster){
    const db = await this.init();
    /* 清空是最需要「操作前精确回退点」的操作，强制打点（不吃 10 分钟合并窗口） */
    await histForceMark(keepMaster ? '清空业务数据前' : '清空全部数据前');
    const next = { _v:5, _seeded:true, _clearedAt:new Date().toISOString() };
    Object.keys(SCHEMA).forEach(k => { next[k] = []; });
    if(keepMaster){ next.customers = db.customers || []; next.owners = db.owners || []; }
    /* 回收站保留：清空本身正是最需要能救回来的操作 */
    next[TRASH_KEY] = db[TRASH_KEY] || [];
    this._write(next, '清空数据');
    return next;
  }
  async healthCheck(){ const db = await this.init();
    return { ok:true, msg:'localStorage 已就绪，'+ (db.orders||[]).length +' 笔订单' }; }
}

/* ==========================================================================
   模块 5 · Store（单一状态树 + 订阅发布）
   ========================================================================== */
/* 筛选作用域（v0.22）
   顶栏筛选栏是同一套 UI，但按页面读写**不同的筛选值**：
   - 'global'：业务统计口径。看板 / 预警 / 回款 / 客户 共用 —— 这几页统计的本就是同一批数据，
     在订单页筛「本月 + 某业务员」后回看板看这批单的汇总，是刻意的联动。
   - 'prod'  ：排产页专用。订单页的筛选**不会**再顺带把排产列表筛掉（v0.22 之前的耦合点：
     prodBaseList 走的就是 filteredOrders，于是订单页一筛，排产页跟着空）。
   两页的筛选栏各存各的值，互不影响；同一时刻只有当前页那一份在生效。 */
/* ---------------------------------------------------------------
   v0.23 · 多维「多选」筛选模型
   · 同一维度内多选 = 「或」；不同维度之间 = 「与」。
   · 空数组 = 该维度不设限（等价于「全部」）。
   · 兼容老写法：'ALL' / '' / null 一律当「不设限」；单个字符串当单选。
   --------------------------------------------------------------- */
function selList(v){
  if(v == null || v === '' || v === 'ALL') return [];
  const a = Array.isArray(v) ? v.slice() : [v];
  return a.filter(x => x != null && x !== '' && x !== 'ALL');
}
function selOn(v, k){ return selList(v).indexOf(k) >= 0; }
function selToggle(v, k){
  const L = selList(v), i = L.indexOf(k);
  if(i >= 0) L.splice(i, 1); else L.push(k);
  return L;
}
function selLabel(opts, v){ const o = opts.find(x => x[0] === v); return o ? o[1] : v; }

/* 各维度的候选值：[值, 显示名] */
const F_STATUS = STATUS.map(s => [s, String(s).slice(3)]);
const F_PAY  = [['todo','未收齐'],['done','已收齐'],['wo','有核销'],['nodep','订金未收'],['dun','超交期未收']];
const F_PROD = [['none','未排产'],['wait','待排产'],['doing','生产中'],['done','已完工'],['pause','已暂停']];
const F_RISK = [['overdue','已逾期'],['d7','7天内'],['t15','15天内'],['normal','正常'],['delivered','已交付'],['shipped','已发货']];
/* 排产页：单条排产记录的两个维度 */
const F_PROW  = [['待排产','待排产'],['生产中','生产中'],['已完工','已完工'],['已暂停','已暂停']];
const F_PRISK = [['overdue','已逾期未完工'],['late','预计晚于交期'],['tight','卡交期'],['normal','正常'],['done','已完工']];

/* 订单的交期维度（互斥）：已交付 > 已发货 > 已逾期 > 7天内 > 15天内 > 正常。
   「已发货」视为交期风险解除（货已出厂），不再计入逾期 —— 风险转到「发货未收款」。 */
function ordDateKey(o){
  if(o && o.actualDelivery) return 'delivered';
  if(orderShipped(o))       return 'shipped';
  if(!o || !o.contractDelivery) return 'normal';
  const d = diffToday(o.contractDelivery);
  if(d < 0) return 'overdue';
  if(d <= 7) return 'd7';
  if(d <= 15) return 't15';
  return 'normal';
}
/* 订单的回款维度（可多值：一笔单可能同时「未收齐 + 订金未收」），命中任一即算匹配 */
function ordPayKeys(o){
  o = o || {};
  const r = [isFullyPaid(o) ? 'done' : 'todo'];
  if(writeOffOf(o) > 0) r.push('wo');
  const dep = Number(o.depositAmount || 0);
  if(dep > 0 && !o.depositPaidDate) r.push('nodep');
  if(!isFullyPaid(o) && o.contractDelivery && diffToday(o.contractDelivery) < 0) r.push('dun');
  return r;
}
/* 订单的排产维度：把该单所有排产记录归成一个整体状态
   优先级 pause > done > doing > wait > none（有异常先报异常） */
function ordProdStateOf(recs){
  if(!recs || !recs.length) return 'none';
  if(recs.some(p => p.opStatus === '已暂停')) return 'pause';
  if(recs.every(p => prodDone(p))) return 'done';
  if(recs.some(p => p.opStatus === '生产中' || p.actualStart || prodPct(p) > 0)) return 'doing';
  return 'wait';
}
function ordProdState(st, o){ return ordProdStateOf((st.data.production || []).filter(p => p.orderId === o.id)); }
/* 订单 -> 排产状态索引（避免逐条重扫 production） */
function prodStateIndex(st){
  const groups = {};
  (st.data.production || []).forEach(p => { (groups[p.orderId] = groups[p.orderId] || []).push(p); });
  const idx = {};
  Object.keys(groups).forEach(k => { idx[k] = ordProdStateOf(groups[k]); });
  return idx;
}

/* ==========================================================================
   v0.43 · 排产单号模型：一个订单可以有多个排产单号
   --------------------------------------------------------------------------
   ★ 唯一可编辑来源 = production 表 —— 一个单号一条排产记录，各自独立
     （车间 / 计划开工完工 / 实际开工完工 / 数量 / 进度 / 状态）。
   ★ orders.moNo 退化为**派生只读快照**（orderMoNoText 的回写结果），
     只为兼容历史数据、CSV 导出、思源推送与看板里对 o.moNo 的既有读取路径；
     任何界面入口都不再直接编辑它 —— syncOrderMoNo 是它唯一的写入者。
   ★ 单号**全局唯一**（跨订单，大小写不敏感）：校验统一走 moNoOwner。
   ========================================================================== */
/* 拆「多单号」文本：兼容 / 、 , ， ; ； 与空白。
   用户习惯用「/」分隔，所以 / 必须认 —— 原来只认「、,，;；」，
   "MO-A/MO-B" 会被当成**一个**单号，这正是「多单号没有各自独立」的根因。 */
function splitMoNos(raw){
  return String(raw == null ? '' : raw)
    .split(/[\/、,，;；\s]+/).map(x => x.trim()).filter(Boolean);
}
/* 该订单的全部排产记录（保持录入顺序） */
function orderProds(st, orderId){
  return (st.data.production || []).filter(p => p.orderId === orderId);
}
/* 该订单的排产单号列表：去空、去重、保序 */
function orderMoNos(st, orderId){
  const seen = Object.create(null), out = [];
  orderProds(st, orderId).forEach(p => {
    const m = String(p.moNo == null ? '' : p.moNo).trim();
    if(m && !seen[m]){ seen[m] = 1; out.push(m); }
  });
  return out;
}
/* 订单上的排产单号文本（多号用「、」）—— 与 syLocalRows 的思源口径一致 */
function orderMoNoText(st, orderId){ return orderMoNos(st, orderId).join('、'); }
/* 全局唯一查询：单号是否已被别的排产记录占用。
   exceptId 用于「编辑自己」时排除自身；大小写不敏感 + 去首尾空白。 */
function moNoOwner(st, moNo, exceptId){
  const k = String(moNo == null ? '' : moNo).trim().toLowerCase();
  if(!k) return null;
  return (st.data.production || []).find(p =>
    p.id !== exceptId && String(p.moNo == null ? '' : p.moNo).trim().toLowerCase() === k) || null;
}
/* 存量重复单号检测（跨订单、跨记录）→ [{ moNo, prods:[...] }]
   ★ 只报告，绝不自动改写数据。 */
function dupMoNos(st){
  const by = new Map();
  (st.data.production || []).forEach(p => {
    const raw = String(p.moNo == null ? '' : p.moNo).trim();
    if(!raw) return;
    const k = raw.toLowerCase();
    if(!by.has(k)) by.set(k, { moNo: raw, prods: [] });
    by.get(k).prods.push(p);
  });
  const out = [];
  by.forEach(v => { if(v.prods.length > 1) out.push(v); });
  return out.sort((a, b) => String(a.moNo).localeCompare(String(b.moNo)));
}
/* 把 orders.moNo 回写成派生快照（唯一写入者）。
   先改内存再落库 —— 调用方通常在 reload 之后紧接着用它，读到旧值会漂移。 */
async function syncOrderMoNo(st, orderId){
  const o = (st.data.orders || []).find(x => x.id === orderId);
  if(!o || !st.source || !st.source.capabilities.write) return;
  const txt = orderMoNoText(st, orderId);
  if(String(o.moNo == null ? '' : o.moNo) === txt) return;
  o.moNo = txt;
  await st.source.update('orders', orderId, { moNo: txt });
}
/* ---------- 签约未排产标记 ----------
   返回 '' | 'need'（已签约 01，还没有任何排产单号 —— 正常流程里该去排产了）
              | 'missing'（状态已推进到排产之后，却一条排产记录都没有 —— 数据缺失） */
function orderPlanFlag(st, o){
  if(!o || orderProds(st, o.id).length) return '';
  const c = stCode(o.status);
  if(c === '01') return 'need';
  if(c === '02' || c === '03' || c === '04' || c === '05') return 'missing';
  return '';
}
function orderPlanTagHTML(st, o){
  const f = orderPlanFlag(st, o);
  if(f === 'need')    return '<span class="tag t-need" title="还没有排产单号 —— 到「排产」页补录，或在订单表单的排产单号里一次填多个">待排产</span>';
  if(f === 'missing') return '<span class="tag t-need" title="状态已推进到排产之后，却没有排产记录 —— 请补录排产单号">缺单号</span>';
  return '';
}
/* 待排产统计（作用于传入的订单集合，缺省 = 全部订单） */
function orderPlanFlags(st, list){
  const arr = Array.isArray(list) ? list : (st.data.orders || []);
  let need = 0, missing = 0;
  arr.forEach(o => { const f = orderPlanFlag(st, o); if(f === 'need') need++; else if(f === 'missing') missing++; });
  return { need: need, missing: missing, total: need + missing };
}
/* ---------- 订单表单里的「排产单号」差异计划 ----------
   planOrderMoNos：纯校验 + 算出「要新增 / 要移除」，**不写库**（有进度的移除会先确认）。
   runOrderMoNos ：按计划落库。两步分开，保证「校验失败不留半截写入」。 */
function planOrderMoNos(st, orderId, text){
  const want = splitMoNos(text);
  const dup = want.filter((m, i) => want.indexOf(m) !== i);
  if(dup.length) return { ok:false, msg:'排产单号重复填写：' + dup.join('、') };
  for(const m of want){
    const owner = moNoOwner(st, m, null);
    if(owner && owner.orderId !== orderId){
      const oo = (st.data.orders || []).find(x => x.id === owner.orderId) || {};
      return { ok:false, msg:'排产单号「' + m + '」已被订单 ' + (oo.orderNo || owner.orderId) + ' 占用' };
    }
  }
  const cur = orderProds(st, orderId);
  const curNos = cur.map(p => String(p.moNo == null ? '' : p.moNo).trim());
  const add = want.filter(m => curNos.indexOf(m) < 0);
  const del = cur.filter(p => {
    const m = String(p.moNo == null ? '' : p.moNo).trim();
    return m && want.indexOf(m) < 0;
  });
  /* 移除已经开工 / 有进度的排产记录要额外确认 —— 那是真在做的活 */
  const busy = del.filter(p => prodPct(p) > 0 || Number(p.doneQty) > 0 || p.actualStart || p.actualFinish);
  if(busy.length && typeof confirm === 'function' &&
     !confirm('以下排产单号已开工 / 有进度，从本单移除会连同其排产记录移入「回收站」：\n\n'
       + busy.map(p => '· ' + p.moNo + '（进度 ' + prodPct(p) + '%）').join('\n')
       + '\n\n确定继续？')){
    return { ok:false, cancel:true, msg:'' };
  }
  return { ok:true, orderId: orderId, add: add, del: del, busy: busy };
}
async function runOrderMoNos(st, plan){
  if(!plan || !plan.ok) return { added:0, removed:0 };
  const orderId = plan.orderId;
  const o = (st.data.orders || []).find(x => x.id === orderId) || {};
  let added = 0, removed = 0;
  for(const m of plan.add){
    const row = {
      id: uid('P'), orderId: orderId, moNo: m, workshop: '',
      planStart: '', planFinish: String(o.contractDelivery || ''),
      actualStart: '', actualFinish: '', qty: 0, doneQty: 0, progressPct: 0,
      opStatus: '待排产', _src: 'manual'
    };
    await st.source.create('production', row);
    added++;
  }
  for(const p of plan.del){ await st.source.remove('production', p.id); removed++; }
  return { added: added, removed: removed };
}
/* ---------- v0.45 · 单号重复提示的「忽略」记忆 ----------
   粒度＝单号本身（规范化：去首尾空白 + 转大写），全局生效 —— 刷新 / 重开页面仍然忽略。
   与排序记忆（ot.sort.v1）、列宽记忆（ot.colw.v1）同一套路：单文件离线场景存 localStorage，
   任何坏 JSON / 非对象值一律退化成空表，绝不让读取把启动打挂。 */
const MOIGN_KEY = 'ot.moignore.v1';
function moIgnCfg(){
  try{
    const o = JSON.parse(localStorage.getItem(MOIGN_KEY) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  }catch(e){ return {}; }
}
function moIgnKey(moNo){ return String(moNo == null ? '' : moNo).trim().toUpperCase(); }
function moIgnoredSet(){
  const s = new Set();
  Object.keys(moIgnCfg()).forEach(k => { if(k) s.add(k); });
  return s;
}
function moIgnored(moNo){ const k = moIgnKey(moNo); return !!k && Object.prototype.hasOwnProperty.call(moIgnCfg(), k); }
function moIgnSave(cfg){ try{ localStorage.setItem(MOIGN_KEY, JSON.stringify(cfg)); }catch(e){} }
function moIgnoreAdd(moNo){
  const k = moIgnKey(moNo); if(!k) return false;
  const cfg = moIgnCfg(); cfg[k] = new Date().toISOString(); moIgnSave(cfg); return true;
}
function moIgnoreDel(moNo){
  const k = moIgnKey(moNo); const cfg = moIgnCfg();
  if(!Object.prototype.hasOwnProperty.call(cfg, k)) return false;
  delete cfg[k]; moIgnSave(cfg); return true;
}

/* 重复排产单号提示条（只在真检出重复时渲染，不占版面）

  const ign = moIgnoredSet();
  const live = dups.filter(d => !ign.has(moIgnKey(d.moNo)));

    + '<div class="dp-list">' + rows

    + '<div class="mo-hint" style="margin-top:4px">排产单号要求全局唯一。这里只做提示，不会自动改写数据 —— 请到对应排产记录里改成不同单号。'

   v0.24 · 思源式条件行筛选
   形态照抄思源数据库的筛选：[字段 ▾] [关系 ▾] [值]，可加多行；
   第 2 行起行首可选「且 / 或」，按顺序从左到右计算。
   为什么换掉 chips：chips 只能表达「等于某个枚举值」，做不了
   「金额 > 10 万」「交期 早于 某日」「本月新签」这类比较，也塞不下更多维度。
   ========================================================================== */
const F_OPS = {
  text:   [['contains','包含'],['notContains','不包含'],['eq','等于'],['ne','不等于'],['empty','为空'],['notEmpty','不为空']],
  enum:   [['in','是其中之一'],['notIn','不是其中之一'],['empty','为空'],['notEmpty','不为空']],
  number: [['eq','='],['ne','≠'],['gt','>'],['gte','≥'],['lt','<'],['lte','≤'],['empty','为空'],['notEmpty','不为空']],
  date:   [['on','等于'],['before','早于'],['after','晚于'],['thisMonth','本月'],['thisQuarter','本季'],
           ['thisYear','本年'],['last30','近 30 天'],['last90','近 90 天'],['empty','为空'],['notEmpty','不为空']]
};
/* 这些运算符不需要填值 */
const F_OP_NOVAL = ['empty','notEmpty','thisMonth','thisQuarter','thisYear','last30','last90'];
/* 相对日期区间（「本月」「近 30 天」这类），基准是今天 */
function fRelRange(op){
  const t = today();
  /* 整段日历区间：筛「本月交期」要能带出本月剩余日期的单，截到今天会漏 */
  if(op === 'thisMonth')   return { from: fmt(new Date(t.getFullYear(), t.getMonth(), 1)), to: fmt(new Date(t.getFullYear(), t.getMonth()+1, 0)) };
  if(op === 'thisQuarter') return { from: fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3, 1)), to: fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3+3, 0)) };
  if(op === 'thisYear')    return { from: fmt(new Date(t.getFullYear(), 0, 1)), to: fmt(new Date(t.getFullYear(), 11, 31)) };
  if(op === 'last30')      return { from: fmt(new Date(t.getTime() - 30*86400000)), to: fmt(t) };
  if(op === 'last90')      return { from: fmt(new Date(t.getTime() - 90*86400000)), to: fmt(t) };
  return null;
}

function filterFieldsOf(scope){ return scope === 'prod' ? PROD_FIELDS : ORDER_FIELDS; }

/* 单个条件求值 */
function condMatch(st, o, c, ctx){
  const F = ctx.fieldOf(c.field);
  if(!F) return true;                       /* 字段不认识 -> 不设限，不让脏条件筛空列表 */
  const raw = F.get(st, o, ctx);
  const L = selList(c.vals);
  /* 需要填值的运算符却没填值 -> 不设限；否则 Number(undefined)=NaN，整个列表会被筛空 */
  if(F_OP_NOVAL.indexOf(c.op) < 0 && !L.length) return true;
  const blank = raw == null || raw === '' || (Array.isArray(raw) && !raw.length);
  const sRaw = String(raw == null ? '' : raw);
  switch(c.op){
    case 'empty':    return blank;
    case 'notEmpty': return !blank;
    case 'in':       if(!L.length) return true;
                     return Array.isArray(raw) ? raw.some(x => L.indexOf(String(x)) >= 0) : L.indexOf(sRaw) >= 0;
    case 'notIn':    if(!L.length) return true;
                     return Array.isArray(raw) ? !raw.some(x => L.indexOf(String(x)) >= 0) : L.indexOf(sRaw) < 0;
    case 'contains':    return !L.length || sRaw.toLowerCase().indexOf(String(L[0]).toLowerCase()) >= 0;
    case 'notContains': return !L.length || sRaw.toLowerCase().indexOf(String(L[0]).toLowerCase()) < 0;
    case 'eq':  return F.type === 'number' ? Number(raw || 0) === Number(L[0]) : sRaw === String(L[0]);
    case 'ne':  return F.type === 'number' ? Number(raw || 0) !== Number(L[0]) : sRaw !== String(L[0]);
    case 'gt':  return Number(raw || 0) >  Number(L[0]);
    case 'gte': return Number(raw || 0) >= Number(L[0]);
    case 'lt':  return Number(raw || 0) <  Number(L[0]);
    case 'lte': return Number(raw || 0) <= Number(L[0]);
    case 'on':     return !blank && sRaw === String(L[0]);
    case 'before': return !blank && sRaw < String(L[0]);
    case 'after':  return !blank && sRaw > String(L[0]);
    default: {
      const R = fRelRange(c.op);
      if(R) return !blank && sRaw >= R.from && sRaw <= R.to;
      return true;
    }
  }
}
/* 多行组合：按顺序从左到右（第 1 行没有 join，从第 2 行起生效） */
function condsMatch(st, o, conds, ctx){
  if(!conds || !conds.length) return true;
  let acc = null;
  for(const c of conds){
    const r = condMatch(st, o, c, ctx);
    if(acc === null) acc = r;
    else acc = (c.join === 'or') ? (acc || r) : (acc && r);
  }
  return acc === null ? true : acc;
}

  return L.length ? String(L[0]) : '';
}

function bindMsel(sel, apply){
  const box = $(sel); if(!box) return;
  const btn = box.querySelector('.msel-btn');
  const inputs = $$(sel + ' input[type=checkbox]');
  if(btn) btn.onclick = e => { e.stopPropagation();
    const was = box.classList.contains('open');
    closeAllMsel();
    box.classList.toggle('open', !was);
    _openMsel = !was ? sel.replace(/^#/, '') : null;
    /* v0.32：浮层里的下拉是 fixed 定位，展开后按按钮位置摆一次 */
    if(!was && box.closest('.cfgwrap')) placeMselPop(box);
  };
  inputs.forEach(cb => cb.onchange = () => apply(inputs.filter(x => x.checked).map(x => x.value)));
  const sr = $(sel + ' .mp-search');
  if(sr) sr.oninput = () => {
    const k = sr.value.trim().toLowerCase();
    $$(sel + ' .msel-pop label').forEach(l => {
      l.style.display = (!k || l.textContent.toLowerCase().indexOf(k) >= 0) ? '' : 'none';
    });
  };

function closeAllMsel(){ $$('.msel').forEach(m => m.classList.remove('open')); _openMsel = null; }
/* v0.32 · 浮层里的多选下拉按按钮位置摆位（fixed，不受浮层 body 的 overflow 裁切）；
   下方放不下就翻到上方 —— 与「i」说明浮层同一套做法。 */
function placeMselPop(box){
  const pop = box.querySelector('.msel-pop'), btn = box.querySelector('.msel-btn');
  if(!pop || !btn) return;
  const r = btn.getBoundingClientRect();
  pop.style.minWidth = Math.round(r.width) + 'px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  pop.style.left = Math.max(8, Math.min(r.left, vw - w - 8)) + 'px';
  let top = r.bottom + 4;
  if(top + h > vh - 8) top = Math.max(8, r.top - h - 4);
  pop.style.top = top + 'px';
}

  if(e.target && e.target.closest && e.target.closest('.msel')) return;
  closeAllMsel();
});

function condRowHTML(st, scope, c, idx){

  const ops = F_OPS[F.type] || F_OPS.text;
  if(!c.op || !ops.some(o => o[0] === c.op)) c = Object.assign({}, c, { op:ops[0][0] });
  const joinSel = idx === 0
    ? '<span class="c-join ph">条件</span>'
    : `<select class="c-join" data-ci="${idx}">
         <option value="and"${c.join !== 'or' ? ' selected' : ''}>且</option>
         <option value="or"${c.join === 'or' ? ' selected' : ''}>或</option></select>`;
  const fieldSel = `<select class="c-field" data-ci="${idx}">` +
    fields.map(f => `<option value="${esc(f.k)}"${f.k === F.k ? ' selected' : ''}>${esc(f.label)}</option>`).join('') + '</select>';
  const opSel = `<select class="c-op" data-ci="${idx}">` +
    ops.map(o => `<option value="${esc(o[0])}"${o[0] === c.op ? ' selected' : ''}>${esc(o[1])}</option>`).join('') + '</select>';
  let valHtml = '<span class="c-none">—</span>';
  if(F_OP_NOVAL.indexOf(c.op) < 0){
    const v0 = selList(c.vals)[0] || '';
    if(F.type === 'enum'){
      const opts = F.opts ? F.opts(st) : [];
      valHtml = mselHTML('cmsel' + idx, selList(c.vals), opts, '选择…', idx, opts.length > 8);
    } else if(F.type === 'number'){
      valHtml = `<input type="number" data-ci="${idx}" data-keep="1" value="${esc(v0)}" placeholder="数值">`;
    } else if(F.type === 'date'){
      valHtml = `<input type="date" data-ci="${idx}" data-keep="1" value="${esc(v0)}">`;
    } else {
      valHtml = `<input type="text" data-ci="${idx}" data-keep="1" value="${esc(v0)}" placeholder="输入内容">`;
    }
  }
  return `<div class="cond" data-ci="${idx}">${joinSel}${fieldSel}${opSel}
    <div class="c-val">${valHtml}</div>
    <button type="button" class="c-del" data-ci="${idx}" title="删除这个条件">×</button></div>`;
}

function resolveRange(f){
  const t = today();
  if(f.preset === 'custom') return { from: f.from || '0000-01-01', to: f.to || '9999-12-31' };
  if(f.preset === 'all')    return { from: '0000-01-01', to: '9999-12-31' };
  /* ★ 日历区间 = 整段（到期末），不是「期初…今天」。
     筛「本月交期」就是为了找出本月要交货 / 要完工的单，而交期大量落在今天之后；
     截到今天会把它们整片漏掉 —— 实测「本月」只出 1 条，自定义 9/1~9/30 才全出。
     只有真正滚动的窗口（近 90 天 / 近 12 月）才以今天为终点。 */
  if(f.preset === 'month')   return { from: fmt(new Date(t.getFullYear(), t.getMonth(), 1)),
                                      to:   fmt(new Date(t.getFullYear(), t.getMonth()+1, 0)) };
  if(f.preset === 'quarter') return { from: fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3, 1)),
                                      to:   fmt(new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3+3, 0)) };
  if(f.preset === 'year')    return { from: fmt(new Date(t.getFullYear(), 0, 1)),
                                      to:   fmt(new Date(t.getFullYear(), 11, 31)) };
  if(f.preset === 'last12')  return { from: fmt(new Date(t.getFullYear()-1, t.getMonth(), t.getDate())), to: fmt(t) };
  if(f.preset === 'last90')  return { from: fmt(new Date(t.getTime() - 90*86400000)), to: fmt(t) };
  return { from: '0000-01-01', to: '9999-12-31' };
}

/* 多维度筛选 + 关键字 + 时间范围。
   scope 不传 = 当前页面的作用域（见 filterScopeOf）→ 订单页与排产页各筛各的。 */
function filteredOrders(st, scope){
  const f = scopeFilters(st, scope), { from, to } = resolveRange(f);
  let list = st.data.orders.slice();
  /* v0.23 多维多选：同一维度内「或」，维度之间「与」；空 = 该维度不设限 */
  const own = selList(f.ownerId), cus = selList(f.customerId);
  const sta = selList(f.status),  pay = selList(f.pay);
  const prd = selList(f.prod),    rsk = selList(f.risk);
  if(own.length) list = list.filter(o => own.indexOf(o.ownerId) >= 0);
  if(cus.length) list = list.filter(o => cus.indexOf(o.customerId) >= 0);
  if(sta.length) list = list.filter(o => sta.indexOf(o.status) >= 0);
  if(pay.length) list = list.filter(o => ordPayKeys(o).some(k => pay.indexOf(k) >= 0));
  if(prd.length){ const pid = prodStateIndex(st); list = list.filter(o => prd.indexOf(pid[o.id] || 'none') >= 0); }
  if(rsk.length) list = list.filter(o => rsk.indexOf(ordDateKey(o)) >= 0);
  /* v0.24 条件行（新 UI 的唯一出口）：与上面的兼容维度是「与」的关系。
     ★ 只有 global 作用域的条件在这里生效 —— 它的字段是**订单级**的。
       排产页那份条件行是**记录级**的（工单号 / 排产状态 / 交期对比 / 计划完工…），
       由 prodViewList 逐条排产记录求值；放到这里算会把订单整片筛空
       （订单上没有 opStatus 这类字段 → 恒不匹配）。 */
  if(f.conds && f.conds.length && scope !== 'prod'){
    const cctx = filterCtx(st, scope);
    list = list.filter(o => condsMatch(st, o, f.conds, cctx));
  }
  if(f.quick){ const QP = quickPlan(f.quick); if(QP) list = list.filter(o => QP.test(st, o)); }
  if(f.keyword){
    const k = f.keyword.toLowerCase();
    /* 关键字匹配：订单号 + 客户（全称/简称/编码）+ 业务员 + 产品摘要
       —— 之前只匹配客户「法定全称」，而订单列表展示的是「简称」，导致用看到的简称搜不到，
          只有打首字命中全称首字时才搜得到。这里补齐 shortName/code，与「客户档案」页搜索口径一致。 */
    const cText = id => {
      const c = st.data.customers.find(x => x.id === id) || {};
      return ((c.name||'') + ' ' + (c.shortName||'') + ' ' + (c.code||'')).toLowerCase();
    };
    const oText = id => {
      const u = st.data.owners.find(x => x.id === id) || {};
      return (u.name || '').toLowerCase();
    };
    list = list.filter(o => (o.orderNo + ' ' + cText(o.customerId) + ' ' + oText(o.ownerId) + ' ' + (o.productSummary||'')).toLowerCase().includes(k));
  }
  if(f.basis === 'sign')     list = list.filter(o => o.signDate && o.signDate >= from && o.signDate <= to);
  if(f.basis === 'delivery') list = list.filter(o => o.contractDelivery && o.contractDelivery >= from && o.contractDelivery <= to);
  if(f.basis === 'pay'){
    list = list.filter(o => orderPaidInRange(o, from, to) > 0);
  }
  return list;
}
function calcKPI(st, orders){
  const basis = st.filters.basis;
  const { from, to } = resolveRange(st.filters);
  const amount   = orders.reduce((a,b) => a + (b.amount||0), 0);
  /* 实收额：按「回款日」口径时按回款实收日归集，其余口径直接用订单实收到账额 */
  const recv     = orders.reduce((a,o) => a + (basis === 'pay' ? orderPaidInRange(o, from, to) : receivedOf(o)), 0);
  const writeoff = orders.reduce((a,o) => a + writeOffOf(o), 0);
  const paid     = recv + writeoff;                       // 已回款（核销口径）：实收 + 已结清手续费
  const unpaid   = Math.max(0, amount - orders.reduce((a,o) => a + paidTotalOf(o), 0));
  const overdue = orders.filter(o => ACTIVE_STATUS(o.status) && o.contractDelivery &&
                    diffToday(o.contractDelivery) < 0 && !o.actualDelivery && !orderShipped(o)).length;
  const active = orders.filter(o => ACTIVE_STATUS(o.status)).length;
  return { amount, count: orders.length, recv, writeoff, paid, unpaid, avg: orders.length ? amount/orders.length : 0, overdue, active };
}
/* v0.40 · 归集「基准日」：把「按签订日 / 合同交期 / 回款实收日」这条 basis 真正落到
   月份分组上。此前 month 维度**恒取 signDate**，而卡片副标题与 filteredOrders 都跟着
   basis 走 —— 切到「合同交期 / 回款实收日」时，x 轴月份仍按签订月，与筛选范围、
   与副标题三方对不上（一套口径三个说法）。
   回款口径取「该单最后一笔回款日」（订金 / 尾款中较晚者），保证 1 单仍只落 1 个月，
   不把一笔订单在多个月里重复计入。 */
function basisDateOf(o, basis){
  if(!o) return '';
  if(basis === 'delivery') return o.contractDelivery || '';
  if(basis === 'pay'){
    /* v0.55：有回款流水的单取「最后一笔到账日」（多笔可能跨月，仍只落 1 个月） */
    const agg = payAggOf(o);
    if(agg && agg.n) return agg.last ? String(agg.last).slice(0, 10) : '';
    const ds = [o.depositPaidDate, o.balancePaidDate].filter(Boolean).sort();
    return ds.length ? ds[ds.length - 1] : '';
  }
  return o.signDate || '';
}
const basisMonthOf = (o, basis) => (basisDateOf(o, basis) || '').slice(0, 7) || '未知';
/* opt.basis 缺省时读看板作用域的 basis（看板即 global），既有两参调用不受影响 */
function aggBy(st, orders, dim, opt){
  const basis = (opt && opt.basis) || ((st.filters && st.filters.basis) || 'sign');
  const keyOf = {
    customer : o => o.customerId,
    owner    : o => o.ownerId,
    status   : o => o.status,
    industry : o => ((st.data.customers.find(c => c.id === o.customerId) || {}).industry || '未分类'),
    month    : o => basisMonthOf(o, basis),
    level    : o => ((st.data.customers.find(c => c.id === o.customerId) || {}).level || '未分级')
  }[dim] || (o => o.customerId);
  const labelOf = {
    customer : k => ((st.data.customers.find(c => c.id === k) || {}).shortName || '未知'),
    owner    : k => ((st.data.owners.find(u => u.id === k) || {}).name || '未分配'),
    status   : k => String(k).slice(3),
    industry : k => k, month: k => k, level: k => k + ' 级'
  }[dim] || (k => k);
  const map = new Map();
  orders.forEach(o => {
    const k = keyOf(o) || '未知';
    if(!map.has(k)) map.set(k, { key:k, label:labelOf(k), amount:0, count:0, paid:0, unpaid:0 });
    const r = map.get(k); r.amount += o.amount; r.count += 1;
  });
  const ids = new Set(orders.map(o => o.id));
  orders.forEach(o => {
    const r = map.get(keyOf(o)); if(!r) return;
    r.paid += paidTotalOf(o); r.unpaid += unpaidOf(o);
  });
  let rows = [...map.values()];
  if(dim === 'month') rows.sort((a,b) => a.key.localeCompare(b.key));
  else if(dim === 'status') rows.sort((a,b) => FLOW.indexOf(a.key) - FLOW.indexOf(b.key));
  else rows.sort((a,b) => b.amount - a.amount);
  return rows;
}

function ownerStats(st, orders, uid){
  const mine = orders.filter(o => (o.ownerId || '未分配') === uid);
  return rollup(st, mine);

function customerStats(st, orders, cid, ix){

function rollup(st, list){
  let amount = 0, paid = 0;
  list.forEach(o => { amount += (o.amount || 0); paid += paidTotalOf(o); });
  const unpaid = Math.max(0, amount - paid);
  const overdue = list.filter(o => ACTIVE_STATUS(o.status) && o.contractDelivery &&
              diffToday(o.contractDelivery) < 0 && !o.actualDelivery && !orderShipped(o)).length;
  return { amount, count:list.length, paid, unpaid, active: list.length, overdue };

/* ---------- v0.13 · 客户等级自动定级（ABC 分类，按销售额占比） ----------
   规则：某客户「订单金额合计」÷「全公司订单金额合计」
        > 20% → A ｜ > 10% → B ｜ 其余 → C
   在每次数据载入入口（reload → loadData）自动重算并写回 level 字段；
   仅对本地可写源（LocalDataSource）持久化，思源/模拟源仅当次会话生效。 */
const LEVEL_A = 0.20, LEVEL_B = 0.10;
function totalSalesAmount(data){
  return (data.orders || []).reduce((s, o) => s + (Number(o.amount) || 0), 0);
}
function customerSalesAmount(data, cid){
  return (data.orders || []).filter(o => o.customerId === cid)
    .reduce((s, o) => s + (Number(o.amount) || 0), 0);
}
function custAutoLevelByShare(share){
  return share > LEVEL_A ? 'A' : share > LEVEL_B ? 'B' : 'C';
}
function custShare(st, c){ const t = totalSalesAmount(st.data); return t > 0 ? customerSalesAmount(st.data, c.id) / t : 0; }
function custAutoLevel(st, c){ return custAutoLevelByShare(custShare(st, c)); }
async function applyAutoLevels(data, src){
  const total = totalSalesAmount(data);
  const tasks = [];
  (data.customers || []).forEach(c => {
    const amt = customerSalesAmount(data, c.id);
    const share = total > 0 ? amt / total : 0;
    const lv = custAutoLevelByShare(share);
    if(c.level !== lv){
      c.level = lv;
      /* 仅本地可写源持久化；思源/模拟源为只读，只在本次会话的内存对象上生效 */
      if(src && src.id === 'local') tasks.push(src.update('customers', c.id, { level: lv }).catch(() => {}));
    }
  });
  if(tasks.length) await Promise.all(tasks);
}
/* 关联引用计数：删除前的完整性检查。
   v0.39：客户一侧改走 custResolveId（id → 编码 → 全称/简称三级解析），
   否则按编码 / 名称关联的历史订单会被判成「无关联」而被放行删除。 */
function refCounts(st, kind, id){
  if(kind === 'customer'){
    const ix = custIndex(st);
    return st.data.orders.filter(o => custResolveId(st, o.customerId, ix) === id).length;
  }
  if(kind === 'owner')    return st.data.orders.filter(o => o.ownerId === id).length;
  return 0;
}

/* ---------- v0.5 · 预警引擎：交期 T-30 / T-15 / 逾期 + 发货未收款 + 到期应收款 ---------- */
function computeAlerts(st){
  const cfg = st.alertCfg || ALERT_DEFAULTS;
  if(cfg.enabled === false) return [];
  const out = [];
  // ① 交期预警：做 appetite 未完工（无实际交付）且状态未到「已完结」
  st.data.orders.forEach(o => {
    if(!ACTIVE_STATUS(o.status) || !o.contractDelivery) return;
    const d = diffToday(o.contractDelivery);
    /* 已交付 / 已发货都不再报交期风险：货已出厂，关注点转到「发货未收款」 */
    if(o.actualDelivery || orderShipped(o)) return;
    if(d < 0){
      out.push({ lvl:'red', type:'交期逾期', orderId:o.id, title:`已过合同交期 ${-d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 当前状态 ${String(o.status).slice(3)}`, days:d });
    }else if(d <= (cfg.lead15 || 15)){
      out.push({ lvl:'orange', type:'临近交期', orderId:o.id, title:`距交期仅 ${d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 请确认排产与发货准备`, days:d });
    }else if(d <= (cfg.lead30 || 30)){
      out.push({ lvl:'blue', type:'交期提醒', orderId:o.id, title:`距交期 ${d} 天 · ${o.orderNo}`,
        meta:`客户 ${custName(st,o.customerId)} ｜ 交期 ${o.contractDelivery} ｜ 提前跟进生产进度`, days:d });
    }
  });
  // ② 已发货未收齐超期：已发货且仍有未收金额，最晚发货日距今超过阈值
  const shippedOrders = st.data.orders.filter(o => ACTIVE_STATUS(o.status) &&
    (stCode(o.status) === '04' || st.data.shipments.some(s => s.orderId === o.id)));
  shippedOrders.forEach(o => {
    const ss = st.data.shipments.filter(s => s.orderId === o.id);
    const lastShip = ss.map(s => s.shipDate).filter(Boolean).sort().pop();
    const un = unpaidOf(o);
    if(un > 0.005 && lastShip){
      const age = -diffToday(lastShip);
      if(age >= (cfg.shipUnpaidDays || 30)){
        out.push({ lvl:'red', type:'发货未收款', orderId:o.id, title:`发货 ${age} 天仍未收齐 · ${o.orderNo}`,
          meta:`发货日 ${lastShip} ｜ 未收 ${money(un)} ｜ 超阈值 ${cfg.shipUnpaidDays} 天`, days:age });
      }
    }
  });
  // ③ 回款逾期 / 待收：以合同交期为收款预期基准，未收齐且临近/超过交期则警示
  st.data.orders.forEach(o => {
    if(o.status === DONE || !ACTIVE_STATUS(o.status) || !o.contractDelivery) return;
    const un = unpaidOf(o);
    if(un <= 0.005) return;
    const d = diffToday(o.contractDelivery);
    if(d < 0){
      out.push({ lvl:'red', type:'回款逾期', orderId:o.id, title:`回款逾期 ${-d} 天 · ${o.orderNo}`,
        meta:`合同交期 ${o.contractDelivery} ｜ 待收 ${money(un)}`, days:d });
    }else if(d <= (cfg.payDueSoon || 7)){
      out.push({ lvl:'orange', type:'回款待收', orderId:o.id, title:`回款${d===0?'今日到期':'T-'+d+' 天'} · ${o.orderNo}`,
        meta:`合同交期 ${o.contractDelivery} ｜ 待收 ${money(un)}`, days:d });
    }
  });
  const rank = { red:0, orange:1, blue:2 };
  return out.sort((a,b) => rank[a.lvl] - rank[b.lvl] || (a.days - b.days));
}
function custName(st, id){
  const c = st.data.customers.find(x => x.id === id);
  return c ? (c.shortName || c.name) : '未知客户';
}
/* ---------- v0.39 · 订单 ↔ 客户 关联解析（可自动匹配） ----------
   订单与客户的关联以 customerId 为准，但历史导入（Excel / U9C / 思源）里这个字段
   可能落成「客户编码」或「客户全称 / 简称」。此前这类订单在客户页一笔都算不到，
   于是「客户订单数」与「实际订单数」对不上。这里按 id → code → name/shortName
   三级解析（沿用 v0.13 思源客户匹配的既有口径），把订单自动归位到正确客户。 */
function custIndex(st){
  const s = st || Store.state;
  const ix = { byId:new Map(), byCode:new Map(), byName:new Map() };
  (s.data.customers || []).forEach(c => {
    if(c.id == null) return;
    ix.byId.set(String(c.id), c.id);
    const code = String(c.code == null ? '' : c.code).trim().toLowerCase();
    if(code) ix.byCode.set(code, c.id);
    if(c.name)      ix.byName.set(String(c.name).trim().toLowerCase(), c.id);
    if(c.shortName) ix.byName.set(String(c.shortName).trim().toLowerCase(), c.id);
  });

}
function custResolveId(st, raw, ix){
  const k = String(raw == null ? '' : raw).trim();
  if(!k) return '';
  const x = ix || custIndex(st);
  return x.byId.get(k) || x.byCode.get(k.toLowerCase()) || x.byName.get(k.toLowerCase()) || '';

/* 一次算好「每家客户的订单数」+「未匹配到客户的订单数」。
   口径：**全部订单**，不受顶部筛选影响（与侧栏「订单」徽标一致）。 */
function custOrderCounts(st){
  const s = st || Store.state;
  const ix = custIndex(s), map = new Map();
  (s.data.customers || []).forEach(c => map.set(c.id, 0));
  let orphan = 0;
  (s.data.orders || []).forEach(o => {
    const id = custResolveId(s, o.customerId, ix);
    if(id) map.set(id, (map.get(id) || 0) + 1); else orphan++;
  });
  return { map: map, orphan: orphan, index: ix };
}
/* 关联不到任何客户档案的订单 —— 只统计上报，绝不自动改写数据 */
function orphanOrders(st){
  const s = st || Store.state;
  const ix = custIndex(s);
  return (s.data.orders || []).filter(o => !custResolveId(s, o.customerId, ix));
}
/* 订金取值：直接取订单字段（重构后收款数据落在订单上） */
function depositOf(st, o){

/* ==========================================================================
   模块 7 · 图表引擎
   ========================================================================== */
const Chart = (() => {
  function showTip(e, html){
    const t = $('#tip'); if(!t) return;
    t.innerHTML = html; t.style.opacity = 1;
    t.style.left = Math.min(e.clientX + 14, innerWidth - 220) + 'px';
    t.style.top  = (e.clientY - 10) + 'px';
  }
  function hideTip(){ const t = $('#tip'); if(t) t.style.opacity = 0; }
  const W = 860, H = 300, PL = 62, PR = 56, PT = 16, PB = 44;
  const moneyShortV = (v, metric) => metric === 'count' ? String(v) : moneyShort(v);
  function bar(rows, metric){
    const n = rows.length, iw = W - PL - PR, ih = H - PT - PB;
    const maxA = Math.max(1, ...rows.map(r => r.amount));
    const maxC = Math.max(1, ...rows.map(r => r.count));
    const step = iw / Math.max(1, n), bw = Math.min(44, step * 0.55);
    const yA = v => PT + ih - (v / maxA) * ih;
    const yC = v => PT + ih - (v / maxC) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    for(let i=0;i<=4;i++){ const y = PT + ih - (ih/4)*i;
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${INK.grid}"/>`;
      s += `<text x="${PL-8}" y="${y+4}" font-size="10" fill="${INK.axis}" text-anchor="end">${moneyShort(maxA/4*i)}</text>`;
      if(metric === 'both') s += `<text x="${W-PR+8}" y="${y+4}" font-size="10" fill="${INK.axis}">${Math.round(maxC/4*i)}</text>`; }
    rows.forEach((r,i) => {
      const cx = PL + step*i + step/2;
      const h = Math.max(2, PT + ih - yA(r.amount));
      s += `<rect x="${cx-bw/2}" y="${yA(r.amount)}" width="${bw}" height="${h}" rx="3" fill="${PALETTE[i % PALETTE.length]}"
             opacity=".94" data-tip="${esc(r.label)}｜金额 ${money(r.amount)}｜订单 ${r.count} 单"><title>${esc(r.label)}</title></rect>`;
      if(metric === 'both'){
        s += `<circle cx="${cx}" cy="${yC(r.count)}" r="4" fill="${INK.ink}"/>`;
        s += `<text x="${cx}" y="${yC(r.count)-9}" font-size="10" fill="${INK.ink}" text-anchor="middle">${r.count}</text>`;
      }
      s += `<text x="${cx}" y="${H-PB+16}" font-size="10.5" fill="${INK.label}" text-anchor="middle">${esc(String(r.label).slice(0,7))}</text>`;
      if(metric !== 'both') s += `<text x="${cx}" y="${yA(r.amount)-6}" font-size="10" fill="${INK.axis}" text-anchor="middle">${moneyShortV(metric==='count'?r.count:r.amount, metric)}</text>`;
    });
    return s + `<line x1="${PL}" y1="${PT+ih}" x2="${W-PR}" y2="${PT+ih}" stroke="${INK.base}"/></svg>`;
  }
  /* vw：可选画布宽（缺省 860）。环形图在宽卡里左右各留下大片死白，
     收窄 viewBox 能让环占满画布 —— 供状态分布卡的「环形」形态使用。 */
  function pie(rows, metric, donut, vw, colors){
    const vwid = vw || W;
    const total = rows.reduce((a,b) => a + (metric === 'count' ? b.count : b.amount), 0) || 1;
    const cx = vwid/2, cy = H/2, R = Math.min(H/2 - 24, Math.min(124, vwid*0.34)), r0 = donut ? R*0.56 : 0;
    let a0 = -Math.PI/2, s = `<svg viewBox="0 0 ${vwid} ${H}">`;
    rows.forEach((r,i) => {
      const v = metric === 'count' ? r.count : r.amount;
      const a1 = a0 + (v/total) * Math.PI * 2;
      const big = (a1-a0) > Math.PI ? 1 : 0;
      const p = [
        `M ${cx+r0*Math.cos(a0)} ${cy+r0*Math.sin(a0)}`,
        `L ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}`,
        `A ${R} ${R} 0 ${big} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}`,
        `L ${cx+r0*Math.cos(a1)} ${cy+r0*Math.sin(a1)}`,
        r0 ? `A ${r0} ${r0} 0 ${big} 0 ${cx+r0*Math.cos(a0)} ${cy+r0*Math.sin(a0)}` : '', 'Z'
      ].join(' ');
      s += `<path d="${p}" fill="${(colors && colors[i]) || PALETTE[i%PALETTE.length]}" stroke="${INK.on}" stroke-width="1.5"
             data-tip="${esc(r.label)}｜${metric==='count'?r.count+' 单':money(r.amount)}｜占比 ${(v/total*100).toFixed(1)}%"><title>${esc(r.label)}</title></path>`;
      a0 = a1;
    });
    if(donut){
      s += `<text x="${cx}" y="${cy-4}" font-size="11" fill="${INK.axis}" text-anchor="middle">合计</text>`;
      s += `<text x="${cx}" y="${cy+18}" font-size="19" font-weight="700" fill="${INK.ink}" text-anchor="middle">${metric==='count'?total+' 单':moneyShort(total)}</text>`;
    }
    return s + '</svg>';
  }
  function line(rows, metric, area){
    const iw = W - PL - PR, ih = H - PT - PB;
    const maxA = Math.max(1, ...rows.map(r => r.amount));
    const maxC = Math.max(1, ...rows.map(r => r.count));
    const step = rows.length > 1 ? iw/(rows.length-1) : 0;
    const X = i => PL + step*i;
    const YA = v => PT + ih - (v/maxA)*ih;
    const YC = v => PT + ih - (v/maxC)*ih;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    /* v0.40：双指标时补右轴刻度。金额与笔数各自归一化到满高，没有右轴就完全读不出
       虚线（笔数）的量级；柱状图一直有右轴，折线/面积图此前漏了。
       同时给两条轴加单位（金额 / 笔数），否则「哪条线读哪根轴」还是得靠猜。 */
    for(let i=0;i<=4;i++){ const y = PT + ih - (ih/4)*i;
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="${INK.grid}"/>`;
      s += `<text x="${PL-8}" y="${y+4}" font-size="10" fill="${INK.axis}" text-anchor="end">${moneyShort(maxA/4*i)}</text>`;
      if(metric === 'both') s += `<text x="${W-PR+8}" y="${y+4}" font-size="10" fill="${INK.axis}">${Math.round(maxC/4*i)}</text>`; }
    if(metric === 'both'){
      s += `<text x="${PL-8}" y="${PT-5}" font-size="10" fill="${INK.axis}" text-anchor="end">金额</text>`;
      s += `<text x="${W-PR+8}" y="${PT-5}" font-size="10" fill="${INK.axis}">笔数</text>`;
    }
    const ptsA = rows.map((r,i) => `${X(i)},${YA(r.amount)}`).join(' ');
    if(area) s += `<polygon points="${PL},${PT+ih} ${ptsA} ${X(rows.length-1)},${PT+ih}" fill="${INK.area}"/>`;
    s += `<polyline points="${ptsA}" fill="none" stroke="${PALETTE[0]}" stroke-width="2.4" stroke-linejoin="round"/>`;
    if(metric === 'both'){
      const ptsC = rows.map((r,i) => `${X(i)},${YC(r.count)}`).join(' ');
      const sumC = rows.reduce((a,r) => a + r.count, 0);
      s += `<polyline points="${ptsC}" fill="none" stroke="${INK.ink}" stroke-width="2" stroke-dasharray="5 4"
             data-tip="订单笔数（右轴）｜区间合计 ${sumC} 笔"><title>订单笔数（右轴）</title></polyline>`;
    }
    rows.forEach((r,i) => {
      s += `<circle cx="${X(i)}" cy="${YA(r.amount)}" r="3.6" fill="${INK.on}" stroke="${PALETTE[0]}" stroke-width="2"
             data-tip="${esc(r.label)}｜金额 ${money(r.amount)}｜订单 ${r.count} 单"><title>${esc(r.label)}</title></circle>`;
      s += `<text x="${X(i)}" y="${H-PB+16}" font-size="10" fill="${INK.label}" text-anchor="middle">${esc(String(r.label).slice(-5))}</text>`;
    });
    return s + `<line x1="${PL}" y1="${PT+ih}" x2="${W-PR}" y2="${PT+ih}" stroke="${INK.base}"/></svg>`;
  }
  /* v0.40 · 阶段条（漏斗）：状态 01→06 本身是一条**有序**流水线，环形图的圆既没有
     起点也没有方向，形态上就把「卡在哪一段」这层信息丢了；环形在宽卡里还两头留白。
     横向阶段条：每段一条，灰色轨道铺满（0 单的段也留着，链条不断），
     右侧直接给出「金额 · 笔数 · 占比」，一张图同时回答「多不多」和「挤在哪」。 */
  function stage(rows, metric, colors){
    const RH = 42, LW = 104, BW = 470, PADT = 16;
    const vw = 860, vh = PADT*2 + rows.length*RH;
    const x0 = LW + 22;
    const valOf = r => metric === 'count' ? r.count : r.amount;
    const maxV  = Math.max(1, ...rows.map(valOf));
    const total = rows.reduce((a,r) => a + valOf(r), 0) || 1;
    let s = `<svg viewBox="0 0 ${vw} ${vh}" role="img" style="display:block;width:100%;height:auto">`;
    rows.forEach((r,i) => {
      const cy = PADT + i*RH + RH/2 - 2;
      const bw = Math.max(3, valOf(r)/maxV * BW);
      const pct = (valOf(r)/total*100).toFixed(1);
      s += `<text x="${LW}" y="${cy+4}" font-size="12" fill="${r.count ? INK.label : INK.axis}" text-anchor="end">${esc(String(r.label).slice(0,7))}</text>`;
      s += `<rect x="${x0}" y="${cy-9}" width="${BW}" height="18" rx="5" fill="${INK.grid}"/>`;
      /* 提示语按当前口径排头 —— 切到「笔数」时先给笔数，占比也跟着口径走，
         否则悬停看到的第一项和图上那根条量的是两回事。 */
      const main = metric === 'count' ? `${r.count} 笔` : money(r.amount);
      const sub  = metric === 'count' ? `金额 ${money(r.amount)}` : `${r.count} 笔`;
      /* 0 单的段用轨道色 —— 视觉上就是空档，不假装「有一点点数据」 */
      const fill = r.count ? ((colors && colors[i]) || PALETTE[i % PALETTE.length]) : INK.grid;
      s += `<rect x="${x0}" y="${cy-9}" width="${bw}" height="18" rx="5" fill="${fill}" opacity=".95"
             data-tip="${esc(String(r.label))}｜${main}｜${sub}｜占比 ${pct}%"><title>${esc(String(r.label))}</title></rect>`;
      s += `<text x="${x0+BW+16}" y="${cy+4}" font-size="11.5" fill="${INK.ink}" style="font-variant-numeric:tabular-nums">${money(r.amount)} · ${r.count} 笔 · ${pct}%</text>`;
    });
    return s + '</svg>';
  }
  function table(rows){
    const total = rows.reduce((a,b) => a + b.amount, 0) || 1;
    return `<div class="tw"><table><thead><tr><th>#</th><th>维度</th><th class="num">订单金额</th>
      <th class="num">占比</th><th class="num">订单数</th><th class="num">已回款</th><th class="num">未回款</th></tr></thead><tbody>` +
      rows.map((r,i) => `<tr><td>${i+1}</td><td><span class="rank ${i<3?'r'+(i+1):''}" style="margin-right:6px">${i+1}</span>${esc(r.label)}</td>
        <td class="num">${money(r.amount)}</td><td class="num">${(r.amount/total*100).toFixed(1)}%</td>
        <td class="num">${r.count}</td><td class="num green">${money(r.paid)}</td>
        <td class="num ${r.unpaid>0?'red':''}">${money(r.unpaid)}</td></tr>`).join('') + '</tbody></table></div>';
  }
  /* v0.40 · 状态专用色：色相语言与列表里的状态标签（见 stTag）对齐 ——
     01 灰 / 02 蓝 / 03 琥珀 / 04 青 / 05 绿 / 06 中灰，只是条形取的是**实色档**：
     stTag 用的是「浅底 + 深字」的标签配色，直接拿来画实心条会太浅（尤其 03，
     纯琥珀 #ffcc00 压在本就浅的 #eef1f6 轨道上对比度太低 —— 那正是本轮要治的
     「看着像空档」）。06 取 --slate，与 solid-slate 那个实底标签严格同值。
     深浅两档由 prefersDark() 在绘制时决定（与 PALETTE 同步换肤，不在构建期写死）。 */
  const ST_COLOR = [
    ['#aeaeb2', '#636366'],   /* 01 已签约     · 浅灰（未启动，比收口更淡一档） */
    ['#007aff', '#0a84ff'],   /* 02 已排产     · 蓝   · = PALETTE[0] */
    ['#ff9500', '#ff9f0a'],   /* 03 已完工待发货 · 橙   · 同琥珀族，实色档保证白底可读 */
    ['#30b0c7', '#40c8e0'],   /* 04 已发货     · 青   · = PALETTE[1] */
    ['#34c759', '#30d158'],   /* 05 已收款     · 绿   · = PALETTE[2] */
    ['#6e6e73', '#98989d']    /* 06 已完结     · 中灰 · = --slate（solid-slate 实底） */
  ];
  /* 按状态在全链中的位置取色；不在链条里的（脏数据）回落通用色板。
     0 单的段返回轨道色 —— 与 stage 里「空段留空档」是同一条规则，
     这样图例色块与图上那根条永远对得上，不会出现「图例有颜色、图上是空的」。 */
  function stColors(rows){
    const d = prefersDark() ? 1 : 0;
    return rows.map((r,i) => {
      if(!r.count) return INK.grid;
      const k = FLOW.indexOf(r.key);
      return k >= 0 ? ST_COLOR[k][d] : PALETTE[i % PALETTE.length];
    });
  }
  return {
    render(el, rows, opt){
      if(!el) return;
      if(!rows.length){ el.innerHTML = '<div class="empty">当前筛选条件下没有数据</div>'; return; }
      const t = opt.type, m = opt.metric;
      if(t === 'table'){ el.innerHTML = table(rows); return; }
      el.innerHTML = `<div class="tw"><div style="min-width:520px">${
        t === 'bar'   ? bar(rows, m) :
        t === 'pie'   ? pie(rows, m, false, opt.vw, opt.colors) :
        t === 'donut' ? pie(rows, m, true, opt.vw, opt.colors) :
        t === 'stage' ? stage(rows, m, opt.colors) :
        t === 'line'  ? line(rows, m, false) : line(rows, m, true)
      }</div></div>`;
      el.querySelectorAll('[data-tip]').forEach(n => {
        n.onmouseenter = e => showTip(e, n.getAttribute('data-tip'));
        n.onmousemove  = e => showTip(e, n.getAttribute('data-tip'));
        n.onmouseleave = hideTip;
      });
    },
    legend(rows, colors){
      const total = rows.reduce((a,b) => a + b.amount, 0) || 1;
      /* v0.40：补「N 笔」—— 只给金额占比时，一笔大单就能把其余分组压成 0.1%，
         看上去「只有一格」，看不出笔数结构。colors 传入时以它为准，
         保证图例色块与图上那根条同色（状态卡传的是语义色）。 */
      return rows.map((r,i) => {
        const sw = (colors && colors[i]) || PALETTE[i % PALETTE.length];
        return `<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${sw};margin-right:5px"></i>${esc(r.label)}
        <span class="muted">${(r.amount/total*100).toFixed(1)}% · ${r.count} 笔</span></span>`;
      }).join('');
    },
    /* v0.40 · 折线 / 面积图的「系列图例」：分类图例说明不了实线与虚线各代表什么，
       月度趋势卡此前干脆没有图例，虚线就成了一条无名线。色值取自当前色板，
       深色档切换后随 render() 一并刷新（不在构建期写死）。 */
    series(){
      return `<span><i style="display:inline-block;width:15px;height:0;border-top:2.4px solid ${PALETTE[0]};vertical-align:middle;margin-right:6px"></i>金额</span>`
           + `<span><i style="display:inline-block;width:15px;height:0;border-top:2px dashed ${INK.ink};vertical-align:middle;margin-right:6px"></i>笔数<span class="muted">（右轴）</span></span>`;
    },
    stColors
  };
})();

const APP_NAME_DEFAULT = APP_NAME;

const APP_NAME_MAX     = 24;

function nameClean(v){
