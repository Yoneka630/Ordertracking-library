  const canEdit = !!(st.source && st.source.capabilities.write);
  let h = '';
  h += `<div class="toolbar">
      ${cfgEntryHTML(st, 'pFilterBtn', 'prod')}
      <div class="seg" id="pView">
        <button data-v="table" class="${pView==='table'?'on':''}">表格</button>
        <button data-v="card"  class="${pView==='card'?'on':''}">卡片</button></div>
      ${pView === 'table' ? pgControlsHTML('prod') : ''}
      ${infoI(`排产记录${canEdit ? '可点行末「编辑」修改进度与日期' : '为只读镜像（当前数据源不可写）'}。关注 <b>计划完工日晚于合同交期</b> 与 <b>逾期未完工</b>。<br>顶栏筛选在本页是<b>独立的</b>（订单页筛了什么，这里照常全显示），点「重置」恢复全部。<br>工具栏可切<b>表格 / 卡片</b>：卡片按<b>合同交期</b>分月，一眼看清每月要交多少单、哪个月吃紧。`)}
      <div class="spacer"></div>
      ${pView === 'card'
        ? sortMenuBtnHTML('pSortBtn', 'prod') + infoI('卡片视图没有列头，用左侧「排序」选字段，同一字段再点一次切换 升序 ↔ 降序。<b>卡片与表格共用同一份排序</b>，切回表格时列头箭头会跟上。')
        : infoI('点击列头排序：同一列再点一次切换 升序 ↔ 降序。右侧 ▲/▼ 就是当前排序状态；未填值的行恒排最后。')}
      <span class="muted" style="font-size:11.5px">${ps.length} 单</span>
    </div>`;
  h += filterDlgHTML(st, 'prod', 'pFilterWrap');
  h += moDupBannerHTML(st);   /* v0.43：单号全局唯一，检出重复时提示（不自动改数据） */
  if(pView === 'card') return h + prodCardViewHTML(st, ps);
  h += `<div class="card"><div class="bd np"><div class="tw tscroll"><table><thead><tr>
    ${thSort('prod','moNo','工单号')}${thSort('prod','orderNo','订单号')}
    ${thSort('prod','customer','客户')}${thSort('prod','opStatus','状态')}
    ${thSort('prod','planStart','计划开工')}${thSort('prod','planFinish','计划完工')}
    ${thSort('prod','progress','进度','num')}${canEdit?'<th>操作</th>':''}</tr></thead><tbody>`;
  const pv = pgSlice('prod', ps);
  pv.forEach(p => {
    const o = st.data.orders.find(x => x.id === p.orderId) || {};
    const c = st.data.customers.find(x => x.id === o.customerId) || {};
    const pct = prodPct(p);
    h += `<tr data-oid="${esc(p.orderId)}" data-pid="${esc(p.id)}"><td><b>${esc(p.moNo)}</b></td><td>${esc(o.orderNo||'')}</td><td>${esc(c.shortName||'')}</td>
      <td><span class="tag t-gray" style="font-size:10.5px">${esc(p.opStatus||'—')}</span></td>
      <td class="muted">${p.planStart||'-'}</td><td class="muted">${p.planFinish||'-'}</td>
      <td class="num"><div class="pbar" style="width:56px;display:inline-block;vertical-align:middle"><i class="${pct>=100?'good':''}" style="width:${pct}%"></i></div> ${pct}%</td>
      ${canEdit?`<td class="ops">${prodDone(p) && !orderDelivered(o) && !orderShipped(o) ? `<button class='btn xs' data-pship='${esc(p.orderId)}'>发货</button>` : ''}<button class='btn xs' data-pedit='${p.id}'>编辑</button></td>`:''}</tr>`;
  });
  if(!pv.length) h += `<tr><td colspan="${canEdit?8:7}" class="empty">当前筛选条件下没有排产记录</td></tr>`;
  return h + '</tbody></table></div></div>' + pagerHTML('prod', ps.length) + '</div>';
}
function bindProd(){
  bindCondPanel('prod');
  bindCfgWrap('pFilterBtn', 'f:prod', 'pFilterWrap');
  $$('#pView button').forEach(x => x.onclick = () => { pView = x.dataset.v; Store.set({}); });
  bindSortClicks();
  setupColResize('prod');   /* v0.35：可拖列宽（仅表格视图） */
  bindPager('prod');        /* v0.35：分页（默认关） */
  $$('[data-pedit]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = Store.state.data.production.find(x => x.id === b.dataset.pedit);
    if(p) openProdForm(p.orderId, p.id);
  });
  /* 工单完工后可直接登记发货，不用先跳到订单详情 */
  $$('[data-pship]').forEach(b => b.onclick = e => { e.stopPropagation(); openShipmentForm(b.dataset.pship); });
  /* v0.43：排产页点行 / 卡片 → 打开**该排产单号**的独立详情（不再是订单详情）；
     详情面板里可以一键跳到所属订单。 */
  $$('#page tbody tr[data-pid], #page .mcard[data-pid]').forEach(el =>
    el.onclick = () => openProdSheet(el.dataset.pid));
  /* v0.45 起：单号重复提示栏的「忽略 / 恢复全部」；
     v0.46 去掉组级「跳转」按钮 —— 组内每个订单号本身就是跳转入口 */
  $$('#page [data-mojump]').forEach(b => b.onclick = e => {
    e.stopPropagation();                        /* 别顺手穿透到行点击上 */
    openProdSheet(b.dataset.mojump);
  });
  $$('#page [data-moign]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const moNo = b.dataset.moign;
    moIgnoreAdd(moNo);
    toast('已忽略排产单号「' + moNo + '」的重复提示');
    Store.set({});
  });
  $$('#page [data-mounig-all]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const n = Object.keys(moIgnCfg()).length;
    moIgnoreClear();
    toast(n ? ('已恢复 ' + n + ' 个单号的重复提示') : '没有已忽略的单号');
    Store.set({});
  });
}

/* ---------- 回款 ---------- */
let payTab = 'todo';
function viewPay(st){
  const ids = new Set(filteredOrders(st).map(o => o.id));
  const list0 = st.data.orders.filter(o => ids.has(o.id));
  const payCnt = (st.data.payments || []).filter(p => ids.has(p.orderId)).length;   /* v0.55：回款流水笔数 */
  const amtSum  = list0.reduce((a,o)=>a+Number(o.amount||0),0);
  const recvSum = list0.reduce((a,o)=>a+receivedOf(o),0);   // 实收：真实到账，剔除手续费
  const wfSum   = list0.reduce((a,o)=>a+writeOffOf(o),0);   // 手续费/尾差核销（已结清）
  const paidSum = recvSum + wfSum;                          // 已回款（核销口径）
  const rateSum = amtSum ? (recvSum / amtSum * 100).toFixed(1) : '0.0';
  const unSum = list0.reduce((a,o)=>a+unpaidOf(o),0);
  const todo = list0.filter(o => !isFullyPaid(o));
  const done = list0.filter(o => isFullyPaid(o));
  const list = payTab === 'todo' ? todo : done;
  const ov = todo.filter(o => o.contractDelivery && diffToday(o.contractDelivery) < 0).reduce((a,o)=>a+unpaidOf(o),0);
  const wk = todo.filter(o => o.contractDelivery && diffToday(o.contractDelivery) >= 0 && diffToday(o.contractDelivery) <= 7).reduce((a,o)=>a+unpaidOf(o),0);

  let h = `<div class="grid kpi">
    <div class="card"><div class="lb">销售总额</div><div class="vl">${money(amtSum)}</div><div class="sb2">${list0.length} 笔订单 · 合同金额</div></div>
    <div class="card"><div class="lb">实收金额</div><div class="vl good">${money(recvSum)}</div><div class="sb2">${done.length} 笔已收齐 · ${payCnt} 笔回款流水 · 实收率 ${rateSum}%</div></div>
    <div class="card"><div class="lb">未收款</div><div class="vl ${unSum?'bad':''}">${money(unSum)}</div><div class="sb2">${todo.length} 笔待收</div></div>
    <div class="card"><div class="lb">手续费 · 尾差核销</div><div class="vl ${wfSum?'warn':''}">${money(wfSum)}</div><div class="sb2">已结清不追收 · 不计入实收</div></div>
    <div class="card"><div class="lb">已逾期未收</div><div class="vl ${ov?'bad':''}">${money(ov)}</div><div class="sb2">交期已过仍欠</div></div>
    <div class="card"><div class="lb">7 日内交期到期</div><div class="vl ${wk?'warn':''}">${money(wk)}</div><div class="sb2">提前沟通</div></div>
  </div>`;
  h += `<div class="card" style="margin-top:14px"><div class="hd">
      <button class="btn sm ${payTab==='todo'?'primary':''}" data-pt="todo">待收款 ${todo.length}</button>
      <button class="btn sm ${payTab==='done'?'primary':''}" data-pt="done">已收齐 ${done.length}</button>
      ${infoI('<b>支持分次回款</b>：点「登记回款」进弹层，可以一笔一笔登记到账（日期 / 金额 / 类型 / 方式 / 流水号各记各的），已收 = 各笔合计，未收 = 订单金额 − 已收。<br>订金与尾款在这里只是<b>款项类型标签</b>；被扣手续费时勾「差额已结清」即可结案，不再计入未收。<br>老订单（只有「订金付款日 / 尾款付款日」两笔）在第一次登记新流水时会自动补成两笔记录，<b>历史金额不变</b>。')}
    </div><div class="bd np"><div class="tw tscroll"><table><thead><tr><th>订单号</th><th>客户</th><th class="num">金额</th>
    <th class="num">已收</th><th class="num">未收</th><th class="num">笔数</th><th>最近回款</th><th>回款率</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>`;
  list.forEach(o => {
    const c = st.data.customers.find(x => x.id === o.customerId) || {};
    const agg = payAggOf(o), n = agg ? agg.n : 0, last = (agg && agg.last) || '';
    const recv = receivedOf(o), un = unpaidOf(o), wo = writeOffOf(o), pct = payPctOf(o);
    let cls, txt;
    if(isFullyPaid(o)){ cls = 'tag solid-slate'; txt = wo > 0 ? '已收齐·差额结清' : '已收齐'; }
    else if(n){ cls = 'tag t-blue'; txt = '部分回款 ' + pct + '%'; }
    else if(Number(o.depositAmount||0) > 0 && !o.depositPaidDate){ cls = 'tag solid-red'; txt = '待收订金'; }
    else if(Number(o.depositAmount||0) === 0 || o.depositPaidDate){ cls = 'tag t-orange'; txt = '待收尾款'; }
    else { cls = 'tag solid-red'; txt = '待收'; }
    const recvCell = `${money(recv)}${wo > 0 ? `<div class="muted" style="font-size:10.5px">核销 ${money(wo)}</div>` : ''}`;
    h += `<tr data-oid="${o.id}"><td><b>${esc(o.orderNo||'')}</b></td><td>${esc(c.shortName||c.name||'')}</td>
      <td class="num">${money(o.amount)}</td>
      <td class="num"><b class="${recv ? 'green' : ''}">${recvCell}</b></td>
      <td class="num">${un ? money(un) : '<span class="muted">—</span>'}</td>
      <td class="num">${n ? n + ' 笔' : '<span class="muted">—</span>'}</td>
      <td>${last || '<span class="muted">未回款</span>'}</td>
      <td class="num">${pct}%</td>
      <td><span class="${cls}">${txt}</span></td>
      <td><button class="btn sm primary" data-pay="${o.id}">登记回款</button></td></tr>`;
  });
  if(!list.length) h += `<tr><td colspan="10" class="empty">暂无记录</td></tr>`;
  return h + '</tbody></table></div></div></div>';
}
/* v0.55 · 回款登记弹层：汇总条 + 流水明细 + 「登记一笔」
   ★ 一笔到账一条记录，想登记几笔就几笔 —— 分批出货分批汇款的标准场景。
   ★ 首次给老订单登记时，ensureLegacyPays 会把「订金 / 尾款付款日」补成两笔流水，
     所以老订单的已收金额不会因为换了口径而变小。 */
function paySummaryHTML(o){
  const amt = Number(o.amount || 0), recv = receivedOf(o), un = unpaidOf(o), pct = payPctOf(o);
  const n = payListOf(o).length;
  return `<div class="payhd">
    <span class="pk"><em>订单金额</em><b>${money(amt)}</b></span>
    <span class="pk"><em>已收</em><b class="green">${money(recv)}</b></span>
    <span class="pk"><em>未收</em><b class="${un ? 'red' : ''}">${money(un)}</b></span>
    <span class="pk"><em>回款</em><b>${n} 笔</b></span>
    <span class="pbar" style="flex:1;min-width:90px"><i class="${pct >= 100 ? 'good' : ''}" style="width:${pct}%"></i></span>
  </div>`;
}
function openPaySheet(orderId, opts){
  const st = Store.state;
  const back = (opts && typeof opts.back === 'function') ? opts.back : null;
  const o = (st.data.orders || []).find(x => x.id === orderId); if(!o) return;
  const c = st.data.customers.find(x => x.id === o.customerId) || {};
  const un = unpaidOf(o), list = payListOf(o);
  const KIND_CLS = { '订金':'t-blue', '尾款':'t-teal', '货款':'t-gray', '其他':'t-gray' };
  const rows = list.length ? list.map((p, i) => `<div class="pp-rec" data-prec="${esc(p.id)}">
      <div class="t"><b>${esc(p.payDate || '-')}</b>
        <span class="tag ${KIND_CLS[p.kind] || 't-gray'}" style="font-size:10.5px">${esc(p.kind || '货款')}</span>
        <b class="green">${money(p.amount)}</b>
        ${i === list.length - 1 && list.length > 1 ? '<span class="muted" style="font-size:10.5px">最近一笔</span>' : ''}
        <span style="flex:1"></span>
        <span class="muted" style="font-size:10.5px">第 ${i + 1} / ${list.length} 笔</span>
        <button class="btn xs del" data-pdel="${esc(p.id)}">删除</button></div>
      <div class="s">${esc(p.method || '未填方式')}${p.ref ? ' ｜ 流水号 ' + esc(p.ref) : ''}${p.note ? ' ｜ ' + esc(p.note) : ''}</div>
    </div>`).join('') : '<div class="empty">还没有回款记录 —— 在下方登记第一笔</div>';
  sheet(`<div class="hd"><h3>回款登记</h3>
      <span class="tag t-gray">${esc(o.orderNo || '')}</span>
      <span class="muted" style="font-size:11.5px">${esc(c.shortName || c.name || '')}</span>
      <div class="spacer"></div><button class="close" data-close>×</button></div>
    <div class="bd">
      ${paySummaryHTML(o)}
      <div class="paylist" id="payListBox">${rows}</div>
      <section class="pp-grp" style="margin-top:16px"><div class="pp-gt">登记一笔回款</div>
        <div class="frow">
          <div class="fld"><label>回款日期</label><input id="pyDate" type="date" value="${fmt(today())}"></div>
          <div class="fld"><label>回款金额</label><input id="pyAmt" type="number" min="0" step="0.01"
            placeholder="本次实际到账" value="${un > 0 ? un : ''}"></div>
        </div>
        <div class="frow">
          <div class="fld"><label>款项类型</label><select id="pyKind">${
            PAY_KINDS.map(k => `<option${k === (list.some(p => p.kind === '订金') ? '货款' : '订金') ? ' selected' : ''}>${k}</option>`).join('')
          }</select></div>
          <div class="fld"><label>回款方式</label><select id="pyMethod">${PAY_METHODS.map(k => `<option>${k}</option>`).join('')}</select></div>
        </div>
        <div class="frow">
          <div class="fld"><label>流水号 / 凭证号</label><input id="pyRef" placeholder="银行流水号，选填"></div>
          <div class="fld"><label>备注</label><input id="pyNote" placeholder="如：第二批发货后到账，选填"></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <button class="btn primary" id="pyAdd">＋ 登记这笔回款</button>
          <span class="muted" style="font-size:11.5px">支持分多次回款：每笔独立记账，累计到账 = 已收</span>
        </div>
      </section>
      ${un > 0 ? `<div class="hint" style="margin-top:2px"><label class="switch"><input type="checkbox" id="pySettle" ${isBalSettled(o) ? 'checked' : ''}> 差额已结清（手续费 / 汇损 / 尾差，勾选后不再计入未收）</label></div>` : ''}
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-close>${back ? '完成 · 返回订单' : '完成'}</button></div>
    </div>`);
  bindClose();
  /* 从订单详情进来时，关掉登记弹层要回到详情，而不是掉回列表页 */
  if(back) $$('#sheet [data-close]').forEach(b => b.onclick = () => { closeSheet(); back(); });
  const addBtn = $('#pyAdd');
  if(addBtn) addBtn.onclick = async () => {
    if(!Store.state.source.capabilities.write){ toast('当前数据源只读，无法登记回款'); return; }
    const date = $('#pyDate').value;
    const val = Number($('#pyAmt').value || 0);
    if(!date){ toast('请选择回款日期'); return; }
    if(!(val > 0)){ toast('回款金额须大于 0'); return; }
    /* v0.56 · 超收只确认、不硬拦：预收下批货款、客户抹零补款都合法，
       但「多打一位数」是分次回款里最容易犯的错 —— 与发货的「超发确认」对齐。 */
    const cur = st.data.orders.find(x => x.id === orderId) || o;
    const amt0 = Number(cur.amount || 0), before = receivedOf(cur);
    if(amt0 > 0 && before + val > amt0 + 0.005
      && !window.confirm('累计回款将超过订单金额：\n\n已收 ' + money(before) + ' + 本次 ' + money(val)
        + ' = ' + money(before + val) + '\n订单金额 ' + money(amt0)
        + '（超 ' + money(before + val - amt0) + '）\n\n仍然登记吗？')) return;
    await addPayment(o.id, { payDate:date, amount:val, kind:$('#pyKind').value,
      method:$('#pyMethod').value, ref:$('#pyRef').value, note:$('#pyNote').value });
    toast('已登记回款 ' + money(val));
    openPaySheet(o.id, opts);
  };
  $$('#sheet [data-pdel]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const p = list.find(x => x.id === b.dataset.pdel); if(!p) return;
    if(!window.confirm('删除这笔回款？\n\n' + (p.payDate || '-') + ' ｜ ' + money(p.amount) + (p.kind ? ' ｜ ' + p.kind : '')
      + '\n\n会移入「回收站」，可在「数据历史」页还原；该单的已收金额同步减少。')) return;
    await deletePayment(o.id, p.id);
    toast('已删除该笔回款');
    openPaySheet(o.id, opts);
  });
  const sw = $('#pySettle');
  if(sw) sw.onchange = async () => {
    await Store.state.source.update('orders', o.id, { balanceSettled: sw.checked });
    await reload();
    toast(sw.checked ? '已标记差额结清，该单不再计入未收' : '已取消差额结清');
    openPaySheet(o.id, opts);
  };
}
function bindPay(){
  $$('[data-pt]').forEach(x => x.onclick = () => { payTab = x.dataset.pt; Store.set({}); });
  $$('#page [data-pay]').forEach(b => b.onclick = () => openPaySheet(b.dataset.pay));
}

/* ---------- 客户档案：新增 / 编辑 / 删除 + 客户维度汇总 ---------- */
let custKW = '', custSort = 'amount';
function custQuery(st){
  /* v0.39 · 客户页是「客户档案」页：行内数字一律按「该客户**全部**订单」算，
     与侧栏「订单」徽标、删除保护提示同口径 —— 不再被顶部订单筛选收窄。
     此前这里用 filteredOrders(st)，于是同一行里「订单数」是筛后口径、
     删除提示与「暂无订单」是全量口径，顶部一有筛选就对不上。
     （顶部筛选作用于看板 / 订单 / 回款 / 排产，不影响本页这四个数字。） */
  const orders = st.data.orders;
  const ix = custIndex(st);
  const cnt = custOrderCounts(st);
  const q = String(custKW || '').trim().toLowerCase();
  const list = st.data.customers.map(c => ({
    c, s: customerStats(st, orders, c.id, ix), n: cnt.map.get(c.id) || 0
  })).filter(x => {
    if(!q) return true;
    const c = x.c;
    return ((c.name||'')+(c.shortName||'')+(c.code||'')+(c.industry||'')+(c.contact||'')+(c.phone||'')).toLowerCase().includes(q);
  });
  const cmp = {
    amount  : (a,b) => b.s.amount - a.s.amount,
    count   : (a,b) => b.n - a.n,
    unpaid  : (a,b) => b.s.unpaid - a.s.unpaid,
    name    : (a,b) => String(a.c.name||'').localeCompare(String(b.c.name||''), 'zh')
  }[custSort] || ((a,b) => b.s.amount - a.s.amount);
  list.sort((a,b) => (String(a.c.active) === 'false' ? 1 : 0) - (String(b.c.active) === 'false' ? 1 : 0) || cmp(a,b));
  return list;
}

/* ==========================================================================
   v0.47 · 产品库（客户产品 / 供应商产品）
   --------------------------------------------------------------------------
   设计取舍（写下来免得以后又推翻）：

      所以客户产品可挂一条 supplierProductId 作「首选对应供应商产品」，需要多工厂就多建几条供应商产品。
   ② 两表字段结构完全一致 → 列表 / 详情 / 表单三套渲染共用一个 kind 参数，只有「归属对象」和
      「哪个型号算主型号」不同（客户侧主型号 = 客户型号，供应商侧主型号 = 工厂型号）。
   ③ 订购状态一变就刷 statusAt（订购状态更新时间）。这是需求里唯一的时间字段，
      不做手工编辑 —— 手填的时间最终一定会和真实状态脱节。
   ④ 包装资料是产品上的结构化字段（pack*），包装文件走 FileStore 元数据数组（packingFiles），
      附件白名单是 FileStore 的可选参数，订单附件仍只收 PDF / JPG / PNG。
   ========================================================================== */
const ORDER_STATUS = ['在售','待定','停产','打样中'];
const PKG_EXT = ['pdf','jpg','jpeg','png','xls','xlsx','doc','docx','csv','zip'];
const PROD_KIND = {
  cust: { res:'custProducts', label:'客户产品', ownLabel:'归属客户', ownRes:'customers',
          mdlA:'客户型号', mdlB:'工厂型号', priceLabel:'客户价' },
  supp: { res:'supplierProducts', label:'供应商产品', ownLabel:'归属供应商', ownRes:'suppliers',
          mdlA:'工厂型号', mdlB:'客户型号', priceLabel:'采购价' }
};
const pk = kind => PROD_KIND[kind] || PROD_KIND.cust;
/* ---------- v0.52 · 产品库排序记忆（刷新 / 重开页面后顺序不变）----------
   为什么不复用 ot.sort.v1：那个键由 sortSave() 整体重写（遍历 SORT_DEF 的 ord/prod），
   产品库的 cust/supp 混进去会被下一次订单页排序顺手抹掉。单开一个键，互不干扰。
   存 { cust:{k,d}, supp:{k,d} }，d 用 ±1（与产品库内部口径一致，不转 asc/desc）。 */
const PSORT_KEY = 'ot.psort.v1';
const PSORT_FIELDS = ['sku','custModel','factoryModel','owner','price','moq','orderStatus','statusAt'];
const PSORT_DEF = { cust:{ k:'statusAt', d:-1 }, supp:{ k:'statusAt', d:-1 } };
function psortCfg(){
  try { const o = JSON.parse(localStorage.getItem(PSORT_KEY) || '{}'); return (o && typeof o === 'object') ? o : {}; }
  catch(e){ return {}; }
}
/* 字段仍在表内 + 方向是 ±1 才认，脏数据 / 旧版本一律退回默认（默认按更新时间倒序） */
function psortInit(kind){
  const d = PSORT_DEF[kind] || PSORT_DEF.cust, o = psortCfg()[kind];
  if(o && typeof o === 'object' && PSORT_FIELDS.includes(o.k) && (o.d === 1 || o.d === -1)) return { k:o.k, d:o.d };
  return { k:d.k, d:d.d };
}
function psortSave(kind){
  const o = psortCfg();
  o[kind] = { k:PROD_SORT[kind].k, d:PROD_SORT[kind].d };
  try { localStorage.setItem(PSORT_KEY, JSON.stringify(o)); } catch(e){}
}
const PROD_SORT = { cust: psortInit('cust'), supp: psortInit('supp') };
const PROD_KW   = { cust:'', supp:'' };
const colwKind  = kind => kind === 'cust' ? 'cprod' : 'sprod';

/* ---------- v0.48 · 表格文字对齐（整表切换 + 记忆）----------
   只影响产品库两张表（table[data-al]），订单表 / 排产表维持原样。

function prodOwner(st, p, kind){

/* ---------- 缩略图：FileStore 里存的是二进制，URL 得异步取 ----------
   列表里先渲染空容器，取到再回填 src；取不到就留「无图」占位，不弹错。
   URL 缓存在 _thumbCache 里 —— 同一张图在一次会话内只建一次 objectURL。 */
const _thumbCache = new Map();
async function hydrateThumbs(root){
  const box = root || document;
  const imgs = Array.prototype.slice.call(box.querySelectorAll ? box.querySelectorAll('img[data-img]') : []);
  for(const el of imgs){
    const fid = el.getAttribute('data-img');
    if(!fid) continue;
    if(_thumbCache.has(fid)){ el.src = _thumbCache.get(fid); continue; }
    try{
      const u = await FileStore.url(fid);
      if(u){ _thumbCache.set(fid, u); if(el.isConnected) el.src = u; }
      else if(el.isConnected) el.classList.add('pimg-broken');
    }catch(e){ if(el.isConnected) el.classList.add('pimg-broken'); }
  }
}

/* ==========================================================================
   v0.51 · 产品图放大预览
   --------------------------------------------------------------------------
   三处可点：列表缩略图（.pthumb）、详情画廊主图（.pmain）、表单图片网格（.pimg）。
   遮罩节点第一次点图时才建 —— 不用这个功能的人不多一个 DOM。
   ★ 捕获阶段拦截：列表行本身绑了 tr.onclick = 打开详情，冒泡阶段再拦就两件事都发生了。
   ★ 只认已经有 src 的图：缩略图是异步 hydrate 的，src 还没回来就什么都不做（别开空遮罩）。
   ★ 表单图片上的「设主图 / 删除」是 button，直接放行，保持原职责。
   ========================================================================== */
let _zoomOn = false;
function zoomBox(){
  let box = document.getElementById('imgZoom');
  if(box) return box;
  box = document.createElement('div');
  box.id = 'imgZoom';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-label', '产品图预览');
  box.innerHTML = '<button class="iz-x" type="button" title="关闭（Esc）">×</button>'
    + '<img alt="产品图"><div class="iz-tip">点击任意处或按 Esc 关闭</div>';
  document.body.appendChild(box);
  box.addEventListener('click', () => closeZoom());
  return box;
}
function openZoom(src){
  if(!src) return;
  const box = zoomBox(), img = box.querySelector('img');
  if(!img) return;
  img.src = src;
  box.classList.add('on');
  _zoomOn = true;
  document.body.classList.add('zooming');
}
function closeZoom(){
  const box = document.getElementById('imgZoom');
  if(!box || !_zoomOn) return;
  box.classList.remove('on');
  const img = box.querySelector('img');
  if(img) img.removeAttribute('src');    /* 断开引用，objectURL 归 _thumbCache 管 */
  _zoomOn = false;
  document.body.classList.remove('zooming');
}
document.addEventListener('click', e => {
  const t = e.target;
  if(!t || !t.closest || _zoomOn) return;      /* 遮罩开着时由它自己的 click 关 */
  const z = t.closest('.pthumb, .pmain, .pimg');
  if(!z || t.closest('button')) return;
  const img = z.querySelector('img');

/* 分隔符嗅探：Excel 复制出来的是制表符（TSV），另存文件的多半是逗号。
   只看首行（表头）——表头几乎不会带引号，逗号/制表符计数可靠。
   注意 2 列 TSV 首行只有 **1 个** tab，阈值写 2 会把它误判成 CSV。 */
function sniffDelim(text){
  const first = String(text == null ? '' : text).split(/\r?\n/)[0] || '';
  const tab = (first.match(/\t/g) || []).length;
  const comma = (first.match(/,/g) || []).length;
  return (tab > 0 && tab >= comma) ? '\t' : ',';
}
function csvParse(text, delim){
  const s = String(text == null ? '' : text).replace(/^\ufeff/, '');
  const d = delim || sniffDelim(s);
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){
      if(c === '"'){ if(s[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c === '"') q = true;
    else if(c === d){ row.push(cur); cur = ''; }
    else if(c === '\n'){ row.push(cur); cur = ''; rows.push(row); row = []; }
    else if(c === '\r'){ /* 忽略，next 处理 \n */ }
    else cur += c;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const csvNorm = h => String(h == null ? '' : h)
  .replace(/[（(][^）)]*[）)]/g, '')
  .replace(/[\s*＊]/g, '')

   --------------------------------------------------------------------------

   ② UTF-16：Excel「Unicode 文本」带 BOM，按 UTF-8 解全是控制字符；
   ③ **已经丢字的**：Excel「CSV(逗号分隔)」用系统 ANSI 保存时，泰文/中文直接写成
      0x3F —— 文件里就是问号，任何解码器都救不回来。只能提示改用「粘贴导入」。

const IMP_ENC_KEY = 'ot.impenv.v1';
const IMP_ENCS = [
  { v:'auto',        t:'自动探测' },
  { v:'utf-8',       t:'UTF-8' },
  { v:'gbk',         t:'GBK / ANSI（简体中文）' },
  { v:'big5',        t:'BIG5（繁体中文）' },
  { v:'windows-874', t:'TIS-620 / Windows-874（泰文）' },
  { v:'utf-16le',    t:'UTF-16 LE（Excel「Unicode 文本」）' }

function decodeText(ab, enc){
  const u8 = new Uint8Array(ab);
  const pick = (e, off) => {
    try{ return { text: new TextDecoder(e).decode(off ? u8.subarray(off) : u8), enc: e }; }
    catch(_){ return null; }
  };
  if(enc && enc !== 'auto'){
    const r = pick(enc, 0);
    if(r) return r;
  }
  if(u8.length > 2 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return pick('utf-8', 0);
  if(u8.length > 2 && u8[0] === 0xFF && u8[1] === 0xFE) return pick('utf-16le', 2);
  if(u8.length > 2 && u8[0] === 0xFE && u8[1] === 0xFF) return pick('utf-16be', 2);
  try{ return { text: new TextDecoder('utf-8', { fatal:true }).decode(u8), enc:'utf-8' }; }catch(e){}
  /* 无 BOM 的 UTF-16：ASCII 文本在高字节位上全是 0x00 */
  const n = Math.min(u8.length, 400), pairs = Math.floor(n / 2);
  let zero = 0;
  for(let i = 1; i < n; i += 2){ if(u8[i] === 0) zero++; }
  if(pairs > 10 && zero / pairs > 0.6) return pick('utf-16le', 0) || pick('utf-8', 0);

     给一点减分（分数越低越优），这样 874 文件不会被 GBK 抢走。 */
  let best = null;
  ['gbk','big5','windows-874'].forEach(e => {
    const r = pick(e, 0); if(!r) return;
    const bad  = (r.text.match(/\uFFFD/g) || []).length;
    const ctrl = (r.text.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g) || []).length;
    const thai = (r.text.match(/[\u0E00-\u0E7F]/g) || []).length;
    const sc = bad * 10 + ctrl * 10 - Math.min(thai, 40) * 0.2;
    if(!best || sc < best.sc) best = { text: r.text, enc: e, sc };
  });
  if(best) return { text: best.text, enc: best.enc };
  return pick('utf-8', 0) || { text:'', enc:'utf-8' };
}

  };
}
/* 纯文本导入：解析 → 计划 → 确认 → 写库。文件路径与粘贴路径共用这一份。 */
async function importProdText(kind, text, opt){
  const o = opt || {};
  const st = Store.state, C = pk(kind);
  if(!st.source || !st.source.capabilities.write){ toast('当前数据源只读，无法导入'); return { ok:0, skip:0, add:0 }; }
  const rows = csvParse(text);
  if(rows.length < 2){ toast('CSV 里没有数据行（只有表头？）'); return; }
  const map = prodCSVHeaderMap(rows[0]);
  if(map.sku == null){ toast('表头缺少「SKU」列，请用导出的模版填写'); return; }
  if(map.owner == null){ toast('表头缺少「' + C.ownLabel + '」列，无法确定归属'); return; }
  const ownList = st.data[C.ownRes] || [];
  const findOwn = name => {
    const q = String(name || '').trim().toLowerCase();
    if(!q) return null;
    return ownList.find(x => [x.name, x.shortName, x.code].filter(Boolean)
      .some(v => String(v).trim().toLowerCase() === q)) || null;
  };
  const plans = [], errs = [];
  rows.slice(1).forEach((r, idx) => {
    const line = idx + 2;                       /* 表头算第 1 行 */
    const cell = k => map[k] == null ? '' : String(r[map[k]] == null ? '' : r[map[k]]).trim();
    const sku = cell('sku').toUpperCase();
    if(!sku){ errs.push('第 ' + line + ' 行：SKU 为空'); return; }
    const own = findOwn(cell('owner'));
    if(!own){ errs.push('第 ' + line + ' 行：找不到' + C.ownLabel + '「' + cell('owner') + '」'); return; }
    const cur = cell('currency').toUpperCase();
    const payload = {
      sku,
      name: cell('name'),
      custModel: cell('custModel'),
      factoryModel: cell('factoryModel'),
      price: numOr(cell('price'), 0),
      currency: CUR_SYM[cur] ? cur : 'CNY',
      moq: numOr(cell('moq'), 0),
      unit: cell('unit') || 'pcs',
      orderStatus: ORDER_STATUS.includes(cell('orderStatus')) ? cell('orderStatus') : '在售',
      packMethod: cell('packMethod'), packQty: cell('packQty'), packSize: cell('packSize'),
      packCbm: cell('packCbm'), packNet: cell('packNet'), packGross: cell('packGross'),
      packMaterial: cell('packMaterial'), packMark: cell('packMark'), packNote: cell('packNote'),
      remark: cell('remark'),
      updatedAt: fmt(today())
    };
    payload[kind === 'cust' ? 'customerId' : 'supplierId'] = own.id;
    /* v0.52：定位已有记录的口径跟着「允许重复」一起改。
       客户产品 → SKU 全局唯一，命中即更新（老行为不变）。
       供应商产品 → 按「SKU + 归属供应商」定位，且**只有唯一命中才更新**；
                    命中多条说明用户是有意重复录入的，这时一律追加，不去猜该覆盖哪一条。 */
    let exist = null;
    const same = (st.data[C.res] || []).filter(x => String(x.sku || '').trim().toUpperCase() === sku);
    if(kind === 'cust') exist = same[0] || null;
    else { const hits = same.filter(x => x.supplierId === own.id); exist = hits.length === 1 ? hits[0] : null; }
    plans.push({ line, sku, payload, exist });
  });
  if(!plans.length){ toast('没有可导入的行' + (errs.length ? '：' + errs[0] : '')); return { ok:0, skip:errs.length, add:0, errs }; }
  const addN = plans.filter(p => !p.exist).length, updN = plans.length - addN;
  if(o.confirm !== false && !confirm('将导入 ' + plans.length + ' 行（新增 ' + addN + ' / 更新 ' + updN + '）'
    + (errs.length ? '\n另有 ' + errs.length + ' 行会被跳过：\n' + errs.slice(0, 5).join('\n') : '')
    + '\n\n继续导入？')) return { ok:0, skip:0, add:0, errs, canceled:true };
  let okN = 0;
  for(const p of plans){
    try{
      if(p.exist){
        /* 与表单同口径：状态没变保留原 statusAt，变了才刷今天（导入不该把更新时间全刷平） */
        const oldSt = p.exist.orderStatus || '';
        p.payload.statusAt = (p.exist.statusAt && oldSt === p.payload.orderStatus)
          ? p.exist.statusAt : fmt(today());
        await st.source.update(C.res, p.exist.id, p.payload);
      }else{
        p.payload.id = uid(kind === 'cust' ? 'CP' : 'SP');
        p.payload.createdAt = fmt(today());
        p.payload.statusAt = fmt(today());
        p.payload.images = []; p.payload.packingFiles = [];
        await st.source.create(C.res, p.payload);
      }
      okN++;
    }catch(e){ errs.push('第 ' + p.line + ' 行写入失败：' + ((e && e.message) || e)); }
  }
  await reload();
  toast('导入完成：成功 ' + okN + ' 行' + (errs.length ? '，跳过 / 失败 ' + errs.length + ' 行（明细见控制台）' : ''));
  if(errs.length) console.warn('[产品导入] 未导入的行：\n' + errs.join('\n'));
  return { ok: okN, skip: errs.length, add: addN, upd: updN, errs };
}

/* ==========================================================================
   v0.49 · 导入预览弹层
   --------------------------------------------------------------------------
   为什么不直接读文件就导：编码猜错一次就是「泰文变乱码 / 变问号」的脏数据落库。
   弹层里能切编码、看前 4 行原始文本，**用户一眼就能判断「这是乱码」**；
   再来一条粘贴通道 —— 剪贴板是 UTF-16，不经过任何文件编码，泰文一个字都不会丢。
   ========================================================================== */
function openImportSheet(kind, seed){
  const C = pk(kind);
  const conf = seed || {};
  const s = {
    ab: conf.ab || null,
    text: conf.text || '',
    enc: IMP_ENC,
    name: conf.name || '',
    paste: !!conf.paste,
    real: ''
  };
  if(s.ab){
    const r = decodeText(s.ab, s.enc);
    s.text = r.text; s.real = r.enc;
  }
  const draw = () => {
    const rows = csvParse(s.text);
    const dataN = Math.max(0, rows.length - 1);
    const head = rows[0] || [];
    const map = prodCSVHeaderMap(head);
    const q = impQuality(s.text);
    const delim = sniffDelim(s.text) === '\t' ? '制表符（TSV）' : '逗号（CSV）';
    const miss = [];
    if(map.sku == null) miss.push('SKU');
    if(map.owner == null) miss.push(C.ownLabel);
    const canGo = dataN > 0 && !miss.length;
    const preview = String(s.text).split(/\r?\n/).slice(0, 4).join('\n');
    const encLabel = s.ab ? (s.enc === 'auto' ? ('自动 → ' + (s.real || '?').toUpperCase()) : s.enc.toUpperCase())
                          : '剪贴板文本（无需编码）';
    const warn = [];
    if(q.replaceN) warn.push('⚠ 有 ' + q.replaceN + ' 个字符解不出来（替换符 �）：<b>编码选错了</b>，换下面的编码再看预览。');
    if(q.qRuns) warn.push('⚠ 发现 ' + q.qRuns + ' 处连续问号：如果原文是泰文 / 中文，说明<b>源文件已被 Excel 以 ANSI 编码保存，字在保存时就丢了</b>（任何编码都还原不了）。'
      + '请改用 <b>粘贴表格导入</b>，或把 Excel 另存为「CSV UTF-8」再导。');
    /* 编码错了表头也会跟着乱，这时再喊「缺少 SKU」只会误导 —— 先让用户把编码选对 */
    if(miss.length && !q.replaceN) warn.push('⚠ 表头缺少：' + miss.join(' / ') + ' —— 请用导出的模版填写。');
    if(!dataN) warn.push('⚠ 没有识别到数据行（只有表头或空内容）。');
    if(s.paste) warn.push('在 Excel 里选中区域 <b>Ctrl+C</b>，然后点下面的输入框 <b>Ctrl+V</b> —— 走剪贴板，泰文/中文不会丢。');
    if(kind === 'supp') warn.push('供应商产品库<b>允许 SKU 重复</b>：按「SKU + 归属供应商」定位，唯一命中才更新；已有多条同组合时本次<b>追加</b>，不会覆盖。');

    sheet(`<div class="hd"><h3>导入${C.label}</h3>
        <span class="tag t-gray">${esc(s.name || (s.paste ? '粘贴导入' : 'CSV'))}</span>
        <div class="spacer"></div><button class="close" data-close>×</button></div>
      <div class="bd">
        <div class="frow">
          <div class="fld"><label>编码</label>
            ${s.ab ? `<select id="impEnc">${IMP_ENCS.map(e => `<option value="${e.v}"${e.v === s.enc ? ' selected' : ''}>${esc(e.t)}</option>`).join('')}</select>`
                   : `<input readonly value="${esc(encLabel)}">`}
          </div>
          <div class="fld"><label>分隔符</label><input readonly value="${esc(delim)}"></div>
        </div>
        ${s.paste ? `<div class="fld"><label>粘贴表格内容（首行是表头）</label>
          <textarea id="impPaste" rows="6" placeholder="在 Excel 里选中含表头的区域 → Ctrl+C → 点这里 → Ctrl+V">${esc(s.text)}</textarea></div>` : ''}
        <div class="fld"><label>预览（前 4 行 · 已识别 ${dataN} 行数据）</label>
          <textarea readonly rows="5" id="impPrev">${esc(preview || '（空）')}</textarea></div>
        <div id="impWarn">${warn.map(w => `<div class="hint" style="margin:8px 0 0">${w}</div>`).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn primary" id="impGo"${canGo ? '' : ' disabled'}>导入 ${dataN} 行</button>
          <button class="btn" data-close>取消</button>
          <div class="spacer"></div>
          <span class="muted" style="font-size:12px;align-self:center">编码：${esc(encLabel)}</span>
        </div>
      </div>`, { wide:true });
    bindClose();
    const sel = $('#impEnc');
    if(sel) sel.onchange = e => {
      const enc = e.target.value;
      const r = decodeText(s.ab, enc);
      s.enc = enc; s.text = r.text; s.real = r.enc;
      /* 只记住「真能解开」的编码：切到 GBK 看出一屏乱码后取消，下次不该还被 GBK 套住 */
      if(enc === 'auto' || !impQuality(s.text).replaceN) impEncSave(enc);
      draw();
    };
    const ta = $('#impPaste');
    if(ta){
      ta.oninput = e => { s.text = e.target.value; refreshImp(); };
      setTimeout(() => { try{ ta.focus(); }catch(_){} }, 60);
    }
    const go = $('#impGo');
    if(go) go.onclick = async () => {
      if(go.disabled) return;
      go.disabled = true;
      const res = await importProdText(kind, s.text, { confirm:false });
      if(res && res.ok) closeSheet();
      else go.disabled = false;
    };
  };
  /* 粘贴输入时只刷新预览与按钮，不整层重绘 —— 重绘会把光标踢出 textarea */
  const refreshImp = () => {
    const rows = csvParse(s.text);
    const map = prodCSVHeaderMap(rows[0] || []);
    const dataN = Math.max(0, rows.length - 1);
    const prev = $('#impPrev'); if(prev) prev.value = String(s.text).split(/\r?\n/).slice(0, 4).join('\n');
    const go = $('#impGo');
    if(go){
      go.disabled = !(dataN > 0 && map.sku != null && map.owner != null);
      go.textContent = '导入 ' + dataN + ' 行';
    }
    const q = impQuality(s.text);
    const box = $('#impWarn');
    if(box){
      const w = [];
      if(q.replaceN) w.push('⚠ 有 ' + q.replaceN + ' 个字符解不出来（替换符 �）：编码可能选错了。');
      if(q.qRuns) w.push('⚠ 发现 ' + q.qRuns + ' 处连续问号：源文件可能已在保存时丢了泰文 / 中文，请直接从 Excel 复制粘贴。');
      if(map.sku == null) w.push('⚠ 表头缺少：SKU');
      if(map.owner == null) w.push('⚠ 表头缺少：' + C.ownLabel);
      box.innerHTML = w.map(x => `<div class="hint" style="margin:8px 0 0">${x}</div>`).join('');
    }
  };
  draw();
}
/* 文件入口：只负责读出字节，剩下交给预览弹层（编码切换 / 问号体检都在那儿） */
async function importProdCSV(kind, file){
  let ab = null;
  try{ ab = await file.arrayBuffer(); }
  catch(e){ toast('文件读取失败：' + ((e && e.message) || e)); return; }
  openImportSheet(kind, { ab, name: file.name });
}

function bindProdIO(kind){
  const btn = $('#pIOBtn'), menu = $('#pIOMenu'), inp = $('#pImpFile');
  if(!btn || !menu) return;
  btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };

    const b = e.target && e.target.closest ? e.target.closest('[data-io]') : null;
    if(!b) return;
    menu.hidden = true;
    const act = b.dataset.io;
    if(act === 'tpl') exportProdCSV(kind, 'tpl');

    else if(act === 'imp' && inp) inp.click();
    else if(act === 'paste') openImportSheet(kind, { paste:true });
  };
  if(inp) inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.value = '';
    if(!f) return;
    if(!/\.(csv|txt|tsv)$/i.test(f.name)){ toast('请选择 .csv / .txt 文件（Excel 请先「另存为」）'); return; }
    await importProdCSV(kind, f);
  };
  /* 点空白处收起菜单：document 上只绑一次，靠 hidden 判断，不会重复处理 */
  if(!bindProdIO._doc){
    bindProdIO._doc = true;
    document.addEventListener('click', () => {
      const m = $('#pIOMenu'); if(m && !m.hidden) m.hidden = true;
    });
  }
}

/* v0.48：拖拽 / 粘贴进来的 File 常常没有扩展名（剪贴板截图 name 可能是 image.png，
   也可能整个是空的）。FileStore 是按扩展名判白名单的，先补一个能过检的名字。 */
function fitFile(raw, defExt){
  if(!raw) return null;
  const nm = String(raw.name || '').trim();
  if(nm && /\.[a-z0-9]{2,6}$/i.test(nm)) return raw;
  const t = String(raw.type || '');
  const ext = /png/i.test(t) ? 'png' : /jpe?g/i.test(t) ? 'jpg' : defExt;
  const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const base = (nm || ('粘贴-' + stamp)).replace(/[\\/:*?"<>|]/g, '_');
  try{ return new File([raw], base + '.' + ext, { type: t || 'application/octet-stream' }); }
  catch(e){ try{ raw.name = base + '.' + ext; }catch(_){} return raw; }
}
/* 选择 / 拖拽 / 粘贴三个来源共用的灌图入口 —— 三处各写一份太容易走偏 */
async function pimgAddFiles(f, list){
  const arr = Array.prototype.slice.call(list || []);
  let ok = 0;
  for(const raw of arr){
    const file = fitFile(raw, 'png');
    const bad = FileStore.check(file, ['jpg','jpeg','png']);
    if(bad){ toast(bad); continue; }
    try{
      const meta = await FileStore.put(file, ['jpg','jpeg','png']);
      if(!Array.isArray(f.values.images)) f.values.images = [];
      f.values.images.push(meta.id);
      f.pendingNew.push(meta.id);
      ok++;
    }catch(e){ toast('上传失败：' + ((e && e.message) || e)); }
  }
  if(ok) redrawPImg(f);
  return ok;
}
function bindPImg(f){

/* ==========================================================================
   v0.48 · 产品表单的粘贴上传（Ctrl+V 直接进）
   --------------------------------------------------------------------------
   只处理「剪贴板里带文件」的粘贴：纯文字粘贴（在备注 / 箱唛里打字）一律放过 ——
   全局监听最怕的就是抢走输入框的 Ctrl+V。
   去向：鼠标最后停在哪块就进哪块（PROD_PASTE_ZONE）；没停留记录时按类型分流 ——
   图片进产品图、其它文件进包装文件。
   ========================================================================== */
let PROD_PASTE_ZONE = null;   /* 'img' | 'pk' | null */
function bindProdPaste(){
  if(bindProdPaste._on) return;
  bindProdPaste._on = true;
  document.addEventListener('mouseover', e => {
    const t = e.target;
    if(!t || !t.closest) return;
    if(t.closest('#pkBox') || t.closest('#pkDrop') || t.closest('#pkFormPrev')) PROD_PASTE_ZONE = 'pk';
    else if(t.closest('#pimgGrid')) PROD_PASTE_ZONE = 'img';
  });
  document.addEventListener('paste', e => {
    const f = FORM;
    if(!f || f.kind !== 'product') return;
    const grid = $('#pimgGrid'), box = $('#pkBox');
    if(!grid && !box) return;
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    const files = [];
    for(let i = 0; i < items.length; i++){
      if(items[i].kind === 'file'){
        const fl = items[i].getAsFile();
        if(fl) files.push(fl);
      }
    }
    if(!files.length) return;      /* 纯文字 → 不拦，交给输入框 */
    e.preventDefault();
    const imgs = files.filter(x => /^image\/(png|jpe?g)$/i.test(x.type || ''));
    const others = files.filter(x => imgs.indexOf(x) < 0);
    Promise.resolve().then(async () => {
      if(!grid || PROD_PASTE_ZONE === 'pk'){
        if(box) await pkAddFiles(f, files);
        else if(grid) await pimgAddFiles(f, imgs);
        return;
      }
      if(imgs.length) await pimgAddFiles(f, imgs);
      if(others.length && box) await pkAddFiles(f, others);
    });
  });
}

      };
      if(isCust){
        payload.customerId = v.customerId;
        payload.supplierProductId = v.supplierProductId || '';
      }else{
        payload.supplierId = v.supplierId;
      }
      if(id){ await src.update(C.res, id, payload); }
      else{
        payload.id = uid(isCust ? 'CP' : 'SP');
        payload.createdAt = fmt(today());
        await src.create(C.res, payload);
      }
      /* 保存成功才真正删掉被移除的图 / 文件 */
      for(const fid of (FORM.orphans || [])){ try{ await FileStore.del(fid); }catch(e){} }
      FORM.orphans = []; FORM.pendingNew = [];
      toast(C.label + '已' + (id ? '更新' : '新增') + '：' + sku
        + (p && oldSt && oldSt !== nextSt ? '（状态 ' + oldSt + ' → ' + nextSt + '）' : ''));
      return true;
    }
  });
}

  const kw = (SUPP_KW || '').trim().toLowerCase();
  let list = (st.data.suppliers || []).map(s => ({
    s, n: (st.data.supplierProducts || []).filter(p => p.supplierId === s.id).length
  }));

    list = list.filter(x => [x.s.name, x.s.shortName, x.s.code, x.s.category, x.s.contact, x.s.phone]
      .filter(Boolean).join(' ').toLowerCase().includes(kw));

  list.sort((a, b) =>
    (String(a.s.active) === 'false' ? 1 : 0) - (String(b.s.active) === 'false' ? 1 : 0)
    || b.n - a.n
    || String(a.s.name || '').localeCompare(String(b.s.name || ''), 'zh-CN'));

/* v0.32 · 配置型浮层的打开态：'' | 'alert' | 'f:global' | 'f:prod'。
   跨 render 保留 —— 改一个阈值 / 加一行筛选都会触发重渲染，浮层不该自己关掉。 */
let cfgOpen = '';
const ALERT_LEVELS = [['ALL','全部'],['red','严重'],['orange','警示'],['blue','提醒']];
const PAY_ALERT_TYPES = ['发货未收款','回款逾期','回款待收'];
const DLV_ALERT_TYPES = ['交期逾期','临近交期','交期提醒'];
const LVL_RANK = { red:0, orange:1, blue:2 };
function sortAlerts(rows){
  return rows.slice().sort((a,b) =>
    (LVL_RANK[a.lvl] - LVL_RANK[b.lvl]) || ((b.days || 0) - (a.days || 0)));
}
function alertColHTML(title, ico, hint, rows){
  const n = rows.length, r = rows.filter(x => x.lvl === 'red').length;
  let h = `<div class="card"><div class="hd"><h3>${ico} ${title}</h3>
      <span class="tag ${r ? 'solid-red' : n ? 't-gray' : 't-green'}">${n} 条${r ? ` · 严重 ${r}` : ''}</span>
      <div class="spacer"></div>
      <span class="muted" style="font-size:11.5px">${hint}</span></div><div class="bd np">`;
  if(!n){ return h + '<div class="empty">🎉 当前没有该类预警</div></div></div>'; }
  sortAlerts(rows).forEach(a => {
    const badge = a.lvl === 'red' ? '<span class="tag solid-red">严重</span>'
      : a.lvl === 'orange' ? '<span class="tag t-orange">警示</span>' : '<span class="tag t-blue">提醒</span>';

        <div class="ttl">${esc(a.title)}</div>

  });

}

/* ---------- 桌面通知 ---------- */
function askNotify(test){
  if(typeof Notification === 'undefined'){ toast('当前环境不支持桌面通知'); return; }
  if(Notification.permission === 'denied'){ toast('桌面通知已被浏览器拒绝，请在站点权限里手动允许'); return; }
  Notification.requestPermission().then(p => {
    const granted = (p === 'granted');
    if(granted !== Store.state.alertCfg.notify || test) Store.setAlert({ notify: granted });
    if(granted){
      if(test) new Notification(APP_NAME, { body:'桌面通知已开启：交期 / 回款预警将在此弹出', tag:'ot-test' });
      else toast('桌面通知已开启');
    }else toast('未授权桌面通知');
  });
}
function fireDesktopAlerts(){
  const st = Store.state;
  if(st.alertCfg.enabled === false || st.alertCfg.notify !== true) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const red = (Store.alerts || []).filter(a => a.lvl === 'red');
  if(!red.length) return;
  try{
    new Notification(APP_NAME + ' · 严重预警 ' + red.length + ' 条', {
      body: red.slice(0, 5).map(a => '· ' + a.title).join('\n'),
      tag: 'ot-alert-' + fmt(today())
    });
  }catch(e){}
}

function openShipmentForm(orderId, shipId){
  const st = Store.state;
  const o = st.data.orders.find(x => x.id === orderId); if(!o) return;
  const editing = shipId && st.data.shipments.find(s => s.id === shipId);
  const def = editing || {};
  /* v0.55：分批出货 —— 表单抬头就把「已发多少、还能发多少」摆出来，
     新增时金额默认 = 剩余未发（而不是整单金额，那是最容易把分批记成整单的坑）。 */
  const agg = shipAggOf(o), remain = Math.max(0, Number(o.amount || 0) - agg.amount);
  const hint = `订单金额 ${money(o.amount)} ｜ 已发 ${money(agg.amount)}（${agg.n} 个出货单号）`
    + ` ｜ 剩余可发 ${money(remain)}`
    + (agg.nos.length ? `<div style="margin-top:4px" class="muted">已登记单号：${agg.nos.map(n => esc(n)).join('、')}</div>` : '');
  openForm({
    kind:'shipment', orderId, title: editing ? '编辑发货 / 物流' : '登记发货', subtitle: o.orderNo || '',
    extra: `<div class="hint" style="margin:12px 0 0">${hint}</div>`,
    tip: '支持分批出货：每次出货登记一条记录、各自一个出货单号，详情页会显示「已发 / 剩余 / 进度」。发货后请同步关注回款计划是否到期：发货超期仍未收齐会进「预警中心」的严重档。',
    fields: [
      { key:'shipNo', label:'发货单号', ph:'留空自动生成', rule:'code',
        help:'一票货一个单号；分批出货就分行登记，各单号全局唯一' },
      { key:'shipDate', label:'发货日期', type:'date', required:true },
      { key:'qty', label:'发货数量', type:'number', ph:'件 / 台' },
      { key:'amount', label:'发货金额', type:'number', required:true, ph:'元',
        help:'本批出货对应的货款；新增时默认等于剩余未发金额' },
      { key:'carrier', label:'承运方', type:'select', opts: CARRIERS.map(v => ({ v, t:v })) },
      { key:'logisticsNo', label:'物流单号' },
      { key:'signDate', label:'签收日期', type:'date' }
    ],
    values: { shipNo: def.shipNo || '', shipDate: def.shipDate || fmt(today()), qty: def.qty != null ? def.qty : 1,
      amount: def.amount != null ? def.amount : remain,
      carrier: CARRIERS.indexOf(def.carrier) >= 0 ? def.carrier : CARRIERS[0],
      logisticsNo: def.logisticsNo || '', signDate: def.signDate || '' },
    onReady: () => wireCarrierManage(),
    onSave: async v => {
      /* v0.56 · 自动单号要自己避开已占用的号段：以前生成撞号后直接弹「单号已被占用」，
         而用户压根没填单号 —— 明明系统自己撞的，却要用户自己想一个。现在循环重生成。 */
      let shipNo = String(v.shipNo || '').trim();
      if(!shipNo){
        const base = 'DN-' + fmt(today()).replace(/-/g,'').slice(2);
        for(let i = 0; i < 40; i++){
          const cand = base + String(Math.floor(Math.random()*900+100));
          if(!shipNoOwner(cand, editing ? editing.id : null)){ shipNo = cand; break; }
        }
      }
      const dup = shipNoOwner(shipNo, editing ? editing.id : null);
      if(dup){ toast('出货单号已被占用：' + dup.shipNo); return false; }
      const payload = { shipNo, shipDate:v.shipDate, qty:Number(v.qty||0),
        amount: Number(v.amount||0), logisticsNo: String(v.logisticsNo||'').trim(),
        carrier: v.carrier, signDate: v.signDate || '' };
      /* 累计发货金额（含本次）——超发只确认、不硬拦：改单加量 / 赠品 / 运费都会让金额对不上 */
      const total = agg.amount - Number((editing && editing.amount) || 0) + payload.amount;
      const amt0 = Number(o.amount || 0), over = total - amt0;
      if(over > 0.005 && !window.confirm('累计发货金额将超出订单金额：\n\n累计 ' + money(total)
        + ' > 订单 ' + money(amt0) + '（超 ' + money(over) + '）\n\n仍然保存吗？')) return false;
      if(editing){ await st.source.update('shipments', editing.id, payload); }
      else { await st.source.create('shipments', Object.assign({ id: uid('S'), orderId, _src:'manual' }, payload)); }
      /* v0.29：登记发货顺手把订单推进到「已发货」，省掉再手动改一次状态。
         只从「签约 / 排产 / 完工待发货」推进；已收款、已完结的单不回退。 */
      const cur = st.data.orders.find(x => x.id === orderId);
      const adv = shipAdvanceTo(cur);
      if(adv && st.source.capabilities.write)
        await st.source.update('orders', orderId, { status: adv });
      closeSheet(); await reload(); openOrder(orderId);
      const tail = over > 0.005 ? '（累计已超订单金额 ' + money(over) + '）'
        : (total + 0.005 < amt0 ? '（部分发货，剩余未发 ' + money(amt0 - total) + '）' : '（已发完）');
      toast((editing ? '发货记录已更新：' : '已登记发货：') + shipNo + tail);
      return false;
    }
  });
}
/* 承运方可新增 / 删除：在发货表单的承运方下拉旁挂两个按钮，动态改选项并同步回 FORM.values。 */
function wireCarrierManage(){
  const sel = document.querySelector('#formBody [data-k="carrier"]'); if(!sel) return;
  if(sel.parentNode.querySelector('.carrier-ops')) return;
  const ops = document.createElement('span');
  ops.className = 'carrier-ops';
  ops.style.cssText = 'margin-left:8px;display:inline-flex;gap:4px';
  ops.innerHTML = `<button type="button" class="btn" style="padding:2px 8px;font-size:11px" data-cop="add">＋承运方</button>`
    + `<button type="button" class="btn" style="padding:2px 8px;font-size:11px" data-cop="del">删除</button>`;
  sel.parentNode.appendChild(ops);
  ops.querySelector('[data-cop="add"]').onclick = () => {
    const name = (window.prompt('新增承运方名称：') || '').trim();
    if(!name) return;
    if(CARRIERS.indexOf(name) >= 0){ sel.value = name; FORM.values.carrier = name; toast('承运方已存在'); return; }
    CARRIERS.push(name); saveCarriers();
    sel.innerHTML = CARRIERS.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = name; FORM.values.carrier = name;
    toast('已新增承运方：' + name);
  };
  ops.querySelector('[data-cop="del"]').onclick = () => {
    if(CARRIERS.length <= 1){ toast('至少保留一个承运方'); return; }
    const cur = sel.value;
    if(!window.confirm('删除承运方「' + cur + '」？已有的发货记录仍保留该名称，仅从下拉选项中移除。')) return;
    const i = CARRIERS.indexOf(cur); if(i >= 0) CARRIERS.splice(i, 1); saveCarriers();
    sel.innerHTML = CARRIERS.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = CARRIERS[0]; FORM.values.carrier = CARRIERS[0];
    toast('已删除承运方：' + cur);
  };
}

   排产信息收敛成五项、进度不再由数量推算之后，这里再进一步：
   「进度」**完全**由状态映射（见 PROD_STATUS_PCT），不再手填 —— 表单里那个框常置灰，
   切状态即自动跳到对应值。prodStatusPct 是纯函数（表单回填 / 保存 / 展示共用一份口径，
   杜绝两处漂移），prodFormSyncProgress 只负责把结果同步回表单控件。 */
function prodStatusPct(opStatus, pctIn){
  const s = String(opStatus || '');
  if(Object.prototype.hasOwnProperty.call(PROD_STATUS_PCT, s)) return PROD_STATUS_PCT[s];
  /* 没有状态 / 未知状态（老数据）：退回手填值，越界封顶归零 */
  const f = Number(pctIn);
  if(!isFinite(f)) return 0;
  return Math.max(0, Math.min(100, Math.round(f)));
}
function prodFormSyncProgress(f){
  if(!f || !f.values) return;
  const s = String(f.values.opStatus || '');
  f.values.progressPct = prodStatusPct(s, f.values.progressPct);
  const box = $('#formBody [data-fld="progressPct"]'); if(!box) return;
  const inp = box.querySelector('[data-k="progressPct"]'); if(!inp) return;
  inp.disabled = true;                       /* v0.46：只读，跟随状态自动变 */
  box.classList.toggle('locked', true);
  /* 只在真的不一致时才写 value —— 避免多余重排 / 光标跳动 */
  const want = (f.values.progressPct == null) ? '' : String(f.values.progressPct);
  if(String(inp.value) !== want) inp.value = want;
}

/* ---------- 排产记录：新增 / 编辑 / 删除 ----------
   思源过来的排产记录只有单号 + 日期，没有数量，所以进度会显示 0%。
   v0.46 起录入项为五项，进度**完全由状态决定**（见 PROD_STATUS_PCT）。 */
function openProdForm(orderId, prodId, backTo){
  const st = Store.state;
  const o = st.data.orders.find(x => x.id === orderId); if(!o) return;
  const editing = prodId && st.data.production.find(p => p.id === prodId);
  const def = editing || {};
  const cur = editing ? prodPct(editing) : '';
  openForm({
    kind:'production', orderId, title: editing ? '编辑排产记录' : '新增排产记录', subtitle: o.orderNo || '',
    tip: `一条排产记录只有 <b>排产单号 / 状态 / 计划开工 / 计划完工 / 进度</b> 五项。<br><b>进度由状态自动决定</b>（只读、不用填）：待排产 0%、生产中 30%、已暂停 50%、已完工 100%。<br>状态「已完工」＝该单已完工，<b>不再判为逾期</b>。<br>排产单号<b>全局唯一</b>（跨订单也不许重复），留空会自动生成一个。`,
    fields: [
      { key:'moNo', label:'排产单号（工单号）', ph:'留空自动生成', rule:'code' },
      { key:'opStatus', label:'状态', type:'select', opts: PROD_STATUS.map(v => ({ v, t:v })),
        help:'决定进度：待排产 0%、生产中 30%、已暂停 50%、已完工 100%（进度只读跟随状态）' },
      { key:'planStart', label:'计划开工', type:'date' },
      { key:'planFinish', label:'计划完工', type:'date' },
      { key:'progressPct', label:'完成进度（按状态自动）', type:'number', ph:'自动',
        help:'只读：由状态决定 —— 待排产 0%、生产中 30%、已暂停 50%、已完工 100%' }
    ],
    values: {
      /* v0.43：新增时**不**预填订单上的单号 —— 单号全局唯一，
         预填会造成第二条记录与第一条撞号而被拦下。留空即自动生成。 */
      moNo: def.moNo || '',
      planStart: def.planStart || '', planFinish: def.planFinish || o.contractDelivery || '',
      /* v0.46：编辑时按**展示口径**预填进度（= 该状态对应的固定值），
         带出来的就是它此刻显示的那个百分比，保存即完成口径迁移。 */
      progressPct: cur === '' ? '' : cur,
      opStatus: PROD_STATUS.indexOf(def.opStatus) >= 0 ? def.opStatus : '生产中'
    },
    onRedraw: f => prodFormSyncProgress(f),
    onSave: async v => {
      const moNo = String(v.moNo || '').trim()
        || ('MO-' + fmt(today()).replace(/-/g,'').slice(2) + Math.floor(Math.random()*900+100));
      /* v0.43：排产单号全局唯一（跨订单）—— 编辑自己时排除自身。冲突不落库。 */
      const clash = moNoOwner(st, moNo, editing ? editing.id : null);
      if(clash){
        const co = st.data.orders.find(x => x.id === clash.orderId) || {};
        toast('排产单号「' + moNo + '」已被订单 ' + (co.orderNo || clash.orderId) + ' 占用，请换一个');
        return false;   /* 不关表单，光标留给用户改单号 */
      }
      const opStatus = v.opStatus || '生产中';
      const payload = {
        moNo,
        planStart: v.planStart || '', planFinish: v.planFinish || '',
        opStatus,
        /* v0.46：进度口径只剩一处 —— 完全由状态决定（0 / 30 / 50 / 100）。 */
        progressPct: prodStatusPct(opStatus, v.progressPct),
        /* v0.45 起「车间 / 实际开工 / 实际完工 / 生产数量 / 已完成数量」不再在界面出现；
           保存时一律归零，避免旧的数量口径在背后继续改写进度（隐藏的第二条口径）。 */
        workshop: '', actualStart: '', actualFinish: '', qty: 0, doneQty: 0
      };
      let keepId = editing ? editing.id : null;
      if(editing){ await st.source.update('production', editing.id, payload); }
      else {
        const row = Object.assign({ id: uid('P'), orderId, _src:'manual' }, payload);
        keepId = row.id;
        await st.source.create('production', row);
      }
      closeSheet(); await reload();
      await syncOrderMoNo(st, orderId);      /* v0.43：回写订单上的派生快照 */
      if(backTo === 'prod' && keepId) openProdSheet(keepId);
      else openOrder(orderId);
      toast(editing ? '排产记录已更新：' + moNo : '已新增排产记录：' + moNo);
      return false;
    }
  });
}
async function deleteProd(orderId, prodId){
  if(!window.confirm('确定删除该排产记录？\n会移入「回收站」，可在「数据历史」页还原；订单的回款数据不受影响。')) return;
  await Store.state.source.remove('production', prodId);
  closeSheet(); await reload();
  await syncOrderMoNo(Store.state, orderId);   /* v0.43：单号没了，快照跟着更新 */
  openOrder(orderId);
  toast('排产记录已移入回收站');
}

/* ---------- v0.43 · 排产单号独立详情面板 ----------
   「一订单 N 单号」之下，每个排产单号都要有自己的独立视图：
   主体是这个工单（车间 / 计划 / 实际 / 数量 / 进度 / 交期对比），

    : '<span class="muted">本单仅此一个排产单号</span>';

  /* v0.45：排产信息只保留「排产单号 / 状态 / 计划开工 / 计划完工 / 进度」五项。 */
  const infoRows = row('排产单号', ros('<b>' + esc(p.moNo || '—') + '</b>'))
    + row('状态', ros('<span class="tag t-gray">' + esc(p.opStatus || '—') + '</span>'))
    + row('计划开工', ros(p.planStart || '—'))
    + row('计划完工', ros(p.planFinish || '—'))
    + row('进度', ros('<span class="pbar" style="width:120px;display:inline-block;vertical-align:middle">'
        + '<i class="' + (pct >= 100 ? 'good' : '') + '" style="width:' + pct + '%"></i></span> ' + pct + '%'));

  const orderRows = row('订单号', ros('<span class="mo-jump" data-oidjump="' + esc(o.id) + '" title="打开订单详情">'
      + esc(o.orderNo || '—') + '</span>'))
    + row('客户', ros(esc(c.shortName || c.name || '—')))
    + row('合同交期', ros(esc(o.contractDelivery || '—')

    + row('订单状态', ros('<span class="' + stTag(o.status) + '">' + String(o.status || '').slice(3) + '</span>'))

  sheet('<div class="hd"><h3>' + esc(p.moNo || '排产记录') + '</h3>'
      + '<span class="tag t-gray">' + esc(p.opStatus || '—') + '</span>'
      + '<span class="muted" style="font-size:11.5px">' + esc(o.orderNo || '')
      + (c.shortName ? ' · ' + esc(c.shortName) : '') + '</span>'
      + '<div class="spacer"></div><button class="close" data-close>×</button></div>'
    + '<div class="bd">'
      + '<div class="odetop">'
        + kpi('计划完工', p.planFinish || '—')
        + kpi('进度', pct + '%')
        + kpi('状态', p.opStatus || '—')
        + '<span class="spacer"></span>'
        + (canEdit
            ? '<button class="btn sm" id="pEdit">编辑</button>'
              + (prodDone(p) && !orderDelivered(o) && !orderShipped(o)

    + '</div>', { wide: true });
  bindClose();

  $$('#sheet [data-psheet]').forEach(b => b.onclick = () => openProdSheet(b.dataset.psheet));
  $$('#sheet [data-oidjump]').forEach(b => b.onclick = () => openOrder(b.dataset.oidjump));
  const pe = $('#pEdit'); if(pe) pe.onclick = () => openProdForm(p.orderId, p.id, 'prod');
  const ps = $('#pShip'); if(ps) ps.onclick = () => openShipmentForm(p.orderId);
  const pd = $('#pDel'); if(pd) pd.onclick = () => deleteProd(p.orderId, p.id);
}


/* ---------- 清空数据（删演示数据、改用真实数据的入口） ---------- */
async function clearData(keepMaster){
  const src = Store.state.source;
  if(!src || !src.capabilities.write) return { ok:false, msg:'当前数据源只读，无法清空' };
  if(src.clearAll) await src.clearAll(keepMaster);
  if(FileStore.clear) await FileStore.clear();
  /* 附件二进制已被物理清掉，回收站里的文件引用要一并抹掉，
     否则从回收站还原回来的订单会挂着指向不存在文件的断链附件。 */
  if(src.dropTrashFiles) await src.dropTrashFiles().catch(()=>{});
  await reload();
  const c = Store.state.data.customers.length;
  return { ok:true, msg: (keepMaster
    ? (c ? '已清空业务数据，保留 ' + c + ' 家客户档案' : '已清空业务数据（客户档案为空，请先建档）')
    : '已清空全部数据') + '　清空前已自动存档，可在「数据历史」页回滚。' };
}

/* ---------- 只清演示种子数据（_src === 'demo'）----------
   与 clearData 的区别：这是「精准清理」，只删自动生成的演示数据，
   用户手工录入（_src 非 demo）与其他来源的数据一律保留。拉取真实数据前调用。 */
async function syDropDemoData(){
  const st = Store.state, src = st.source;
  if(!src || !src.capabilities.write) return { ok:false, n:0, msg:'当前数据源只读，无法清理' };
  const isDemo = x => !!(x && x._src === 'demo');
  let n = 0;
  for(const t of ['orders','customers','production','shipments','payments','followups']){
    const targets = (st.data[t] || []).filter(isDemo);
    if(!targets.length) continue;
    if(t === 'orders'){ for(const r of targets) for(const a of (r.attachments || [])){ try{ await FileStore.del(a.id); }catch(e){} } }
    /* 走硬删除：清理演示数据不是误操作，不该灌进回收站 */
    try{
      if(typeof src.hardRemove === 'function') n += await src.hardRemove(t, targets.map(r => r.id));
      else for(const r of targets){ try{ await src.remove(t, r.id); n++; }catch(e){} }
    }catch(e){}
  }
  if(n) await reload();
  return { ok:true, n };
}
/* ==========================================================================
   v0.37 · 思源双向同步（专用同步库 · 8 列扁平表）
   --------------------------------------------------------------------------
   设计（整体替换 v0.18 那套，目的：降复杂度）：
     · 一个专用数据库承载「订单级扁平表」，8 列，订单号为唯一键：
       主键（订单号）/ 客户 / 排产单号 / 货款 / 交货日期 / 状态 / 产品摘要 / 业务员。
     · 建库、建列由工作台一键完成。v0.19.3 记录的「思源写接口在本机静默失效」
       经在 3.8.4 上实测，真实原因是打在了**不存在的端点**上
       （/api/av/addAttributeViewColumn → 404；真名是 addAttributeViewKey）。
       另外两个必须记住的形状：行值写入用 **itemID**（rowID 自 3.7.0 起移除）、
       读行取 **data.view**（不是 data.av，后者的 rows 恒为空）。
     · 冲突不自动合并，一律列出来交人决定。
     · 旧的导出 HTML 导入器 / SiyuanDataSource 适配器 / 列别名表 / 节流退避 /
       断点续做缓存 / 双 id 解析，全部移除。
   ========================================================================== */

/* 同步 schema：key = 工作台字段，col = 思源列名，type = 思源列类型。
   列名与业务字段一一对应、零翻译；前导「主键」是思源自动生成的行标签列，不可改名。 */
const SY_SCHEMA = [
  { key:'orderNo',  col:'主键',     type:'block'  },
  { key:'customer', col:'客户',     type:'text'   },
  { key:'moNo',     col:'排产单号', type:'text'   },
  { key:'amount',   col:'货款',     type:'number' },
  { key:'delivery', col:'交货日期', type:'date'   },
  { key:'status',   col:'状态',     type:'text'   },
  { key:'product',  col:'产品摘要', type:'text'   },
  { key:'owner',    col:'业务员',   type:'text'   }
];
const SY_DATA_FIELDS = SY_SCHEMA.filter(f => f.type !== 'block');
const SY_DB_NAME = '订单同步';
const SY_NOTEBOOK = 'CRM管理';
const SY_LEGACY_HINT = '2026跟踪库同步订单';   /* 历史遗留的空壳库，可一键清除 */
const SY_BIND_KEY = 'ot.syBind.v1';            /* 绑定信息（只存 id，不存凭据） */
let SY_BIND = null;                            /* { avID, blockID, docID, notebook, title } */
let _syTransport = null;                       /* 测试注入点；默认走 fetch */

function syLoadBind(){
  try{ const r = JSON.parse(localStorage.getItem(SY_BIND_KEY) || 'null');
    SY_BIND = (r && r.avID) ? r : null; }catch(e){ SY_BIND = null; }
  return SY_BIND;
}
function sySaveBind(b){
  SY_BIND = (b && b.avID) ? b : null;
  try{ SY_BIND ? localStorage.setItem(SY_BIND_KEY, JSON.stringify(SY_BIND))
               : localStorage.removeItem(SY_BIND_KEY); }catch(e){}
  return SY_BIND;
}
function syClearBind(){ return sySaveBind(null); }
function syCfg(){ return (Store.state.dsCfg && Store.state.dsCfg.siyuan) || {}; }
function sySetTransport(fn){ _syTransport = fn; }
const sySleep = ms => new Promise(r => setTimeout(r, ms));

/* 时间戳型 id（与思源自身 id 同形），用于 db / 列 id */
function syNewId(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for(let i = 0; i < 7; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '-' + s;
}

/* ---------------------------------------------------------------------------
   transport：默认 fetch 直连本机思源内核（已放行 CORS）；
   测试可用 sySetTransport(fn) 注入 stub，签名 (path, body, cfg) → data。
   --------------------------------------------------------------------------- */
async function syApi(path, body){
  const cfg = syCfg();
  if(_syTransport) return _syTransport(path, body, cfg);
  const base = String(cfg.baseUrl || 'http://127.0.0.1:6806').replace(/\/$/, '');
  const headers = { 'Content-Type':'application/json' };
  if(cfg.token) headers['Authorization'] = 'Token ' + cfg.token;
  const r = await fetch(base + path, { method:'POST', headers, body: JSON.stringify(body || {}) });
  if(!r.ok) throw new Error('HTTP ' + r.status + ' @ ' + path);
  const txt = await r.text();
  if(!txt.trim()) return null;                    /* 部分写接口成功时回空体 */
  const j = JSON.parse(txt);
  if(j && j.code && j.code !== 0) throw new Error((j.msg || ('code=' + j.code)) + ' @ ' + path);
  return j.data;
}

async function syListKeys(avID){ return (await syApi('/api/av/getAttributeViewKeysByAvID', { avID })) || []; }
async function syAddKey(avID, keyID, keyName, keyType, previousKeyID){
  return syApi('/api/av/addAttributeViewKey', { avID, keyID, keyName, keyType, keyIcon:'', previousKeyID });
}
/* 数据库标题：优先取路径末段（/CRM管理/订单同步 → 订单同步），比 content 可靠 */
function syDbTitle(hpath, content){
  const p = String(hpath || '').split('/').filter(Boolean);
  if(p.length) return p[p.length - 1];
  return String(content || '').trim().split(/\s+/)[0] || '(无标题)';
}

/* 在整库范围找专用同步库（按路径判断，不看标题 —— 标题可被改） */
async function syFindDB(){
  const rows = await syApi('/api/query/sql', {
    stmt: "SELECT b.id, b.hpath, b.box, b.content FROM blocks b WHERE b.type='av' ORDER BY b.created DESC"
  }) || [];
  const hit = (rows || []).find(x => String(x.hpath || '').indexOf('/' + SY_DB_NAME) >= 0);
  if(!hit) return null;
  const blk = await syApi('/api/query/sql', { stmt: "SELECT markdown FROM blocks WHERE id='" + hit.id + "'" }) || [];
  const m = /data-av-id="([^"]+)"/.exec((blk[0] || {}).markdown || '');
  if(!m) return null;
  const dr = await syApi('/api/query/sql', { stmt: "SELECT root_id FROM blocks WHERE id='" + hit.id + "'" }) || [];
  return { avID:m[1], blockID:hit.id, docID:(dr[0] || {}).root_id, notebook:hit.box,
    hpath:hit.hpath, title:syDbTitle(hit.hpath, hit.content) };
}

/* 按 schema 顺序补列（previousKeyID 链式追加，保证列序稳定）；
   已存在的列只读 keyID 不重建。 */
async function syEnsureColumns(ref){
  const have = await syListKeys(ref.avID);
  const byName = new Map(have.map(k => [k.name, k]));
  const added = [];
  let prev = (have[have.length - 1] || {}).id || '';
  for(const f of SY_DATA_FIELDS){
    if(byName.has(f.col)){ prev = byName.get(f.col).id; continue; }
    const keyID = syNewId();
    await syAddKey(ref.avID, keyID, f.col, f.type, prev);
    added.push(f.col); prev = keyID;
    await sySleep(260);                            /* 内核写入间隔，避免打满被掐 */
  }
  return added;
}

/* 确保同步库存在且列齐全；不存在则新建（笔记本 → 文档 → 数据库块 → 物化视图 → 8 列） */
async function syEnsureDB(){
  const cfg = syCfg();
  if(!String(cfg.baseUrl || '').trim()) return { ok:false, msg:'请先填写思源地址' };
  let got = null;
  try{ got = await syFindDB(); }
  catch(e){ return { ok:false, msg:'连接思源失败：' + ((e && e.message) || e) }; }
  if(got && got.avID){
    const added = await syEnsureColumns(got);
    sySaveBind(got);
    return Object.assign({ ok:true, created:false, colsAdded:added, ready:true }, got);
  }
  /* 1) CRM管理 笔记本（没有就建） */
  const nbs = ((await syApi('/api/notebook/lsNotebooks', {})) || {}).notebooks || [];
  let nb = nbs.find(n => n.name === SY_NOTEBOOK);
  if(!nb) nb = ((await syApi('/api/notebook/createNotebook', { name: SY_NOTEBOOK })) || {}).notebook;
  const notebook = nb && nb.id;
  if(!notebook) return { ok:false, msg:'无法创建 / 找到「' + SY_NOTEBOOK + '」笔记本' };
  /* 2) 文档 */
  const docID = await syApi('/api/filetree/createDocWithMd', {
    notebook, path:'/' + SY_DB_NAME,
    markdown:'# ' + SY_DB_NAME + '\n\n（本库由' + APP_NAME + '维护，请勿手改列结构）'
  });
  /* 3) 数据库块：data-type 必须是 NodeAttributeView，av-id 由我们指定 */
  const avID = syNewId();
  await syApi('/api/block/insertBlock', {
    dataType:'dom', parentID:docID,
    data: '<div data-type="NodeAttributeView" data-av-id="' + avID + '" data-av-type="table"></div>'
  });
  await sySleep(700);
  const avs = (await syApi('/api/query/sql', {
    stmt: "SELECT id FROM blocks WHERE type='av' AND box='" + notebook + "'" })) || [];
  const blockID = (avs[0] || {}).id;
  /* 4) 物化视图：不做这步，addAttributeViewKey 一律 view not found */
  await syApi('/api/av/renderAttributeView', { id:avID, blockID, page:1, pageSize:-1, createIfNotExist:true });
  await sySleep(500);
  /* 5) 删掉自动生成的空「单选」列 */
  for(const k of await syListKeys(avID)){ if(k.name === '单选') await syApi('/api/av/removeAttributeViewKey', { avID, keyID:k.id }); }
  const ref = { avID, blockID, docID, notebook, title:SY_DB_NAME };
  const added = await syEnsureColumns(ref);
  sySaveBind(ref);
  return Object.assign({ ok:true, created:true, colsAdded:added, ready:true }, ref);
}

/* ---------------------------------------------------------------------------
   读全表 → [{ itemID, orderNo, customer, moNo, amount, delivery, status, product, owner }]
   行数据在 data.view（不是 data.av）；cell 的 keyID 挂在 cell.value 上。
   --------------------------------------------------------------------------- */
async function syReadRows(ref){
  const keys = await syListKeys(ref.avID);
  const byId = new Map(keys.map(k => [k.id, k.name]));
  const d = await syApi('/api/av/renderAttributeView', {
    id:ref.avID, blockID:ref.blockID, page:1, pageSize:-1, createIfNotExist:true });
  const view = (d && d.view) || {};
  return ((view.rows) || []).map(row => {
    const o = { itemID: row.id };
    for(const c of (row.cells || [])){
      const v = c.value || {};
      const keyID = v.keyID || c.keyID;
      const name = byId.get(keyID);
      const f = SY_SCHEMA.find(x => x.col === name);
      if(!f) continue;
      o[f.key] = syCellRead(v, f.type);
    }
    return o;
  });
}
function syCellRead(value, type){
  const v = value || {};
  if(type === 'block')  return String((v.block || {}).content || '').trim();
  if(type === 'number') return Number((v.number || {}).content) || 0;
  if(type === 'date'){ const t = Number((v.date || {}).content) || 0; return t ? fmt(new Date(t)) : ''; }
  return String((v.text || {}).content || '').trim();
}

/* 建行 / 写值 / 删行 */
async function syAddRows(ref, list){
  if(!list.length) return;
  await syApi('/api/av/addAttributeViewBlocks', {
    avID:ref.avID, blockID:ref.blockID,
    srcs: list.map(o => ({ isDetached:true, content: String(o.orderNo) })),
    ignoreDefaultFill:false });

}
async function sySetCells(ref, itemID, fields){
  const keys = await syListKeys(ref.avID);
  const keyOf = new Map(keys.map(k => [k.name, k.id]));
  const values = [];
  for(const k of Object.keys(fields || {})){
    const f = SY_SCHEMA.find(x => x.key === k);
    if(!f || !keyOf.has(f.col)) continue;
    const val = fields[k];
    if(val === '' || val == null) continue;
    values.push({ keyID: keyOf.get(f.col), itemID, value: syCellWrite(val, f.type) });
  }
  if(!values.length) return 0;
  await syApi('/api/av/batchSetAttributeViewBlockAttrs', { avID:ref.avID, values });
  return values.length;
}
async function syRemoveRows(ref, itemIDs){
  if(!itemIDs.length) return;
  await syApi('/api/av/removeAttributeViewBlocks', { avID:ref.avID, srcIDs: itemIDs });
}
function syCellWrite(v, type){
  if(type === 'number'){ const n = Number(v); return { type, number:{ content: isFinite(n) ? n : 0, isNotEmpty: v !== '' && v != null } }; }
  if(type === 'date'){
    const t = v ? Date.parse(String(v).replace(/-/g, '/')) : NaN;
    return { type, date:{ content: isNaN(t) ? null : t, isNotEmpty: !isNaN(t) } };
  }
  if(type === 'block') return { type:'block', block:{ content: v == null ? '' : String(v) } };
  return { type:'text', text:{ content: v == null ? '' : String(v) } };
}

/* ---------------------------------------------------------------------------
   工作台 → 扁平行（8 列）
   客户 / 业务员按 id 解析成名字；排产单号由该订单的排产记录拼接（多单号用「、」）。
   --------------------------------------------------------------------------- */
function syLocalRows(st){
  const d = st.data || {};
  const custOf = id => (d.customers || []).find(c => c.id === id) || {};
  const ownOf  = id => (d.owners || []).find(u => u.id === id) || {};
  return (d.orders || []).map(o => {
    /* v0.43：排产单号唯一来源 = production 表，统一走 orderMoNos 派生（保序去重） */
    const mos = orderMoNos(st, o.id);
    const c = custOf(o.customerId), u = ownOf(o.ownerId);
    return {
      orderNo: String(o.orderNo || '').trim(),
      customer: c.name || c.shortName || '',
      moNo: mos.join('、'),
      amount: Number(o.amount) || 0,
      delivery: String(o.contractDelivery || '').trim(),
      status: String(o.status || '').trim(),
      product: String(o.productSummary || '').trim(),
      owner: u.name || ''
    };
  }).filter(r => r.orderNo);
}

/* ---------------------------------------------------------------------------
   差异引擎（冲突不自动定，交人选择）
   规则：两端都有值且不同 → 冲突；单端有值 → 单向补齐；仅思源有 → remoteOnly（不自动删）。
   --------------------------------------------------------------------------- */
function syDiff(localRows, remoteRows){
  const norm = v => String(v == null ? '' : v).trim();
  const R = new Map((remoteRows || []).filter(r => r.orderNo).map(r => [norm(r.orderNo), r]));
  const toPush = [], toPull = [], conflicts = [], localOnly = [];
  const seen = new Set();
  for(const lo of (localRows || [])){
    const no = norm(lo.orderNo);
    if(!no) continue;
    seen.add(no);
    const ro = R.get(no);
    if(!ro){ localOnly.push(no); toPush.push({ orderNo:no, fields: syPick(lo) }); continue; }
    const pushF = {}, pullF = {};
    for(const f of SY_DATA_FIELDS){
      const a = norm(lo[f.key]), b = norm(ro[f.key]);
      if(a === b) continue;
      if(!b) pushF[f.key] = lo[f.key];                 /* 思源空 → 推 */
      else if(!a) pullF[f.key] = ro[f.key];            /* 本地空 → 拉 */
      else conflicts.push({ orderNo:no, field:f.col, key:f.key, local:lo[f.key], remote:ro[f.key], itemID:ro.itemID });
    }
    if(Object.keys(pushF).length) toPush.push({ orderNo:no, itemID:ro.itemID, fields:pushF });
    if(Object.keys(pullF).length) toPull.push({ orderNo:no, itemID:ro.itemID, fields:pullF });
  }
  const remoteOnly = (remoteRows || []).filter(r => r.orderNo && !seen.has(norm(r.orderNo)));
  return { toPush, toPull, conflicts, remoteOnly, localOnly };
}
function syPick(o){ const r = {}; SY_DATA_FIELDS.forEach(f => { r[f.key] = o[f.key]; }); return r; }

/* ---------------------------------------------------------------------------
   落库管线：思源扁平行 → 工作台 订单 / 客户 / 排产
   （保留 syBuildPlan / syRunImport 的对外形状，字段名兼容旧扁平行）
   --------------------------------------------------------------------------- */
function syRowField(r, keys, def){
  for(const k of keys){
    if(r && r[k] !== undefined && r[k] !== null && r[k] !== '') return r[k];
  }
  return def;
}
/* 金额 / 日期解析工具（导出 HTML 等外部文本里的脏值归一） */
const syMoney = s => { const n = Number(String(s == null ? '' : s).replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const syDate  = s => { const t = String(s == null ? '' : s).trim(); return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : ''; };
const SY_STATUS_MAP = { '未排产':'01 已签约', '已排产':'02 已排产', '已出货':'04 已发货', '已收款':'05 已收款' };
function syMapStatus(r){
  const s = String(syRowField(r, ['status'], '')).trim();
  const ALL = (typeof STATUS !== 'undefined' && STATUS) || [];
  if(ALL.indexOf(s) >= 0) return s;                 /* 已是工作台全称 → 新链路零映射 */
  let base = SY_STATUS_MAP[s];
  if(!base){
    if(/^已收/.test(s)) base = '05 已收款';
    else if(/^已出/.test(s)) base = '04 已发货';
    else if(/^已排/.test(s)) base = '02 已排产';
    else base = '01 已签约';
  }
  const done = syRowField(r, ['done'], false);
  const isDone = done === true || done === 'true' || String(done).trim() === '√';
  if(isDone && (base === '05 已收款' || base === '04 已发货' || base === '03 已完工待发货')) return '06 已完结';
  return base;
}
function syMapTerms(r){
  const t = String(syRowField(r, ['term'], '')).trim();
  if(t === '信用证') return { paymentTerm:'LC', tradeTerm:'FOB' };
  const hit = (TRADE_TERMS.find(x => x.v === t) || {}).v;
  return { paymentTerm:'TT', tradeTerm: hit || 'FOB' };
}
function syBuildPlan(rows, st){
  const norm = s => String(s || '').trim().toLowerCase();
  /* 客户匹配：siyuanCode → shortName → name 三级（大小写 / 空白归一）。
     工作台编辑客户改了名称但保留简称时，再次拉取不重复建档、订单不丢失。 */
  const byCode = new Map(), byShort = new Map(), byName = new Map();
  ((st.data.customers) || []).forEach(c => {
    const sk = norm(c.siyuanCode), sn = norm(c.shortName), nm = norm(c.name);
    if(sk) byCode.set(sk, c);
    if(sn) byShort.set(sn, c);
    if(nm) byName.set(nm, c);
  });
  const orderByNo = new Map(((st.data.orders) || []).map(o => [String(o.orderNo || '').trim(), o]));
  const newCustomers = [], items = [];
  (rows || []).forEach(r => {
    const no = String(syRowField(r, ['orderNo', 'pi'], '')).trim();
    if(!no) return;
    const cname = String(syRowField(r, ['customer', 'customerName'], '')).trim() || '未命名客户';
    const key = norm(cname);
    let c = byCode.get(key) || byShort.get(key) || byName.get(key);
    if(!c){
      c = newCustomers.find(x => norm(x.siyuanCode) === key || norm(x.shortName) === key || norm(x.name) === key);
      if(!c){
        c = { id: uid('C'), code:'', name:cname, shortName:cname, siyuanCode:cname, industry:'未分类', level:'B',
              settleDays:0, contact:'', phone:'', email:'', address:'',
              creditNote:'由思源同步自动建档', active:true, createdAt: fmt(today()), _src:'siyuan' };
        newCustomers.push(c);
      }
    }
    const status  = syMapStatus(r);
    const terms   = syMapTerms(r);
    const amount  = Number(syRowField(r, ['amount'], 0)) || 0;
    const tax     = Number(syRowField(r, ['taxAmount', 'tax'], 0)) || 0;
    const dep     = Number(syRowField(r, ['depositAmount', 'deposit'], 0)) || 0;
    const deliv   = String(syRowField(r, ['delivery', 'contractDelivery'], '')).trim();
    const summary = String(syRowField(r, ['product', 'productSummary'], '')).trim();
    const moRaw   = String(syRowField(r, ['moNo', 'mo'], '')).trim();
    const paid    = (status === '05 已收款' || status === '06 已完结');
    const payDate = paid ? deliv : '';
    const exist   = orderByNo.get(no);
    const ownerName = String(syRowField(r, ['owner', 'ownerName'], '')).trim();
    let ownerId = (exist && exist.ownerId) ? exist.ownerId : '';
    if(!ownerId){
      const hit = ((st.data.owners) || []).find(u => norm(u.name) === norm(ownerName));
      ownerId = hit ? hit.id : ((((st.data.owners) || [])[0] || {}).id || '');
    }
    const order = {
      orderNo:no, moNo:moRaw, customerId:c.id, ownerId,
      status, signDate:'', amount:amount, taxAmount:tax, currency:'CNY',
      contractDelivery:deliv, actualDelivery:'', productSummary:summary, tags:'', remark:'',
      paymentTerm:terms.paymentTerm, tradeTerm:terms.tradeTerm,
      depositAmount:dep, depositPaidDate:(dep > 0 && paid) ? payDate : '',
      balancePaidDate: paid ? payDate : '', balanceReceived:0, balanceSettled:false, _src:'siyuan'
    };
    /* 排产：排产单号列按「、」拆分，逐个建一条无数量排产记录；
       进度直接由状态决定（v0.46：prodStatusPct）。 */
    const opStatus = status === '01 已签约' ? '待排产' : (status === '02 已排产' ? '生产中' : '已完工');
    /* v0.43：分隔符统一走 splitMoNos（兼容「/」，与手填 / 思源回填同一口径）；
       单号全局唯一，冲突的在落库那一步跳过并计数。 */
    const mos = moRaw ? splitMoNos(moRaw) : [];
    const prods = mos.map(m => ({ moNo:m, workshop:'', planStart:'', planFinish:deliv,
      actualStart:'', actualFinish:'', qty:0, doneQty:0,
      progressPct: prodStatusPct(opStatus, 0), opStatus }));
    items.push({ act: exist ? '更新' : '新增', id: exist ? exist.id : null, row:r,
      orderNo:no, customer:cname, amount:amount, tax:tax, status:status, mo:moRaw,
      order, prod:(prods[0] || null), prods, imgs: [] });
  });
  const stats = { total: items.length, add: items.filter(i => i.act === '新增').length,
    upd: items.filter(i => i.act === '更新').length, newCust: newCustomers.length,
    prod: items.reduce((a, i) => a + (i.prods || []).length, 0), img: 0,
    amount: items.reduce((a, i) => a + (i.amount || 0), 0) };
  return { ok:true, items, newCustomers, stats };
}
/* 落库：新建客户 → 订单建/更 → 补排产记录（同单号不重复建） */
async function syRunImport(plan, opts){
  const st = Store.state, src = st.source;
  if(!src || !src.capabilities.write) return { ok:false, msg:'当前数据源只读，无法导入（请切换到「本地手工录入」）' };
  await histForceMark('导入前（' + ((opts && opts.label) || '思源同步') + '）');
  const maxSort = Math.max(0, ...((st.data.orders) || []).map(x => x.sortKey != null ? x.sortKey : 0));
  let nC = 0, nO = 0, uO = 0, nP = 0, nSkip = 0, seq = 0;
  for(const c of (plan.newCustomers || [])){ await src.create('customers', c); nC++; }
  for(const it of (plan.items || [])){
    const payload = Object.assign({}, it.order);
    let oid;
    if(it.act === '新增'){
      payload.id = uid('O'); payload.sortKey = maxSort + (++seq);
      await src.create('orders', payload); oid = payload.id; nO++;
    }else{
      await src.update('orders', it.id, payload); oid = it.id; uO++;
    }
    for(const pr of (it.prods || [])){
      if(!pr.moNo) continue;
      const has = ((st.data.production) || []).some(p => p.orderId === oid && String(p.moNo || '').trim() === pr.moNo);
      if(has) continue;
      /* v0.43：排产单号全局唯一 —— 已被别的订单占用时跳过并计数，不静默覆盖 */
      if(moNoOwner(st, pr.moNo, null)){ nSkip++; continue; }
      await src.create('production', Object.assign({}, pr, { id: uid('P'), orderId: oid })); nP++;
    }
  }
  await reload();
  return { ok:true, msg:'同步落库：新增订单 ' + nO + ' · 更新 ' + uO + ' · 新建客户 ' + nC + ' · 排产 ' + nP
      + (nSkip ? ' · ⚠ 单号重复跳过 ' + nSkip : ''),
    counts:{ nO, uO, nC, nP, nSkip } };
}

          '<option value="local">保留工作台</option><option value="remote">采用思源</option>' +
        '</select></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  if(d.remoteOnly.length){
    const cols = SY_DATA_FIELDS.map(f => '<th>' + f.col + '</th>').join('');
    h += '<div style="font-size:12.5px;font-weight:600;margin:10px 0 4px">思源有、工作台没有（选择导入或忽略）</div>';
    h += '<div class="tw" style="max-height:280px;overflow:auto"><table><thead><tr>' +
      '<th>订单号</th>' + cols + '<th>处理</th></tr></thead><tbody>';
    d.remoteOnly.forEach((r, i) => {
      h += '<tr><td><b>' + esc(r.orderNo) + '</b></td>' +
        SY_DATA_FIELDS.map(f => '<td>' + esc(String(r[f.key] == null ? '' : r[f.key])) + '</td>').join('') +
        '<td><select data-ro="' + i + '"><option value="import">导入为新单</option><option value="ignore">忽略</option></select></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  if(!d.conflicts.length && !d.remoteOnly.length){
    h += '<div class="hint" style="border-color:var(--green-600)">没有需要人工决策的项 —— 直接点「③ 应用变更」即可。</div>';
  }
  box.innerHTML = h;
}
