    }catch(e){}
  }
  /* 读取附件为 dataURL（同步快照用，附件随快照一起加密上传） */
  async function dataUrl(id){
    if(!id) return null;
    if(mode === 'idb'){
      try{ const db = await openIDB(); const blob = await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const q=tx.objectStore('files').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(new Error('读取失败'));});
        if(!blob) return null;
        return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);}); }
      catch(e){ return null; }
    }
    if(mode === 'local'){ const raw = localStorage.getItem('ot.file.' + id); return raw ? JSON.parse(raw).data : null; }
    const it = mem.get(id);
    if(it) return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(it.blob);});
    return null;
  }
  /* 从 dataURL 写回附件（同步恢复用），强制使用给定 id，避免覆盖既有同 id 记录 */
  async function importFromDataUrl(id, dataUrlStr, meta){
    const blob = await (await fetch(dataUrlStr)).blob();
    const file = new File([blob], (meta && meta.name) || id, { type:(meta && meta.type) || 'application/octet-stream' });
    if(mode === 'idb'){
      const db = await openIDB();
      await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file, id);tx.oncomplete=res;tx.onerror=()=>rej(new Error('写入失败'));});
    }else if(mode === 'local'){
      const m = Object.assign({ id }, meta || {});
      try{ localStorage.setItem('ot.file.' + id, JSON.stringify({ ...m, data:dataUrlStr })); }
      catch(e){ throw new Error('本地存储空间不足'); }
    }else{ mem.set(id, { meta:Object.assign({id},meta||{}), blob:file }); }
  }
  return { mode, put, url, del, clear, check, dataUrl, importFromDataUrl, FILE_MAX, FILE_EXT };
})();

const RULES = {
  code   : v => !v ? null : (CODE_RE.test(v) ? null : CODE_MSG),
  amount : v => (v === '' || v == null) ? '请填写订单金额' : (Number(v) > 0 ? null : '订单金额须大于 0'),
  deposit: (v, vals) => {
    if(v === '' || v == null) return null;                       // 允许留空 = 无订金
    const n = Number(v);
    if(isNaN(n) || n < 0) return '订金金额不能为负数';
    const total = Number(vals.amount || 0);
    if(total > 0 && n > total) return '订金不能超过订单金额（' + money(total) + '）';
    return null;
  }
};
/* 订金 / 尾款派生：唯一计算入口，页面与保存逻辑都走它，避免两处口径不一致 */
const balanceOf = o => Math.max(0, Number((o && o.amount) || 0) - Number((o && o.depositAmount) || 0));
/* 尾款实收到账金额：记录「实收尾款金额」则按实收计，否则按合同尾款（未登记手续费时退化为合同额） */
const balReceivedOf = o => {
  const r = Number((o && o.balanceReceived) || 0);
  return r > 0 ? r : balanceOf(o);
};
/* 尾差已结清（手续费 / 折让 / 尾差已确认，不再追收） */
const isBalSettled = o => !!(o && o.balanceSettled);
/* 订单级回款统计算子（重构后收款数据落在订单字段，取代原 payments 多期表）。
   规则（主流回款逻辑）：订金 + 尾款，各自登记「付款日期」；订金为 0 时视为已收，不强制登记。
   尾款阶段若被扣手续费，可登记「实收尾款金额」与「差额已结清」：差额结清后不再计入未收（详见下方实收/核销拆分）。 */
/* ---- v0.10：销售额 / 实收额 分离 ----
   实收额(receivedOf) = 真实到账的钱，绝不含任何核销；
   核销额(writeOffOf) = 手续费 / 尾差，勾选「差额已结清」后不再追收，但不算真金白银到账；
   已回款(paidTotalOf) = 实收 + 核销，仅用于「未收多少」「是否已收齐」判断。
   这样「货款 10125、实收 10115」时，实收额显示 10115，而不是 10125。 */
const depReceivedOf = o => Number((o && o.depositAmount) || 0);
const receivedOf = o => {
  const dep = depReceivedOf(o);
  let s = 0;
  if(dep === 0 || (o && o.depositPaidDate)) s += dep;   // 订金为 0 → 视为已收（无需登记）
  if(o && o.balancePaidDate) s += balReceivedOf(o);
  return s;
};
const writeOffOf = o => {
  if(!o || !o.balancePaidDate || !isBalSettled(o)) return 0;
  return Math.max(0, balanceOf(o) - balReceivedOf(o));
};
const paidTotalOf = o => receivedOf(o) + writeOffOf(o);
const unpaidOf = o => Math.max(0, Number((o && o.amount) || 0) - paidTotalOf(o));
const isFullyPaid = o => {
  const dep = Number((o && o.depositAmount) || 0);
  const depOk = (dep === 0 || (o && o.depositPaidDate));
  if(!depOk || !(o && o.balancePaidDate)) return false;
  return balReceivedOf(o) >= balanceOf(o) || isBalSettled(o);
};
/* 按「回款实收日」归集区间内的已收金额（用于看板按回款日筛选） */
const orderPaidInRange = (o, from, to) => {
  const dep = Number((o && o.depositAmount) || 0);
  let s = 0; const inR = d => d && d >= from && d <= to;
  if(dep > 0 && inR(o && o.depositPaidDate)) s += dep;
  if(inR(o && o.balancePaidDate)) s += balReceivedOf(o);
  return s;
};
/* 计算新增订单的插入排序键：front/end/在某订单之前 */
function computeInsertSortKey(st, pos){
  const orders = st.data.orders || [];
  if(pos === 'front'){ const mn = orders.length ? Math.min(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mn - 1; }
  if(pos === 'end' || !pos){ const mx = orders.length ? Math.max(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mx + 1; }
  const t = orders.find(o => o.id === pos);
  if(!t){ const mx = orders.length ? Math.max(...orders.map(o => o.sortKey != null ? o.sortKey : 0)) : 0; return mx + 1; }
  const tk = (t.sortKey != null ? t.sortKey : 0);
  const smaller = orders.map(o => o.sortKey != null ? o.sortKey : 0).filter(k => k < tk).sort((a,b)=>b-a);
  const prevK = smaller.length ? smaller[0] : tk - 1;
  return (tk + prevK) / 2;
}

function validateForm(fields, vals){
  const errs = {};
  fields.forEach(f => {
    if(!isVisible(f, vals)) return;
    const v = vals[f.key];
    const empty = (v == null) || (typeof v !== 'object' && String(v).trim() === '');
    if(f.rule && RULES[f.rule]){
      const m = RULES[f.rule](v == null ? '' : String(v).trim(), vals);
      if(m){ errs[f.key] = m; return; }
    }
    if(empty){ if(isRequired(f, vals)) errs[f.key] = '此项为必填'; return; }
  });
  return errs;
}

      <span class="it">尾款 <b class="green">${money(bal)}</b>（${amt ? (100 - rate*1).toFixed(1) : '0.0'}%）<span class="muted">${balPaid}</span></span>

/* 回款计划行生成逻辑已移除：回款改为订单级字段（订金 / 尾款 + 各自付款日），见 openOrderForm / saveOrderForm */
function drawForm(){
  const f = FORM; if(!f) return;
  const body = $('#formBody'); if(!body) return;
  // 分组渲染：遇到 group 分隔段则另起一块；stack=true 时组内两列紧凑排列（纵向填写、不横向铺开）
  let html = '', buf = [];
  const flush = () => { if(buf.length) html += '<div class="frow' + (f.stack ? ' two' : '') + '">' + buf.join('') + '</div>'; buf = []; };
  f.fields.forEach(x => {
    if(x.type === 'group'){ flush(); html += `<div class="fsec">${esc(x.label)}</div>`; return; }
    buf.push(fieldHTML(x, f.values, f.errors));
  });
  flush();
  body.innerHTML = html;
  body.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    const evt = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
    el.addEventListener(evt, () => {
      f.values[k] = (el.type === 'checkbox') ? el.checked : el.value;
      delete f.errors[k];
      // 订单金额变化 → 尾款自动联动，同时重算「订金不能超额」这条跨字段校验
      if(k === 'amount'){
        const e2 = validateForm(f.fields.filter(x => x.key === 'depositAmount'), f.values);
        if(e2.depositAmount) f.errors.depositAmount = e2.depositAmount;
        else delete f.errors.depositAmount;
      }
      refreshForm();   // 局部刷新，绝不重建输入框
    });
  });
  bindFileField();
  if(typeof f.onRedraw === 'function') f.onRedraw(f);
}
/* 输入过程中的局部刷新：只更新「显隐 / 必填星号 / 错误提示 / 派生值 / 预览条」。
   不能用 drawForm() 整体重建 —— 那会把正在输入的 <input> 换成新节点，
   焦点和光标位置全丢，表现为「每敲一个字就被踢出输入框，只能一个字一个字输入」。 */
function refreshForm(){
  const f = FORM; if(!f) return;
  const body = $('#formBody'); if(!body) return;
  f.fields.forEach(fld => {
    if(!fld.key) return;
    const el = body.querySelector('[data-fld="' + fld.key + '"]');
    if(!el) return;
    const err = f.errors[fld.key];
    el.classList.toggle('hidden', !isVisible(fld, f.values));
    el.classList.toggle('err', !!err);
    const lab = el.querySelector('label');
    if(lab) lab.innerHTML = esc(fld.label) + (isRequired(fld, f.values) ? '<span class="req">*</span>' : '') + infoI(esc(fld.help));
    const hint = el.querySelector('.fhint');
    if(hint) hint.innerHTML = err ? `<div class="fmsg">${esc(err)}</div>` : '';
    if(fld.type === 'calc' && typeof fld.compute === 'function'){
      const cv = fld.compute(f.values), box = el.querySelector('.calcbox .v');
      if(box) box.textContent = (typeof fld.format === 'function' ? fld.format(cv) : (cv == null ? '-' : cv));
    }
  });
  if(typeof f.onRedraw === 'function') f.onRedraw(f);
}
function bindFileField(){
  const f = FORM; if(!f) return;
  const attInput = $('#attInput'), attDrop = $('#attDrop');
  const attTrigger = () => attInput && attInput.click();
  if(attDrop){
    attDrop.onclick = attTrigger;
    attDrop.ondragover = e => { e.preventDefault(); attDrop.classList.add('over'); };
    attDrop.ondragleave = () => attDrop.classList.remove('over');
    attDrop.ondrop = e => { e.preventDefault(); attDrop.classList.remove('over');
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addAttachments(e.dataTransfer.files); };
  }
  if(attInput) attInput.onchange = () => { if(attInput.files && attInput.files.length) addAttachments(attInput.files); attInput.value = ''; };
  const attBox = $('#attBox');
  if(attBox){
    attBox.onclick = e => {
      const t = e.target, i = t.dataset && t.dataset.i;
      if(i == null) return;
      if(t.classList.contains('attPrev')) previewFile((f.values.attachments||[])[+i], $('#attPrevBox'));
      else if(t.classList.contains('attDel')) deleteAttachment(+i);
    };
    attBox.onchange = e => {
      const t = e.target, i = t.dataset && t.dataset.i;
      if(t.classList.contains('attKind') && i != null && (f.values.attachments||[])[+i]) (f.values.attachments)[+i].kind = t.value;
    };
  }
}
async function addAttachments(fileList){
  const f = FORM; if(!f) return;
  for(const file of Array.from(fileList)){
    const bad = FileStore.check(file);
    if(bad){ toast(bad); continue; }
    try{
      const meta = await FileStore.put(file);
      if(!Array.isArray(f.values.attachments)) f.values.attachments = [];
      f.values.attachments.push(meta);
      f.pendingNew.push(meta.id);
      delete f.errors.attachments;
    }catch(e){ toast('上传失败：' + (e && e.message ? e.message : e)); }
  }
  drawForm();
}
async function deleteAttachment(i){
  const f = FORM; if(!f) return;
  const arr = Array.isArray(f.values.attachments) ? f.values.attachments : [];
  const m = arr[i]; if(!m) return;
  f.orphans.push(m.id);
  f.pendingNew = f.pendingNew.filter(id => id !== m.id);
  arr.splice(i, 1);
  f.values.attachments = arr;
  delete f.errors.attachments; drawForm();
}
async function previewFile(meta, box){
  if(!meta || !box) return;

  const isImg = /image\//.test(meta.type || '') || /\.(jpg|jpeg|png)$/i.test(meta.name || '');
  box.innerHTML = `<div class="fprev">${isImg
    ? `<img src="${u}" alt="${esc(meta.name)}">`
    : `<iframe src="${u}" title="${esc(meta.name)}"></iframe>`}</div>`;
}

async function deleteOrder(id){
  const st = Store.state;
  const o = st.data.orders.find(x => x.id === id); if(!o) return;
  if(!st.source.capabilities.write){ toast('当前数据源只读，无法删除（请切到本地录入）'); return; }
  if(!confirm('确定删除订单 ' + o.orderNo + '？\n\n其排产 / 发货 / 跟进记录会一并移入「回收站」，可在「数据历史」页整组还原。\n附件文件会保留，直到你在回收站里彻底删除。')) return;
  const src = st.source;
  /* v0.20：不再物理删除，整组移入回收站 —— 误删可救，这是本次改动的主要目的 */
  const items = [{ res:'orders', row:o }];
  for(const res of ['production','shipments','followups']){
    st.data[res].filter(x => x.orderId === id).forEach(r => items.push({ res, row:r }));
  }
  if(typeof src.removeGroup === 'function') await src.removeGroup(items, '订单 ' + o.orderNo);
  else { for(const it of items) await src.remove(it.res, it.row.id).catch(()=>{}); }
  closeSheet(); await reload(); toast('订单已移入回收站：' + o.orderNo);
}

/* ---------- v0.20 · 数据历史页（整库快照回滚 + 删除回收站） ---------- */
function viewHistory(){
  return `
    <div class="grid kpi" id="histKpi" style="margin-top:12px"></div>
    <div class="card" style="margin-top:14px"><div class="hd"><h3>快照</h3>${infoI('<b>数据历史</b>存的是<b>整库快照</b>——每次写库前自动存一份（10 分钟内连续改动合并成一份），清空数据 / 导入 / 批量修改 / 云端拉取前再强制存一份。回滚会把整个数据库恢复到那份快照的状态。<br><b>回滚本身也会先存一份</b>，所以即使回滚错了也能再回滚回去。删除的记录不会真的消失，而是进到下面的<b>回收站</b>，可以单独还原某一笔——删订单时它的排产 / 发货 / 跟进会<b>整组</b>一起回来。')}
      <span class="tag t-blue" id="histMode">…</span><div class="spacer"></div>
      <button class="btn primary" id="histMark">📌 立即打一份快照</button>
      <button class="btn" id="histWipe">清空全部快照</button></div>
      <div class="bd"><div id="histSnaps"><div class="muted">读取中…</div></div></div></div>
    <div class="card" style="margin-top:14px"><div class="hd"><h3>回收站</h3>
      <span class="tag t-amber" id="histTrashTag">…</span><div class="spacer"></div>
      <button class="btn danger" id="histTrashWipe">清空回收站</button></div>
      <div class="bd"><div id="histTrash"><div class="muted">读取中…</div></div></div></div>`;
}

async function histRefresh(){
  const snaps = await SnapshotStore.all().catch(() => []);
  const src = Store.state.source;
  const trash = (src && typeof src.listTrash === 'function') ? await src.listTrash().catch(() => []) : [];
  const kb = $('#histKpi');
  if(kb) kb.innerHTML = `
    <div class="card"><div class="bd"><div class="muted" style="font-size:11.5px">快照份数</div>
      <div style="font-size:22px;font-weight:700;line-height:1.5">${snaps.length} <span class="muted" style="font-size:13px;font-weight:400">/ ${HIST_MAX}</span></div></div></div>
    <div class="card"><div class="bd"><div class="muted" style="font-size:11.5px">快照占用</div>
      <div style="font-size:22px;font-weight:700;line-height:1.5">${fmtBytes(SnapshotStore.bytes(snaps))}</div></div></div>
    <div class="card"><div class="bd"><div class="muted" style="font-size:11.5px">回收站</div>
      <div style="font-size:22px;font-weight:700;line-height:1.5">${trash.length} <span class="muted" style="font-size:13px;font-weight:400">条</span></div></div></div>
    <div class="card"><div class="bd"><div class="muted" style="font-size:11.5px">存储后端</div>
      <div style="font-size:15px;font-weight:700;line-height:2">${esc(SnapshotStore.label)}</div></div></div>`;
  const mt = $('#histMode'); if(mt) mt.textContent = SnapshotStore.label;
  const tt = $('#histTrashTag'); if(tt) tt.textContent = trash.length ? (trash.length + ' 条待处理') : '空';

  const sb = $('#histSnaps');
  if(sb){
    if(!snaps.length) sb.innerHTML = '<div class="muted">还没有快照。改动数据时会自动存档，也可以点右上角「立即打一份快照」。</div>';
    else sb.innerHTML = snaps.map((m, i) => {
      const c = m.counts || {};
      return `<div class="hrow">
        <div class="hmain">
          <div class="htitle">${esc(m.reason || '自动存档')}
            <span class="tag ${m.kind === 'manual' ? 't-green' : m.kind === 'key' ? 't-blue' : 't-gray'}">${esc(HIST_KIND_LABEL[m.kind] || m.kind || '')}</span>
            ${i === 0 ? '<span class="tag t-amber">最新</span>' : ''}</div>
          <div class="muted" style="font-size:12px;margin-top:3px">
            ${esc(fmtStamp(m.at))}（${esc(fmtAgo(m.at))}）　·　${fmtBytes(m.size)}
            　·　订单 ${c.orders || 0} · 排产 ${c.production || 0} · 客户 ${c.customers || 0}</div>
        </div>
        <div class="hact">
          <button class="btn sm" data-hist-go="${esc(m.id)}">↺ 回滚到这一份</button>
          <button class="btn sm" data-hist-drop="${esc(m.id)}">删除</button>
        </div></div>`; }).join('');
  }

  const tb = $('#histTrash');
  if(tb){
    if(!trash.length) tb.innerHTML = '<div class="muted">回收站是空的。删除的订单 / 排产 / 发货 / 跟进 / 客户 / 业务员会先放到这里。</div>';
    else tb.innerHTML = trash.map(e => `<div class="hrow">
      <div class="hmain">
        <div class="htitle">${esc(e.label || '记录')}
          <span class="tag t-gray">${(e.count || (e.items || []).length)} 条</span>
          ${(e.files || []).length ? '<span class="tag t-teal">含 ' + e.files.length + ' 个附件</span>' : ''}</div>
        <div class="muted" style="font-size:12px;margin-top:3px">
          ${esc(fmtStamp(e.at))}（${esc(fmtAgo(e.at))}）　·　${esc(trashSummary(e))}</div>
      </div>
      <div class="hact">
        <button class="btn sm" data-trash-back="${esc(e.id)}">↩ 还原</button>
        <button class="btn sm danger" data-trash-drop="${esc(e.id)}">彻底删除</button>
      </div></div>`).join('');
  }
  histBindRows();
}
/* 行内按钮直接绑定：列表异步渲染，且规模有限（快照 ≤30、回收站 ≤200），不必用委托 */
function histBindRows(){
  $$('[data-hist-go]').forEach(b => b.onclick = () => histDoRestore(b.dataset.histGo));
  $$('[data-hist-drop]').forEach(b => b.onclick = () => histDoDropSnap(b.dataset.histDrop));
  $$('[data-trash-back]').forEach(b => b.onclick = () => histDoTrashRestore(b.dataset.trashBack));
  $$('[data-trash-drop]').forEach(b => b.onclick = () => histDoTrashPurge(b.dataset.trashDrop));
}

async function histDoRestore(id){
  const list = await SnapshotStore.all();
  const m = list.find(x => x.id === id);
  if(!m){ toast('快照不存在（可能已被清理）'); return; }
  const snap = await SnapshotStore.get(id);
  if(!snap){ toast('快照内容已丢失（存储降级或被清理）'); return; }
  const diff = histDiff(snap);
  const lines = diff.length ? diff.map(d => '　' + d.label + '：' + d.cur + ' → ' + d.snap).join('\n')
                            : '　（各表记录数与当前一致）';
  if(!confirm('回滚到 ' + fmtStamp(m.at) + ' 的快照？\n\n快照内容：' + (m.reason || '自动存档') +
    '\n各表记录数变化：\n' + lines +
    '\n\n回滚会把整个数据库替换成这份快照的状态。\n（回滚前会自动先存一份当前状态，所以可以再回滚回来。）')) return;
  const r = await histRestore(id, m.reason);
  toast(r.ok ? ('已回滚到 ' + fmtStamp(m.at)) : ('回滚失败：' + r.msg));
  histRefresh();
}
async function histDoDropSnap(id){
  const list = await SnapshotStore.all();
  const m = list.find(x => x.id === id);
  if(!m) return;
  if(!confirm('删除这份快照？\n\n' + fmtStamp(m.at) + '　' + (m.reason || '') + '\n删除后无法再回滚到这个时间点。')) return;
  await SnapshotStore.del(id);
  toast('快照已删除');
  histRefresh();
}
async function histDoTrashRestore(id){
  const src = Store.state.source;
  if(!src || typeof src.restoreTrash !== 'function'){ toast('当前数据源不支持回收站'); return; }
  const list = await src.listTrash().catch(() => []);
  const e = list.find(x => x.id === id);
  if(!e){ toast('回收站里没有这条记录'); return; }
  if(!confirm('还原「' + (e.label || '记录') + '」？\n\n包含：' + trashSummary(e) +
    '\n共 ' + (e.count || (e.items || []).length) + ' 条记录，会放回原来的位置。')) return;
  const r = await src.restoreTrash(id);
  await reload();
  toast(r.ok ? ('已还原 ' + r.n + ' 条记录' + (r.skipped ? '（' + r.skipped + ' 条因主键已存在跳过）' : ''))
             : (r.msg || '还原失败'));
  histRefresh();
}
async function histDoTrashPurge(id){
  const src = Store.state.source;
  if(!src || typeof src.purgeTrash !== 'function'){ toast('当前数据源不支持回收站'); return; }
  const list = await src.listTrash().catch(() => []);
  const e = list.find(x => x.id === id);
  if(!e) return;
  if(!confirm('彻底删除「' + (e.label || '记录') + '」？\n\n将永久删除 ' + (e.count || (e.items || []).length) + ' 条记录' +
    ((e.files || []).length ? '及 ' + e.files.length + ' 个附件文件' : '') + '，不可恢复。')) return;
  const r = await src.purgeTrash(id);
  toast('已彻底删除' + (r && r.files ? '（含 ' + r.files + ' 个附件）' : ''));
  histRefresh();
}

function bindHistory(){
  histRefresh();
  const mk = $('#histMark'); if(mk) mk.onclick = async () => {
    mk.disabled = true;
    const m = await histManualMark('手动存档');
    mk.disabled = false;
    toast(m ? ('已存一份快照 · ' + fmtBytes(m.size)) : '打快照失败（存储不可用或空间不足），主数据未受影响');
    histRefresh();
  };

/* ==========================================================================
   模块 10 · S3 多端同步引擎（参考产品库 S3-sync-design，适配订单跟踪数据模型）
   - 纯浏览器：SigV4 签名（path / virtual-hosted 双寻址）、PBKDF2 + AES-GCM 加密
   - 快照含全部业务表 + 附件（base64 内联），端到端加密后上传
   - 记录级 _mtime 智能合并，支持写锁防并发覆盖
   ========================================================================== */
const SYNC_SCHEMA = 1;
const SYNC_PREFIX_DEFAULT = 'order-tracking/';
const SYNC_CFG_KEY = 'ot.sync.cfg.v1';
const SYNC_STATE_KEY = 'ot.sync.state.v1';
const SYNC_TABLES = ['orders','customers','owners','production','shipments','followups','file_attachment'];
const SyncModule = (function(){
  const DEFAULT_CFG = {
    enabled:false, preset:'', endpoint:'', region:'', bucket:'', prefix:SYNC_PREFIX_DEFAULT,
    addressing:'path', timeoutSec:30, accessKey:'', secretKeyEnc:'', passphraseEnc:'',
    mode:'manual', intervalMin:30, debounceMin:5, maxRetry:3, retryBackoffSec:5, conflict:'smart',
    includeOrders:true, includePayments:true, includeCustomers:true, includeOwners:true,
    includeProduction:true, includeShipments:true, includeFollowups:true, includeAttachments:true,
    rememberPass:true
  };
  let cfg = Object.assign({}, DEFAULT_CFG);
  let state = { lastSyncAt:0, lastSyncAtStr:'', lastDirection:'', lastError:'' };
  let inFlight = false, _cachedPass = '', autoTimer = null, debounceTimer = null;
  let logLines = [];

  /* ---- 基础工具 ---- */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function b64ToBuf(b64){ const s = atob(b64); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
  function bufToB64(buf){ const u = new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function nowAmz(){ const d = new Date(); const p=n=>String(n).padStart(2,'0');
    const a = d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z';
    return { amzDate:a, dateStamp:a.slice(0,8) }; }
  async function hmacSha256(keyBuf,data){ const ck=await crypto.subtle.importKey('raw',keyBuf,{name:'HMAC',hash:'SHA-256'},false,['sign']); return new Uint8Array(await crypto.subtle.sign('HMAC',ck,data)); }
  async function sha256Buf(data){ return new Uint8Array(await crypto.subtle.digest('SHA-256', data)); }
  async function hex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  async function deriveSigningKey(sk,dateStamp,region,service){ const enc=new TextEncoder(); let k=enc.encode('AWS4'+sk);
    k=await hmacSha256(k,enc.encode(dateStamp)); k=await hmacSha256(k,enc.encode(region));
    k=await hmacSha256(k,enc.encode(service)); k=await hmacSha256(k,enc.encode('aws4_request')); return k; }
  function encodeS3Path(p){ return String(p||'/').split('/').map(s=>encodeURIComponent(s)).join('/'); }
  function canonicalQuery(params){ if(!params) return '';
    return Object.entries(params).map(([k,v])=>[encodeURIComponent(k),encodeURIComponent(v)]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([k,v])=>k+'='+v).join('&'); }
  function inferRegionFromEndpoint(ep){ const s=String(ep||'');
    let m=s.match(/s3[.-]([a-z0-9-]+)\.qiniucs\.com/i); if(m) return m[1];
    m=s.match(/oss[.-]([a-z0-9-]+)\.aliyuncs\.com/i); if(m) return m[1];
    m=s.match(/cos[.-]([a-z0-9-]+)\.myqcloud\.com/i); if(m) return m[1];
    m=s.match(/s3[.-]([a-z0-9-]+)\.amazonaws\.com/i); if(m) return m[1];
    return ''; }
  function effectiveRegion(){ return String(cfg.region||'').trim() || inferRegionFromEndpoint(cfg.endpoint) || 'us-east-1'; }
  function buildUrl(key){ let base=cfg.endpoint.replace(/\/+$/,''); if(!/^https?:\/\//i.test(base)) base='https://'+base;
    if(cfg.addressing==='virtual'){ const u=new URL(base+'/_'); u.hostname=cfg.bucket+'.'+u.hostname; u.pathname='/'+key.replace(/^\/+/,''); return u.toString(); }
    return base+'/'+cfg.bucket+'/'+key.replace(/^\/+/,''); }
  /* 纯函数：供测试验证签名路径，不依赖 Web Crypto */
  function canonicalOf(key){ const url=buildUrl(key); const host=new URL(url).host;
    const objectPath='/' + String(key||'').replace(/^\/+/,'');
    const canonicalPath=(cfg.addressing==='virtual')?objectPath:('/'+cfg.bucket+objectPath);
    return { url, host, canonicalPath }; }
  async function sign(key, method, body, extraHeaders, query){ const { amzDate, dateStamp }=nowAmz();
    const url=buildUrl(key); const host=new URL(url).host;
    const bodyBytes=body==null?new Uint8Array(0):(typeof body==='string'?new TextEncoder().encode(body):body);
    const payloadHash=await hex(await sha256Buf(bodyBytes));
    const headers=Object.assign({ 'x-amz-date':amzDate, 'x-amz-content-sha256':payloadHash }, extraHeaders||{});
    const cHeaders={}; Object.keys(headers).forEach(k=>{ cHeaders[k.toLowerCase()]=(headers[k]||'').toString().trim(); });
    const allKeys=Object.keys(cHeaders).sort(); cHeaders['host']=host;
    const canonicalHeadersStr=allKeys.map(k=>k+':'+cHeaders[k].replace(/\s+/g,' ')).join('\n')+'\n';
    const signedHeadersList=allKeys.join(';');
    const objectPath='/' + String(key||'').replace(/^\/+/,'');
    const canonicalPath=(cfg.addressing==='virtual')?objectPath:('/'+cfg.bucket+objectPath);
    const region=effectiveRegion();
    const canonicalRequest=[method.toUpperCase(), encodeS3Path(canonicalPath), canonicalQuery(query), canonicalHeadersStr, signedHeadersList, payloadHash].join('\n');
    const scope=dateStamp+'/'+region+'/s3/aws4_request';
    const stringToSign=['AWS4-HMAC-SHA256', amzDate, scope, await hex(await sha256Buf(new TextEncoder().encode(canonicalRequest)))].join('\n');
    const sk=await deriveSigningKey(cfg._resolvedSecretKey, dateStamp, region, 's3');
    const sig=await hex(await hmacSha256(sk, new TextEncoder().encode(stringToSign)));
    const auth='AWS4-HMAC-SHA256 Credential='+cfg._resolvedAccessKey+'/'+scope+', SignedHeaders='+signedHeadersList+', Signature='+sig;
    const finalHeaders=Object.assign({},cHeaders,{'Authorization':auth}); delete finalHeaders.host;
    return { url, headers:finalHeaders, bodyBytes }; }
  async function s3Request(method,key,body,extraHeaders,query,attempt){ attempt=attempt||0;
    const sig=await sign(key,method,body,extraHeaders,query);
    const init={ method, headers:sig.headers }; if(body!=null) init.body=sig.bodyBytes;
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),(cfg.timeoutSec||30)*1000); init.signal=ctrl.signal;
    let resp;
    try{ resp=await fetch(sig.url,init); }
    catch(e){ clearTimeout(t); if(attempt<(cfg.maxRetry||0)){ await new Promise(r=>setTimeout(r,(cfg.retryBackoffSec||5)*1000)); return s3Request(method,key,body,extraHeaders,query,attempt+1); } throw new Error('网络错误：'+(e.message||e)); }
    clearTimeout(t);
    if(resp.status>=500 && attempt<(cfg.maxRetry||0)){ await new Promise(r=>setTimeout(r,(cfg.retryBackoffSec||5)*1000)); return s3Request(method,key,body,extraHeaders,query,attempt+1); }
    return resp; }
  async function s3ErrorDetail(resp){ try{ const txt=await resp.text(); const code=(txt.match(/<Code>([^<]*)<\/Code>/)||[])[1]; const msg=(txt.match(/<Message>([^<]*)<\/Message>/)||[])[1]; if(code) return code+(msg?': '+msg:''); if(txt&&txt.length<300) return txt; }catch(e){} return null; }

  /* ---- 加密 ---- */
  async function deriveWrapKey(passphrase,saltB64){ const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuf(saltB64),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
  async function wrapSecret(plaintext,passphrase){ if(!plaintext) return ''; const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveWrapKey(passphrase,bufToB64(salt)); const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plaintext));
    return { salt:bufToB64(salt), iv:bufToB64(iv), ct:bufToB64(ct) }; }
  async function unwrapSecret(wrapped,passphrase){ if(!wrapped||!wrapped.ct) return ''; try{ const key=await deriveWrapKey(passphrase,wrapped.salt);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(wrapped.iv)},key,b64ToBuf(wrapped.ct)); return new TextDecoder().decode(pt); }catch(e){ return ''; } }
  async function encryptJSON(obj,passphrase,saltB64){ const key=await deriveWrapKey(passphrase,saltB64); const iv=crypto.getRandomValues(new Uint8Array(12));
    const data=new TextEncoder().encode(JSON.stringify(obj)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);
    return { salt:saltB64, iv:bufToB64(iv), ct:bufToB64(ct), format:'aes-gcm+pbkdf2-v1' }; }
  async function decryptJSON(wrapped,passphrase){ if(!wrapped||wrapped.format!=='aes-gcm+pbkdf2-v1') throw new Error('不支持的加密格式');
    const key=await deriveWrapKey(passphrase,wrapped.salt); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(wrapped.iv)},key,b64ToBuf(wrapped.ct));
    return JSON.parse(new TextDecoder().decode(pt)); }
  async function randomSaltB64(){ return bufToB64(crypto.getRandomValues(new Uint8Array(16))); }

  /* ---- 配置持久化 ---- */
  function loadCfg(){ try{ const raw=localStorage.getItem(SYNC_CFG_KEY); if(raw) cfg=Object.assign({},DEFAULT_CFG,JSON.parse(raw)); }catch(e){}
    try{ const inj=window.__SYNC_CONFIG__; if(inj&&typeof inj==='object'){ const allow=['enabled','endpoint','region','bucket','prefix','addressing','timeoutSec','mode','intervalMin','debounceMin','maxRetry','retryBackoffSec','conflict','includeOrders','includePayments','includeCustomers','includeOwners','includeProduction','includeShipments','includeFollowups','includeAttachments']; for(const k of allow){ if(k in inj) cfg[k]=inj[k]; } } }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg)); }catch(e){} }
  function loadState(){ try{ const raw=localStorage.getItem(SYNC_STATE_KEY); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){} }
  function saveState(){ try{ localStorage.setItem(SYNC_STATE_KEY, JSON.stringify(state)); }catch(e){} }

  /* ---- v0.25 · 本机口令记忆（换设备导入一次配置后，下次打开免再输入） ----
     口令只存在本机浏览器 localStorage 里，用「设备标识」做流式异或混淆（不是加密，只为避免明文肉眼可见）。
     它绝不写进导出文件，也绝不随仓库分发；换设备仍需重新导入一次配置并输一次口令。 */
  const SYNC_PASS_KEY = 'ot.sync.pass.v1';
  function passKeyBytes(){ try{ return new TextEncoder().encode((getDeviceId()||'ot')+'|'+APP_NAME+'|pass-v1'); }catch(e){ return new Uint8Array([1]); } }
  function obfuscatePass(plain){ try{
      const data=new TextEncoder().encode(String(plain==null?'':plain)); const kb=passKeyBytes();
      const out=new Uint8Array(data.length); for(let i=0;i<data.length;i++) out[i]=data[i]^kb[i%kb.length];
      return bufToB64(out); }catch(e){ return ''; } }
  function deobfuscatePass(blob){ try{
      if(!blob) return ''; const data=new Uint8Array(b64ToBuf(blob)); const kb=passKeyBytes();
      const out=new Uint8Array(data.length); for(let i=0;i<data.length;i++) out[i]=data[i]^kb[i%kb.length];
      return new TextDecoder().decode(out); }catch(e){ return ''; } }
  function loadStoredPass(){ try{ const raw=localStorage.getItem(SYNC_PASS_KEY); if(!raw) return '';
      const o=JSON.parse(raw); return deobfuscatePass(o&&o.v); }catch(e){ return ''; } }
  function hasStoredPass(){ return !!loadStoredPass(); }
  function saveStoredPass(plain){ if(!plain) return false;
    try{ localStorage.setItem(SYNC_PASS_KEY, JSON.stringify({ v:obfuscatePass(plain), at:Date.now() })); return true; }catch(e){ return false; } }
  function clearStoredPass(){ try{ localStorage.removeItem(SYNC_PASS_KEY); return true; }catch(e){ return false; } }
  function syncPassStateText(){ const el=$('syncPassState'); if(el) el.textContent = hasStoredPass() ? '已记住（本机）' : '未记住'; }
  function forgetPass(){ clearStoredPass(); _cachedPass=''; syncPassStateText();
    syncLog('已清除本机记住的同步口令'); toast('已清除记住的口令，下次同步需重新输入', 2800); }

  /* ---- v0.21 · 同步配置导入 / 导出（换设备、换浏览器免手工重填） ----
     白名单：运行时派生的 _resolvedAccessKey / _resolvedSecretKey 绝不能落进文件，
     所以导出只按固定键名取值，绝不整份 JSON.stringify(cfg)。 */
  const CFG_EXPORT_FORMAT = 'order-tracking-sync-config-v1';
  const CFG_EXPORT_KEYS = ['enabled','preset','endpoint','region','bucket','prefix','addressing','timeoutSec',
    'mode','intervalMin','debounceMin','maxRetry','retryBackoffSec','conflict','includeOrders','includePayments',
    'includeCustomers','includeOwners','includeProduction','includeShipments','includeFollowups','includeAttachments'];
  const CFG_SECRET_KEYS = ['accessKey','secretKeyEnc','passphraseEnc'];
  const CFG_ALL_KEYS = CFG_EXPORT_KEYS.concat(CFG_SECRET_KEYS);
  /* 密钥类只显示「已配置 / 未配置」，绝不把密文内容写进确认框或日志 */
  function cfgShow(k, v){ return (k==='secretKeyEnc'||k==='passphraseEnc') ? (v?'已配置':'未配置') : String(v==null?'':v); }
  function cfgClip(s){ s=String(s==null?'':s); return s.length>30 ? s.slice(0,30)+'…' : (s||'（空）'); }
  function exportConfig(opts){
    const withSecret = !!(opts && opts.withSecret);
    const c = {};
    CFG_EXPORT_KEYS.forEach(k => { if(cfg[k] !== undefined) c[k] = cfg[k]; });
    if(withSecret) CFG_SECRET_KEYS.forEach(k => { c[k] = cfg[k] || ''; });
    return { _format:CFG_EXPORT_FORMAT, _app:APP_NAME, _version:APP_VERSION,
      exportedAt:Date.now(), exportedAtStr:fmtBeijing(), secretIncluded:withSecret, cfg:c };
  }
  /* 预演：不改动 cfg，只算「会变哪几项」，供确认框展示与测试断言 */
  function planImport(obj){
    if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok:false, msg:'文件内容不是合法的配置对象' };
    if(obj._format !== CFG_EXPORT_FORMAT) return { ok:false, msg:'不是本工作台导出的同步配置（缺少 '+CFG_EXPORT_FORMAT+' 标识）' };
    const src = (obj.cfg && typeof obj.cfg === 'object' && !Array.isArray(obj.cfg)) ? obj.cfg : {};
    const changed = [];
    CFG_ALL_KEYS.forEach(k => {
      if(!(k in src)) return;                       /* 白名单外的键一律忽略 */
      const a = cfg[k] == null ? '' : cfg[k], b = src[k] == null ? '' : src[k];
      const isSecret = CFG_SECRET_KEYS.indexOf(k) >= 0;
      /* 密钥类按「原始密文」判等：cfgShow 只回「已配置」，会让另一台设备换了口令后导出的
         配置被判成「内容一致、无需导入」，旧密钥留在本机永远同步不上。 */
      const same = isSecret ? (JSON.stringify(a) === JSON.stringify(b)) : (cfgShow(k,a) === cfgShow(k,b));
      if(same) return;
      const to = isSecret ? (!b ? '未配置' : (!a ? '已配置' : '已配置（内容已更新）')) : cfgShow(k, b);
      changed.push({ key:k, from:cfgShow(k, a), to });
    });
    return { ok:true, src, changed, secretIncluded:!!obj.secretIncluded, exportedAtStr:obj.exportedAtStr || '', version:obj._version || '' };
  }
  function importConfig(obj){
    const p = planImport(obj);
    if(!p.ok) return p;
    /* 密钥密文是否真的换了：比原始密文，不比 cfgShow 的「已配置」 */
    const secretChanged = !!p.secretIncluded && CFG_SECRET_KEYS.some(k => (k in p.src)
      && JSON.stringify(cfg[k] == null ? '' : cfg[k]) !== JSON.stringify(p.src[k] == null ? '' : p.src[k]));
    p.changed.forEach(c => { cfg[c.key] = p.src[c.key]; });   /* 只写白名单内的键 */
    /* 密钥密文换了 → 内存缓存与本机记住的口令一并清掉，下次同步重新询问一次 */
    if(secretChanged){ _cachedPass = ''; clearStoredPass(); }
    saveCfg(); fillCfgToUI(); renderPanel(); scheduleAuto();
    return { ok:true, changed:p.changed, secretIncluded:p.secretIncluded, secretChanged };
  }
  function cfgFileName(){ return '订单追踪_同步配置_' + fmtBeijing().slice(0,10).replace(/-/g,'') + '.json'; }
  function exportConfigFile(){
    try{
      const withSecret = !!getVal('syncCfgSecret');
      const json = JSON.stringify(exportConfig({ withSecret }), null, 2);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type:'application/json' }));
      a.download = cfgFileName(); a.click();
      syncLog('已导出同步配置' + (withSecret ? '（含 AccessKey 与密钥密文）' : '（不含密钥）'));
      toast(withSecret ? '已导出配置（含密钥，请妥善保管）' : '已导出配置（不含密钥）', 2600);
    }catch(e){ toast('导出失败：'+(e.message||e)); }
  }
  function importConfigFile(file){
    if(!file) return;
    const rd = new FileReader();
    rd.onerror = () => toast('配置文件读取失败');
    rd.onload = () => {
      let obj = null, jsonErr = false;
      try{ obj = JSON.parse(String(rd.result || '')); }catch(e){ jsonErr = true; }
      if(jsonErr){ toast('不是合法的 JSON 文件'); syncLog('导入失败：不是合法的 JSON 文件', true); return; }
      const p = planImport(obj);
      if(!p.ok){ toast(p.msg, 4200); syncLog('导入失败：'+p.msg, true); return; }
      if(!p.changed.length){ toast('配置与当前一致，无需导入'); syncLog('导入：内容与当前一致，已跳过（' + (file.name||'') + '）'); return; }
      const lines = p.changed.slice(0, 12).map(c => '· ' + c.key + '：' + cfgClip(c.from) + ' → ' + cfgClip(c.to));
      if(p.changed.length > 12) lines.push('· …另有 ' + (p.changed.length - 12) + ' 项');
      const tail = p.secretIncluded
        ? '\n本文件含 AccessKey 与密钥密文，导入后首次同步需输入一次「加密口令」；已开启「口令记忆」则之后免再输入。'
        : '\n本文件不含密钥，AccessKey / SecretKey / 加密口令需自行补填。';
      if(!confirm('即将导入同步配置（来自 ' + (p.version||'未知版本') + '，导出时间 ' + (p.exportedAtStr||'未知') + '）\n共 ' + p.changed.length + ' 项变化：\n\n'
        + lines.join('\n') + tail + '\n\n确认导入？')) { syncLog('导入已取消'); return; }
      const r = importConfig(obj);
      syncLog('已导入同步配置：' + r.changed.length + ' 项变化');
      toast('同步配置已导入（' + r.changed.length + ' 项）', 2800);
    };
    rd.readAsText(file);
  }

  /* ---- 快照 ---- */
  const cap = k => k.charAt(0).toUpperCase()+k.slice(1);
  function buildSnapshotShape(){ const snap={ _format:'order-tracking-sync-v1', schemaVersion:SYNC_SCHEMA, deviceId:getDeviceId(), createdAt:Date.now(), db:{}, attachments:[] };
    SYNC_TABLES.forEach(t => { const flag='include'+cap(t); if(cfg[flag]!==false) snap.db[t]=Store.state.data[t]||[]; });
    return snap; }
  async function collectAttachments(){ const ids=new Set(); const data=Store.state.data;
    (data.orders||[]).forEach(o=>{ (o.attachments||[]).forEach(a=>{ if(a&&a.id) ids.add(a.id); }); }); (data.file_attachment||[]).forEach(f=>{ if(f.id) ids.add(f.id); });
    const out=[]; for(const id of ids){ try{ const du=await FileStore.dataUrl(id); if(du) out.push({ id, meta:(data.file_attachment||[]).find(f=>f.id===id)||{}, dataUrl:du }); }catch(e){} } return out; }
  function mergeTables(local, remote){ const merged={}; SYNC_TABLES.forEach(t=>{ const L=new Map((local[t]||[]).map(r=>[r.id,r])); const R=new Map((remote[t]||[]).map(r=>[r.id,r]));
      const ids=new Set([...L.keys(),...R.keys()]); const out=[]; ids.forEach(id=>{ const l=L.get(id), r=R.get(id);
        if(!l) out.push(r); else if(!r) out.push(l);
        else { const lDel=!!l._deleted, rDel=!!r._deleted; if(lDel&&rDel) return; if(lDel){ out.push(r); return; } if(rDel){ out.push(l); return; }
               const lm=l._mtime||0, rm=r._mtime||0; out.push(lm>=rm?l:r); } }); merged[t]=out; });
    // 附件：取并集（本地缺的从远端补）
    const localAtt=new Map((local.file_attachment||[]).map(r=>[r.id,r])); const remoteAtt=new Map((remote.file_attachment||[]).map(r=>[r.id,r]));
    const attIds=new Set([...localAtt.keys(),...remoteAtt.keys()]); const att=[]; attIds.forEach(id=>{ att.push(localAtt.get(id)||remoteAtt.get(id)); }); merged.file_attachment=att;
    return merged; }
  function applyByStrategy(localDb, snap){ const strategy=cfg.conflict||'smart';
    let merged;
    if(strategy==='remote'){ merged={}; SYNC_TABLES.forEach(t=>{ const flag='include'+cap(t); merged[t]=flag!==false?(snap.db[t]||localDb[t]||[]):(localDb[t]||[]); }); }
    else if(strategy==='local'){ return null; } // 本地优先：不覆盖
    else { merged=mergeTables(localDb, snap.db); if(strategy==='ask') syncLog('冲突策略为「询问」，回退为智能合并（按记录 _mtime）'); }
    return merged; }

  /* ---- 锁 ---- */
  async function ensureLock(){ const lockKey=cfg.prefix+'locks/sync-lock.json'; const now=Date.now();
    try{ const r=await s3Request('GET',lockKey); if(r.ok){ const lock=await r.json(); if(lock&&lock.expiresAt&&lock.expiresAt>now&&lock.deviceId!==getDeviceId()) return false; } }catch(e){}
    const lockObj={ deviceId:getDeviceId(), acquiredAt:now, expiresAt:now+120000 };
    const wr=await s3Request('PUT',lockKey,JSON.stringify(lockObj),{'Content-Type':'application/json'}); return wr.ok; }
  async function releaseLock(){ const lockKey=cfg.prefix+'locks/sync-lock.json'; try{ const r=await s3Request('GET',lockKey); if(!r.ok) return; const lock=await r.json(); if(lock&&lock.deviceId===getDeviceId()) await s3Request('DELETE',lockKey); }catch(e){} }
  async function fetchLatest(){ const r=await s3Request('GET',cfg.prefix+'latest.json'); if(r.status===404) return null; if(!r.ok) throw new Error('读取清单失败 HTTP '+r.status); return r.json(); }
  async function prepareSecrets(){ if(!cfg.accessKey) throw new Error('请先填写 AccessKey'); if(!cfg.secretKeyEnc||!cfg.passphraseEnc) throw new Error('请先填写 SecretKey 与加密口令');
    /* v0.25：内存没有口令时先取本机记住的，取不到才弹窗 —— 这是「下次打开免再输入」的关键一环 */
    if(!_cachedPass) _cachedPass = loadStoredPass();
    if(!_cachedPass){ const p=prompt('请输入同步加密口令（可在「口令记忆」处勾选记住，之后免再输入）'); if(!p) throw new Error('已取消'); _cachedPass=p; }
    let sk=null, pc=null;
    try{ sk=await unwrapSecret(cfg.secretKeyEnc,_cachedPass); pc=await unwrapSecret(cfg.passphraseEnc,_cachedPass); }catch(e){ sk=null; pc=null; }
    if(!sk||!pc){ const had=hasStoredPass(); clearStoredPass(); _cachedPass='';
      throw new Error(had ? '加密口令错误：本机记住的口令已失效并已清除，请重新输入' : '加密口令错误'); }
    cfg._resolvedSecretKey=sk; cfg._resolvedAccessKey=cfg.accessKey;
    /* 只有验证通过的口令才会被记住 */
    if(cfg.rememberPass!==false) saveStoredPass(_cachedPass); }
  function fmtBeijing(d){ const dt=(d instanceof Date)?d:new Date(d||Date.now()); const bj=new Date(dt.getTime()+8*3600*1000); const p=n=>String(n).padStart(2,'0');
    return bj.getUTCFullYear()+'-'+p(bj.getUTCMonth()+1)+'-'+p(bj.getUTCDate())+' '+p(bj.getUTCHours())+':'+p(bj.getUTCMinutes())+':'+p(bj.getUTCSeconds()); }
  function syncLog(msg,isErr){ const line='['+fmtBeijing().split(' ')[1]+'] '+(isErr?'✗ ':'')+msg; logLines.push(line); if(logLines.length>200) logLines=logLines.slice(-200);
    const el=$('syncLog'); if(el) el.textContent=logLines.join('\n'); const ss=$('syncStatusLine'); if(ss) ss.textContent=isErr?('⚠️ '+msg.slice(0,48)):(state.lastSyncAt?('已同步 · '+fmtBeijing(state.lastSyncAt).slice(11,19)+(state.lastDirection==='up'?'（上传）':'（下载）')):'就绪'); }
  function setProgress(p){ const el=$('syncProgress'); if(el) el.style.width=(Math.max(0,Math.min(100,p*100)))+'%'; }
  function checkSecure(){ if(!window.isSecureContext){ syncLog('非安全上下文，无法使用 Web Crypto + S3（请用 https 或 localhost）',true); return false; } return true; }
  function checkRegionConsistency(){ const declared=String(cfg.region||'').trim(); const inferred=inferRegionFromEndpoint(cfg.endpoint);
    if(declared&&inferred&&declared.toLowerCase()!==inferred.toLowerCase()){ const m='⚠️ Region 与同步地址不匹配：同步地址属于「'+inferred+'」，但 Region 填的是「'+declared+'」'; syncLog(m,true); return false; } return true; }

  /* ---- 流量 ---- */
  async function syncUploadNow(opts){ if(!cfg.enabled) throw new Error('同步未启用'); if(!checkSecure()) throw new Error('非安全上下文');
    inFlight=true; renderPanel(); try{ await prepareSecrets(); setProgress(0.1); syncLog('开始上传…');
      const lockOk=await ensureLock(); if(!lockOk) throw new Error('写锁被其他设备占用，请稍后再试');
      setProgress(0.2); const snap=buildSnapshotShape(); if(cfg.includeAttachments) snap.attachments=await collectAttachments();
      const pass=_cachedPass; const salt=await randomSaltB64(); const enc=await encryptJSON(snap,pass,salt);
      setProgress(0.75); const ts=Date.now(); const snapKey=cfg.prefix+'snapshots/'+ts+'_'+getDeviceId()+'.enc';
      const r1=await s3Request('PUT',snapKey,JSON.stringify(enc),{'Content-Type':'application/json'}); if(!r1.ok) throw new Error('快照上传失败 HTTP '+r1.status);
      const latest={ _format:'order-tracking-sync-v1', schemaVersion:SYNC_SCHEMA, createdAt:ts, deviceId:getDeviceId(), snapshotKey:snapKey.replace(cfg.prefix,''), tables:Object.keys(snap.db) };
      const r2=await s3Request('PUT',cfg.prefix+'latest.json',JSON.stringify(latest),{'Content-Type':'application/json'}); if(!r2.ok) throw new Error('清单更新失败 HTTP '+r2.status);
      await releaseLock(); state.lastSyncAt=ts; state.lastSyncAtStr=fmtBeijing(ts); state.lastDirection='up'; state.lastError=''; saveState(); setProgress(1); syncLog('上传完成 ✓');
      if(!opts||!opts.silent) toast('已上传到云端',1800);
    } finally { inFlight=false; renderPanel(); } }
  async function syncDownloadNow(opts){ if(!cfg.enabled) throw new Error('同步未启用'); if(!checkSecure()) throw new Error('非安全上下文');
    inFlight=true; renderPanel(); try{ await prepareSecrets(); setProgress(0.1); syncLog('开始下载…');
      const latest=await fetchLatest(); if(!latest) throw new Error('远端尚无 latest.json，请先在另一台设备上传');
      setProgress(0.3); const snapResp=await s3Request('GET',cfg.prefix+latest.snapshotKey); if(!snapResp.ok) throw new Error('快照下载失败 HTTP '+snapResp.status);
      const enc=await snapResp.json(); const snap=await decryptJSON(enc,_cachedPass); setProgress(0.5);
      const strategy=cfg.conflict||'smart';
      if(strategy==='local'){ syncLog('冲突策略为「本地优先」，跳过覆盖'); }
      else { const merged=applyByStrategy(Store.state.data, snap); if(merged){ if(cfg.includeAttachments&&snap.attachments){ for(const a of snap.attachments){ try{ await FileStore.importFromDataUrl(a.id,a.dataUrl,a.meta); }catch(e){} } }
          await Store.state.source.replaceAll(merged); await reload(); syncLog('已合并并写入本地'); } else syncLog('本地优先：未改动本地数据'); }
      state.lastSyncAt=Date.now(); state.lastSyncAtStr=fmtBeijing(); state.lastDirection='down'; state.lastError=''; saveState(); setProgress(1); syncLog('下载完成 ✓');
      if(!opts||!opts.silent) toast('已从云端拉取最新',1800);
    } finally { inFlight=false; renderPanel(); } }
  async function syncTestConnection(){ if(!cfg.enabled){ toast('请先启用同步'); return; } if(!checkSecure()) return;
    const miss=validateSyncCfg(); if(miss.length){ toast('缺少配置：'+miss.join('、'),4000); return; } if(!checkRegionConsistency()) return;
    try{ await prepareSecrets(); syncLog('测试连接：'+cfg.endpoint+' / '+effectiveRegion()+' / '+cfg.bucket); const r=await s3Request('HEAD',cfg.prefix+'latest.json');
      if(r.status===200||r.status===404){ toast('连接成功（远端'+(r.status===404?'尚无数据':'已有数据')+'）',2400); syncLog('测试连接成功 ('+r.status+')'); }
      else { let d=await s3ErrorDetail(r); if(!d){ const r2=await s3Request('GET',cfg.prefix+'latest.json',null,{'Range':'bytes=0-511'}); d=await s3ErrorDetail(r2); } syncLog('连接异常：'+(d||r.status),true); toast('连接失败：'+(d||r.status)); }
    } catch(e){ syncLog('连接失败：'+e.message,true); toast('连接失败：'+e.message); } }
  const REGION_CANDIDATES=[ {name:'华东',endpoint:'https://s3.cn-east-1.qiniucs.com',region:'cn-east-1'},
    {name:'华东2',endpoint:'https://s3.cn-east-2.qiniucs.com',region:'cn-east-2'}, {name:'华北',endpoint:'https://s3.cn-north-1.qiniucs.com',region:'cn-north-1'},
    {name:'华南',endpoint:'https://s3.cn-south-1.qiniucs.com',region:'cn-south-1'}, {name:'北美',endpoint:'https://s3.us-north-1.qiniucs.com',region:'us-north-1'},
    {name:'新加坡',endpoint:'https://s3.ap-southeast-1.qiniucs.com',region:'ap-southeast-1'} ];
  async function syncAutoDetectRegion(){ if(!cfg.enabled){ toast('请先启用同步'); return; } if(!checkSecure()) return;
    const miss=validateSyncCfg().filter(m=>m!=='Region 区域'); if(miss.length){ toast('缺少配置：'+miss.join('、'),4000); return; }
    const btn=$('syncAutoRegion'); if(btn){ btn.disabled=true; btn.textContent='探测中…'; } inFlight=true; renderPanel();
    const key=cfg.prefix+'latest.json'; let found=null, allInvalidAK=true; const tried=[];
    try{ for(const c of REGION_CANDIDATES){ const probe=Object.assign({},cfg,{endpoint:c.endpoint,region:c.region,addressing:'path'});
        let status=0,code=''; try{ const r=await s3RequestWith(probe,'GET',key); status=r.status; if(r.status===200||r.status===404){ found=c; allInvalidAK=false; } else { const d=await s3ErrorDetail(r); if(/SignatureDoesNotMatch/i.test(d||'')) code='SignatureDoesNotMatch'; else if(/InvalidAccessKeyId/i.test(d||'')) code='InvalidAccessKeyId'; else if(/NoSuchBucket/i.test(d||'')) code='NoSuchBucket'; else code=(d||'').slice(0,60); if(code!=='InvalidAccessKeyId') allInvalidAK=false; } }
      catch(e){ code='网络错误'; allInvalidAK=false; } tried.push(c.name+':'+(status||'ERR')+(code?' '+code:'')); syncLog('  探测 '+c.name+' → HTTP '+status+(code?' '+code:'')); if(found) break; if(code==='InvalidAccessKeyId'){ syncLog('  AK 无效，换区域无意义，终止'); break; } } }
    finally { inFlight=false; renderPanel(); if(btn){ btn.disabled=false; btn.textContent='自动探测区域'; } }
    if(found){ cfg.endpoint=found.endpoint; cfg.region=found.region; cfg.addressing='path'; saveCfg(); fillCfgToUI(); const m='探测成功：桶位于「'+found.name+'」('+found.region+')，已自动填入'; toast(m,7000); syncLog(m); }
    else if(allInvalidAK){ const m='所有区域均返回 InvalidAccessKeyId：AccessKey 无效'; toast(m,8000); syncLog(m,true); }
    else { const m='未探测到匹配区域：'+tried.join(' | '); toast(m,9000); syncLog(m,true); } }
  /* 用给定 cfg 探测（不污染主 cfg） */
  async function s3RequestWith(c,method,key,body,extraHeaders,query){ const saved=cfg; cfg=c; try{ return await s3Request(method,key,body,extraHeaders,query); } finally{ cfg=saved; } }
  function validateSyncCfg(){ const miss=[]; if(!String(cfg.endpoint||'').trim()) miss.push('Endpoint'); if(!String(cfg.bucket||'').trim()) miss.push('Bucket'); if(!String(cfg.accessKey||'').trim()) miss.push('AccessKey'); if(!cfg.secretKeyEnc) miss.push('SecretKey'); if(!cfg.passphraseEnc) miss.push('加密口令'); if(!String(cfg.region||'').trim()&&!inferRegionFromEndpoint(cfg.endpoint)) miss.push('Region'); return miss; }

  /* ---- UI ---- */
  function setVal(id,v){ const el=$(id); if(!el) return; if(el.type==='checkbox') el.checked=!!v; else el.value=(v==null?'':v); }
  function getVal(id){ const el=$(id); if(!el) return null; return el.type==='checkbox'?el.checked:el.value; }
  function fillCfgToUI(){ setVal('syncEnabled',cfg.enabled); setVal('syncPreset',cfg.preset); setVal('syncEndpoint',cfg.endpoint); setVal('syncRegion',cfg.region);
    setVal('syncBucket',cfg.bucket); setVal('syncPrefix',cfg.prefix); setVal('syncAddressing',cfg.addressing); setVal('syncTimeout',cfg.timeoutSec);
    setVal('syncAccessKey',cfg.accessKey); setVal('syncSecretKey',''); setVal('syncPassphrase','');
    setVal('syncMode',cfg.mode); setVal('syncInterval',cfg.intervalMin); setVal('syncDebounce',cfg.debounceMin); setVal('syncConflict',cfg.conflict);
    setVal('syncRememberPass',cfg.rememberPass!==false); syncPassStateText();
    $$('#page [data-inc]').forEach(el=>{ const k=el.dataset.inc; el.checked=(cfg['include'+k]!==false); }); }
  function collectFromUI(){ cfg.enabled=!!getVal('syncEnabled'); cfg.preset=getVal('syncPreset')||''; cfg.endpoint=(getVal('syncEndpoint')||'').trim(); cfg.region=(getVal('syncRegion')||'').trim();
    cfg.bucket=(getVal('syncBucket')||'').trim(); cfg.prefix=(getVal('syncPrefix')||'').trim()||SYNC_PREFIX_DEFAULT; cfg.addressing=getVal('syncAddressing')||'path';
    cfg.timeoutSec=Math.max(5,parseInt(getVal('syncTimeout'),10)||30); cfg.accessKey=(getVal('syncAccessKey')||'').trim(); cfg.mode=getVal('syncMode')||'manual';
    cfg.intervalMin=Math.max(1,parseInt(getVal('syncInterval'),10)||30); cfg.debounceMin=Math.max(1,parseInt(getVal('syncDebounce'),10)||5);
    cfg.maxRetry=Math.max(0,parseInt(getVal('syncMaxRetry'),10)||0); cfg.retryBackoffSec=Math.max(1,parseInt(getVal('syncRetryBackoff'),10)||5);
    cfg.conflict=getVal('syncConflict')||'smart'; cfg.rememberPass=(getVal('syncRememberPass')!==false);
    $$('#page [data-inc]').forEach(el=>{ const k=el.dataset.inc; cfg['include'+k]=!!el.checked; }); }
  async function onConfigChange(){ collectFromUI();
    if(cfg.rememberPass===false) clearStoredPass();   /* 关掉开关顺手清掉已记住的口令 */
    if(typeof location!=='undefined'&&location.protocol==='https:'&&/^http:\/\//i.test(cfg.endpoint||'')) toast('Endpoint 必须 HTTPS',3200);
    const ns=(getVal('syncSecretKey')||'').trim(); const np=(getVal('syncPassphrase')||'').trim();
    if(ns){ if(!np){ toast('请先填加密口令再保存 Secret Key',2400); return; } cfg.secretKeyEnc=await wrapSecret(ns,np); cfg.passphraseEnc=await wrapSecret(np,np); _cachedPass=np; if(cfg.rememberPass!==false) saveStoredPass(np); }
    else if(np){ cfg.passphraseEnc=await wrapSecret(np,np); _cachedPass=np; if(cfg.rememberPass!==false) saveStoredPass(np); }
    saveCfg(); renderPanel(); scheduleAuto(); }
