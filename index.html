  /* ---- 配置持久化 ---- */
  function loadCfg(){ try{ const raw=localStorage.getItem(SYNC_CFG_KEY); if(raw) cfg=Object.assign({},DEFAULT_CFG,JSON.parse(raw)); }catch(e){}
    try{ const inj=window.__SYNC_CONFIG__; if(inj&&typeof inj==='object'){ const allow=['enabled','endpoint','region','bucket','prefix','addressing','timeoutSec','mode','intervalMin','debounceMin','maxRetry','retryBackoffSec','conflict','includeOrders','includePayments','includeCustomers','includeOwners','includeProduction','includeShipments','includeFollowups','includeAttachments']; for(const k of allow){ if(k in inj) cfg[k]=inj[k]; } } }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg)); }catch(e){} }
  function loadState(){ try{ const raw=localStorage.getItem(SYNC_STATE_KEY); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){} }
  function saveState(){ try{ localStorage.setItem(SYNC_STATE_KEY, JSON.stringify(state)); }catch(e){} }

  /* ---- v0.25 · 本机口令记忆（换设备导入一次配置后，下次打开免再输入） ----
     口令只存在本机浏览器 localStorage 里，用「设备标识」做流式异或混淆（不是加密，只为避免明文肉眼可见）。
     它绝不写进导出文件，也绝不随仓库分发；换设备仍需重新导入一次配置并输一次口令。 */
  const SYNC_PASS_KEY = 'ot.sync.pass.v1';
  /* ⚠ 盐值必须冻结在这里，**不要**跟着 APP_NAME 改。
     v0.39 把品牌名从「订单追踪工作台」改成「订单追踪台」；若盐值跟着变，
     此前「记住口令」存下的密文就再也解不开。改品牌名时勿动这个字面量。 */
  function passKeyBytes(){ try{ return new TextEncoder().encode((getDeviceId()||'ot')+'|订单追踪工作台|pass-v1'); }catch(e){ return new Uint8Array([1]); } }
  function obfuscatePass(plain){ try{
      const data=new TextEncoder().encode(String(plain==null?'':plain)); const kb=passKeyBytes();
      const out=new Uint8Array(data.length); for(let i=0;i<data.length;i++) out[i]=data[i]^kb[i%kb.length];
      return bufToB64(out); }catch(e){ return ''; } }
  function deobfuscatePass(blob){ try{
      if(!blob) return ''; const data=new Uint8Array(b64ToBuf(blob)); const kb=passKeyBytes();
      const out=new Uint8Array(data.length); for(let i=0;i<data.length;i++) out[i]=data[i]^kb[i%kb.length];
      return new TextDecoder().decode(out); }catch(e){ return ''; } }
  function loadStoredPass(){ try{ const raw=localStorage.getItem(SYNC_PASS_KEY); if(!raw) return '';
      const o=JSON.parse(raw); return deobfuscatePass(o&&o.v); }catch(e){ return ''; } }
  function hasStoredPass(){ return !!loadStoredPass(); }
  function saveStoredPass(plain){ if(!plain) return false;
    try{ localStorage.setItem(SYNC_PASS_KEY, JSON.stringify({ v:obfuscatePass(plain), at:Date.now() })); return true; }catch(e){ return false; } }
  function clearStoredPass(){ try{ localStorage.removeItem(SYNC_PASS_KEY); return true; }catch(e){ return false; } }
  function syncPassStateText(){ const el=$('syncPassState'); if(el) el.textContent = hasStoredPass() ? '已记住（本机）' : '未记住'; }
  function forgetPass(){ clearStoredPass(); _cachedPass=''; syncPassStateText();
    syncLog('已清除本机记住的同步口令'); toast('已清除记住的口令，下次同步需重新输入', 2800); }

  /* ---- v0.21 · 同步配置导入 / 导出（换设备、换浏览器免手工重填） ----
     白名单：运行时派生的 _resolvedAccessKey / _resolvedSecretKey 绝不能落进文件，
     所以导出只按固定键名取值，绝不整份 JSON.stringify(cfg)。 */
  const CFG_EXPORT_FORMAT = 'order-tracking-sync-config-v1';
  const CFG_EXPORT_KEYS = ['enabled','preset','endpoint','region','bucket','prefix','addressing','timeoutSec',
    'mode','intervalMin','debounceMin','maxRetry','retryBackoffSec','conflict','includeOrders','includePayments',
    'includeCustomers','includeOwners','includeProduction','includeShipments','includeFollowups','includeAttachments'];
  const CFG_SECRET_KEYS = ['accessKey','secretKeyEnc','passphraseEnc'];
  const CFG_ALL_KEYS = CFG_EXPORT_KEYS.concat(CFG_SECRET_KEYS);
  /* 密钥类只显示「已配置 / 未配置」，绝不把密文内容写进确认框或日志 */
  function cfgShow(k, v){ return (k==='secretKeyEnc'||k==='passphraseEnc') ? (v?'已配置':'未配置') : String(v==null?'':v); }
  function cfgClip(s){ s=String(s==null?'':s); return s.length>30 ? s.slice(0,30)+'…' : (s||'（空）'); }
  function exportConfig(opts){
    const withSecret = !!(opts && opts.withSecret);
    const c = {};
    CFG_EXPORT_KEYS.forEach(k => { if(cfg[k] !== undefined) c[k] = cfg[k]; });
    if(withSecret) CFG_SECRET_KEYS.forEach(k => { c[k] = cfg[k] || ''; });
    return { _format:CFG_EXPORT_FORMAT, _app:APP_NAME, _version:APP_VERSION,
      exportedAt:Date.now(), exportedAtStr:fmtBeijing(), secretIncluded:withSecret, cfg:c };
  }
  /* 预演：不改动 cfg，只算「会变哪几项」，供确认框展示与测试断言 */
  function planImport(obj){
    if(!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok:false, msg:'文件内容不是合法的配置对象' };
    if(obj._format !== CFG_EXPORT_FORMAT) return { ok:false, msg:'不是本工作台导出的同步配置（缺少 '+CFG_EXPORT_FORMAT+' 标识）' };
    const src = (obj.cfg && typeof obj.cfg === 'object' && !Array.isArray(obj.cfg)) ? obj.cfg : {};
    const changed = [];
    CFG_ALL_KEYS.forEach(k => {
      if(!(k in src)) return;                       /* 白名单外的键一律忽略 */
      const a = cfg[k] == null ? '' : cfg[k], b = src[k] == null ? '' : src[k];
      const isSecret = CFG_SECRET_KEYS.indexOf(k) >= 0;
      /* 密钥类按「原始密文」判等：cfgShow 只回「已配置」，会让另一台设备换了口令后导出的
         配置被判成「内容一致、无需导入」，旧密钥留在本机永远同步不上。 */
      const same = isSecret ? (JSON.stringify(a) === JSON.stringify(b)) : (cfgShow(k,a) === cfgShow(k,b));
      if(same) return;
      const to = isSecret ? (!b ? '未配置' : (!a ? '已配置' : '已配置（内容已更新）')) : cfgShow(k, b);
      changed.push({ key:k, from:cfgShow(k, a), to });
    });
    return { ok:true, src, changed, secretIncluded:!!obj.secretIncluded, exportedAtStr:obj.exportedAtStr || '', version:obj._version || '' };
  }
  function importConfig(obj){
    const p = planImport(obj);
    if(!p.ok) return p;
    /* 密钥密文是否真的换了：比原始密文，不比 cfgShow 的「已配置」 */
    const secretChanged = !!p.secretIncluded && CFG_SECRET_KEYS.some(k => (k in p.src)
      && JSON.stringify(cfg[k] == null ? '' : cfg[k]) !== JSON.stringify(p.src[k] == null ? '' : p.src[k]));
    p.changed.forEach(c => { cfg[c.key] = p.src[c.key]; });   /* 只写白名单内的键 */
    /* 密钥密文换了 → 内存缓存与本机记住的口令一并清掉，下次同步重新询问一次 */
    if(secretChanged){ _cachedPass = ''; clearStoredPass(); }
    saveCfg(); fillCfgToUI(); renderPanel(); scheduleAuto();
    return { ok:true, changed:p.changed, secretIncluded:p.secretIncluded, secretChanged };
  }
  function cfgFileName(){ return '订单追踪_同步配置_' + fmtBeijing().slice(0,10).replace(/-/g,'') + '.json'; }
  function exportConfigFile(){
    try{
      const withSecret = !!getVal('syncCfgSecret');
      const json = JSON.stringify(exportConfig({ withSecret }), null, 2);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type:'application/json' }));
      a.download = cfgFileName(); a.click();
      syncLog('已导出同步配置' + (withSecret ? '（含 AccessKey 与密钥密文）' : '（不含密钥）'));
      toast(withSecret ? '已导出配置（含密钥，请妥善保管）' : '已导出配置（不含密钥）', 2600);
    }catch(e){ toast('导出失败：'+(e.message||e)); }
  }
  function importConfigFile(file){
    if(!file) return;
    const rd = new FileReader();
    rd.onerror = () => toast('配置文件读取失败');
    rd.onload = () => {
      let obj = null, jsonErr = false;
      try{ obj = JSON.parse(String(rd.result || '')); }catch(e){ jsonErr = true; }
      if(jsonErr){ toast('不是合法的 JSON 文件'); syncLog('导入失败：不是合法的 JSON 文件', true); return; }
      const p = planImport(obj);
      if(!p.ok){ toast(p.msg, 4200); syncLog('导入失败：'+p.msg, true); return; }
      if(!p.changed.length){ toast('配置与当前一致，无需导入'); syncLog('导入：内容与当前一致，已跳过（' + (file.name||'') + '）'); return; }
      const lines = p.changed.slice(0, 12).map(c => '· ' + c.key + '：' + cfgClip(c.from) + ' → ' + cfgClip(c.to));
      if(p.changed.length > 12) lines.push('· …另有 ' + (p.changed.length - 12) + ' 项');
      const tail = p.secretIncluded
        ? '\n本文件含 AccessKey 与密钥密文，导入后首次同步需输入一次「加密口令」；已开启「口令记忆」则之后免再输入。'
        : '\n本文件不含密钥，AccessKey / SecretKey / 加密口令需自行补填。';
      if(!confirm('即将导入同步配置（来自 ' + (p.version||'未知版本') + '，导出时间 ' + (p.exportedAtStr||'未知') + '）\n共 ' + p.changed.length + ' 项变化：\n\n'
        + lines.join('\n') + tail + '\n\n确认导入？')) { syncLog('导入已取消'); return; }
      const r = importConfig(obj);
      syncLog('已导入同步配置：' + r.changed.length + ' 项变化');
      toast('同步配置已导入（' + r.changed.length + ' 项）', 2800);
    };
    rd.readAsText(file);
  }

  /* ---- 快照 ---- */
  const cap = k => k.charAt(0).toUpperCase()+k.slice(1);
  function buildSnapshotShape(){ const snap={ _format:'order-tracking-sync-v1', schemaVersion:SYNC_SCHEMA, deviceId:getDeviceId(), createdAt:Date.now(), db:{}, attachments:[] };
    SYNC_TABLES.forEach(t => { const flag='include'+cap(t); if(cfg[flag]!==false) snap.db[t]=Store.state.data[t]||[]; });
    return snap; }
  /* v0.47：产品图与包装文件也随快照走（base64 内联）。meta 从各自的产品行上取，
     不能只从 file_attachment 里找 —— 产品文件从来不在那张表里，找只会拿到空 meta、丢文件名。 */
  async function collectAttachments(){
    const ids = new Set(), metas = new Map();
    const data = Store.state.data;
    const addMeta = m => { if(m && m.id){ ids.add(m.id); metas.set(m.id, m); } };
    (data.orders||[]).forEach(o => (o.attachments||[]).forEach(addMeta));
    (data.custProducts||[]).forEach(p => {
      (p.images || []).forEach(id => { if(id) ids.add(id); });
      (p.packingFiles || []).forEach(addMeta);
    });
    (data.supplierProducts||[]).forEach(p => {
      (p.images || []).forEach(id => { if(id) ids.add(id); });
      (p.packingFiles || []).forEach(addMeta);
    });
    (data.file_attachment||[]).forEach(addMeta);
    const out = [];
    for(const id of ids){
      try{
        const du = await FileStore.dataUrl(id);
        if(du) out.push({ id, meta: metas.get(id) || (data.file_attachment||[]).find(f => f.id === id) || {}, dataUrl: du });
      }catch(e){}
    }
    return out;
  }
  function mergeTables(local, remote){ const merged={}; SYNC_TABLES.forEach(t=>{ const L=new Map((local[t]||[]).map(r=>[r.id,r])); const R=new Map((remote[t]||[]).map(r=>[r.id,r]));
      const ids=new Set([...L.keys(),...R.keys()]); const out=[]; ids.forEach(id=>{ const l=L.get(id), r=R.get(id);
        if(!l) out.push(r); else if(!r) out.push(l);
        else { const lDel=!!l._deleted, rDel=!!r._deleted; if(lDel&&rDel) return; if(lDel){ out.push(r); return; } if(rDel){ out.push(l); return; }
               const lm=l._mtime||0, rm=r._mtime||0; out.push(lm>=rm?l:r); } }); merged[t]=out; });
    // 附件：取并集（本地缺的从远端补）
    const localAtt=new Map((local.file_attachment||[]).map(r=>[r.id,r])); const remoteAtt=new Map((remote.file_attachment||[]).map(r=>[r.id,r]));
    const attIds=new Set([...localAtt.keys(),...remoteAtt.keys()]); const att=[]; attIds.forEach(id=>{ att.push(localAtt.get(id)||remoteAtt.get(id)); }); merged.file_attachment=att;
    return merged; }
  function applyByStrategy(localDb, snap){ const strategy=cfg.conflict||'smart';
    let merged;
    if(strategy==='remote'){ merged={}; SYNC_TABLES.forEach(t=>{ const flag='include'+cap(t); merged[t]=flag!==false?(snap.db[t]||localDb[t]||[]):(localDb[t]||[]); }); }
    else if(strategy==='local'){ return null; } // 本地优先：不覆盖
    else { merged=mergeTables(localDb, snap.db); if(strategy==='ask') syncLog('冲突策略为「询问」，回退为智能合并（按记录 _mtime）'); }
    return merged; }

  /* ---- 锁 ---- */
  async function ensureLock(){ const lockKey=cfg.prefix+'locks/sync-lock.json'; const now=Date.now();
    try{ const r=await s3Request('GET',lockKey); if(r.ok){ const lock=await r.json(); if(lock&&lock.expiresAt&&lock.expiresAt>now&&lock.deviceId!==getDeviceId()) return false; } }catch(e){}
    const lockObj={ deviceId:getDeviceId(), acquiredAt:now, expiresAt:now+120000 };
    const wr=await s3Request('PUT',lockKey,JSON.stringify(lockObj),{'Content-Type':'application/json'}); return wr.ok; }
  async function releaseLock(){ const lockKey=cfg.prefix+'locks/sync-lock.json'; try{ const r=await s3Request('GET',lockKey); if(!r.ok) return; const lock=await r.json(); if(lock&&lock.deviceId===getDeviceId()) await s3Request('DELETE',lockKey); }catch(e){} }
  async function fetchLatest(){ const r=await s3Request('GET',cfg.prefix+'latest.json'); if(r.status===404) return null; if(!r.ok) throw new Error('读取清单失败 HTTP '+r.status); return r.json(); }
  async function prepareSecrets(){ if(!cfg.accessKey) throw new Error('请先填写 AccessKey'); if(!cfg.secretKeyEnc||!cfg.passphraseEnc) throw new Error('请先填写 SecretKey 与加密口令');
    /* v0.25：内存没有口令时先取本机记住的，取不到才弹窗 —— 这是「下次打开免再输入」的关键一环 */
    if(!_cachedPass) _cachedPass = loadStoredPass();
    if(!_cachedPass){ const p=prompt('请输入同步加密口令（可在「口令记忆」处勾选记住，之后免再输入）'); if(!p) throw new Error('已取消'); _cachedPass=p; }
    let sk=null, pc=null;
    try{ sk=await unwrapSecret(cfg.secretKeyEnc,_cachedPass); pc=await unwrapSecret(cfg.passphraseEnc,_cachedPass); }catch(e){ sk=null; pc=null; }
    if(!sk||!pc){ const had=hasStoredPass(); clearStoredPass(); _cachedPass='';
      throw new Error(had ? '加密口令错误：本机记住的口令已失效并已清除，请重新输入' : '加密口令错误'); }
    cfg._resolvedSecretKey=sk; cfg._resolvedAccessKey=cfg.accessKey;
    /* 只有验证通过的口令才会被记住 */
    if(cfg.rememberPass!==false) saveStoredPass(_cachedPass); }
  function fmtBeijing(d){ const dt=(d instanceof Date)?d:new Date(d||Date.now()); const bj=new Date(dt.getTime()+8*3600*1000); const p=n=>String(n).padStart(2,'0');
    return bj.getUTCFullYear()+'-'+p(bj.getUTCMonth()+1)+'-'+p(bj.getUTCDate())+' '+p(bj.getUTCHours())+':'+p(bj.getUTCMinutes())+':'+p(bj.getUTCSeconds()); }
  function syncLog(msg,isErr){ const line='['+fmtBeijing().split(' ')[1]+'] '+(isErr?'✗ ':'')+msg; logLines.push(line); if(logLines.length>200) logLines=logLines.slice(-200);
    const el=$('syncLog'); if(el) el.textContent=logLines.join('\n'); const ss=$('syncStatusLine'); if(ss) ss.textContent=isErr?('⚠️ '+msg.slice(0,48)):(state.lastSyncAt?('已同步 · '+fmtBeijing(state.lastSyncAt).slice(11,19)+(state.lastDirection==='up'?'（上传）':'（下载）')):'就绪'); }
  function setProgress(p){ const el=$('syncProgress'); if(el) el.style.width=(Math.max(0,Math.min(100,p*100)))+'%'; }
  function checkSecure(){ if(!window.isSecureContext){ syncLog('非安全上下文，无法使用 Web Crypto + S3（请用 https 或 localhost）',true); return false; } return true; }
  function checkRegionConsistency(){ const declared=String(cfg.region||'').trim(); const inferred=inferRegionFromEndpoint(cfg.endpoint);
    if(declared&&inferred&&declared.toLowerCase()!==inferred.toLowerCase()){ const m='⚠️ Region 与同步地址不匹配：同步地址属于「'+inferred+'」，但 Region 填的是「'+declared+'」'; syncLog(m,true); return false; } return true; }

  /* ---- 流量 ---- */
  async function syncUploadNow(opts){ if(!cfg.enabled) throw new Error('同步未启用'); if(!checkSecure()) throw new Error('非安全上下文');
    inFlight=true; renderPanel(); try{ await prepareSecrets(); setProgress(0.1); syncLog('开始上传…');
      const lockOk=await ensureLock(); if(!lockOk) throw new Error('写锁被其他设备占用，请稍后再试');
      setProgress(0.2); const snap=buildSnapshotShape(); if(cfg.includeAttachments) snap.attachments=await collectAttachments();
      const pass=_cachedPass; const salt=await randomSaltB64(); const enc=await encryptJSON(snap,pass,salt);
      setProgress(0.75); const ts=Date.now(); const snapKey=cfg.prefix+'snapshots/'+ts+'_'+getDeviceId()+'.enc';
      const r1=await s3Request('PUT',snapKey,JSON.stringify(enc),{'Content-Type':'application/json'}); if(!r1.ok) throw new Error('快照上传失败 HTTP '+r1.status);
      const latest={ _format:'order-tracking-sync-v1', schemaVersion:SYNC_SCHEMA, createdAt:ts, deviceId:getDeviceId(), snapshotKey:snapKey.replace(cfg.prefix,''), tables:Object.keys(snap.db) };
      const r2=await s3Request('PUT',cfg.prefix+'latest.json',JSON.stringify(latest),{'Content-Type':'application/json'}); if(!r2.ok) throw new Error('清单更新失败 HTTP '+r2.status);
      await releaseLock(); state.lastSyncAt=ts; state.lastSyncAtStr=fmtBeijing(ts); state.lastDirection='up'; state.lastError=''; saveState(); setProgress(1); syncLog('上传完成 ✓');
      if(!opts||!opts.silent) toast('已上传到云端',1800);
    } finally { inFlight=false; renderPanel(); } }
  async function syncDownloadNow(opts){ if(!cfg.enabled) throw new Error('同步未启用'); if(!checkSecure()) throw new Error('非安全上下文');
    inFlight=true; renderPanel(); try{ await prepareSecrets(); setProgress(0.1); syncLog('开始下载…');
      const latest=await fetchLatest(); if(!latest) throw new Error('远端尚无 latest.json，请先在另一台设备上传');
      setProgress(0.3); const snapResp=await s3Request('GET',cfg.prefix+latest.snapshotKey); if(!snapResp.ok) throw new Error('快照下载失败 HTTP '+snapResp.status);
      const enc=await snapResp.json(); const snap=await decryptJSON(enc,_cachedPass); setProgress(0.5);
      const strategy=cfg.conflict||'smart';
      if(strategy==='local'){ syncLog('冲突策略为「本地优先」，跳过覆盖'); }
      else { const merged=applyByStrategy(Store.state.data, snap); if(merged){ if(cfg.includeAttachments&&snap.attachments){ for(const a of snap.attachments){ try{ await FileStore.importFromDataUrl(a.id,a.dataUrl,a.meta); }catch(e){} } }
          await Store.state.source.replaceAll(merged); await reload(); syncLog('已合并并写入本地'); } else syncLog('本地优先：未改动本地数据'); }
      state.lastSyncAt=Date.now(); state.lastSyncAtStr=fmtBeijing(); state.lastDirection='down'; state.lastError=''; saveState(); setProgress(1); syncLog('下载完成 ✓');
      if(!opts||!opts.silent) toast('已从云端拉取最新',1800);
    } finally { inFlight=false; renderPanel(); } }
  async function syncTestConnection(){ if(!cfg.enabled){ toast('请先启用同步'); return; } if(!checkSecure()) return;
    const miss=validateSyncCfg(); if(miss.length){ toast('缺少配置：'+miss.join('、'),4000); return; } if(!checkRegionConsistency()) return;
    try{ await prepareSecrets(); syncLog('测试连接：'+cfg.endpoint+' / '+effectiveRegion()+' / '+cfg.bucket); const r=await s3Request('HEAD',cfg.prefix+'latest.json');
      if(r.status===200||r.status===404){ toast('连接成功（远端'+(r.status===404?'尚无数据':'已有数据')+'）',2400); syncLog('测试连接成功 ('+r.status+')'); }
      else { let d=await s3ErrorDetail(r); if(!d){ const r2=await s3Request('GET',cfg.prefix+'latest.json',null,{'Range':'bytes=0-511'}); d=await s3ErrorDetail(r2); } syncLog('连接异常：'+(d||r.status),true); toast('连接失败：'+(d||r.status)); }
    } catch(e){ syncLog('连接失败：'+e.message,true); toast('连接失败：'+e.message); } }
  const REGION_CANDIDATES=[ {name:'华东',endpoint:'https://s3.cn-east-1.qiniucs.com',region:'cn-east-1'},
    {name:'华东2',endpoint:'https://s3.cn-east-2.qiniucs.com',region:'cn-east-2'}, {name:'华北',endpoint:'https://s3.cn-north-1.qiniucs.com',region:'cn-north-1'},
    {name:'华南',endpoint:'https://s3.cn-south-1.qiniucs.com',region:'cn-south-1'}, {name:'北美',endpoint:'https://s3.us-north-1.qiniucs.com',region:'us-north-1'},
    {name:'新加坡',endpoint:'https://s3.ap-southeast-1.qiniucs.com',region:'ap-southeast-1'} ];
  async function syncAutoDetectRegion(){ if(!cfg.enabled){ toast('请先启用同步'); return; } if(!checkSecure()) return;
    const miss=validateSyncCfg().filter(m=>m!=='Region 区域'); if(miss.length){ toast('缺少配置：'+miss.join('、'),4000); return; }
    const btn=$('syncAutoRegion'); if(btn){ btn.disabled=true; btn.textContent='探测中…'; } inFlight=true; renderPanel();
    const key=cfg.prefix+'latest.json'; let found=null, allInvalidAK=true; const tried=[];
