    '★ <b>顺带堵住一个会改数的坑</b>：保存订单时原来无条件回写这四个字段。表单收起它们之后，<code>values</code> 里读到的就是空值 —— 一保存就会把<b>镜像付款日抹掉</b>、把「差额已结清」<b>重置成未结清</b>，未收金额凭空跳高（实测「订金金额 = 0 但记过订金流水」的单必中）。现在有流水的单保存时<b>完全不碰这四个键</b>。',
    '★ <b>表单顶部的回款预览条跟着换口径</b>：有流水的单显示「已收 / 未收 / N 笔流水」，不再显示「订金 未付 / 尾款 未付」—— 否则回款页明明收到钱了，表单上却说一分没收。',
    '★ <b>登记回款时超收要确认</b>：累计到账超过订单金额（预收下批货款、客户抹零补款都合法）不会被硬拦，但会先弹确认框写明「已收 + 本次 = 合计 > 订单金额（超 X）」。与发货的「超发确认」对齐 —— 分次回款最容易犯的错就是多打一位数。',
    '★ <b>自动出货单号不再自己撞自己</b>：单号留空时由系统生成，原来生成撞号后直接弹「单号已被占用」—— 号是系统起的，却要用户自己想一个。现在<b>生成时就循环避开已占用号段</b>，留空连开两单也不会互相打架。',
    '★ <b>云端同步的表清单补上「回款」</b>：<code>includePayments</code> 这个开关早就在配置里默认开着，但设置页一直没有对应的勾选框 —— 想单独关掉回款同步无处可点。现在「同步设置 → 参与同步的表」里有「回款」了。',
  ]},
  { v:'v0.55', date:'2026-10-20', cat:'分次回款流水 · 分批发货多单号', cur:false, items:[
    '★ <b>回款可以分次数登记</b>：原来是订单上「订金一笔 + 尾款一笔」两个固定字段，装不下第三笔。现在改成<b>回款流水</b>——一笔到账一条记录，各自记 <b>日期 / 金额 / 款项类型 / 回款方式 / 流水号 / 备注</b>。已收 = 各笔合计，未收 = 订单金额 − 已收，回款率按笔推进。分批出货、多次汇款的标准场景终于对得上了。',
    '★ <b>回款中心与详情页都换成流水口径</b>：回款中心的表格由「订金 / 订金付款日 / 尾款 / 尾款付款日 / 实收尾款」改为 <b>已收 / 未收 / 笔数 / 最近回款 / 回款率 / 状态</b>（状态新增「部分回款 N%」）；订单详情新增「回款流水」分组，逐笔列出、可单独删除，点「＋ 登记回款」进的弹层里能连着登记多笔，关掉还回到原详情。',
    '★ <b>老订单零迁移、金额一分不变</b>：没有流水的订单仍按原来的「订金 / 尾款 / 差额结清」四字段算，历史数字与既有回归断言完全不受影响；<b>第一次</b>给它登记新流水时，系统自动把「订金付款日 / 尾款付款日」补成两笔流水（备注写「由原…自动补录」），所以不会出现「一登记就少了一笔钱」。删除最后一笔流水则回到「未收」。',
    '★ <b>支持分批出货、多个出货单号</b>：一个订单可以挂任意多条发货记录、各自一个出货单号（单号全局唯一，重复会被拦下）。发货表单默认金额改为<b>剩余未发金额</b>（原来默认整单金额，最容易把分批记成整单），抬头直接给出「订单 / 已发 / 剩余可发 / 已登记单号」。',
    '★ <b>累计超发只提示、不硬拦</b>：改单加量、赠品、运费都会让累计发货金额与订单金额对不上，所以超发时弹确认框（确认后照存），详情页把「超发」标成红色；发过但没发完时订单头变成「部分发货」，发货分组有「已发 / 订单 / 出货单号数 / 剩余未发 + 进度条」。',
    '★ 回款流水进 S3 快照、回收站与整组删除：删订单时它的流水跟着进回收站，可整组还原；清空业务数据时一并清掉，不留孤儿记录。',
  ]},
  { v:'v0.54', date:'2026-10-20', cat:'工作台可重命名 · 顶栏当日日期星期', cur:false, items:[
    '★ <b>工作台可以重命名</b>：侧栏左上角标题旁边出现<b>铅笔</b>（鼠标移上去才显形），双击标题也行 —— 弹层里改名，保存后<b>侧栏标题、浏览器标签页、桌面通知标题、思源同步库说明</b>一起变（它们引用同一个常量 <code>APP_NAME</code>）。名字存 <code>ot.appname.v1</code>，刷新 / 换页都还记得，清空保存即恢复默认「订单追踪台」。',
    '★ <b>改名不动任何技术标识</b>：导出文件的 <code>_format</code> 盐值、IndexedDB 库名、<code>ot.*</code> 存储键全都与名字无关 —— 改名不会让已有订单 / 产品 / 图片「对不上」，也不会让 S3 同步失败。',
    '★ <b>名字做了清洗与限长</b>：控制字符（换行、Tab）一律剔除 —— 否则侧栏标题会塌成两行、<code>document.title</code> 也会折行；连续空格压成一个，最长 24 字，超长用省略号收尾。',
    '★ <b>顶栏显示当日日期与星期</b>：如「<code>2026年10月20日 星期二</code>」，周末把星期标红；窄屏自动收成「<code>10-20 周二</code>」不挤占按钮。日期取<b>本地时区</b>（不走 UTC，东八区早上 8 点前不会显示成前一天）；跨零点由<b>任意操作 / 切回标签页 / 页面重渲染</b>自动校准，同一日只短路比较、不碰 DOM。',
  ]},
  { v:'v0.53', date:'2026-10-20', cat:'操作按钮固定在题头 · 长表单不用滚到底', cur:false, items:[
    '★ <b>「保存」「取消」搬到表单题头</b>：产品库的编辑表单字段多（基础信息 + 包装资料 + 产品图 + 包装文件），原来按钮压在最底部，<b>每次保存都得先滚到底</b>。现在和「编辑」「删除」放在同一行 —— 题头是<b>吸顶</b>的，内容滚多远按钮都在。',
    '★ <b>产品详情题头的「编辑」「删除」本来就在吸顶行</b>（<code>.hd</code> 一直是 <code>position:sticky</code>），这次一并核对过遮罩模式与分屏模式两种形态，滚动时都不跑。',
    '★ <b>标题给按钮让位</b>：<code>.hd</code> 里标题过长时用省略号收尾，按钮与关闭键标了 <code>flex:none</code> —— 420px 窄屏也不会因为标题长把「保存」挤出可视区。',
    '★ <b>底部那行「保存 / 取消」直接删掉</b>，不做两处重复按钮 —— 同一表单两个保存键，误点哪个都容易懵。'
  ]},
  { v:'v0.52', date:'2026-10-20', cat:'供应商 SKU 可重复 · 产品库排序记忆', cur:false, items:[
    '★ <b>供应商产品库允许 SKU 重复</b>：新增 / 编辑供应商产品时不再拦「SKU 已存在」，同一个 SKU 可以建多条（对应不同工厂型号、不同报价、不同批次）。<b>客户产品库仍要求 SKU 唯一</b> —— 客户侧 SKU 是对客报价编码，重复了报价单和订单就指不清。',
    '★ <b>导入的定位口径跟着一起改</b>：客户产品按 SKU 命中即更新（老行为不变）；供应商产品改成按「<b>SKU + 归属供应商</b>」定位，且<b>只有唯一命中才更新</b>。同一组合已有两三条时（说明你是有意重复录入的），本次一律<b>追加</b>，不去猜该覆盖哪一条 —— 宁可多一行，也不静默改错价格。',
    '★ <b>同 SKU 排序不再随机换位</b>：原来排序打平时只拿 SKU 兜底，重复 SKU 的行每次排序顺序都可能变；现在补了一级 <code>id</code> 兜底，同样的数据每次打开顺序完全一致。',
    '★ <b>产品库排序有记忆了</b>：点列头排「价格降序」，刷新页面、关掉重开、切到别的页再回来，<b>还是价格降序</b> —— 客户产品库和供应商产品库各记各的，互不覆盖。存 <code>localStorage</code> 的 <code>ot.psort.v1</code>。',
    '★ <b>排序记忆不复用 <code>ot.sort.v1</code></b>：那个键由订单 / 排产两页整体重写，产品库混进去会被下一次点订单页列头顺手抹掉。字段表校验照旧 —— 脏数据或旧版本写进去的键，一律退回「按更新时间倒序」。'
  ]},
  { v:'v0.51', date:'2026-10-20', cat:'产品图放大预览 · 表格宽度摊平', cur:false, items:[
    '★ <b>产品图可以点开看大图</b>：列表缩略图、产品详情的主图、编辑表单里的图片，点一下弹出全屏预览（等比缩放到视口内，小图不会被强行放大）。<b>点任意处 / 右上「×」/ Esc</b> 关闭。',
    '★ <b>点缩略图不会再顺带打开详情</b>：列表整行绑着「点行开详情」，放大监听走<b>捕获阶段</b>并截住事件 —— 看大图就只看大图，要详情照旧点行里别的位置。',
    '★ <b>修「搜索只剩两三个产品时页面变窄」</b>：根因是列宽总和小于容器宽时，表格就只占那么宽（<code>table-layout:fixed</code> 按列宽走），右边空出一大片 —— 搜索结果越少越明显，拖过列宽之后更容易出现。现在<b>列宽总和不足容器时按比例摊回</b>，表格始终撑满。',
    '★ <b>摊平只做加法</b>：列宽总和超过容器时一个字都不动（该出现的横向滚动条照旧出现），绝不压缩你拖好的列；产品图列宽被 CSS 钉死 56px，不参与分摊；四舍五入的余数补给最宽的一列，避免差 1px 又冒出横向滚动条。',
    '★ <b>摊平值不写进记忆</b>：拖动列宽存的是你亲手拖出来的值，摊平只是渲染时的补足 —— 换设备 / 重开页面不会把「补宽的列」当成你的偏好。',
    '★ <b>搜索后列表卡片不再往下塌</b>：结果从 20 条筛到 2 条时，表格高度取刷新前的值作下限，页面不会「缩一下」再弹回来；清空搜索自然长回去，缩小窗口由下一次渲染复位。'
  ]},
  { v:'v0.50', date:'2026-10-20', cat:'滚动位置保持 · 重渲染不再跳回顶部', cur:false, items:[
    '★ <b>修「改个数据页面就弹回最上面」</b>。原来每次重渲染都用 <code>innerHTML</code> 整块换掉内容区：内容在一瞬间变空 → <code>scrollHeight</code> 归零 → 浏览器把 <code>scrollTop</code> 钳成 0，新内容填回来也不会自己回到原处。所以<b>改订购状态、点「重新载入」、切排序、在筛选里敲一个字</b>，都会把人踢回顶部。',
    '★ <b>做法</b>：重建前先记下「已经滚过的容器」及其 <code>scrollTop / scrollLeft</code>，重建后按 <b>DOM 路径</b>找回来写回。只记滚过的（正常也就 1~3 处），开销可以忽略；路径认节点位置不认节点本身，所以重建多少次都命中。',
    '★ <b>恢复排在高度自适应之后</b>：内容区高度是实测回写的，提前写 <code>scrollTop</code> 会被那一瞬间的中间高度钳住；再补一帧兜住缩略图 / 字体晚一帧才撑开的高度。补帧只补「还是 0」的位置，<b>不会覆盖你正在进行的滚动</b>。',
    '★ <b>卡片内表格也一起保</b>：产品库 / 客户 / 供应商这类卡片里的表（<code>.tw.tscroll</code>）换 <code>thead</code> / <code>tbody</code> 时同样会被钳到 0，现在一并恢复 —— 筛选、排序、改状态后停在原处。',
    '★ <b>该跳的地方还跳</b>：点侧栏切页仍然回到顶部 —— 那是主动换视图，继承上一页的位置反而莫名其妙。滚动位置<b>只在你主动操作时改变</b>：滚轮 / 拖滚动条 / 点右下角「回到顶部」。',
    '★ <b>结构真变了就不动</b>：列表被筛短、区块增删导致路径对不上时直接放弃恢复 —— 宁可停在浏览器算出来的合法位置，也不乱滚到别处。'
  ]},
  { v:'v0.49', date:'2026-10-19', cat:'导入编码修复 · 泰文 / UTF-16 / 粘贴导入', cur:false, items:[
    '★ <b>修「导入后泰文变问号」</b>。两种成因，分开处理：① 文件其实是 <b>TIS-620 / Windows-874</b>（Excel 泰文版的默认 ANSI），原来一律按 GBK 解 → 得到一串乱码汉字，看着像「不认识泰文」；② 更常见的是<b>字在保存那一步就丢了</b> —— Excel「CSV(逗号分隔)」用系统 ANSI 写文件时，泰文/中文无法表示，直接写成 <code>?</code>，此时文件里就是问号，任何解码器都还原不了。',
    '★ <b>编码探测重写</b>：BOM（UTF-8 / UTF-16LE / UTF-16BE）→ UTF-8 严格解码 → 无 BOM 的 UTF-16（看 `0x00` 分布）→ GBK / BIG5 / Windows-874 按「替换符 + 控制字符最少、泰文最多」打分挑选。**编码可手动指定**（自动 / UTF-8 / GBK / BIG5 / TIS-620 / UTF-16），选过就记住（`ot.impenv.v1`）—— 做泰文业务只需选一次。',
    '★ <b>导入前先看预览</b>：选完文件不再直接落库，先弹预览层 —— <b>前 4 行原文 + 识别到的数据行数 + 分隔符 + 编码</b>。切编码即时重解、预览跟着变，乱码一眼就能看出来。<b>表头缺 SKU / 归属列、没有数据行时「导入」按钮直接禁用</b>。',
    '★ <b>新增「粘贴表格导入」</b>（本次泰文问题的根治方案）：在 Excel 里选中区域 <b>Ctrl+C</b>，粘进弹层 —— <b>走剪贴板（UTF-16），不经过任何文件编码，泰文一个字都不会丢</b>，也不用管另存为什么格式。',
    '★ <b>文本体检</b>：预览层会统计「连续问号」与「替换符 �」—— 前者直接判定「源文件已丢字，换编码没用，请改用粘贴导入」，后者提示「编码选错了，换一个编码再看」。',
    '★ 顺带支持 <b>制表符分隔（TSV）</b>：按首行自动判断逗号还是制表符，`.csv` / `.txt` / `.tsv` 都能导 —— Excel「另存为 Unicode 文本」出来的就是 UTF-16 + Tab，现在可以直接导。',
    '菜单与提示文案改口径：<b>「Excel 填完请另存为 CSV UTF-8」</b>，并明确写着问号的成因与替代路径 —— 免得下次又以为是系统不认识泰文。'
  ]},
  { v:'v0.48', date:'2026-10-19', cat:'产品库交互 · 粘贴拖拽 / 列宽记忆 / 对齐 / CSV 导入导出', cur:false, items:[
    '★ <b>产品图支持拖拽与粘贴</b>：产品图区整个网格都是投放区（拖进去虚线高亮），也可以直接 <b>Ctrl+V 粘贴截图</b>；剪贴板里没有扩展名的图会被自动补名（`粘贴-时间戳.png`），不会因为「格式不支持」白丢。',
    '★ <b>包装文件同样三种来源</b>：点选 / 拖入 / <b>Ctrl+V 粘贴</b>。粘贴去向按「鼠标最后停在哪块」判断 —— 停在包装文件区就全进包装文件；否则图片进产品图、Excel / Word / PDF / ZIP 进包装文件。<b>纯文字粘贴一律放过</b>，不会抢备注、箱唛输入框的 Ctrl+V。',
    '★ <b>产品库列宽可拖动并记忆</b>：拖列头右边缘实时改宽，松手写 `ot.colw.v1`；<b>客户产品 / 供应商产品各存一套</b>（`cprod` / `sprod`），互不覆盖，排序或搜索重绘后不丢。产品图列宽度是缩略图 + 内边距钉死的，不给把手（免得「拖了没反应」）。',
    '★ <b>文字对齐左 / 中 / 右</b>：工具栏三段切换，整表生效并记忆（`ot.palign.v1`）。只影响产品库两张表；数字列原本默认右对齐，手动切过之后以你的选择为准。',
    '★ <b>产品列表导入导出</b>：导出<b>导入模版</b>（20 列表头 + 1 行示例）、导出<b>当前列表</b>（与页面同排序、同筛选结果）、<b>导入 CSV</b>。导入按 <b>SKU upsert</b>：同库内 SKU 相同 → 更新，不同 → 新增；归属按 名称 / 简称 / 编码 匹配，<b>匹配不到整行跳过并报行号</b>，不造孤儿产品。',
    '导入的<b>状态时间口径与表单一致</b>：订购状态没变就保留原 <code>statusAt</code>，变了才刷今天 —— 批量导入不会把整库的「订购状态更新时间」一次性刷平。中文 Excel 另存的 <b>GBK 编码 CSV 也能读</b>（UTF-8 解码失败自动改 GBK）。',
    '导出的 CSV 带 BOM，Excel 双击打开中文不乱码；模版里那行示例是<b>真实可导入</b>的完整值，导入前删掉即可。'
  ]},
  { v:'v0.47', date:'2026-10-19', cat:'产品库 · 客户产品 / 供应商产品 / 供应商档案', cur:false, items:[
    '★ <b>新增两张产品库</b>：<b>客户产品库</b>（挂客户，客户型号为主）与<b>供应商产品库</b>（挂供应商，工厂型号为主）。两张<b>独立表</b>，各自维护价格 / MOQ / 订购状态；客户产品详情里可以挂一条「对应供应商产品」软链接，一个客户型号对多个工厂时拆成多条供应商产品即可，不做多对多中间表。',
    '★ <b>产品字段</b>：SKU、品名、<b>客户型号</b>、<b>工厂型号</b>、产品图（多张，首张为主图）、价格、币种、MOQ、单位、<b>订购状态</b>与<b>订购状态更新时间</b>。状态 4 档：在售 / 待定 / 停产 / 打样中 —— <b>状态一变就自动刷新更新时间</b>，不用手填。',
    '★ <b>产品详情页</b>分三段：基础信息 + 产品图（大图 + 缩略图条）、<b>包装资料</b>（包装方式 / 装箱数 / 外箱尺寸 / 净重 / 毛重 / 单箱体积 / 包装材料 / 箱唛 / 备注）、<b>包装文件</b>（可上传 PDF / Excel / Word / CSV / ZIP / 图片，单个 ≤ 10MB，可预览可下载）。',
    '★ <b>新增供应商档案</b>：编码、全称、简称、主营类别、联系人、电话、邮箱、地址、付款账期、常规交期、评级、合作状态、备注；列表带「产品数」汇总，详情页列出该供应商的全部产品。删除供应商 / 客户时若名下仍有产品会被拦下（先移产品或停用）。',
    '★ <b>客户档案打通产品维度</b>：客户详情页新增「该客户产品」区块，直接看到产品的 SKU / 客户型号 / 价格 / MOQ / 订购状态，点击进产品详情。',
    '★ <b>列表交互</b>：产品表 <b>点列头排序</b>（SKU / 客户型号 / 工厂型号 / 归属 / 价格 / MOQ / 更新时间），搜索覆盖 SKU / 品名 / 双型号 / 归属名称；汇总行统计各状态数量与<b>缺图产品数</b>。',
    '★ 数据层：`suppliers` / `custProducts` / `supplierProducts` 三张新表进 SCHEMA，随数据源适配器一起读写；回收站与历史快照自动覆盖新表；附件白名单改为可选参数，订单附件仍只收 PDF / JPG / PNG。',
    '★ <b>S3 多端同步补上产品库</b>：快照的表清单加了三张新表，<b>产品图与包装文件随附件一起加密上行</b>（原来只收订单附件 —— 不加的话换设备后产品一条都看不到、图全裂）。回收站的文件收集也从写死的 `attachments` 改成统一出口 `rowFileIds()`（订单附件 + 产品图 + 包装文件），删产品不再留孤儿文件。'
  ]},
  { v:'v0.46', date:'2026-09-30', cat:'进度由状态决定 · 提示栏去跳转按钮', cur:false, items:[
    '★ <b>进度改为按状态显示</b>：<b>待排产 0% · 生产中 30% · 已暂停 50% · 已完工 100%</b>。进度框变成<b>只读</b>（置灰、跟着状态自动变），不用再手填 —— 以前固定值只有「待排产 0% / 已完工 100%」两个，中间两档要手填，所以看来看去不是 0 就是 100。',
    '★ <b>老数据也统一按状态显示</b>：历史记录里用「生产数量」算出来的进度不再参与展示，一律以状态为准 —— 口径从此只有一处，表单 / 列表 / 详情 / 卡片 / 排序 / 筛选完全一致。数量字段仍原样留在老记录里，只是不再展示、不再参与计算。',
    '★ <b>提示栏去掉组级「跳转」按钮</b>：一组重复单号后面不再挂按钮，<b>点组里的订单号</b>就直接打开那条排产记录 —— 少一次点击。「忽略」与「恢复全部」保持不变。',
    '<b>没有状态的老数据</b>（极少见）仍按旧口径兜底：生产数量 → 实际完工日 → 手填值，信息不会凭空丢。',
  ] },
  { v:'v0.45', date:'2026-09-30', cat:'排产信息收敛五项 · 单号提示可忽略', items:[
    '★ <b>排产信息只留五项</b>：<b>排产单号、状态、计划开工、计划完工、进度</b>。录入表单、单号详情面板、订单详情里的排产条、排产页表格列、筛选项、可排序列 —— <b>六处一起收敛</b>，不再出现「表单里没有、别处还在显示」的两套说法。',
    '★ <b>进度跟着状态走</b>：状态选「<b>待排产</b>」固定 0%、选「<b>已完工</b>」固定 100%（这两档进度框会锁住，不用填也填不了）；选「生产中 / 已暂停」<b>可以自己填百分比</b>；从锁定档切回可填档会回到默认 0%，生产中 ↔ 已暂停 之间切换则保留你填的值。',
    '★ <b>排产页表格补上「状态」列</b>（以前表格里看不到状态），同时去掉车间、实际开工、实际完工、交期对比四列 —— 列头即排序列，一一对应。',
    '<b>老数据不丢、口径单一</b>：车间 / 实际开工 / 实际完工 / 生产数量 / 已完成数量不再出现在界面上，但老记录里的值<b>原样保留</b>；当你编辑某条老记录时，进度会按其<b>当前显示值</b>预填、保存即完成口径迁移（进度不会跳变），数量随之归零 —— 从此不再有「藏在背后的第二条进度口径」。',
    '<b>列宽记忆跟着列数走</b>：列宽是按序号存的，列数变了之后旧宽度会错位到别的列上，现在长度对不上就整份丢弃、回到自然宽度。',
    '★ <b>单号重复提示栏可以动手了</b>：每组重复单号后面带「<b>跳转</b>」（直接打开该单号的排产详情；组里的每个订单号也都能点，各自跳到自己那条记录）与「<b>忽略</b>」。',
    '★ <b>「忽略」是永久的</b>：点过忽略的单号<b>刷新、重开页面都不再提示</b>（写进本地记忆 <code>ot.moignore.v1</code>，单号大小写与首尾空白视为同一个）；提示栏底部会显示「已忽略 N 个单号」并给一个「<b>恢复全部</b>」把提示放回来。若重复的单号都被忽略了，提示栏缩成一行回执，不会把版面占着，恢复入口仍在。',
    '<b>「交期对比」保留为查询维度</b>：它不再出现在排产信息里，但筛选条件面板里的「交期对比 = 已逾期未完工」仍可用（不占字段位），排产卡片视图上的交期标签也保留。',
  ]},
  { v:'v0.44', date:'2026-09-30', cat:'列头排序状态记忆 · 刷新不丢', items:[
    '★ <b>列头排序会「记住」了</b>：点订单表 / 排产表的列头排序后，<b>刷新或重开页面仍保持</b>刚才那一列与升降序，不用每次进来重排。卡片视图的「排序」下拉（含表格列头没有的「自定义顺序」「签订日」）同样记忆。',
    '★ <b>记忆按页面各存各的</b>：订单页排「金额降序」、排产页排「进度降序」，两者互不影响、互不覆盖；写入 <code>localStorage</code> 的 <code>ot.sort.v1</code>，与列宽记忆（<code>ot.colw.v1</code>）各用各的键。',
    '<b>脏数据不崩</b>：读取时会校验「字段仍在当前字段表里 + 方向合法」，旧版本 / 手改过 / 损坏的记忆一律退回该页默认排序（订单＝交期升序，排产＝计划完工升序），不会把列表弄乱或让页面报错。',
  ]},
  { v:'v0.43', date:'2026-09-30', cat:'排产单号多值 · 单号独立详情', items:[
    '★ <b>一个订单可以有多个排产单号</b>：每个单号是一条<b>各自独立</b>的排产记录（车间 / 计划开工完工 / 实际开工完工 / 数量 / 进度 / 状态互不干扰）。订单表单里的「排产单号」改成<b>标签式多值输入</b> —— 输入后回车生成一个标签，粘贴「MO-1/MO-2」会自动拆开，点标签上的 × 移除；保存时按差异<b>自动新增 / 移除</b>对应的排产记录（已开工、有进度的会先确认，移除的记录进回收站可还原）。',
    '★ <b>「/」现在真的算分隔符</b>：此前只认「、,，;；」，你用「/」写的多单号会被当成<b>一个</b>单号 —— 这正是「多个单号没有各自独立」的根因。现在 / 、 , ， ; ； 与空白都能拆，连续分隔符不会产生空单号。',
    '★ <b>每个排产单号有自己的独立详情</b>：在「排产」页点一行 / 卡片，或从订单详情里点单号，打开的是<b>这个工单</b>的视图（车间、计划 / 实际开工完工、数量、进度条、交期对比、交期倒计时），而不是订单详情；面板里可以一键「返回订单」，同单的其它单号也能直接横跳。',
    '★ <b>排产单号全局唯一</b>：跨订单也不许重复（大小写不敏感、忽略首尾空白）。排产表单、订单表单、思源导入三条写入路径全部把关，冲突时<b>明确报出占用它的订单号</b>且不落库。存量若已有重复，「排产」页顶部会给一条<b>只提示、不改数据</b>的提示条。',
    '★ <b>签约后没排产会提醒</b>：订单状态是「已签约」却一条排产记录都没有 → 订单列表状态列与看板卡片打「<b>待排产</b>」标，订单页工具栏同时给出待排产笔数；状态已推进到排产之后却没有记录（数据缺失）则打「<b>缺单号</b>」标。',
    '<b>数据口径收口</b>：排产单号的唯一可编辑来源是<b>排产记录</b>，<code>orders.moNo</code> 退化为<b>派生只读快照</b>（导出、搜索、看板、思源推送照旧可用，但不再手工编辑）—— 从此不会出现「订单上写的单号」与「排产记录里的单号」两处对不上。',
    '<b>批量修改不再改排产单号</b>：批量查找替换会绕过唯一校验、并让快照与记录不一致，已从可替换字段中移除；要改单号请到「排产」页逐条编辑，或在订单详情里用标签调整。',
    '<b>思源导入遇单号冲突不再静默覆盖</b>：跳过该条并在同步日志里报出「单号 + 占用方订单号」。',
  ]},
  { v:'v0.42', date:'2026-09-30', cat:'品牌名收口 · 测试契约统一', items:[
    '★ <b>通知标题与思源库说明收口到单点常量</b>：桌面通知（测试通知 / 严重预警）与思源同步库的文档说明原先写死「订单追踪工作台」，v0.39 改名后成了漏网的旧名 —— 现一律引用 <code>APP_NAME</code>，以后改品牌名不会再漏。',
    '★ <b>PWA 应用名对齐</b>：<code>manifest.webmanifest</code> 的 <code>name</code> 由「订单追踪工作台」改为「订单追踪台」（根目录与部署包两份同步），装到桌面 / 手机后的应用名与应用内一致。',
    '★ <b>三套回归脚本的汇总输出统一为标准契约</b>：23 / 28 / 29 号此前各用一套自己的格式（「通过 N / 失败 M」「通过 N 项 · 失败 M 项」），开发目录的全量运行器解析不到，长期被标成「异常」并<b>少计 36 条断言</b>（包内运行器本就兼容这三套，所以两边总数一直差 36）。现在统一输出「结果：N/M 通过」，任何运行器都能解析。',
    '★ <b>全量运行器的兼容规则补齐</b>：原兼容规则漏了「项」与分隔符之间的空格（实际输出是「项 · 失败」），且不认「通过 N / 失败 M」—— 这才是那三套被判「异常」的直接原因。现按优先级补齐多条规则，并排除「汇总行被当成失败行」的噪音。',
    '<b>口令盐值确认冻结</b>：<code>passKeyBytes</code> 的盐值仍保持原样不动（跟着品牌名改会让此前「记住口令」的密文全部解不开），并保留断言守护。',
  ]},
  { v:'v0.41', date:'2026-09-30', cat:'排产页搜索栏收敛', items:[
    '★ <b>排产页工具栏的搜索框移除</b>：与筛选按钮并排的关键字输入（工单号 / 订单号 / 客户）撤掉，<b>顶部全局筛选栏的「关键字」成为唯一入口</b>（排产页照旧是独立作用域，不串订单页）。原本页内搜索比顶部多认一个「工单号」，现把工单号匹配<b>补进顶部关键字在排产页的语义</b>里 —— 能力不丢，入口只剩一个。',
    '<b>顶部关键字在排产页的语义补上「工单号」</b>：工单号命中与订单命中<b>并联</b>放行 —— 不能串在订单筛选之后，否则有关键字时订单先被筛空、工单号一个都搜不到（回归探针实测复现后修复）。',
    '页内搜索相关死代码一并清理：<code>pKw</code> 变量 / 输入绑定 / <code>OT.setPKw</code> 导出全部移除，关键字状态只活在筛选作用域里。',
  ]},
  { v:'v0.40', date:'2026-09-29', cat:'图表表达修复 · 状态分布重构', items:[
    '★ <b>月度销售趋势补上「系列图例」</b>：实线 = 金额、虚线 = 笔数（读右轴）。此前这张卡<b>完全没有图例</b>，那条虚线其实是一条无名线；同时补了<b>右轴笔数刻度与轴单位</b> —— 两条线各自归一化到满高却只画了左轴，笔数的量级根本读不出来；虚线此前<b>也没有悬停提示</b>，现在悬停能看到区间合计笔数。',
    '★ <b>订单状态分布改「阶段条」形态</b>：状态 01→06 本身就是一条<b>有序流水线</b>，环形图的圆既没有起点也没有方向，形态上把「卡在哪一段」这层信息丢了。改为横向阶段条：灰色轨道<b>铺满整条链</b>（0 单的段也留位，链条不断），右侧直接给出「金额 · 笔数 · 占比」；环形占不满画布、两头大片留白的毛病一并解决（环形仍保留，画布收窄到 520，环占满画布）。',
    '★ <b>状态分布新增「金额 / 笔数」双口径</b>：此前固定按金额，一笔大单就能把其余段压成细丝、看上去「只有一格」。切到笔数即按笔数重算条形长度与占比，悬停提示也跟着当前口径排头，并标出「N/6 段有单」。',
    '★ <b>月度归集口径跟随「基准」</b>：卡片副标题一直写着「按签订日 / 合同交期 / 回款实收日归集」，但月份分组<b>恒取签订日</b> —— 一套口径三个说法，切到合同交期时 x 轴月份与筛选范围对不上。现在 month 维度真正按 <code>basis</code> 取值：回款口径取该单<b>最后一笔回款日</b>（订金 / 尾款中较晚者），保证<b>一笔订单只落 1 个月</b>，不重复计入。',
    '图表图例补「N 笔」：此前只给金额占比，看不出笔数结构。',
    '<b>状态分布改用语义色</b>：通用色板的第 4 位是系统灰，正好落在「已发货」上 —— 有单的段看上去像个空档。现在按流水线顺序配一套语义色（与列表状态标签同一语言），<b>0 单的段直接用轨道色</b>，不再假装「有一点点数据」。'
  ]},
  { v:'v0.39', date:'2026-09-29', cat:'标题精简 · 客户订单数口径修复', items:[
    '★ <b>侧栏标题改为「订单追踪台」</b>，下方<b>只留版本号</b>，原先那行「vX · 一句话说明」不再占位置（要看详细说明请到「系统版本」页）。标题同时接入单点常量 <code>APP_NAME</code>，由 <code>applyVersion()</code> 一并写入 DOM，不再只靠静态 HTML 兜底。',
    '★ <b>修「客户页订单数对不上」</b>：客户列表的「订单数」此前取自<b>被顶部筛选收窄过的</b>订单集，而同一行的删除保护提示、「暂无订单」统计、侧栏「订单」徽标取的都是<b>全量</b>——同一行里两套口径，顶部一有筛选就对不上。现在客户页的行内数字<b>统一按「该客户全部订单」算</b>，与侧栏徽标同口径：<b>每个客户的订单数恒等于它实际关联的订单条数</b>。',
    '★ <b>订单 ↔ 客户 自动匹配（三级）</b>：关联以 <code>customerId</code> 为准，但历史导入（Excel / U9C / 思源）里这个字段可能落成<b>客户编码</b>或<b>客户全称 / 简称</b>——这类订单此前在客户页<b>一笔都算不到</b>。现按 <code>id → code → name/shortName</code> 三级解析（沿用 v0.13 思源客户匹配的既有口径）自动归位；删除保护也一并改走这套解析，避免按编码关联的订单被误判成「无关联」而放行删除。',
    '★ <b>对不上的订单不再悄悄消失</b>：客户页汇总行新增「订单 N 笔」与「⚠ N 笔订单未匹配到客户」（标红 + 悬停说明），让「各家订单数之和 + 未匹配数 ＝ 全部订单数」一眼对得平；<b>只提示、绝不自动改写订单数据</b>。',
    '<b>口径说明</b>：客户页的「订单数 / 订单金额 / 已回款 / 未回款」四列统一为该客户全量口径（顶部筛选不再收窄它们，它作用于看板 / 订单 / 回款 / 排产）。这样才能保证同一行里的数字互相自洽，也让「客户订单数」在任何筛选状态下都等于实际订单数。'
  ]},
  { v:'v0.38', date:'2026-09-29', cat:'iOS 界面改版 · 跟随系统深浅色 · 智能录入助手', cur:false, items:[
    '★ <b>界面整体换成 iOS 风格</b>：配色改用 Apple 系统色（systemBlue / Red / Orange / Yellow / Green / Teal / Gray），卡片圆角放大到 12px、控件圆角 10px、控件统一高 34px，按钮 / 分段控件 / 标签胶囊 / 输入框 / 提示条按 iOS 观感重绘。<b>只改外观，功能与数据一字未动</b>——全部红线（<code>#sheet</code> / <code>.hd</code> / <code>.bd</code> / 内容区唯一滚动 / 列表页零滚动 / <code>fitPageH()</code> 实测填充）依旧成立。',
    '★ <b>跟随系统深浅色</b>：新增 <code>@media (prefers-color-scheme: dark)</code> 深色档，<b>只重定义一套 token</b>，组件不需要第二套规则；浅色下 <code>-600</code> 用作正文深档、深色下自动切到亮档，避免文字沉进背景。切换系统外观即时生效，不用刷新。',
    '★ <b>图表同步换肤</b>：SVG 图表的调色板与墨色拆成两份（<code>PALETTE_LIGHT/DARK</code> + <code>INK_LIGHT/DARK</code>），由 <code>applyScheme()</code> 读取系统偏好写入；<code>matchMedia</code> 变化时自动重渲染，深色下坐标轴与网格不再是刺眼白。',
    '★ <b>修掉一个隐蔽的「深色失效」Bug</b>：深色 <code>@media</code> 块此前被<b>嵌在浅色 <code>:root{}</code> 声明块内部</b>，真实浏览器按 CSS 嵌套规则把内层 <code>:root</code> 编译成 <code>:root :root</code>（html 的后代）——<b>永远匹配不到元素</b>，等于深色档根本没生效。现把整块提到顶层，深色 token 与 <code>color-scheme</code> 正常落地。',
    '★ <b>新增「智能录入助手」页</b>（侧栏「业务」组 + 顶栏 ✨ 快捷入口）：把订单信息写成一句话就能建单，例如「帮我新增订单，单号是123456，金额是222.00，客户是xxx，交货日期2026.6.30」。',
    '★ <b>字段顺序 / 说法 / 完整度都能灵活适配</b>：同义说法表覆盖 12 个字段（订单号 / 客户 / 金额 / 合同交期 / 税金 / 签订日期 / 状态 / 排产单号 / 产品摘要 / 业务员 / 付款条件 / 贸易条款）；值写在关键词前或后都取得到（「9月30号交货」「¥8800 订单」同样认）；金额容忍 <code>¥</code> / 千分位 / <code>万</code> / <code>k</code>，日期容忍 <code>2026.6.30</code> / <code>2026年6月30日</code> / <code>6/30</code> / <code>今天</code> 等写法。',
    '★ <b>「提示不猜」是硬约束</b>：必填缺项（客户 / 金额 / 合同交期）标红追问并禁用提交；同一字段读到多个值会列出来由你定；客户名对不上时给 <b>候选列表</b>（点一下即选），库里没有则需你确认才新建——<b>绝不自动建档、绝不错误录入</b>。',
    '★ <b>录入前先确认</b>：解析结果以「识别结果 · 请确认」卡片逐字段展示（可直接改），点「确认录入」才落库；写入前会自动存一份快照，可到「数据历史」回滚到「智能录入前」。<b>纯本地规则解析，零联网、不上传任何内容</b>。',
    '回归：新增 <code>54_v0.38_iOS主题与深浅色.js</code> 与 <code>55_v0.38_智能录入助手.js</code>；并把 <code>36</code>（页面总数 11 → 12）与真机核对清单同步。全量回归 0 FAIL。'
  ]},
  { v:'v0.37', date:'2026-09-29', cat:'思源双向同步重构 · 专用同步库 8 列', cur:false, items:[
    '★ <b>整块重写思源同步，目标只有两个字：降复杂度</b>。旧方案（v0.18 / v0.19 系列）要工作台去猜库里已有哪些列、按列名做中文别名匹配、再维护一张三段字段映射表，任何一处对不上就整条链路卡死。新方案换成 <b>「一个专用库 + 8 个固定列 + 扁平表」</b>：工作台<b>一键建库建列</b>，两端列名逐字一致，读 / 写 / 比对共用同一套字段。',
    '★ <b>查到并修掉真正的病根</b>：v0.19.3 记的「思源写接口在本机静默失效」是<b>错误结论</b>——真因是<b>建列接口名写错了</b>：旧代码请求 <code>/api/av/addAttributeViewColumn</code>，而思源 3.8.x 里<b>没有这个接口</b>，真名是 <code>/api/av/addAttributeViewKey</code>。请求一直打在错误路径上，自然「建了 0 列」。v0.37 起全部改走实测通过的接口。',
    '<b>专用同步库固定 8 列</b>：订单号 / 客户 / 排产单号 / 货款 / 交货日期 / 状态 / 产品摘要 / 业务员。<b>订单号为主键</b>，一张订单一行、扁平存储，不再为每张订单拆出一堆子块。',
    '★ <b>三步走的同步卡片</b>：<b>① 一键连接</b>（本机 <code>127.0.0.1:6806</code> + Token，可留空）→ <b>② 读取并比对</b> → <b>③ 应用变更</b>。比对结果按 <b>待推送 / 待回填 / 冲突 / 仅思源有</b> 四类分别列出。',
    '★ <b>冲突一律交你决定，绝不自动合并</b>：同一订单号两端都有但取值不同时，逐条显示「工作台值 → 思源值」，由你选「保留工作台」还是「采用思源」，选完才落库。仅思源存在的行列在下方，可选 <b>导入为新订单 / 忽略</b>，<b>不会自动删除本地数据</b>。',
    '<b>旧思源链路整体移除</b>：字段映射表、中文别名匹配、导出 HTML 导入器、<code>SiyuanDataSource</code> 适配器、限流退避与建列续做等一整批代码全部删除；「数据源」页现在只剩「本地 / 模拟」两张卡 + 思源同步卡 + 本地备份卡。',
    '顺手<b>更正更新日志里 v0.19.3 的错误结论</b>（「写接口静默失效」→「建列接口名写错」）——它是当年绕远路的源头，留档以免再被误导。',
    '回归：重写 25 / 26 / 33 / 35 / 37 五套，新增 <code>53_v0.37_思源同步重构.js</code>，并适配 06 / 30 / 31；全量回归 0 FAIL。'
  ]},
  { v:'v0.36', date:'2026-09-28', cat:'布局修复 · 分屏宽度与内容区高度自适应', cur:false, items:[
    '★ <b>修「分屏宽度拖不动」</b>：详情/表单分屏中间的拖宽把手此前<b>根本抓不住</b>——CSS 写的是 <code>flex:0 0 0</code>，而 <code>flex-basis:0</code> 会覆盖同一行里的 <code>width:7px</code>，把手被压成 <b>0 宽</b>，鼠标永远落在它下面的面板上。改为 <code>flex:0 0 auto</code> 让宽度真正生效，并用 <code>::after</code> 把命中区向两侧各扩 5px（共 19px）；元素自身净占 1px，<b>对布局几乎零影响</b>。（v0.34 的验证是直接向把手派发 PointerEvent，绕过了命中测试，所以一直是「假绿」。）',
    '★ <b>修「列表页底部留白」</b>：列表在首屏内自成滚动区的高度上限此前写死为 <code>calc(100dvh - 376px)</code>，而各页「表头 + 筛选栏 + KPI」的高度并不相同——订单页与排产页共用同一个 376，实测底部余量却差 41px，所以必然要么留白、要么多滚一行。改为渲染后用 <code>fitPageH()</code> <b>实测回写</b>：以「内容区内边距盒底」为目标线，让滚动区正好长到这条线；撑满后仍有富余时，让末个内容容器长到目标线。<b>只增不减</b>——内容本来就装不下时一律不动，绝不制造溢出。',
    '内容区高度自适应覆盖到所有页面：实测桌面 1920 / 1440 / 1366 与宽平板 1024 下，订单、排产、回款、预警、客户、卡片视图的底部余量<b>全部归零</b>（此前 80~273px），看板页保持原样。',
    '视口变化（窗口缩放、横竖屏切换）与分屏拖宽后都会<b>重新实测</b>，不再依赖启动时的一次性计算。',
    '窄屏（≤920px）不接管高度：整页滚动是既定设计，把手也照旧隐藏（触摸端直接上下滑更顺手）。',
    '回归：新增 <code>52_v0.36_布局自适应与分屏宽度.js</code>（jsdom 34 项），并新增真机验证 <code>_verify_v036_layout.js</code>（55 项，含<b>真实鼠标</b>拖把手 200px 实测 + 六个页面 × 四个视口的底部余量实测）。'
  ]},
  { v:'v0.35', date:'2026-09-28', cat:'表格分页与列宽拖拽 · 详情改为可直接编辑属性面板', items:[
    '★ <b>订单表 / 排产表支持拖列宽</b>：鼠标停在表头列分隔线上会变成左右箭头，<b>拖到哪宽到哪、实时生效</b>（不用松手就跟着变）；松手即记住，<b>下次打开还是你调过的宽度</b>。实现上只注入一个 <code>&lt;colgroup&gt;</code> 与一个空 <code>&lt;span&gt;</code> 把手，<b>不新增 &lt;th&gt;</b>，所以列数（11 列）与列头排序的既有行为完全不受影响。',
    '★ <b>表格分页（默认关闭）</b>：工具栏多了「分页」开关与「每页 10 / 20 / 50 条」。<b>默认不勾选，行为与从前一模一样</b>（一次列出全部，表尾仍显示「共 N 条」）；勾上后表尾出现页码条（首页/上一页/页码/下一页/末页 + 「显示 1–10 条，共 68 条」）。订单页与排产页<b>各持一份分页状态</b>，互不影响。',
    '★ <b>订单详情改为「可直接编辑」的属性面板</b>（Notion / 思源式）：不再是一堆只读卡片，而是<b>按分组列出全部字段及取值</b>（订单信息 / 金额与回款 / 贸易与条款 / 排产 / 发货与物流 / 跟进记录 / 附件）。<b>点字段就能改</b> —— 文本框失焦或回车提交、下拉与日期即时提交，写回后原地刷新面板，不用再进「编辑」表单转一圈。',
    '详情顶部保留 <b>「关键信息 + 常用操作」一条</b>：左边三格（合同交期 / 未收 / 排产条数），右边四个入口（编辑 / 新增排产 / 登记发货 / 添加跟进），一进详情就能触达。',
    '★ <b>金额口径回到 v0.10 的不变量</b>：面板里的「实收」是<b>真实到账金额（绝不含核销）</b>；手续费 / 尾差核销<b>单独列一行</b>并标注「已结清（不计入实收）」。这样「货款 10125、实收 10115、核销 10」在详情里一眼分得清。',
    '排产记录重新带上<b>进度条</b>（满条转绿），与排产页同一口径。',
    '契约零改动：<code>#sheet</code> / <code>.hd</code> / <code>.bd</code> / <code>[data-close]</code> / <code>--sheet-w</code> 分屏壳照旧，v0.34 的「分屏详情 + 宽度可拖」断言全部保持绿色。'
  ]},
  { v:'v0.34', date:'2026-09-28', cat:'详情与表单改为分屏布局', cur:false, items:[
    '订单/客户详情与所有表单入口：宽屏下从居中浮层改为右侧分屏，左侧列表/主视图保持可见且可继续点选',
    '分屏宽度可拖：中间分隔条向左拖变宽，详情/表单各记一份宽度（刷新后保持）',
    '窄屏（≤920）自动回落为满屏遮罩，隐藏分隔条',
    '点其他行直接替换右栏内容、不关闭分屏；切页或关闭按钮收起分屏'
  ]},
  { v:'v0.33', date:'2026-09-26', cat:'详情与表单统一为抽屉卡片 · 宽度可拖', cur:false, items:[
    '★ <b>所有「点击打开」的面板统一成右侧抽屉卡片</b>：订单详情、客户详情，以及新增 / 编辑订单、客户、业务员、登记发货、登记回款、排产工序、添加跟进、批量修改 —— 共 11 个入口，全部从「居中的浮层」改成<b>贴右缘滑出的卡片</b>。居中浮层原先只有 920 / 1360 两档固定宽度，宽表格被挤在屏幕中间、左右各空一大片；现在卡片贴右边、内容整体靠右展开，视线从列表到详情不再横跨整个屏幕。',
    '★ <b>宽度可拖，且记得住</b>：卡片左缘有一条把手，<b>向左拖变宽、向右拖变窄</b>；宽度按「详情」与「表单」各存一份（详情 840 / 表单 520 为首次默认），<b>关掉浏览器重开还是你调过的宽度</b>，不用每次重拖。可拖范围 <code>[380, min(1280, 视口−72)]</code> —— 背后永远留得住一条遮罩，点一下就关。',
    '窄屏（≤920px）抽屉<b>整屏显示、无圆角、把手隐藏</b>：手机上本来就没有拖拽的习惯，宽度微调只在桌面端生效，不占触控面积。',
    '卡片从右缘<b>滑入</b>（180ms），不再是硬切；卡片内主体独立滚动、标题栏钉在顶部，滚长内容时标题与「×」始终在手边。',
    '零结构改动：<code>#sheet</code> / <code>#mask.on</code> / <code>.hd</code> / <code>.bd</code> / <code>[data-close]</code> 全部照旧，<code>#sheet.wide</code> 语义保留为「宽版详情」—— 历史版本的回归断言不受影响。'
  ]},
  { v:'v0.32', date:'2026-09-24', cat:'设置收进浮层 · 首屏更清爽', items:[
    '★ <b>「预警规则」不再占页面一块</b>：它是一组「设完就走」的阈值与开关，原先却长期占着预警页一整行。现在收成工具栏上的 <b>「⚙ 预警规则」入口</b>，点开在居中浮层里设置，<b>保存后浮层自动收起</b>，页面上立刻能看到按新阈值重算的结果。引擎被关掉时入口变橙红警示色 —— 不点进去也知道规则没在跑。',
    '★ <b>「筛选条件」同理收成入口</b>：订单页与排产页顶部原先固定占着一条筛选面板，哪怕一条条件都没设也照样把列表往下推。现在改成工具栏上的「筛选」入口，并<b>带条件条数徽标</b>；没设条件时页面上不留任何占位，设了几条一眼可见。',
    '★ <b>首屏腾出：预警页 219px、订单 / 排产页各 111px</b>（1440×900 实测「下方内容整体上移」的距离）。预警页移走的那张规则卡片本身就有 189px 高，订单 / 排产页移走的常驻筛选条 99px 高，再加上原先各自的上下外边距，实际位置上移比卡片本身还多一点。列表与预警内容整体上移，相同屏幕能多看 2~3 行。',
    '浮层四种关法：点右上「×」、点面板外的遮罩、按 <b>Esc</b>、或切页（自动收起）；打开期间背后内容区锁住不跟着滚。',
    '窄屏（≤640px）时浮层变成<b>从底部升起的贴底面板</b>，按钮落在拇指够得到的位置；浮层只切换显隐，<b>不改动任何既有 DOM 结构</b>，历史版本的回归断言全部照旧。'
  ]},
  { v:'v0.31', date:'2026-09-24', cat:'布局重排 · 减少鼠标滚动', items:[
    '★ <b>全站改成「一屏」结构</b>：侧边栏 / 顶栏 / 筛选栏现在<b>永久固定在屏幕上</b>，只有中间的内容区滚动。以前整页一起滚，滚到下面的订单表就再也看不见顶部筛选和 KPI；切页还会把滚动位置留在一半。现在切页自动回到顶部，筛选和 KPI 一直在手边。',
    '★ <b>列表页整页零滚动</b>：订单 / 排产 / 回款 / 客户 / 业务员的数据表改成<b>首屏内独立滚动区 + 表头钉住</b>。以订单页为例，68 笔订单一屏装不下，原来整页要往下滚约 <b>3000px</b>（表格本身高约 3400px），现在表格在卡内滚动，<b>页面本身不再需要滚</b>，表头和 KPI 始终可见。',
    '★ <b>看板重排，纵向段数减半</b>：维度分析图与月度销售趋势<b>并排</b>一行，客户排行与状态分布并排一行 —— 原来 4 段纵向堆叠变成 3 段，少了约一屏的滚动量。',
    '★ <b>更新日志拆成两列时间轴</b>并限高：收录 30+ 个版本时，原来一页要滚约 <b>5000px</b>，现在版本页也在首屏内看完。',
    '★ <b>密度收紧</b>：桌面端表格行高、卡片头与卡片内边距一起收小，同样一屏能多看好几行；KPI 行改成<b>恒为一行</b>，屏幕不够宽时横向滚动而不是折成两行把内容往下推。',
    '★ <b>内容区不再限宽 1560px</b>（放宽到 1920px），宽屏上表格与图表用满可用宽度，少换行、少纵向堆叠。',
    '★ <b>新增「回到顶部」</b>：内容区滚过一屏后右下角浮出，省掉把滚动条拖回去的那一下。',
    '窄屏（≤920px）行为<b>完全不变</b>：仍是抽屉侧栏 + 表格横向滚动，本次改动只在桌面端生效。'
  ]},
  { v:'v0.30', date:'2026-09-24', cat:'设计系统 token 化 · 可访问性修正', items:[
    '★ <b>全站文字对比度按 WCAG 2.2 AA 重新核过一遍</b>：原先 <b>11px 的第三级灰字只有 2.53:1</b>（连大字号 3:1 的门槛都够不着），主色做正文只有 4.38:1，语义色里橙色最低只有 <b>3.05:1</b> —— 都不达标。现在第三级灰字调到 <code>#697585</code>（4.68:1）；未达标的语义色统一下沉到各自的 <b>600 深档</b>做文字（红 5.91 / 橙 6.16 / 琥珀 6.49 / 绿 5.62 / 青 5.57）。浅底状态标签、KPI 数字、表单报错、交期倒计时跟着换档 —— 颜色更深更稳，长时间看数据不累。',
    '★ <b>新增「纯装饰灰」<code>--decor</code></b>：把原来那支太浅的灰（<code>#99a4b3</code>）降级为只用于分隔线与占位符号，不再承载任何文字。「灰得好看」与「读得清楚」各归其位。',
    '★ <b>补上键盘焦点环</b>：此前全站<b>完全没有</b>焦点样式，纯键盘操作时看不出光标在哪 —— 现在任何可聚焦元素都有 2px 主色外圈。<b>支持系统「减弱动效」偏好</b>：系统开了减弱动效，过渡与动画即刻归零。',
    '★ <b>补齐三套设计 token</b>：<b>类型刻度</b>（11 / 12 / 13 / 14 / 16 / 20 / 28 七级，8px 基线）、<b>动效词表</b>（120 / 180 / 260ms + 统一缓动）、<b>层级与移动端安全区</b>。今后调样式从变量取，不再各处散写数值。',
    '按钮补上<b>按下反馈</b>（按压缩到 0.97，120ms）；侧栏滑出改用动效 token，与其它过渡手感一致。',
    '表格与所有数值统一<b>等宽数字</b>，数字列的位数不再随内容左右抖动 —— 金额、进度、倒计时对齐更整齐。',
    '细节修正：白字实底的状态标签与主按钮改用深一档底色（原主色底白字只有 4.38:1）；图表坐标轴标签的灰同步跟上新值。',
    '本版<b>不改变任何布局与功能</b>，只动颜色、可达性与动效变量：既有回归脚本（v0.21 / v0.27 / v0.28 / v0.29）全部重跑通过。下一步的移动端断点体系与底部导航会另起一版。'
  ]},
  { v:'v0.29', date:'2026-09-22', cat:'已发货状态 · 操作布局重排', items:[
    '★ <b>新增「已发货」状态</b>：状态链变为 已签约 → 已排产 → 已完工待发货 → <b>已发货</b> → 已收款 → 已完结。历史数据里的旧编号会自动顺延迁移（原「04 已收款」→「05 已收款」、「05 已完结」→「06 已完结」），打开工作台即完成，不需要手工改数据。',
    '★ <b>登记发货后订单自动推进为「已发货」</b>：在详情页或列表行内点「发货」，保存后订单状态自动跟上，不用再回头手动改一次；已收款、已完结的单不会被回退。',
    '「已发货」视为<b>交期风险解除</b>：货已出厂，交期列不再显示逾期与倒计时（与「已交付」「已完工」同一口径），列表的逾期计数与看板 KPI 同步排除；关注点转到已有的「发货未收款」预警。',
    '交期筛选新增<b>「已发货」</b>维度；「已发货」有独立配色（青色），与已排产（蓝）、已完工待发货（琥珀）区分得开。思源同步里的「已出货」也落到真正的「已发货」，不再并进「已完工待发货」。',
    '★ <b>订单页工具栏从四层压到两层</b>：去掉了与列表头重复的「当前命中 N 笔」、重复出现的第二个「批量修改」，以及那条<b>零选中也常驻</b>的选择条——现在勾选后才浮出，列表头不再被挤出首屏。',
    '★ <b>列表行内直接给常用操作</b>：订单行尾有「发货 / 编辑」；排产行在工单完工后直接出现「发货」——不必先进订单详情再翻按钮。行内按钮不会误触发「打开详情」。',
    '★ <b>订单详情顶部新增「关键信息 + 常用操作」带</b>：合同交期（含余 N 天 / 已逾期）、未收金额、排产单数与平均进度，加上 编辑 / 新增排产 / 登记发货 / 添加跟进 四个入口集中在一行，进详情即可触达，不用再滚到对应卡片里找按钮。',
    '回归测试新增 47 号脚本（状态模型 / 存量迁移 / 已发货口径 / 自动推进 / 三处布局结构）；受状态重编号影响的旧断言统一改成从状态表派生，以后再增删状态不必回头改测试。'
  ]},
  { v:'v0.28', date:'2026-09-19', cat:'列头点击排序', items:[
    '★ <b>订单 / 排产列表的排序改成「点列头」</b>：同一列再点一次切换 <b>升序 ↔ 降序</b>，列头右侧的 <b>▲ / ▼</b> 就是当前排序状态（当前列高亮）。原先那两排「排序字段 + 升降序按钮」控件已撤掉，工具栏和列表头都清爽了。',
    '可点的列扩到<b>全部有意义的字段</b> —— 订单：订单号 / 客户 / 业务员 / 状态 / 交期 / 金额 / 已收 / 未收；排产：工单号 / 订单号 / 客户 / 车间 / 计划开工 / 计划完工 / 实际开工 / 实际完工 / 进度 / 交期对比。产品摘要与「操作」列不参与排序。',
    '每列有自己的<b>默认方向</b>：金额 / 已收 / 未收这类数值列先看大额（降序），日期与文本列先看小值（升序）；换列时自动套用，不用再手动点方向。',
    '<b>未填值恒排最后</b>：没填交期或空字段的行不会因为切到降序就翻到最前面，一屏空行的情况不再出现。',
    '表格与卡片<b>共用同一份排序</b>：卡片视图没有列头，工具栏给了一个「排序」下拉（选字段、同一字段再点一次切方向），里面还保留了表格列头没有的「自定义顺序」。',
    '排序逻辑收敛到一处（字段表 + <code>toggleSort</code>）：列头点击与卡片下拉走同一条路径，不会出现「列头说按交期、下拉说按金额」。',
    '「已收」列排序按<b>实收 + 核销</b>算，与列上显示的金额同口径，不是只按实收。'
  ]},
  { v:'v0.27', date:'2026-09-19', cat:'订单卡片视图 · 说明收进 i', items:[
    '新增<b>订单卡片视图</b>：订单页工具栏多了「表格 / 卡片」切换。<b>按合同交期所在月份分列</b>横向铺开——这一列就是「本月该交货的单」，「余 N 天 / 已逾期」直接对着这列的日期看，不用二次换算。',
    '卡片显示哪些字段<b>由你勾</b>（参考思源数据库的字段显隐）：状态 / 交期倒计时 / 合同交期 / 金额 / 已收 / 未收 / 业务员 / 排产单号 / 签订日 / 产品摘要，默认显示前 5 项。这个选择只存本机，不随同步配置走。',
    '卡片与表格<b>看的是同一份筛选结果</b>：关键字、条件行、排序对两者同时生效，不会出现两个视图说法不一致。列头带本月单数与逾期数，空的月份也留一列，没填交期的单进最后一列。',
    '★ <b>页面上的操作说明与注释全部收进小圆圈「i」图标</b>：鼠标悬停浮出、点击可钉住（再点或点空白处关闭）。覆盖各页顶部用法说明、表单字段说明、批量修改 / 数据源 / 同步 / 数据历史 / 版本页的口径注释。',
    '说明文字仍保留在 DOM 里（只是不铺在页面上），所以既保持可检索、也让靠文本的回归断言继续有效。风险类提示（只读数据源、file:// 被 CORS 阻断、清空数据）用<b>红圈 i</b>，比普通说明更显眼，不会被当成无事发生。',
    '保留直接显示的只有<b>动态内容</b>：计数 / 金额 / 解析结果、空状态占位、<b>生成出来的建列清单</b>、以及数据源报错——那些本身就是要看的对象，不是注释。',
    '订单「已交付」判定抽成单一函数 <code>orderDelivered()</code>，表格与卡片共用，避免「表格说已交付、卡片说逾期」这类口径漂移。',
    '顺手清掉同步卡片标题里写死的旧版本号（原为「思源双向同步（专用库 · v0.24）」）。'
  ]},
  { v:'v0.26', date:'2026-09-19', cat:'交期区间修复 · 排产卡片', items:[
    '★ <b>修复「时间范围选『本月』只出 1 条、自定义 9/1~9/30 才全出」</b>：日历区间（本月 / 本季 / 本年）原先被截到<b>今天</b>，于是本月里<b>还没到期</b>的交期整片被漏掉——而「查本月交期」本来就是为了找出这些单。现在改成<b>整段日历区间</b>（到本月最后一天 / 本季末 / 12-31）；只有真正滚动的窗口（<b>近 90 天 / 近 12 月</b>）仍以今天为终点。',
    '同一个坑在「本月新签」快捷方案里也一并修掉了（原写法同样是「月初…今天」）。',
    '新增<b>排产卡片视图</b>：排产页工具栏多一个「表格 / 卡片」切换。卡片<b>按合同交期所在月份分列</b>，横排一眼看完整年——哪个月交期空、哪个月堆单，不用再逐行数。',
    '卡片上给：<b>工单号 + 交期对比标签</b>（已逾期 / 预计晚 N 天 / 卡交期 / 提前）、<b>订单号 · 客户简称</b>、<b>合同交期 + 余 N 天</b>（逾期红、今天到期橙、正常绿；已完工不再倒数）。',
    '卡片列头带<b>本月单数</b>与<b>逾期数</b>；中间空的月份也留一列，不会因为没数据就把那一格藏起来；<b>没填合同交期</b>的单统一进最后一列。',
    '卡片可直接点开订单详情；数据源可写时卡片右下还有「编辑」，与表格视图完全一致（两者看的是同一份筛选结果）。'
  ]},
  { v:'v0.25', date:'2026-09-18', cat:'口令记忆 · 同步导入修复', items:[
    '新增<b>本机口令记忆</b>：在「云端同步」页勾选「在本机记住加密口令」后，这台设备<b>下次打开直接同步，既不用再输口令，也不用重新导入配置</b>。换设备时仍是「导入一次配置 → 输一次口令 → 之后免输」。',
    '口令<b>只存在这台设备的浏览器里</b>，用本机设备标识混淆后存放（不是明文，但也不是加密，仅为避免肉眼可见）；它<b>不会写进导出文件、也不会随仓库分发</b>，仓库里那份 HTML 依旧不含任何 S3 / 思源凭据。',
    '★ <b>修复「换了加密口令后导出的配置，在另一台设备被提示『内容与当前一致，无需导入』」</b>：原先密钥类只比「已配置 / 未配置」四个字，两份完全不同的密文会被判成相等，于是新密钥永远进不来、旧口令一直报错。现在按<b>原始密文</b>比对，会正常识别为已更新，并顺带清掉本机记住的旧口令。',
    '<b>口令错了会说清楚</b>：不再只回一句「加密口令错误」，而是明说本机记住的口令已失效并已清除，避免反复用同一枚错口令重试；并且<b>只有验证通过的口令才会被记住</b>。',
    '「清除同步配置」现在会<b>连带清掉本机记住的口令</b>；把「记住口令」开关关掉也会即时清除，不留残影。',
    '「口令记忆」区实时显示<b>已记住 / 未记住</b>状态，并可一键「清除已记住的口令」——换设备前想清干净时不必去翻浏览器设置。'
  ]},
  { v:'v0.24', date:'2026-09-16', cat:'筛选重构 · 同步修复', items:[
    '筛选改成<b>思源式条件行</b>：[字段 ▾] [关系 ▾] [值]，可加多行；<b>第 2 行起可选「且 / 或」</b>，按顺序从左到右计算。chips 只能表达「等于某个枚举值」，条件行能表达<b>「订单金额 > 10 万」「合同交期 早于 某日」「签约日在 本月」「工单进度 ≥ 80」</b>这类比较——有范围、有阈值的筛选才谈得上灵活。',
    '字段覆盖 <b>15 个订单字段</b>（订单号 / 客户 / 业务员 / 订单状态 / 回款状态 / 排产状态 / 交期状态 / 金额 / 未收金额 / 税金 / 签约日 / 合同交期 / 实际交付 / 产品摘要 / 备注）与 <b>10 个排产字段</b>（工单号 / 订单号 / 客户 / 排产状态 / 交期对比 / 进度 / 车间 / 计划开工 / 计划完工 / 实际完工）。',
    '关系运算符按字段类型给：文本<b>包含 / 不包含 / 等于 / 不等于</b>；枚举<b>是其中之一 / 不是其中之一</b>；数值 <b>= ≠ &gt; ≥ &lt; ≤</b>；日期<b>等于 / 早于 / 晚于 / 本月 / 本季 / 本年 / 近 30 天 / 近 90 天</b>；各类型都支持<b>为空 / 不为空</b>。',
    '顶栏业务员从 chips 改成<b>多选下拉</b>；<b>取消快捷方案按钮</b>——「待跟进 / 风险单 / 本月新签」用条件行直接拼即可，还能顺手改条件。',
    '条件行输入时<b>列表实时刷新且不丢焦点</b>（边打金额边看结果）。排产页与订单页依旧<b>各筛各的</b>：订单页那份作用于订单，排产页那份作用于排产记录。',
    '★ <b>修复思源同步「按说明建了列名，还是提示没有相同列名」</b>：思源里<b>数据库块 id 与属性视图 avID 是两个不同的 id</b>，而工作台过去拿块 id 当 avID 用，内核只回一个空骨架（「主键 + 单选」两列），于是你建多少列都读不到。现在任何入口都先解析成真 avID。',
    '列名匹配改为<b>「同名优先，中文别名兜底」</b>：交货日期 / 交期 → contractDelivery、总货款 / 金额 → amount、客户代号 → customerName、PI No. → orderNo …… 你库里原有的中文列可以直接用，不必再建一套英文列。',
    '思源同步<b>不再需要手抄 avId</b>：点「① 列出思源里的数据库」→ 在列表里点一下库名，自动绑定并读出列名，<b>逐列显示匹配方式</b>（同名 / 中文别名 / 缺列），缺哪些列直接列清单。思源 <b>Token 放宽为可留空</b>（本机未设「访问授权码」时无需 Token）。'
  ]},
  { v:'v0.23', date:'2026-09-15', cat:'筛选能力', items:[
    '筛选<b>全面改为多选</b>：<b>同一行内多选 =「或」，跨行之间 =「与」</b>。例如「状态行点已排产 + 回款行点未收齐」= 已排产且未收齐；「交期行同时点已逾期和 7 天内」= 两者都要。此前每类条件只能选一个值，这类组合根本筛不出来。',
    '筛选维度从「订单状态 + 客户 + 回款」扩成<b>五组</b>：<b>状态 / 回款 / 排产 / 交期 / 客户</b>；顶栏的业务员也改为多选，可同时看两个业务员的单，并且仍然<b>订单页与排产页各存各的</b>。',
    '每行 chip 上的数字是<b>分面计数</b>——算的是「其他条件都满足时，这一项有多少条」，所以能提前看出某个组合点了会不会变空，不会点出一片空白还不知道为什么。',
    '新增<b>快捷方案</b>：待跟进 / 风险单 / 待收款 / 缺交期 / 本月新签，点一下套用整组条件，仍可继续叠加下面的维度继续收窄；再点一次或点「不限」取消。这些方案含「或」的组合（如待跟进 = 未排产 或 15 天内到期），是单靠多选表达不出来的。',
    '面板底部有<b>「已选条件」实时汇总</b>，把当前生效的所有条件（含方案）列成一行，一眼看清为什么只剩这几笔；点「清空」一键回到全部。',
    '排产页的「交期风险」下拉升级为多选，并新增<b>排产状态</b>多选（待排产 / 生产中 / 已完工 / 已暂停）；两页都支持按客户多选。',
    '客户候选超过 8 家时，行内出现搜索框，按名称（简称或全称）过滤可选项 —— 只改显隐、不重渲染，不影响已经选好的条件。'
  ]},
  { v:'v0.22', date:'2026-09-15', cat:'体验优化', items:[
    '修<b>「订单页一筛，排产页跟着空」</b>：排产的基准集合原本走的是订单的筛选结果，所以顶栏一设条件，排产列表就被连带筛掉（且看不出原因）。现在<b>排产页有自己独立的一份筛选</b>——在排产页改筛选栏只影响排产，订单页 / 看板 / 预警 / 回款 那边纹丝不动，反之亦然。',
    '筛选栏在排产页会挂一个<b>「本页独立」</b>标记，页面顶部也写明这条规则，避免「改了没反应」的误判；订单页仍与看板联动（在订单页筛出本月，回看板看的就是这批单的汇总，这是刻意保留的）。',
    '顶栏右上的 <b>「载入」改名为「重新载入」</b>并补悬停说明：它的作用是从当前数据源<b>重新读一遍全部数据并刷新界面</b>（纯读、不改数据）。还加了反馈——点击后按钮进入「载入中…」禁用态，结束提示实际读到的订单条数与数据源名称，不再让人猜它到底做了什么。',
    '侧栏副标题文案改为<b>单点维护</b>（<code>APP_TAG</code>）：此前 JS 与静态兜底各写一份，改版本时容易漏掉一处、显示成旧说明。'

const NAV_GRP = { dashboard:'分析', alert:'分析', assist:'业务', source:'系统', sync:'系统', history:'系统', version:'系统' };

function renderSidebar(st){
  let h = '', last = null;
  PAGES.forEach(p => {
    const g = NAV_GRP[p.id] || '业务';
    if(g !== last){ h += `<div class="grp">${g}</div>`; last = g; }
    let cnt = '';
    if(p.id === 'orders') cnt = `<span class="cnt">${st.data.orders.length}</span>`;
    if(p.id === 'cust')   cnt = `<span class="cnt">${st.data.customers.length}</span>`;
    if(p.id === 'custprod')  cnt = `<span class="cnt">${(st.data.custProducts||[]).length}</span>`;
    if(p.id === 'suppliers') cnt = `<span class="cnt">${(st.data.suppliers||[]).length}</span>`;
    if(p.id === 'supprod')   cnt = `<span class="cnt">${(st.data.supplierProducts||[]).length}</span>`;
    if(p.id === 'owners') cnt = `<span class="cnt">${st.data.owners.length}</span>`;
    if(p.id === 'pay')    cnt = `<span class="cnt">${st.data.orders.filter(o=>!isFullyPaid(o)).length}</span>`;
    if(p.id === 'alert'){
      const n = Store.alerts ? Store.alerts.filter(a => a.lvl === 'red').length : 0;
      if(n) cnt = `<span class="cnt" style="background:var(--fill-red);color:var(--on-accent)">${n}</span>`;
    }
    h += `<a data-pg="${p.id}" class="${st.ui.page===p.id?'on':''}"><span class="ico">${p.ico}</span>${p.name}${cnt}</a>`;
  });
  $('#sbNav').innerHTML = h;
  $$('#sbNav a').forEach(a => a.onclick = () => goto(a.dataset.pg));
  const src = st.source ? st.source.label : '—';
  $('#dsName').textContent = src;
  $('#dsMeta').textContent = st.source && st.source.capabilities.write ? '读写就绪' : '只读';
  $('#dsDot').className = 'dot' + (st.health && st.health.ok === false ? ' warn' : '');
}
/* ★ v0.50：切页标志。声明放在 goto 之前 —— 别让将来的启动流程在模块初始化阶段
   调 goto 时踩 TDZ（render 里消费一次就复位）。 */
let _scrollReset = false;
function goto(pg){
  /* ★ v0.50：主动切页 → 置位让 render 跳过滚动恢复。新页从顶部开始是本来的正确行为，
     不加这一句的话旧页的 scrollTop 会被原样搬到新页上（一进产品库就停在半截）。 */
  _scrollReset = true;
  cfgOpen = '';                    /* 切页收起浮层，免得留一个属于上一页的设置面板 */

function initGlobalFilter(){
  const wrap = $('#gfilter'); if(!wrap) return;
  /* 当前页面用哪个作用域：订单页/看板/回款… = global（业务统计口径）；排产页 = prod（独立） */
  const scope = filterScopeOf(Store.state.ui.page);
  wrap.innerHTML = gfilterHTML(Store.state, scope);
  const sf = patch => Store.setFilter(patch, scope);
  bindMsel('#fOwner', L => sf({ ownerId:L }));
  const b = $('#fBasis'); if(b) b.onchange = e => sf({ basis:e.target.value });
  const kw = $('#fKw'); if(kw) kw.oninput = e => sf({ keyword:e.target.value });
  const frm = $('#fFrom'); if(frm) frm.onchange = e => sf({ from:e.target.value });
  const to = $('#fTo'); if(to) to.onchange = e => sf({ to:e.target.value });
  $$('#fPreset button').forEach(x => x.onclick = () => sf({ preset:x.dataset.p }));
  const r = $('#fReset'); if(r) r.onclick = () => sf(blankFilter());
}
/* ---------- v0.24 · 面板绑定：订单页 / 排产页共用同一套条件行组件 ----------
   组件的实现（字段表 / 求值 / 渲染 / 多选下拉）都在「模块 6 · Selectors」上方，
   这里只保留「订单页」这一侧的薄封装；排产页走 bindCondPanel('prod')。 */
function ordersPanelHTML(st){ return condPanelHTML(st, 'global'); }

/* 当前页面正在生效的那份筛选（订单页/看板 = global，排产页 = prod） */
function pageFilter(st){
  st = st || Store.state;

}
/* 顶栏业务员下拉只刷文字与勾选态，不重建节点（重建会让关键字输入框丢焦点） */
function syncOwnerMsel(cur){
  const box = $('#fOwner'); if(!box) return;

/* 把「当前页作用域」的筛选值刷回筛选栏 DOM（不重建节点 → 输入不丢焦点） */

/* ---------- 订单 ---------- */
/* ==========================================================================
   v0.28 · 列表排序：点击列头即升降序
   原先的「排序字段 chips + 升降序按钮」两排控件已移除，改成直接点列头：
   同一列再点一次切换 升序 ↔ 降序（两态，不做「取消」，列表始终有明确次序）；
   列头右侧的 ▲/▼ 就是当前排序状态。
   卡片视图没有列头，工具栏给一个「排序」下拉（还能选表格列头没有的「自定义顺序」），
   两个视图共用同一份排序状态，不存在两套口径。
   ========================================================================== */
const ORD_SORT_FIELDS = [
  { k:'manual',   t:'自定义顺序', d:'asc',  noCol:1 },   /* 不是真实列：只在卡片下拉里可选 */
  { k:'orderNo',  t:'订单号',     d:'asc'  },
  { k:'customer', t:'客户',       d:'asc'  },
  { k:'owner',    t:'业务员',     d:'asc'  },
  { k:'status',   t:'状态',       d:'asc'  },
  { k:'delivery', t:'交期',       d:'asc'  },
  { k:'amount',   t:'金额',       d:'desc' },
  { k:'got',      t:'已收',       d:'desc' },
  { k:'unpaid',   t:'未收',       d:'desc' },
  { k:'sign',     t:'签订日',     d:'desc', noCol:1 }    /* 订单表没有「签订日」列，只在卡片下拉里可选 */
];
/* v0.45：排产信息收敛后，可排序列 = 表格上真实存在的列（工单号 / 订单号 / 客户 /
   状态 / 计划开工 / 计划完工 / 进度）。车间、实际开工、实际完工、交期对比已下线，
   继续留在表里会出现「可排序列没有对应列头」——45 号套件正盯着这条一致性。 */
const PROD_SORT_FIELDS = [
  { k:'moNo',         t:'工单号',   d:'asc'  },
  { k:'orderNo',      t:'订单号',   d:'asc'  },
  { k:'customer',     t:'客户',     d:'asc'  },
  { k:'opStatus',     t:'状态',     d:'asc'  },
  { k:'planStart',    t:'计划开工', d:'asc'  },
  { k:'planFinish',   t:'计划完工', d:'asc'  },
  { k:'progress',     t:'进度',     d:'desc' }
];
/* 各字段默认方向由字段表派生 —— 避免「表里写着 desc、默认方向表里写着 asc」这种两处对不上 */
const ORD_DIR_DEFAULT  = {}; ORD_SORT_FIELDS.forEach(f => { ORD_DIR_DEFAULT[f.k]  = f.d; });
const PROD_DIR_DEFAULT = {}; PROD_SORT_FIELDS.forEach(f => { PROD_DIR_DEFAULT[f.k] = f.d; });
/* 两个页面的排序状态放进同一张表：列头点击 / 卡片下拉 / toggleSort 都只认 kind。 */
const SORT_DEF = {
  ord:  { fields:ORD_SORT_FIELDS,  cur:() => ordSort, curDir:() => ordDir, set:(k, d) => { ordSort = k; ordDir = d; } },
  prod: { fields:PROD_SORT_FIELDS, cur:() => pSort,   curDir:() => pDir,  set:(k, d) => { pSort = k;  pDir = d; } }
};
function sortField(kind, key){ const m = SORT_DEF[kind]; return m ? m.fields.find(f => f.k === key) : null; }
/* --------------------------------------------------------------------------
   排序状态记忆（v0.44）· 刷新 / 重开页面后列头排序不丢
   —— 单文件离线场景，存 localStorage；key 与列宽记忆（ot.colw.v1）同一套路：
      { kind:{k,d} } 一张表按 kind 存，两个页面共用同一份。
   —— 读取时必须校验「字段仍在本期字段表里 + 方向合法」：旧版本 / 脏数据 / 手改过
      localStorage 时不能让排序崩掉 —— 校验不过就退回该页默认值。
   -------------------------------------------------------------------------- */
const SORT_KEY = 'ot.sort.v1';
function sortCfg(){
  try { const o = JSON.parse(localStorage.getItem(SORT_KEY) || '{}'); return (o && typeof o === 'object') ? o : {}; }
  catch(e){ return {}; }
}
/* 取某页持久化的排序：字段与方向都合法才用，否则退回 (defK, defD) */
function sortInit(kind, defK, defD){
  const o = sortCfg()[kind];
  if(o && typeof o === 'object' && sortField(kind, o.k) && (o.d === 'asc' || o.d === 'desc')) return { k:o.k, d:o.d };
  return { k:defK, d:defD };
}
/* 把两个页面当前排序写回 localStorage（列头 / 卡片下拉 / OT setter 都走这里） */
function sortSave(){
  const o = {};
  Object.keys(SORT_DEF).forEach(kind => { o[kind] = { k:SORT_DEF[kind].cur(), d:SORT_DEF[kind].curDir() }; });
  try { localStorage.setItem(SORT_KEY, JSON.stringify(o)); } catch(e){}
}
/* 点同一列 = 翻方向；点别的列 = 换列并套该列默认方向 */
function toggleSort(kind, key){
  const m = SORT_DEF[kind]; const f = sortField(kind, key);
  if(!m || !f) return;
  if(m.cur() === key) m.set(key, m.curDir() === 'asc' ? 'desc' : 'asc');
  else                m.set(key, f.d || 'asc');
  sortSave();                 /* v0.44：排序一变就记忆，刷新不丢 */
  Store.set({});
}
/* 列头：当前排序列高亮 + ▲/▼；其余列留箭头位（悬停才显），暗示可点。 */
function thSort(kind, key, label, extraCls){
  const m = SORT_DEF[kind]; const on = !!m && m.cur() === key;
  const d = on ? m.curDir() : 'asc';
  const arw = on ? (d === 'desc' ? '▼' : '▲') : '';
  const cls = 'th-sort' + (on ? ' on' : '') + (extraCls ? ' ' + extraCls : '');
  const tip = on ? `当前按「${label}」${d === 'desc' ? '降序' : '升序'}，点一下切${d === 'desc' ? '升序' : '降序'}`
                 : `按「${label}」排序`;
  return `<th class="${cls}" data-sort="${kind}:${key}" title="${tip}">${label}<i class="sarw">${arw}</i></th>`;
}
/* 卡片视图的「排序」下拉：卡片没有列头，字段与方向都从这里选。 */
function sortMenuBtnHTML(id, kind){
  const m = SORT_DEF[kind];
  return `<div class="menu" id="${id}">
      <button class="btn sm" data-sortbtn="1">⇅ 排序</button>
      <div class="pop" style="min-width:150px">${m.fields.map(f => {
        const on = m.cur() === f.k;
        return `<button class="srow${on ? ' on' : ''}" data-sf="${kind}:${f.k}">${f.t}<i class="sarw">${on ? (m.curDir() === 'desc' ? '▼' : '▲') : ''}</i></button>`;
      }).join('')}</div></div>`;
}
/* 通用比较：数字按大小、其余按中文字典序（numeric 让 O2 排在 O10 前面）。 */
function cmpSortVal(a, b){
  if(typeof a === 'number' && typeof b === 'number') return a - b;
  const as = String(a), bs = String(b);
  if(!as && !bs) return 0;
  if(!as) return 1;
  if(!bs) return -1;
  return as.localeCompare(bs, 'zh-Hans-CN', { numeric:true });
}
/* 未填值（'' / null）恒排最后 —— 不随升降序翻到最前，否则一降序满屏空行。 */
function cmpWithDir(va, vb, dir){
  const ea = (va === '' || va == null), eb = (vb === '' || vb == null);
  if(ea || eb) return (ea && eb) ? 0 : (ea ? 1 : -1);
  return cmpSortVal(va, vb) * dir;
}
/* 列头点击 + 卡片下拉：一处绑定，两种视图都覆盖 */
function bindSortClicks(root){
  const box = root || $('#page'); if(!box) return;
  box.querySelectorAll('th.th-sort').forEach(th => th.onclick = () => {
    const p = String(th.dataset.sort || '').split(':'); toggleSort(p[0], p[1]);
  });
  box.querySelectorAll('[data-sortbtn]').forEach(b => {
    const menu = b.closest('.menu'); if(!menu) return;
    b.onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  });
  box.querySelectorAll('[data-sf]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = String(b.dataset.sf || '').split(':'); toggleSort(p[0], p[1]);
  });
}

/* ==========================================================================
   v0.35 · 可拖列宽 + 分页（订单表 / 排产表共用）
   —— 列宽：把手收在本列 th 内（th 带 sticky+z-index 自成层叠上下文，跨到相邻列会被后一列
      的 th 盖住、鼠标点不中）；把手是空 <span>，不新增 <th>、不进 th.textContent ——
      列数（11）与列头 ▲/▼ 的历史断言不受影响。
   —— 分页：默认关 = 现有行为（一次列出全部）。只在表格视图生效；ordViewList / prodViewList
      仍返回全量，只有渲染切片。因此「行数 === 全量」类历史断言在默认关下照旧成立。
   ========================================================================== */
const COLW_KEY = 'ot.colw.v1';
const COL_MIN = 56, COL_MAX = 900;
/* v0.48：产品库两张表各记一套列宽（cprod / sprod）—— 客户产品列宽拖宽了，
   切到供应商产品不该跟着变形；两表列数恰好都是 10，但含义不同，必须分开存。 */
const tblColW = { ord: [], prod: [], cprod: [], sprod: [] };
const _colw = (() => { try { return JSON.parse(localStorage.getItem(COLW_KEY) || '{}') || {}; } catch(e){ return {}; } })();
function colwSave(kind){ _colw[kind] = { w: tblColW[kind].slice() }; try{ localStorage.setItem(COLW_KEY, JSON.stringify(_colw)); }catch(e){} }
/* v0.51：列宽总和小于容器宽时，把差额按比例摊回去。
   症状：搜索只剩两三条、或者用户把各列都拖窄过之后，表格只占容器一部分，右边空
         一大片 —— 看起来像「页面变窄了」。
   做法：只在 sum < 容器宽时动手（超了要保留横向滚动，绝不压缩）；产品图列宽度被
         CSS 钉死在 56px，不参与分摊。差额按各列宽度等比分配，四舍五入的余数给最宽
         的那一列 —— 必须严格等于容器宽，否则又会差 1px 冒出横向滚动条。
   ★ 只改内存里的 tblColW 与 <col>，不写 localStorage：用户拖出来的值保持原样。 */
function fitColToWrap(widths, wrapW, skip){
  if(!wrapW || !widths.length) return widths;
  const sum = widths.reduce((a, b) => a + b, 0);
  if(sum >= wrapW) return widths;
  const cand = widths.map((w, i) => i).filter(i => i !== skip);
  if(!cand.length) return widths;
  const base = cand.reduce((a, i) => a + widths[i], 0);
  const need = wrapW - sum;
  cand.forEach(i => {
    const add = base > 0 ? Math.round(need * widths[i] / base) : Math.round(need / cand.length);
    widths[i] += add;
  });
  const rest = wrapW - widths.reduce((a, b) => a + b, 0);
  if(rest){
    let m = cand[0];
    cand.forEach(i => { if(widths[i] > widths[m]) m = i; });
    /* 这里**不能**套 COL_MIN 下限：摊平是「加宽」，套下限会在宽度本就小于 56 的列上
       把结果撑过容器宽（[56,13,13] + 余数 → 56 反而多出 43px）。 */
    widths[m] += rest;
  }
  return widths;
}
function setupColResize(kind){
  const tbl = $('#page .tw.tscroll > table'); if(!tbl) return;
  const ths = $$('#page .tw.tscroll > table > thead > tr > th'); if(!ths.length) return;
  /* 自然宽度（此刻仍是 auto 布局）—— 首次的默认档。
     直接用实测值、**不加 COL_MIN 下限**：否则被抬升的列会让首屏总宽超出容器，
     一进页面就多出一条横向滚动条。COL_MIN 只作「拖动 / 恢复保存值」时的下限。
     无布局信息时（jsdom 度量恒为 0）退回下限，保证可测。 */
  const natural = ths.map(th => { const w = Math.round(th.getBoundingClientRect().width); return w > 0 ? w : COL_MIN; });
  /* v0.45：列宽记忆是**按序号**存的数组。列数变了（v0.45 排产表 11 → 8 列）之后
     再按序号套旧宽度，会把旧列的宽度错位到别的列上。长度对不上就整份丢弃，走自然宽度。 */
  const savedRaw = (_colw[kind] && _colw[kind].w) || null;
  const saved = (savedRaw && savedRaw.length === ths.length) ? savedRaw : null;
  const widths = ths.map((th, i) => {
    if(saved && saved[i] != null) return Math.max(COL_MIN, Math.min(COL_MAX, Math.round(saved[i])));
    return Math.max(1, Math.min(COL_MAX, natural[i]));
  });
  /* 首屏（无保存值时）把 11 列取整累积的 1~2px 余量从最宽的一列扣掉：
     否则总宽会比容器宽出几个像素，overflow-x:auto 立刻多出一条几乎不可见的横向滚动条。
     保存值（用户拖出来的）不动 —— 那时超出容器是该有的横向滚动。 */
  const wrapW = tbl.parentElement ? Math.round(tbl.parentElement.clientWidth) : 0;
  if(!saved && wrapW > 0){
    const diff = widths.reduce((a, b) => a + b, 0) - wrapW;
    if(diff > 0){
      let idx = 0;
      widths.forEach((w, i) => { if(w > widths[idx]) idx = i; });
      widths[idx] = Math.max(1, widths[idx] - diff);
    }
  }
  /* v0.51：还窄就摊平到容器宽。有保存值时同样要摊 —— 这正是「搜索后只剩两个产品、
     表格缩成一条、右边空一大片」的来源（用户拖过的列宽总和小于容器宽就会这样）。 */
  fitColToWrap(widths, wrapW, ths.findIndex(th => th.classList.contains('pcell')));
  tblColW[kind] = widths.slice();
  /* 注入 <colgroup>（不是 <th>，不影响列数断言） */
  let cg = tbl.querySelector('colgroup');
  if(!cg){ cg = document.createElement('colgroup'); tbl.insertBefore(cg, tbl.firstChild); }
  cg.innerHTML = widths.map(w => `<col style="width:${w}px">`).join('');
  tbl.classList.add('rz-ready');
  ths.forEach((th, i) => {
    th.classList.add('c-rz');
    /* 产品图列（.pcell）宽度被 CSS 钉死在 56px（缩略图 40 + 内边距），拖了看不出变化，
       干脆不给把手 —— 免得用户以为「拖不动 / 坏了」。 */
    if(th.classList.contains('pcell')) return;
    if(th.querySelector('.rz')) return;
    const h = document.createElement('span');
    h.className = 'rz'; h.title = '拖动调整列宽';
    th.appendChild(h);
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX, startW = tblColW[kind][i], colEl = cg.children[i];
      h.classList.add('on'); document.body.classList.add('col-rz');
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      const move = ev => {
        const w = Math.max(COL_MIN, Math.min(COL_MAX, Math.round(startW + (ev.clientX - startX))));
        if(w === tblColW[kind][i]) return;
        tblColW[kind][i] = w; if(colEl) colEl.style.width = w + 'px';
      };
      const up = ev => {
        h.classList.remove('on'); document.body.classList.remove('col-rz');
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        try{ h.releasePointerCapture(ev.pointerId); }catch(_){}
        colwSave(kind);
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  });
}

const PG_SIZES = [10, 20, 50];
let oPaged = false, oSize = 10, oPage = 1;
let pPaged = false, pSize = 10, pPage = 1;
function pgGet(kind){ return kind === 'ord' ? [oPaged, oSize, oPage] : [pPaged, pSize, pPage]; }
function pgSet(kind, paged, size, page){
  if(kind === 'ord'){ oPaged = paged; oSize = size; oPage = page; }
  else { pPaged = paged; pSize = size; pPage = page; }
}
/* 渲染切片：分页关 → 原样；开 → 当前页。并把越界页码夹回有效范围。 */
function pgSlice(kind, list){
  const g = pgGet(kind), paged = g[0], size = g[1];
  if(!paged) return list;
  const pc = Math.max(1, Math.ceil(list.length / size));
  let page = Math.min(Math.max(1, g[2]), pc);
  pgSet(kind, paged, size, page);
  return list.slice((page - 1) * size, page * size);
}
/* 工具栏里的分页开关 + 每页条数 */
function pgControlsHTML(kind){
  const g = pgGet(kind), paged = g[0], size = g[1];
  const idSw = kind === 'ord' ? 'oPaged' : 'pPaged';
  const idSz = kind === 'ord' ? 'oSize'  : 'pSize';
  const sel = PG_SIZES.map(n => `<option value="${n}"${n === size ? ' selected' : ''}>${n} / 页</option>`).join('');
  return `<label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="${idSw}"${paged ? ' checked' : ''}>分页</label>
    <select id="${idSz}" style="border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:12.5px;background:var(--panel);color:var(--text)"${paged ? '' : ' disabled'}>${sel}</select>`;
}
/* 表下方的分页条 */
function pagerHTML(kind, total){
  const g = pgGet(kind), paged = g[0], size = g[1], page = g[2];
  if(!paged) return `<div class="pager2"><span class="pl">共 ${total} 条</span><span class="pr2"></span></div>`;
  const pc = Math.max(1, Math.ceil(total / size));
  const from = total === 0 ? 0 : (page - 1) * size + 1, to = Math.min(page * size, total);
  const B = (label, pg, o) => { o = o || {}; return `<button class="pg2${o.on ? ' on' : ''}" data-pg="${kind}:${pg}"${o.dis ? ' disabled' : ''}>${label}</button>`; };
  const win = []; const add = p => { if(p >= 1 && p <= pc && win.indexOf(p) < 0) win.push(p); };
  add(1); for(let p = page - 2; p <= page + 2; p++) add(p); add(pc); win.sort((a, b) => a - b);
  let btns = '', prev = 0;
  win.forEach(p => { if(p - prev > 1) btns += '<span class="pg2 gap">…</span>'; btns += B(String(p), p, { on: p === page }); prev = p; });
  return `<div class="pager2"><span class="pl">显示 ${from}–${to} 条，共 ${total} 条</span>
    <span class="pr2">${B('«', 1, { dis: page === 1 })}${B('‹', page - 1, { dis: page === 1 })}${btns}${B('›', page + 1, { dis: page === pc })}${B('»', pc, { dis: page === pc })}</span></div>`;
}
function bindPager(kind){
  const sw = $(kind === 'ord' ? '#oPaged' : '#pPaged');
  if(sw) sw.onchange = e => { const g = pgGet(kind); pgSet(kind, e.target.checked, g[1], 1); Store.set({}); };
  const sz = $(kind === 'ord' ? '#oSize' : '#pSize');
  if(sz) sz.onchange = e => { const g = pgGet(kind); pgSet(kind, g[0], Number(e.target.value), 1); Store.set({}); };
  $$('#page .pager2 [data-pg]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const parts = String(b.dataset.pg).split(':');
    if(parts[0] !== kind) return;
    const g = pgGet(kind); pgSet(kind, g[0], g[1], Number(parts[1])); Store.set({});
  });
}

/* v0.44：排序状态从记忆里恢复（首次无记忆 = 交期升序）；非法脏值退回默认 */
const _ordSort0 = sortInit('ord', 'delivery', 'asc');
let ordSort = _ordSort0.k;  /* 排序字段：见 ORD_SORT_FIELDS */
let ordDir  = _ordSort0.d;  /* 排序方向：asc 升序 | desc 降序 */
/* v0.23：客户 / 回款筛选并入统一的多维筛选对象（filters.customerId / filters.pay）。
   下面两个兼容读写口子保留，老脚本仍可用 setOrdFCust('C1') / setOrdFPay('todo') 这类单选写法。 */
function setOrdFCust(v){ Store.setFilter({ customerId: selList(v) }); }
function setOrdFPay(v){ Store.setFilter({ pay: selList(v) }); }
/* 取排序值：数字保持数字，其余转字符串；「已收」与列上显示口径一致（实收 + 核销）。 */
function ordSortVal(o, k, st){
  switch(k){
    case 'orderNo':  return o.orderNo || '';
    case 'customer': { const c = st.data.customers.find(x => x.id === o.customerId); return c ? (c.shortName || c.name || '') : ''; }
    case 'owner':    { const u = st.data.owners.find(x => x.id === o.ownerId);       return u ? (u.name || '') : ''; }
    case 'status':   return String(o.status || '');
    case 'delivery': return o.contractDelivery || '';
    case 'amount':   return Number(o.amount) || 0;
    case 'got':      return paidTotalOf(o);
    case 'unpaid':   return unpaidOf(o);
    case 'sign':     return o.signDate || '';
    default:         return o.sortKey != null ? o.sortKey : 0;   /* manual */
  }
}
/* 订单页当前可见列表：全局筛选（含客户 / 回款多维）→ 排序（含方向） */
function ordViewList(st){
  const list = filteredOrders(st).slice();
  const dir = ordDir === 'desc' ? -1 : 1;
  list.sort((a, b) => cmpWithDir(ordSortVal(a, ordSort, st), ordSortVal(b, ordSort, st), dir));
  return list;
}
function exportCSV(rows, name){
  const csv = '\ufeff' + rows.map(r => r.map(c =>
    '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = name + '_' + fmt(today()) + '.csv'; a.click();
}
function exportOrders(st){
  const list = filteredOrders(st).slice().sort((a,b) => (b.signDate||'').localeCompare(a.signDate||''));
  const head = ['订单号','客户','业务员','状态','签订日','合同交期','实际交付','订单金额','税金','实收','已回款','未回款','手续费核销','付款条件','贸易条款','排产单号','产品摘要'];
  const rows = [head];
  list.forEach(o => {
    const c = st.data.customers.find(x => x.id === o.customerId) || {};
    const u = st.data.owners.find(x => x.id === o.ownerId) || {};
    const got = paidTotalOf(o), recv = receivedOf(o), wo = writeOffOf(o);
    const plan = o.amount || 0;
    rows.push([ o.orderNo, c.name || '', u.name || '', String(o.status).slice(3), o.signDate, o.contractDelivery,
      o.actualDelivery, o.amount, Number(o.taxAmount||0)||0, recv, got, Math.max(0, plan-got), wo,
      payTermLabel(o.paymentTerm), tradeTermLabel(o.tradeTerm), o.moNo, o.productSummary ]);
  });
  exportCSV(rows, '订单明细');
  toast('已导出 ' + list.length + ' 笔订单');
}

/* ==========================================================================
   模块 8.5 · 批量修改（Excel 式查找替换 · 勾选生效 · 一步撤销）
   - ordSel：订单页勾选集合（跨重渲染保留）
   - 直接赋值：把选中订单的某个字段整批改成新值（业务员 / 状态 / 客户 / 条款 / 日期 / 金额 / 文本）
   - 查找替换：对文本字段做子串替换，支持「区分大小写」「单元格匹配」
   - 执行前先算差异表（旧值 → 新值）预览，新旧值相同的记录自动跳过、不写库
   - 执行后保留一次撤销快照，仅回滚被改字段，不影响其它改动
   ========================================================================== */
const BATCH_FIELDS = [
  { k:'ownerId',          t:'业务员',     type:'ref',    src:'owners' },
  { k:'status',           t:'状态',       type:'status' },
  { k:'customerId',       t:'客户',       type:'ref',    src:'customers' },
  { k:'paymentTerm',      t:'付款条件',   type:'enum',   opts:PAY_TERMS },
  { k:'tradeTerm',        t:'贸易条款',   type:'enum',   opts:TRADE_TERMS },
  { k:'contractDelivery', t:'合同交期',   type:'date' },
  { k:'actualDelivery',   t:'实际交付日', type:'date' },
  { k:'amount',           t:'订单金额',   type:'number' },
  { k:'taxAmount',        t:'税金',       type:'number' },
  { k:'productSummary',   t:'产品摘要',   type:'text' },
  { k:'remark',           t:'备注',       type:'text' },
  { k:'tags',             t:'标签',       type:'text' },
  { k:'orderNo',          t:'订单号',     type:'text' }
];
/* 查找替换只作用于文本字段：避免把「状态 / 条款 / 枚举」替换成非法值。
   v0.43：'moNo' 已移除 —— 排产单号的唯一来源是 production 表，
   批量改写缓存字段会绕过全局唯一校验、并让 orders.moNo 与排产记录不一致。
   要改单号请到「排产」页逐条编辑，或在订单详情里用排产单号 chips 调整。 */
const BATCH_TEXT_FIELDS = ['productSummary','remark','tags','orderNo'];
const BATCH_NUMBER_FIELDS = ['amount','taxAmount'];

let ordSel = new Set();   /* 已勾选订单 id */
let batchUndo = null;     /* { at, label, rows:[{id,field,old}] } 仅保留最近一次 */
let BX = null;            /* 批量弹窗内的临时编辑状态 */

function batchTargetList(st){
  const all = st.data.orders;
  return all.filter(o => ordSel.has(o.id));
}
/* 字段值 → 展示文案（id 还原成名称，金额加币种） */
function bxLabel(st, field, v){
  if(v == null || v === '') return '';
  if(field === 'ownerId'){ const u = st.data.owners.find(x => x.id === v); return u ? u.name : String(v); }
  if(field === 'customerId'){ const c = st.data.customers.find(x => x.id === v); return c ? (c.shortName || c.name) : String(v); }
  if(field === 'paymentTerm') return payTermLabel(v);
  if(field === 'tradeTerm')   return tradeTermLabel(v);
  if(BATCH_NUMBER_FIELDS.indexOf(field) >= 0) return money(Number(v) || 0);
  return String(v);
}
function bxCell(st, field, v){
  const t = bxLabel(st, field, v);
  return t === '' ? '<span class="muted">（空）</span>' : esc(t);
}
function bxCast(f, raw){
  if(!f) return String(raw == null ? '' : raw);
  if(f.type === 'number'){ const n = Number(raw); return isFinite(n) ? n : 0; }
  return String(raw == null ? '' : raw);
}
function bxFieldLabel(k){ const f = BATCH_FIELDS.find(x => x.k === k); return f ? f.t : k; }
function bxEscRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* 计算差异集：只返回「值真的会变」的记录 */
function bxCompute(st){
  const rows = batchTargetList(st);
  const out = [];
  if(!BX || !rows.length) return out;
  if(BX.mode === 'replace'){
    const k = BX.rfield;
    if(!BX.find) return [];
    const re = new RegExp(bxEscRe(BX.find), BX.cs ? 'g' : 'gi');
    rows.forEach(o => {
      const ov = String(o[k] == null ? '' : o[k]);
      let nv = null;
      if(BX.whole){
        const hit = BX.cs ? ov === BX.find : ov.toLowerCase() === BX.find.toLowerCase();
        if(hit) nv = String(BX.to == null ? '' : BX.to);
      }else{
        re.lastIndex = 0;
        if(re.test(ov)){ re.lastIndex = 0; nv = ov.replace(re, String(BX.to == null ? '' : BX.to)); }
      }
      if(nv !== null && nv !== ov) out.push({ o, field:k, ft:bxFieldLabel(k), ov, nv });
    });
    return out;
  }
  const f = BATCH_FIELDS.find(x => x.k === BX.field);
  if(!f) return [];
  if(BX.value === '' || BX.value == null) return [];   /* 未选新值 → 不产生变更 */
  const nv = bxCast(f, BX.value);
  rows.forEach(o => {
    const ov = o[f.k] == null ? '' : o[f.k];
    if(String(ov) !== String(nv)) out.push({ o, field:f.k, ft:f.t, ov, nv });
  });
  return out;
}

/* ---------- 弹窗：设置规则 + 差异预览 ---------- */
function bxValueHTML(st){
  const f = BATCH_FIELDS.find(x => x.k === BX.field) || BATCH_FIELDS[0];
  const v = BX.value == null ? '' : BX.value;
  if(f.type === 'ref'){
    const list = st.data[f.src] || [];
    const lab = f.src === 'customers' ? (c => c.shortName || c.name) : (c => c.name);
    return `<select id="bxValue"><option value="">— 请选择 —</option>` +
      list.map(x => `<option value="${x.id}" ${v === x.id ? 'selected' : ''}>${esc(lab(x))}</option>`).join('') + `</select>`;
  }
  if(f.type === 'status')
    return `<select id="bxValue"><option value="">— 请选择 —</option>` +
      STATUS.map(s => `<option value="${s}" ${v === s ? 'selected' : ''}>${String(s).slice(3)}</option>`).join('') + `</select>`;
  if(f.type === 'enum')
    return `<select id="bxValue"><option value="">— 请选择 —</option>` +
      f.opts.map(o => `<option value="${o.v}" ${v === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('') + `</select>`;
  if(f.type === 'date')   return `<input type="date" id="bxValue" value="${esc(v)}">`;
  if(f.type === 'number') return `<input type="number" id="bxValue" value="${esc(v)}" placeholder="输入数字">`;
  return `<input id="bxValue" value="${esc(v)}" placeholder="输入新值">`;
}
function bxPanelHTML(st){
  if(!BX) return '';
  if(BX.mode === 'replace'){
    const opts = BATCH_TEXT_FIELDS.map(k =>
      `<option value="${k}" ${BX.rfield === k ? 'selected' : ''}>${esc(bxFieldLabel(k))}</option>`).join('');
    return `<div class="frow" style="grid-template-columns:1fr 1.15fr 1.15fr">
        <div class="fld"><label>目标字段</label><select id="bxRField">${opts}</select></div>
        <div class="fld"><label>查找内容</label><input id="bxFind" value="${esc(BX.find)}" placeholder="要查找的文字"></div>
        <div class="fld"><label>替换为（留空 = 删除该内容）</label><input id="bxTo" value="${esc(BX.to)}" placeholder="替换后的文字"></div>
      </div>
      <div class="bxopts">
        <label><input type="checkbox" id="bxCs" ${BX.cs ? 'checked' : ''}> 区分大小写</label>
        <label><input type="checkbox" id="bxWhole" ${BX.whole ? 'checked' : ''}> 单元格匹配（整格内容完全相等才替换）</label>
      </div>
      ${infoI('例：把产品摘要里的「2025」整批换成「2026」；客户改名后统一替换备注里的旧公司名。')}`;
  }
  const opts = BATCH_FIELDS.map(f =>
    `<option value="${f.k}" ${BX.field === f.k ? 'selected' : ''}>${esc(f.t)}</option>`).join('');
  return `<div class="frow two">
      <div class="fld"><label>要修改的字段</label><select id="bxField">${opts}</select></div>
      <div class="fld"><label>新值</label>${bxValueHTML(st)}</div>
    </div>
    ${infoI('只作用于勾选的订单；新旧值相同的记录自动跳过，不会写库。')}`;
}
function bxPreviewHTML(st, rows){
  if(!rows.length) return `<div class="hint" style="margin:0;background:var(--line-2);color:var(--muted)">暂无命中：请设置规则，或所选订单的新值与旧值相同。</div>`;
  const show = rows.slice(0, 50);
  let h = `<div class="bxprev"><table><thead><tr><th>订单号</th><th>客户</th><th>字段</th>
    <th>旧值</th><th></th><th>新值</th></tr></thead><tbody>`;
  show.forEach(r => {
    const c = st.data.customers.find(x => x.id === r.o.customerId) || {};
    h += `<tr><td><b>${esc(r.o.orderNo)}</b></td><td>${esc(c.shortName || c.name || '')}</td>
      <td>${esc(r.ft)}</td><td class="ov">${bxCell(st, r.field, r.ov)}</td>
      <td class="bxarrow">→</td><td class="nv">${bxCell(st, r.field, r.nv)}</td></tr>`;
  });
  h += '</tbody></table></div>';
  if(rows.length > show.length)
    h += `<div class="tip" style="margin-top:6px">仅预览前 50 条，实际会修改 <b>${rows.length}</b> 条。</div>`;
  return h;
}
function bxRefresh(){
  const st = Store.state;
  const rows = bxCompute(st);
  const cnt = $('#bxCnt');
  if(cnt) cnt.textContent = rows.length ? `命中 ${rows.length} 笔` : '无命中';
  const p = $('#bxPrev'); if(p) p.innerHTML = bxPreviewHTML(st, rows);
  const btn = $('#bxRun');
  if(btn){ btn.disabled = !rows.length; btn.style.opacity = rows.length ? '' : '.5'; }
}
function bxBindPanel(){
  const fs = $('#bxField');
  if(fs) fs.onchange = e => { BX.field = e.target.value; BX.value = ''; $('#bxPanel').innerHTML = bxPanelHTML(Store.state); bxBindPanel(); bxRefresh(); };
  const rf = $('#bxRField'); if(rf) rf.onchange = e => { BX.rfield = e.target.value; bxRefresh(); };
  const fn = $('#bxFind');   if(fn) fn.oninput  = e => { BX.find = e.target.value; bxRefresh(); };
  const to = $('#bxTo');     if(to) to.oninput  = e => { BX.to   = e.target.value; bxRefresh(); };
  const cs = $('#bxCs');     if(cs) cs.onchange = e => { BX.cs = e.target.checked; bxRefresh(); };
  const wh = $('#bxWhole');  if(wh) wh.onchange = e => { BX.whole = e.target.checked; bxRefresh(); };
  const v  = $('#bxValue');
  if(v){
    const h2 = e => { BX.value = e.target.value; bxRefresh(); };
    v.addEventListener(v.tagName === 'SELECT' ? 'change' : 'input', h2);
    if(v.tagName !== 'SELECT') v.addEventListener('change', h2);
  }
}
function openBatchSheet(){

  const targets = batchTargetList(st);
  if(!targets.length){ toast('请先在订单列表勾选要修改的订单'); return; }

    <div class="bd" id="bxBody">
      <div class="fsec">① 选择改值方式</div>
      <div class="seg" id="bxMode">
        <button data-m="assign" class="on">直接赋值</button>
        <button data-m="replace">查找替换</button></div>

      <div id="bxPrev"></div>

/* ---------- 执行 / 撤销 ---------- */
async function bxRun(){
  const st = Store.state;
  const rows = bxCompute(st);
  if(!BX || !rows.length){ toast('没有需要修改的记录'); return; }
  const label = BX.mode === 'replace'
    ? `查找替换「${BX.find}」→「${BX.to}」（${bxFieldLabel(BX.rfield)}）`
    : `批量改「${bxFieldLabel(BX.field)}」→ ${bxLabel(st, BX.field, bxCast(BATCH_FIELDS.find(x => x.k === BX.field), BX.value)) || '（空）'}`;
  if(!confirm(`即将修改 ${rows.length} 笔订单，是否继续？\n\n${label}`)) return;
  /* v0.20：批量修改是大范围改动，强制存一份「操作前」的回退点（不吃 10 分钟合并窗口） */
  await histForceMark('批量修改前（' + String(label).slice(0, 40) + '）');
  const btn = $('#bxRun'); if(btn){ btn.disabled = true; btn.textContent = '执行中…'; }
  const undoRows = rows.map(r => ({ id:r.o.id, field:r.field, old:r.ov }));
  let n = 0, err = 0;
  for(const r of rows){
    try{ await st.source.update('orders', r.o.id, { [r.field]: r.nv }); n++; }catch(e){ err++; }
  }
  batchUndo = { at: Date.now(), label, rows: undoRows };
  closeSheet();
  await reload();
  Store.set({});
  toast(`已修改 ${n} 笔订单` + (err ? `（失败 ${err} 笔）` : '') + ' · 可点「↩ 撤销批量修改」回滚');
}
async function bxUndo(){
  if(!batchUndo){ toast('没有可撤销的批量修改'); return; }
  const u = batchUndo;
  if(!confirm(`撤销上一次批量修改？\n\n${u.label}\n将把 ${u.rows.length} 笔订单还原为修改前的值。`)) return;
  let n = 0, err = 0;
  for(const r of u.rows){
    try{ await Store.state.source.update('orders', r.id, { [r.field]: r.old }); n++; }catch(e){ err++; }
  }
  batchUndo = null;
  await reload();
  Store.set({});
  toast(`已撤销 ${n} 笔订单的修改` + (err ? `（失败 ${err} 笔）` : ''));
}

/* ==========================================================================
   v0.27 · 订单卡片视图（思源数据库式看板）+「i」说明图标
   - 卡片与表格看的是同一份 ordViewList：筛选 / 关键字 / 排序对两者同时生效，
     不另写一套取数，两个视图不可能给出不一致的说法。
   - 分列逻辑与排产卡片完全共用（boardColumns）：按合同交期月份升序铺开。
   - 卡片上显示哪些字段由用户自己勾（参考思源数据库的字段显隐），只存本机。
   ========================================================================== */
/* ---------- 「i」说明图标 ---------- */
function infoI(tip, cls){
  if(!tip) return '';
  return `<span class="ii${cls ? ' ' + cls : ''}"><span class="dot">i</span><span class="ii-t">${tip}</span></span>`;
}
let _iiOn = null, _iiPinned = false;
function iiPlace(el){
  const t = el.querySelector('.ii-t'); if(!t) return;
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, vw - w - 8));
  let top = r.bottom + 7;
  if(top + h > vh - 8) top = Math.max(8, r.top - h - 7);
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function iiShow(el){
  if(_iiOn && _iiOn !== el) _iiOn.classList.remove('on');
  _iiOn = el; el.classList.add('on'); iiPlace(el);
}
function iiClose(){
  if(_iiOn){ _iiOn.classList.remove('on'); _iiOn = null; }
  _iiPinned = false;
}
function bindInfoIcons(){
  if(bindInfoIcons._done) return; bindInfoIcons._done = true;
  document.addEventListener('mouseover', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el || el === _iiOn || _iiPinned) return;
    iiShow(el);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el || el !== _iiOn || _iiPinned) return;
    if(el.contains(e.relatedTarget)) return;
    iiClose();
  });
  /* 捕获阶段：点到图标不该连带触发所在行 / 卡片的打开订单 */
  document.addEventListener('click', e => {
    const el = e.target && e.target.closest && e.target.closest('.ii');
    if(!el){ iiClose(); return; }
    e.stopPropagation(); e.preventDefault();
    if(_iiPinned && _iiOn === el){ iiClose(); return; }
    _iiPinned = true; iiShow(el);
  }, true);
  window.addEventListener('resize', () => { if(!_iiPinned) iiClose(); });
}

/* ---------- 通用「按月分列」：升序、空月补列、跨度 >15 月退化、无日期进末列 ---------- */
function boardColumns(list, getKey){
  const groups = {}, noDate = [];
  list.forEach(x => {
    const k = getKey(x) || '';
    if(!k){ noDate.push(x); return; }
    (groups[k] = groups[k] || []).push(x);
  });
  const present = Object.keys(groups).sort();
  let keys = present;
  if(present.length > 1){
    const ix = k => Number(k.slice(0,4)) * 12 + (Number(k.slice(5,7)) - 1);
    const a = ix(present[0]), b = ix(present[present.length - 1]);
    if(b - a + 1 <= 15){
      keys = [];
      for(let i = a; i <= b; i++)
        keys.push(String(Math.floor(i/12)).padStart(4,'0') + '-' + String(i % 12 + 1).padStart(2,'0'));
    }
  }
  const cols = keys.map(k => ({ key:k, list: groups[k] || [] }));
  if(noDate.length) cols.push({ key:'', list: noDate });
  return cols;
}

/* ==========================================================================
   v0.55 · 分批出货（一个订单 → N 个出货单号）
   --------------------------------------------------------------------------
   shipments 表本来就允许一个订单挂多条记录，缺的是「发完没」的语义：
   统计累计已发金额 / 件数 / 最近发货日，剩下的就是「未发金额」。
   ★ 累计 > 订单金额不硬拦（改单、赠品、运费都会让金额对不上），只提示；
     是否超发由 shipOverOf 单独判，UI 用琥珀色标出。
   ========================================================================== */
function shipListOf(o){
  const all = (Store.state && Store.state.data && Store.state.data.shipments) || [];
  const id = o && o.id;
  return id == null ? [] : all.filter(s => s && s.orderId === id);
}
function shipAggOf(o){
  const list = shipListOf(o);
  const amount = list.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  const qty    = list.reduce((a, s) => a + (Number(s.qty) || 0), 0);
  const nos    = list.map(s => s.shipNo).filter(Boolean);
  const dates  = list.map(s => s.shipDate).filter(Boolean).sort();
  return { n:list.length, amount, qty, nos, last: dates.length ? dates[dates.length - 1] : '', list };
}
/* 未发金额：订单金额 − 累计已发（不低于 0） */
function shipRemainOf(o){
  const a = shipAggOf(o);
  return Math.max(0, Number((o && o.amount) || 0) - a.amount);
}
/* 超发金额：累计已发 − 订单金额（> 0 才算超发） */
function shipOverOf(o){
  const a = shipAggOf(o);
  return Math.max(0, a.amount - Number((o && o.amount) || 0));
}
/* 部分发货：发过但没发完（且不是超发） */
function shipPartialOf(o){
  const a = shipAggOf(o);
  return a.n > 0 && a.amount + 0.005 < Number((o && o.amount) || 0);
}
/* 发货进度（金额口径，0~100） */
function shipPctOf(o){
  const amt = Number((o && o.amount) || 0), a = shipAggOf(o);
  if(amt <= 0) return a.n ? 100 : 0;
  return Math.max(0, Math.min(100, Math.round(a.amount / amt * 100)));
}
/* 出货单号查重（跨订单，大小写不敏感）：同一票货不能挂两个单号，

const PROD_RISK_LABEL = { ALL:'全部状态', overdue:'已逾期未完工', late:'预计晚于交期', tight:'卡交期', normal:'正常', done:'已完工' };
const PROD_STATUS = ['待排产','生产中','已完工','已暂停'];
/* v0.46：进度**完全由状态决定**（只读，不再手填、不再从数量推算）。
   四个状态各有固定值；改这一处即可调整全局口径
   （表单 / 列表 / 详情 / 卡片 / 排序 / 筛选 共用同一份）。 */
const PROD_STATUS_PCT = { '待排产':0, '生产中':30, '已暂停':50, '已完工':100 };
/* 是否已完工：优先看「实际完工日」；思源过来的记录没有实际完工日，
   但状态已写成「已完工」（导入时按完工类状态落库），同样算已完工——
   否则会被误报成「已逾期」，出现「状态=已完工 却显示逾期」的矛盾。 */
function prodDone(p){ return !!(p && (p.actualFinish || p.opStatus === '已完工')); }
/* 排产进度（0-100）。⚠ 必须与表单保存口径完全一致（见 PROD_STATUS_PCT）。
   v0.46 起**状态优先**：待排产 0% / 生产中 30% / 已暂停 50% / 已完工 100%。
   只有「没有状态 / 状态不在表里」的老数据才退回旧口径（信息不凭空丢）：
     ① 有「生产数量」→ 已完成 ÷ 生产数量
     ② 有实际完工日 → 100%
     ③ 其余 → 手填的「完成进度」百分比 */
function prodPct(p){
  if(!p) return 0;
  const s = String(p.opStatus || '');
  if(Object.prototype.hasOwnProperty.call(PROD_STATUS_PCT, s)) return PROD_STATUS_PCT[s];
  const q = Number(p.qty) || 0, d = Number(p.doneQty) || 0;
  if(q > 0) return Math.max(0, Math.min(100, Math.round(d / q * 100)));
  if(prodDone(p)) return 100;
  const f = Number(p.progressPct);
  return isFinite(f) ? Math.max(0, Math.min(100, Math.round(f))) : 0;
}
/* 计划完工 − 合同交期（天），无数据返回 null */
function prodGap(p, o){
  if(!p.planFinish || !o.contractDelivery) return null;
  return Math.round((new Date(p.planFinish) - new Date(o.contractDelivery)) / 86400000);
}
/* 交期风险归类（互斥，优先级 done > overdue > late > tight > normal） */
function prodRisk(p, o){
  if(prodDone(p)) return 'done';
  const g = prodGap(p, o);
  if(p.planFinish && diffToday(p.planFinish) < 0) return 'overdue';
  if(g != null && g > 0) return 'late';
  if(g === 0) return 'tight';
  return 'normal';
}
/* 交期对比展示（tag 文案 + 配色）
   已完工 → 看「实际完工日 vs 合同交期」；未完工 → 看「计划完工日 vs 合同交期」（属预测，标「预计」）。 */
function prodCmpTag(p, o){
  if(prodDone(p)){
    if(p.actualFinish && o.contractDelivery){
      const d = Math.round((new Date(p.actualFinish) - new Date(o.contractDelivery)) / 86400000);
      if(d > 0)   return { cmp:'完工晚 ' + d + ' 天', cls:'t-red' };
      if(d === 0) return { cmp:'卡交期完工', cls:'t-orange' };
      return { cmp:'提前 ' + (-d) + ' 天', cls:'t-green' };
    }
    return { cmp:'已完工', cls:'t-green' };
  }
  const g = prodGap(p, o);
  if(p.planFinish && diffToday(p.planFinish) < 0)
    return { cmp:'已逾期 ' + (-diffToday(p.planFinish)) + ' 天', cls:'t-red' };
  if(g == null) return { cmp:'—', cls:'t-gray' };
  if(g > 0)   return { cmp:'预计晚 ' + g + ' 天', cls:'t-red' };
  if(g === 0) return { cmp:'卡交期', cls:'t-orange' };
  return { cmp:'预计提前 ' + (-g) + ' 天', cls:'t-green' };
}

  const kw = (scopeFilters(st, 'prod').keyword || '').trim().toLowerCase();
