<style>
/* ============ 扁平浅色设计系统 v0.4 ============ */
:root{
  /* v0.38 · iOS 设计系统：整套换成 Apple 系统色（systemBlue/Red/Orange/Yellow/Green/Teal/Gray），
     圆角放大到 iOS 的 12 / 10px，控件高度 34px。深色模式见紧随其后的 prefers-color-scheme 块；
     JS 侧的 SVG 图表墨色与调色板由 applyScheme() 同步，两套色板见 PALETTE_LIGHT / PALETTE_DARK。
     —— 语义不变：红=风险/未收，绿=正常/已收。 */
  --bg:#f2f2f7; --panel:#ffffff; --line:#d9d9de; --line-2:#efeff4;
  --text:#1c1c1e; --muted:#5b5b60; --faint:#7c7c82; --decor:#c7c7cc;
  --primary:#007aff; --primary-600:#0062cc; --primary-700:#004c99; --primary-soft:#e8f1ff;
  --red:#ff3b30; --red-600:#c7362e; --red-soft:#ffebea;
  --orange:#ff9500; --orange-600:#a65b00; --orange-soft:#fff3e0;
  --amber:#ffcc00; --amber-600:#8a6100; --amber-soft:#fff8e1;
  --green:#34c759; --green-600:#1e7b37; --green-soft:#e7f9ec;
  --teal:#30b0c7; --teal-600:#0e7c90; --teal-soft:#e3f6fa;
  --slate:#6e6e73; --slate-soft:#efeff4;
  /* iOS 控件观感专用 token（浅色档） */
  --accent-fill:#007aff; --on-accent:#ffffff;
  --fill-1:rgba(120,120,128,.20); --fill-2:rgba(120,120,128,.12); --fill-3:rgba(120,120,128,.07);
  --line-hover:#c6c6cb; --warn-line:#f0b3ad; --danger-line:#f0c0bb;
  --row-hover:rgba(0,122,255,.055);
  --err-bg:#fff5f4; --inset-bg:#f7f7fa; --drop-line:#c7c7cc; --drop-bg:#fbfbfd; --selbar-line:#cfe2ff;
  --scrim:rgba(0,0,0,.34);
  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 8px 24px rgba(0,0,0,.12);
  --shadow-3:-24px 0 60px rgba(0,0,0,.18);
  --toast-bg:rgba(28,28,30,.94); --toast-fg:#ffffff;
  --fill-green:#1e7b37; --fill-red:#c7362e; --fill-slate:#6e6e73;
  --rank1-bg:#ffefb8; --rank1-fg:#7a5600;
  --rank2-bg:#e4e4e9; --rank2-fg:#4b4b50;
  --rank3-bg:#ffe0d5; --rank3-fg:#9a3d1e;
  /* 圆角：iOS 卡片 12px / 控件 10px */
  --radius:12px; --radius-ctl:10px;
  --sh:var(--shadow-1);
  --sw:224px; --topbar-h:52px; --ctl-h:34px;
  /* 类型刻度（8px 基线）：字号只从这七级里取，勿再散写 */
  --fs-display:28px; --fs-h1:20px; --fs-h2:16px; --fs-body:14px;
  --fs-sm:13px; --fs-xs:12px; --fs-tab:11px;
  /* 动效词表：只动画 transform / opacity */
  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.4,0,.2,1);
  /* 层级 */
  --z-sidebar:70; --z-drawer:200; --z-toast:280; --z-tip:300;
  /* 移动端安全区 */
  --safe-b:env(safe-area-inset-bottom,0px);
  /* v0.31 · 数据表滚动区高度上限：列表在首屏内自成滚动区，整页不再需要滚
     v0.36：这里退化为「首帧兜底」——真实值由 fitPageH() 实测后写回元素。
     原因：各页 表头+筛选栏+KPI 的高度并不相同（orders 与 prod 共用同一个 376，
     实测底部余量却差 41px），写死一个常数必然要么留白、要么多滚一行。 */
  --tbl-max:calc(100dvh - 376px);
}
/* v0.38 · 「跟随系统」深色档：只重定义 token，组件无需第二套规则。
   —— 浅色下 -600 是「正文用的深档」，深色下必须反过来用亮档，否则文字沉进背景。 */
@media (prefers-color-scheme: dark){
  html{color-scheme:dark}
  :root{
    --bg:#000000; --panel:#1c1c1e; --line:#38383a; --line-2:#2c2c2e;
    --text:#ffffff; --muted:#aeaeb2; --faint:#8e8e93; --decor:#48484a;
    --primary:#0a84ff; --primary-600:#4aa3ff; --primary-700:#7cbbff; --primary-soft:#0a2540;
    --red:#ff453a; --red-600:#ff7a70; --red-soft:#3a1b19;
    --orange:#ff9f0a; --orange-600:#ffb340; --orange-soft:#3a2712;
    --amber:#ffd60a; --amber-600:#ffd75e; --amber-soft:#332a0e;
    --green:#30d158; --green-600:#5bdb7c; --green-soft:#14391f;
    --teal:#40c8e0; --teal-600:#5fd0e0; --teal-soft:#0d2f36;
    --slate:#98989d; --slate-soft:#2c2c2e;
    --accent-fill:#0a84ff; --on-accent:#ffffff;
    --fill-1:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.24); --fill-3:rgba(120,120,128,.14);
    --line-hover:#5a5a5e; --warn-line:#7a3b36; --danger-line:#7a3b36;
    --row-hover:rgba(10,132,255,.14);
    --err-bg:#3a1b19; --inset-bg:#232325; --drop-line:#48484a; --drop-bg:#232325; --selbar-line:#1d3a5c;
    --scrim:rgba(0,0,0,.58);
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 10px 28px rgba(0,0,0,.55);
    --shadow-3:-24px 0 60px rgba(0,0,0,.6);
    --toast-bg:rgba(58,58,60,.96); --toast-fg:#ffffff;
    --rank1-bg:#4a3c0d; --rank1-fg:#ffd75e;
    --rank2-bg:#3a3a3e; --rank2-fg:#d0d0d5;
    --rank3-bg:#4a2a1c; --rank3-fg:#ffa07a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
/* 键盘可达：焦点环（此前完全缺失） */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-ctl)}
/* 数字对齐：表格与数值统一等宽数字，消除列抖动 */
table,.num,.kpi .vl,.calcbox .v,.odetop .k b,.mc-kv .kv,.vno,.vdate,.planbar .it b,.selbar b,.chip-sel b,.mc-date,.mhd .cnt{font-variant-numeric:tabular-nums}
/* 尊重「减弱动效」偏好 */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- 侧边栏（浅色扁平） ---------- */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:70;
  transition:transform var(--dur-2) var(--ease-out)}
.sb-logo{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.sb-logo .mark{width:28px;height:28px;border-radius:6px;overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center}
.sb-logo .t{font-size:14px;font-weight:700;color:var(--text);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-logo .s{font-size:10.5px;color:var(--faint)}
.sb-nav{flex:1;overflow-y:auto;padding:10px}
.sb-nav .grp{color:var(--faint);font-size:10.5px;padding:12px 10px 5px;letter-spacing:.8px;font-weight:600}
.sb-nav a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:5px;color:var(--muted);
  font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:background .12s,color .12s}
.sb-nav a:hover{background:var(--line-2);color:var(--text)}
.sb-nav a.on{background:var(--primary);color:#fff;font-weight:600}
.sb-nav a .ico{width:18px;text-align:center;font-size:15px}
.sb-nav a .cnt{margin-left:auto;background:var(--line-2);color:var(--muted);border-radius:10px;
  font-size:10px;padding:0 6px;min-width:18px;text-align:center}
.sb-nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sb-foot{padding:11px 14px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.7}
.sb-foot .ds{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sb-foot .dot.warn{background:var(--orange)}

/* ---------- 主区 / 粘性头部（顶栏 + 全局筛选一起钉住） ---------- */
#main{margin-left:var(--sw);height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0}
header.stick{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line)}
#topbar{display:flex;align-items:center;gap:10px;height:var(--topbar-h);padding:0 18px;border-bottom:1px solid var(--line-2)}
#topbar .ttl{font-size:15.5px;font-weight:700}
#topbar .sub{font-size:11.5px;color:var(--faint)}
.spacer{flex:1}
.hamb{display:none;border:1px solid var(--line);border-radius:var(--radius-ctl);padding:5px 10px;font-size:15px;color:var(--muted)}

/* ---------- 全局筛选栏（所有页面可见可用） ---------- */
#gfilter{border-bottom:1px solid var(--line);background:var(--panel)}
#gfilter .inner{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:9px 18px}
.gf-label{font-size:10.5px;color:var(--faint);margin-bottom:3px;font-weight:600;letter-spacing:.3px}
.gf{min-width:120px}
.gf input,.gf select{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:5px 8px;background:var(--panel);font-size:13px;width:100%;height:var(--ctl-h)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-ctl);overflow:hidden;background:var(--panel);height:var(--ctl-h)}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--line-2);color:var(--text)}
.seg button.on{background:var(--primary-soft);color:var(--primary-600);font-weight:600}
#gfilter .tools{display:flex;gap:6px;align-items:center;margin-left:auto}

/* ---------- 按钮 ---------- */
/* 圆角统一收小；高度固定 32px 让同行按钮顶底对齐 */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-ctl);padding:6px 12px;font-size:13px;color:var(--muted);
  height:var(--ctl-h);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:border-color var(--dur-1),background var(--dur-1),color var(--dur-1),transform var(--dur-1)}
.btn:hover{border-color:#d3dae4;color:var(--text);background:var(--line-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.btn.primary:hover{background:var(--primary-700)}
.btn.sm{padding:2px 9px;font-size:12px;border-radius:3px;height:26px}
.btn.danger{color:var(--red-600)}
.btn.danger:hover{border-color:#e5c9c6;background:var(--red-soft);color:var(--red-600)}

/* ---------- 布局 ---------- */
/* v0.31：内容区是唯一滚动容器 —— 侧栏 / 顶栏 / 筛选栏永远在屏幕上，切页不再整页回滚 */
/* v0.51：scrollbar-gutter:stable —— 列表长/短切换时纵向滚动条会出现或消失，
   不预留位置的话内容区宽度会跳 15~17px（表格跟着「一会儿宽一会儿窄」）。
   预留后无论有无滚动条，内容区宽度恒定。 */
#page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;
  padding:16px 20px 40px;max-width:1920px;width:100%}
.grid{display:grid;gap:12px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(370px,1fr))}
/* v0.35：订单详情改为「可直接编辑属性面板」（.pp），原六卡网格 .od2 已移除 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh)}
.card .hd{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .hd h3{font-size:13.5px}
.card .bd{padding:15px}
.card .bd.np{padding:0}
.sec{font-size:11.5px;color:var(--faint);margin:20px 0 9px;font-weight:700;letter-spacing:.6px}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);background:var(--line-2);border:1px solid var(--line-2);
  border-radius:var(--radius-ctl);padding:9px 12px;margin-bottom:12px;line-height:1.7}
/* v0.27 · 「i」说明图标：说明文字仍留在 DOM 内（.ii-t），只是不铺在页面上；
   悬停浮出、点击钉住（.on）。用 position:fixed 是为了不被 .tw / .card 的 overflow 裁掉。 */
.ii{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;flex:none;
    border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--muted);
    font:italic 700 10.5px/1 Georgia,"Times New Roman",serif;cursor:help;vertical-align:middle;margin-left:6px;
    user-select:none;transition:border-color .12s,color .12s,background .12s}
.ii:hover,.ii.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.ii.warn{border-color:#e0b0ab;color:var(--red)}
.ii.warn:hover,.ii.warn.on{border-color:var(--red);background:var(--red);color:#fff}
.ii-t{position:fixed;left:0;top:0;z-index:300;width:max-content;max-width:330px;visibility:hidden;opacity:0;
    pointer-events:none;white-space:normal;text-align:left;font-size:11.5px;font-weight:400;font-style:normal;
    color:var(--text);line-height:1.7;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-ctl);padding:9px 11px;box-shadow:0 8px 24px rgba(15,23,42,.16);
    transition:opacity .12s}
.ii-t b{color:var(--text)}
.ii-t code{background:var(--line-2);border-radius:3px;padding:1px 4px;font-size:11px}
.ii.on>.ii-t{visibility:visible;opacity:1}
.toolbar .ii,.hd .ii,.selbar .ii{margin-left:2px}
/* 订单卡片：多行字段（思源数据库卡片的样子） */
.mc-line{font-size:11.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-kv{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.mc-kv .kv{font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
.mc-kv .kv em{font-style:normal;color:var(--faint);margin-right:3px}
.mc-kv .kv .ok{color:var(--green-600)} .mc-kv .kv .bad{color:var(--red-600)}
.cfrow{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12.5px;color:var(--text);cursor:pointer}
.cfrow:hover{background:var(--line-2)}
.cfrow input{margin:0}
.empty{text-align:center;padding:34px 16px;color:var(--faint);font-size:13px}

/* ---------- 标签：浅色为主，关键信息用实底突出 ---------- */
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:4px;white-space:nowrap;font-weight:500}
.t-gray{background:var(--slate-soft);color:var(--slate)}
.t-blue{background:var(--primary-soft);color:var(--primary-600)}
.t-orange{background:var(--orange-soft);color:var(--orange-600)}
.t-amber{background:var(--amber-soft);color:var(--amber-600)}
.t-green{background:var(--green-soft);color:var(--green-600)}
.t-teal{background:var(--teal-soft);color:var(--teal-600)}
.t-red{background:var(--red-soft);color:var(--red-600)}
/* 实底 = 一眼抓住的关键信息 */
.tag.solid-green{background:var(--green-600);color:#fff}
.tag.solid-red{background:var(--red-600);color:#fff}
.tag.solid-slate{background:var(--slate);color:#fff}
.tag.solid-primary{background:var(--primary-600);color:#fff}

/* v0.20 · 数据历史页：快照 / 回收站行 */
.hrow{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow:first-child{padding-top:0}
.hmain{min-width:0;flex:1}
.htitle{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hact{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

/* KPI */
.kpi .card{padding:12px 15px;display:flex;flex-direction:column;gap:1px}
.kpi .lb{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.3px}
.kpi .vl{font-size:23px;font-weight:700;margin:2px 0 0;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .sb2{font-size:11px;color:var(--faint)}
.kpi .vl.good{color:var(--green-600)} .kpi .vl.warn{color:var(--orange-600)} .kpi .vl.bad{color:var(--red-600)}
.red{color:var(--red-600)} .green{color:var(--green-600)} .orange{color:var(--orange-600)}

/* 表格 */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--line-2);font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f7f9fc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;
  background:var(--line-2);font-size:10.5px;font-weight:700;color:var(--muted)}
.rank.r1{background:#f6e7b2;color:#8a6100} .rank.r2{background:#e6ecf3;color:#46586c} .rank.r3{background:#f6d9cf;color:#a53a18}

/* 进度 */
.pbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.pbar i.good{background:var(--green)} .pbar i.bad{background:var(--red)}

/* 弹层：统一右侧抽屉卡片 —— 拖左缘把手改宽度，窄屏整屏（宽度逻辑见 sheetW） */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:150;display:none;--sheet-w:520px}
#mask.on{display:block}
#sheet{position:absolute;top:0;right:0;bottom:0;width:var(--sheet-w);max-width:100%;
  background:var(--bg);border-radius:10px 0 0 10px;overflow-y:auto;overflow-x:hidden;
  box-shadow:-20px 0 56px rgba(15,23,42,.22)}
#mask.on #sheet{animation:sheetIn .18s ease-out}
@keyframes sheetIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
/* 订单 / 客户详情走宽版（.wide）：宽度由 sheetW() 算好后写入 --sheet-w，类名本身只作判据 */
#sheet .hd,#dpane .hd{background:var(--panel);padding:13px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
#sheet .bd,#dpane .bd{padding:15px 18px 26px}
/* v0.53 · 题头承载操作按钮（编辑 / 删除 / 保存 / 取消）
   —— 标题让位给按钮：长标题省略号收尾，按钮一律不压缩，窄屏也不会把按钮挤出可视区 */
#sheet .hd h3,#dpane .hd h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .hd>.btn,#dpane .hd>.btn,#sheet .hd>.close,#dpane .hd>.close,#sheet .hd>.tag,#dpane .hd>.tag{flex:none}
/* 拖宽把手：独立挂在 #mask 下、贴卡片左缘 —— 在卡片外，不随卡片内容滚动 */
.dz{position:absolute;top:0;bottom:0;right:calc(var(--sheet-w) - 7px);width:14px;z-index:3;
  cursor:col-resize;display:none;touch-action:none}
#mask.on .dz{display:block}
.dz::before{content:'';position:absolute;top:50%;left:5px;width:4px;height:52px;margin-top:-26px;
  border-radius:2px;background:var(--line-2);transition:background var(--dur-1)}
.dz:hover::before,.dz.on::before{background:var(--primary)}
body.col-resizing{cursor:col-resize;user-select:none}
.close{font-size:20px;color:var(--faint);line-height:1;padding:2px 6px;border-radius:4px}
.close:hover{background:var(--line-2);color:var(--text)}
/* 分屏：宽屏下 #stage 转横向 flex，#page 与 #dpane 并排各自滚动；窄屏回落 #mask 遮罩（详情/表单共用） */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#page{min-width:0}
#dpane{display:none;min-width:0;min-height:0;overflow:auto}
#main.split #stage{flex-direction:row}
#main.split #page{flex:1 1 auto;width:auto;min-width:0;min-height:0;overflow-y:auto}
#main.split #dpane{flex:0 0 var(--sheet-w);display:block;overflow:auto;
  border-left:1px solid var(--line);background:var(--bg)}
#main.split #dpane #sheet{position:static;width:100%;height:100%;border-radius:0;box-shadow:none;overflow-y:auto;
  animation:dpaneIn .18s ease-out}
@keyframes dpaneIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
/* v0.36 · 修「分屏宽度拖不动」：flex:0 0 0 的 flex-basis 会覆盖 width，把手被压成 0 宽、
   真鼠标永远点不中（v0.34 的验证是直接向 .dvh 派发 PointerEvent，绕过了命中测试 → 假绿）。
   改 flex:0 0 auto 让 width 生效；再用 ::after 把命中区左右各扩 5px（共 19px），
   元素自身净占 1px，对布局几乎零影响。 */
.dvh{display:none;position:relative;flex:0 0 auto;width:9px;margin:0 -4px;z-index:3;cursor:col-resize;touch-action:none;
  background:linear-gradient(var(--line-2),var(--line-2)) center/2px 100% no-repeat}
.dvh::after{content:"";position:absolute;top:0;bottom:0;left:-5px;right:-5px}
#main.split .dvh{display:block}
.dvh:hover,.dvh.on{background:linear-gradient(var(--primary),var(--primary)) center/2px 100% no-repeat}

/* 表单 */
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:12px;align-items:start}
.fld{min-width:120px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;line-height:16px;min-height:16px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:6px 10px;
  background:var(--panel);width:100%;transition:border .12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)}
.fld input[readonly]{background:var(--line-2);color:var(--muted)}
.req{color:var(--red-600);margin-left:2px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red);background:#fdf7f6}
.fmsg{font-size:11px;color:var(--red-600);margin-top:3px;line-height:1.5}
.fld .tip{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.5}
.fld.full{grid-column:1/-1}
/* 字段显隐用 class 切换而非增删 DOM：避免输入过程中重建输入框导致光标/焦点丢失 */
.fld.hidden{display:none}
.fhint:empty{display:none}
code{background:var(--line-2);border-radius:3px;padding:1px 5px;font-size:12px}

/* ---------- v0.21 · 卡片与表单相对对齐 ---------- */
/* 所有输入类控件同高（--ctl-h=32px）：同一行内、以及跨卡片的填写框顶底都对齐。
   textarea 不锁高（多行内容要能撑开）。 */
.fld input:not([type=checkbox]):not([type=radio]),.fld select{height:var(--ctl-h);line-height:20px}
.fld textarea{line-height:1.6}
/* 字段里若只有一个复选框（如「启用同步」），补一个与输入框等高对齐的上边距，
   否则它会紧贴标签、比同行输入框高一截。 */
.fld > input[type=checkbox]{width:15px;height:15px;margin:9px 0 0;flex:none;accent-color:var(--primary)}
/* 卡片头 / 卡片体左右内边距统一为 15px，跨卡片的内容左边缘严格对齐 */
.card > .hd{padding:11px 15px}
.card > .bd{padding:15px}
/* 字段内出现提示行时不把控件顶歪：提示行统一贴在控件下方 */
.fld .tip,.fld .fmsg{margin-top:3px}

/* 文件控件 */
.filecard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:5px;
  padding:8px 11px;background:var(--panel)}
.filecard .fi{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary-600);font-size:10px;font-weight:700;flex:none}
.filecard .fn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .fs{font-size:11px;color:var(--faint)}
.drop{border:1.5px dashed #d7dde6;border-radius:5px;padding:15px;text-align:center;color:var(--muted);
  font-size:13px;background:#fcfdfe;cursor:pointer;transition:.12s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-600)}
.fprev{margin-top:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.fprev img{display:block;max-width:100%}
.fprev iframe{display:block;width:100%;height:420px;border:0}

/* 更多菜单 */
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:30px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;box-shadow:0 10px 34px rgba(15,23,42,.14);min-width:132px;padding:5px;z-index:10;display:none}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:left;padding:7px 10px;font-size:13px;border-radius:4px}
.menu .pop button:hover{background:var(--line-2)}
.menu .pop button.del{color:var(--red-600)}

.toast{position:fixed;right:18px;bottom:18px;z-index:300;background:var(--text);color:#fff;padding:9px 15px;
  border-radius:5px;font-size:13px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:none}
#tip{position:fixed;z-index:200;background:var(--text);color:#fff;border-radius:4px;padding:6px 9px;font-size:12px;
  pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ---------- 工具条 / 快捷筛选 ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;
  font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip:hover{border-color:#d3dae4;color:var(--text)}
.chip.on{background:var(--primary-600);border-color:var(--primary-600);color:#fff;font-weight:600}
.chip .n{opacity:.7;margin-left:4px;font-size:11px}
.chip.sm{padding:2px 10px;font-size:12px}

/* ---------- v0.23 · 多维多选筛选面板 ---------- */
.fpanel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:10px 15px 11px;margin-bottom:12px;box-shadow:var(--sh)}
.fp-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:9px;
  border-bottom:1px solid var(--line-2);margin-bottom:9px}
.fp-hd .t{font-size:13px;font-weight:700}
.fp-hd .muted{font-size:11.5px}
.fp-grp{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;padding:5px 0;
  border-top:1px dashed var(--line-2)}
.fp-grp:first-of-type{border-top:0;padding-top:1px}
.fp-grp > .lb{width:56px;flex:none;font-size:11.5px;color:var(--faint);font-weight:600;
  letter-spacing:.3px;padding-top:6px;line-height:16px}
.qk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;
  font-size:12px;color:var(--muted);height:26px;display:inline-flex;align-items:center;gap:4px}
.qbtn:hover{border-color:var(--primary);color:var(--primary-600)}
.qbtn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-600);font-weight:600}
.qbtn .n{opacity:.7;font-size:11px}
.fp-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2)}
.fp-sum .st{background:var(--primary-soft);color:var(--primary-600);border-radius:4px;
  padding:1px 8px;font-size:11.5px}
.fp-sum .st.q{background:var(--amber-soft);color:var(--amber-600)}
.fp-srch{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:3px 9px;font-size:12px;
  height:26px;width:132px;background:var(--panel)}
.fp-srch:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
/* ---------- v0.24 · 思源式条件行筛选（替代 chips） ---------- */
.condlist{display:flex;flex-direction:column;gap:7px}
.cond{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cond .c-join{width:58px;flex:none}
.cond .c-join.ph{width:58px;flex:none;font-size:12px;color:var(--faint);padding-left:2px}
.cond select{height:var(--ctl-h);border:1px solid var(--line);border-radius:var(--radius-ctl);
  background:var(--panel);color:var(--text);font-size:12.5px;padding:0 8px;max-width:190px}
.cond select:hover{border-color:#d3dae4}
.cond select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.cond .c-val{flex:1;min-width:130px;max-width:340px}
.cond .c-val input{width:100%;height:var(--ctl-h);border:1px solid var(--line);
  border-radius:var(--radius-ctl);background:var(--panel);color:var(--text);font-size:12.5px;padding:0 9px}
.cond .c-val input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.cond .c-none{display:flex;align-items:center;height:var(--ctl-h);font-size:12px;color:var(--faint)}
.cond .c-del{flex:none;width:26px;height:26px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:var(--radius-ctl);cursor:pointer;font-size:14px;line-height:1;padding:0}
.cond .c-del:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.fp-empty{font-size:12px;color:var(--faint);padding:10px 0 2px}

/* ---------- v0.32 · 配置入口 + 居中浮层 ----------
   预警规则 / 筛选条件这类「设置型」面板不再在页面上常占一块位置：
   收到工具栏的一个入口按钮上，点开在居中浮层里设置。
   ★ 浮层节点恒在 DOM 内（老回归脚本直接取 #al30 / #alSave / #fpAdd / #condList），
     只靠 .on 切换显隐 —— 不是「点开才挂载」，否则老脚本取不到节点。 */
.cfgentry{position:relative}
.cfgentry .cnt{background:var(--primary-soft);color:var(--primary-600);border-radius:9px;
  font-size:10.5px;font-weight:600;padding:1px 6px;min-width:16px;text-align:center;margin-left:2px}
.cfgentry.warn{border-color:#e0b0ab;color:var(--red-600)}
.cfgwrap{display:none}
.cfgwrap.on{display:block}
.cfgwrap>.cfgm{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:160;overscroll-behavior:contain}
/* ★ 居中刻意不用 transform：transform 会成为 fixed 子元素的包含块，
   浮层里的多选下拉就没法用 fixed 逃出 body 的 overflow 裁切。
   改用绝对定位的经典居中（inset:0 + margin:auto），不产生包含块。 */
.cfgwrap>.cfgd{position:fixed;inset:0;margin:auto;z-index:161;
  width:min(620px,calc(100vw - 28px));height:fit-content;max-height:min(84dvh,780px);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 20px 52px rgba(15,23,42,.26)}
.cfgwrap>.cfgd>.hd{padding:11px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex:none}
.cfgwrap>.cfgd>.hd h3{font-size:13.5px}
.cfgwrap>.cfgd>.bd{padding:15px;overflow:auto;flex:1;min-height:0}
/* 浮层里的表单：4 个阈值排成规整的 2×2（620px 宽下楼宽自适应会排成 3+1，看着散） */
.cfgwrap .frow{grid-template-columns:1fr 1fr}
/* 浮层里的筛选面板：去掉自带卡片外壳与重复标题（标题已在浮层头上） */
.cfgwrap .fpanel{border:0;box-shadow:none;padding:0;margin:0}
.cfgwrap .fp-hd{border-bottom:0;margin-bottom:4px;padding-bottom:0}
.cfgwrap .fp-hd .t{display:none}
/* 浮层内的多选下拉改成 fixed 由 JS 摆位 —— body 是滚动容器，
   absolute 弹层会被它的 overflow 整块裁掉（实测 192px 的弹层只露出 50px） */
.cfgwrap .msel-pop{position:fixed;left:auto;top:auto;z-index:250;
  width:max-content;min-width:180px;max-width:340px}
/* 打开浮层时锁住背后的内容区（老浏览器不支持 :has 时退化为「背后可滚」，不影响使用） */
#page:has(.cfgwrap.on){overflow:hidden}
@media(prefers-reduced-motion:no-preference){
  .cfgwrap.on>.cfgd{animation:cfgFade var(--dur-2) var(--ease-out)}
  @keyframes cfgFade{from{opacity:0}to{opacity:1}}
}
/* 窄屏：贴底升起的面板，按钮落在拇指够得到的位置 */
@media(max-width:640px){
  .cfgwrap>.cfgd{inset:auto 0 0 0;margin:0;width:auto;height:auto;
    max-height:88dvh;border-radius:10px 10px 0 0}
}
/* 多选下拉（顶栏业务员 + 条件行的枚举值共用，取代 chips） */
.msel{position:relative;display:inline-block;min-width:134px;max-width:100%}
.msel-btn{width:100%;height:var(--ctl-h);border:1px solid var(--line);border-radius:var(--radius-ctl);
  background:var(--panel);color:var(--text);font-size:12.5px;padding:0 26px 0 9px;text-align:left;
  cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel-btn:hover{border-color:#d3dae4}
.msel-btn.on{border-color:var(--primary);color:var(--primary-600);font-weight:600}
.msel-btn i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;
  font-size:10px;color:var(--faint)}
.msel-pop{display:none;position:absolute;z-index:60;top:calc(100% + 4px);left:0;min-width:100%;
  max-height:250px;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 8px 24px rgba(20,30,50,.14);padding:5px}
.msel.open .msel-pop{display:block}
.msel-pop label{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--radius-ctl);
  font-size:12.5px;cursor:pointer;white-space:nowrap}
.msel-pop label:hover{background:var(--primary-soft)}
.msel-pop input[type=checkbox]{height:13px!important;width:13px!important;min-height:0!important;
  margin:0!important;padding:0!important;flex:none;accent-color:var(--primary)}
.msel-pop .mp-search{width:100%;height:28px;border:1px solid var(--line);border-radius:var(--radius-ctl);
  padding:0 8px;font-size:12.5px;margin:0 0 4px;background:var(--panel)}
.msel-pop .mp-search:focus{outline:none;border-color:var(--primary)}
.gf .msel{width:150px}
.search{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:6px 11px;background:var(--panel);
  width:200px;font-size:13px;max-width:100%;height:var(--ctl-h)}
.search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
/* 列表内筛选下拉（订单 / 排产等） */
.lsel{border:1px solid var(--line);border-radius:var(--radius-ctl);padding:5px 8px;background:var(--panel);
  font-size:12.5px;color:var(--text);max-width:190px;height:var(--ctl-h)}
.lsel:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.dirbtn{min-width:74px;justify-content:center}
/* v0.28 · 列头点击排序：表头可点，当前排序列高亮并显示 ▲/▼，其余列悬停时淡显箭头 */
th.th-sort{cursor:pointer;user-select:none}
th.th-sort:hover{color:var(--primary-600)}
th.th-sort .sarw{font-style:normal;font-size:9px;margin-left:3px;color:var(--primary);opacity:0}
th.th-sort.on{color:var(--primary-600)}
th.th-sort.on .sarw{opacity:1}
th.th-sort:hover .sarw{opacity:.45}
.menu .pop button.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu .pop button.srow.on{color:var(--primary-600);font-weight:600;background:var(--line-2)}
.menu .pop button.srow .sarw{font-style:normal;font-size:9px;color:var(--primary)}


/* ---------- v0.26 · 排产卡片视图（按合同交期分月的看板） ---------- */
.mkan{display:flex;gap:11px;overflow-x:auto;padding:1px 1px 6px;align-items:flex-start}
.mcol{flex:0 0 226px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.mhd{display:flex;align-items:center;gap:6px;padding:2px 3px 8px;flex-wrap:wrap}
.mhd b{font-size:12.5px}
.mhd .cnt{font-size:11px;line-height:17px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:0 6px}
.mbd{display:flex;flex-direction:column;gap:7px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;
  cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s}
.mcard:hover{border-color:var(--primary);box-shadow:0 2px 7px rgba(15,23,42,.08)}
.mc-hd{display:flex;align-items:center;gap:6px;justify-content:space-between}
.mc-hd b{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-hd .tag{flex:none}
.mc-sub{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-ft{display:flex;align-items:center;gap:7px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--line)}
.mc-date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc-cd{font-size:11.5px;font-weight:600}
.mc-cd.ok{color:var(--green-600)} .mc-cd.warn{color:var(--orange-600)} .mc-cd.bad{color:var(--red-600)}
.mc-edit{margin-left:auto}
.mnone{font-size:11.5px;color:var(--faint);text-align:center;padding:12px 0}
.acts{display:flex;gap:6px;white-space:nowrap}

/* ---------- 批量修改（勾选 + Excel 式查找替换 + 一步撤销） ---------- */
th.ck,td.ck{width:36px;padding-left:12px;padding-right:2px;text-align:center}
th.ck input,td.ck input{width:auto;cursor:pointer;accent-color:var(--primary);vertical-align:middle}
tbody tr.sel,tbody tr.sel:hover{background:var(--primary-soft)}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid #d9e5f8;
  border-radius:5px;padding:8px 13px;background:var(--primary-soft);margin-bottom:12px;
  font-size:12.5px;color:var(--primary-600)}
.selbar b{color:var(--primary-600);font-variant-numeric:tabular-nums;font-size:14px}
/* v0.29：工具栏里的「已选 N 笔」轻量计数（替代原来常驻一整条的选择条） */
.chip-sel{font-size:12.5px;color:var(--primary-600);background:var(--primary-soft);
  border-radius:4px;padding:3px 9px;white-space:nowrap}
.chip-sel b{font-variant-numeric:tabular-nums;font-size:13px}
/* 行内操作列：按钮不换行，避免把行撑高 */
.ops{white-space:nowrap}
.ops .btn.xs{margin-right:4px}
/* 订单详情顶部：关键信息 + 常用操作同一条，进详情即触达 */
.odetop{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:9px 13px;margin-bottom:12px}
.odetop .k{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted)}
.odetop .k em{font-style:normal;color:var(--faint);font-size:11.5px}
.odetop .k b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.odetop .k b.bad{color:var(--red-600)}
.odetop .spacer{flex:1}
.bxopts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:12.5px;color:var(--muted)}
.bxopts label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.bxopts input[type=checkbox]{width:auto;accent-color:var(--primary)}
.bxprev{max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:5px}
.bxprev table{font-size:12.5px}
.bxprev thead th{position:sticky;top:0;z-index:1}
.ov{color:var(--muted);text-decoration:line-through}
.nv{color:var(--green-600);font-weight:600}
.bxarrow{color:var(--faint);padding:0 4px}

/* ---------- 预警列表 ---------- */
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.al:hover{background:#f7f9fc}
.al .bar{width:3px;border-radius:2px;align-self:stretch;min-height:34px;flex:none}
.al.red .bar{background:var(--red)}
.al.orange .bar{background:var(--orange)}
.al.blue .bar{background:var(--primary)}
.al .ttl{font-size:13.5px;font-weight:600}
.al .meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.al .rt{margin-left:auto;text-align:right;flex:none;padding-left:10px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{width:auto}

/* ---------- 表单：分组 + 两列紧凑排列（v0.7） ---------- */
.frow.one{grid-template-columns:1fr}
.frow.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
/* ---------- 预警中心：左右两列（回款 / 交期） ---------- */
.alcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.alcols .card{margin:0}
.alcols .card .hd{flex-wrap:wrap;row-gap:4px}
@media(max-width:680px){
  .frow.two{grid-template-columns:1fr}
}
.fsec{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.7px;
  margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.fsec:first-child{margin-top:0}
.calcbox{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--radius-ctl);
  padding:6px 10px;background:var(--line-2)}
.calcbox .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green-600);margin-left:auto}
.planbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);
  border-radius:5px;padding:10px 13px;background:#fafbfd;margin-top:2px}
.planbar .it{font-size:12.5px;color:var(--muted)}
.planbar .it b{color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- v0.19 · 系统版本页：更新日志时间轴 ---------- */
.vlog{border-left:2px solid var(--line);margin:2px 0 0 6px;padding-left:20px}
.vitem{position:relative;padding-bottom:22px}
.vitem:last-child{padding-bottom:0}
.vitem::before{content:'';position:absolute;left:-26px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2px solid var(--faint)}
.vitem.cur::before{background:var(--primary);border-color:var(--primary)}
.vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.vno{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.vdate{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.vcat{font-size:11px;padding:1px 8px;border-radius:4px;background:var(--slate-soft);color:var(--slate)}
.vlist{margin:0;padding-left:19px;font-size:13px;color:var(--muted);line-height:1.85}
.vlist li{margin-bottom:2px}
.vlist b{color:var(--text);font-weight:600}
@media(max-width:560px){ .vlog{padding-left:15px;margin-left:3px} .vitem::before{left:-21px} }

/* ---------- v0.31 · 布局重排：把「鼠标滚动」压到最低 ----------
   ① 列表：数据表在首屏内自成滚动区 + 粘性表头 —— 列表页整页零滚动，
      表头 / KPI / 工具栏永远看得见（不加 overscroll-behavior:contain，
      滚到底自然接力给页面，避免「滚不动」的陷阱感）
   ② 密度：桌面端行高与卡片内边距收紧，一屏多看好几行
   ③ 排布：看板图表两两并排、更新日志拆两列 —— 纵向段数减半 */
@media(min-width:921px){
  .tw.tscroll{max-height:var(--tbl-max);overflow:auto}
  .tw.tscroll>table>thead>tr>th{position:sticky;top:0;z-index:3}
  th,td{padding:6px 11px}
  .card>.hd{padding:9px 15px}
  .card>.bd{padding:13px 15px}
  .kpi .card{padding:10px 13px}
  .kpi .vl{font-size:21px}
  /* KPI 恒为一行：按内容宽度排布，实在放不下时横向滚动，不换行 */
  .kpi{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;padding-bottom:2px}
  .kpi>.card{flex:1 1 auto;min-width:max-content}
  /* 排产看板：列区限高，列内滚动，不再把页面拉长 */
  .mkan{max-height:calc(100dvh - 330px);overflow-y:auto}
  /* 预警中心：回款 / 交期两栏各自限高 —— 规则卡与 KPI 不被长列表推到屏幕外 */
  .alcols>.card{display:flex;flex-direction:column;max-height:calc(100dvh - 520px);min-height:200px}
  .alcols>.card>.bd{flex:1;min-height:0;overflow:auto}
  /* 更新日志：限高滚动，版本页一屏内看完 */
  .vbox{max-height:var(--tbl-max);overflow:auto}
  /* 抽屉宽度由 --sheet-w 决定（sheetW 计算），宽屏不再需要 max-width 档位 */
}
/* 更新日志双列时间轴（窄屏自动回落单列） */
.vcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:0 24px;align-items:start}
/* 回到顶部：内容区滚过一屏才出现 */
.totop{position:fixed;right:20px;bottom:calc(58px + var(--safe-b));z-index:var(--z-drawer);
  width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(15,23,42,.14);color:var(--muted);font-size:16px;line-height:1;
  display:none;align-items:center;justify-content:center;transition:color var(--dur-1),border-color var(--dur-1)}
.totop.on{display:flex}
.totop:hover{color:var(--primary-600);border-color:var(--primary)}

@media(max-width:920px){
  #sidebar{transform:translateX(-102%)}
  #sidebar.open{transform:none;box-shadow:0 0 0 100vw rgba(15,23,42,.34)}
  #main{margin-left:0}
  .hamb{display:block}
  #page{padding:12px 12px 40px}
  .c2{grid-template-columns:1fr}
  #mask{--sheet-w:100%}
  #sheet{border-radius:0}
  #mask.on .dz{display:none}
  #main.split #stage{display:block}
  #main.split #dpane{display:none}
  #main.split .dvh{display:none}
  #gfilter .inner{overflow-x:auto;flex-wrap:nowrap;align-items:flex-start}
  #gfilter .gf{min-width:auto}
  /* v0.47 · 顶栏标题：窄屏下右侧按钮区吃掉宽度，标题容器被压到 22px 宽 → 逐字竖排
     （实测 430px 视口 titleW=22 / titleH=122）。标题区自己 nowrap + 省略号，别让字换行。 */
  #topbar > div:nth-child(2){flex:1 1 auto;min-width:0}
  #topbar .spacer{flex:0 0 0}
  #topbar .ttl,#topbar .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* v0.47 · 超窄屏：顶栏三个按钮吃掉 286px，430px 机身只剩 22px 给标题（连一个字都放不下）。
   按钮瘦身（内边距 + 字号），把宽度还给标题区。 */
@media(max-width:560px){
  #topbar{padding:0 10px;gap:6px}
  #topbar .btn.sm{padding:4px 8px;font-size:11.5px;white-space:nowrap}
  #topbar > div:nth-child(2){flex:1 1 96px;min-width:0}
  /* 「重新载入」文字最长、又在窄屏最不常用（关掉重开一样刷新）→ 收成一个 ↻ 图标。
     用 font-size:0 把文字藏掉、靠 ::before 出声，按钮仍是同一个节点（aria/点击不受影响）。 */
  #topbar #btnRefresh{font-size:0;padding:4px 9px}
  #topbar #btnRefresh::before{content:"↻";font-size:14px;line-height:1}
  #topbar .sub{display:none}
}

/* ---------- v0.35 · 可拖列宽 / 分页 / 可直接编辑属性面板 ---------- */
/* 可拖列宽：th 带 sticky+z-index 会自成层叠上下文，把手必须收在本列 th 内（right:0），
   跨到相邻列会被后一列 th 盖住、鼠标点不中。把手是空元素，不进 th.textContent（保住 ▲/▼）。 */
table.rz-ready{table-layout:fixed;width:max-content;min-width:100%}
table.rz-ready th,table.rz-ready td{overflow:hidden;text-overflow:ellipsis}
th.c-rz{position:sticky}
th.c-rz>.rz{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
th.c-rz>.rz::after{content:"";position:absolute;right:1px;top:7px;bottom:7px;width:2px;border-radius:2px;background:transparent;transition:background var(--dur-1)}
th.c-rz>.rz:hover::after,th.c-rz>.rz.on::after{background:var(--primary-600)}
body.col-rz{user-select:none}
body.col-rz,body.col-rz *{cursor:col-resize!important}

/* 分页条 */
.pager2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 15px 12px}
.pager2 .pl{font-size:12px;color:var(--muted)}
.pager2 .pr2{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pg2{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-ctl);padding:3px 9px;font-size:12.5px;color:var(--text);cursor:pointer;min-width:30px;text-align:center}
.pg2:hover:not(:disabled){background:var(--line-2)}
.pg2:disabled{opacity:.42;cursor:default}
.pg2.on{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.pg2.gap{border:none;background:none;cursor:default;padding:3px 2px;color:var(--muted)}

/* 可直接编辑属性面板（Notion 式：点字段即改，无边框，悬停/聚焦才显形） */
.pp{display:flex;flex-direction:column}
.pp-grp{margin-bottom:16px}
.pp-gt{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:0 0 6px}
.pp-row{display:flex;align-items:flex-start;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line-2)}
.pp-row:last-child{border-bottom:none}
.pp-k{flex:0 0 88px;font-size:12.5px;color:var(--muted);line-height:32px}
.pp-v{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.pp-in,.pp-sel{border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 8px;font-size:13px;color:var(--text);width:100%;font-family:inherit;line-height:1.5}
.pp-in:hover,.pp-sel:hover{border-color:var(--line)}
.pp-in:focus,.pp-sel:focus{border-color:var(--primary);background:var(--panel);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.pp-in::placeholder{color:var(--muted)}
.pp-sel{cursor:pointer}
.pp-in[type=number],.pp-in.ro{font-variant-numeric:tabular-nums}
.pp-ro{font-size:13px;line-height:32px;color:var(--text);padding-left:8px}
.pp-ro .muted{font-size:11.5px;margin-left:6px}
.pp-add{flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer;line-height:1}
.pp-add:hover{color:var(--primary-600);border-color:var(--primary)}
.pp-rec{border-bottom:1px solid var(--line-2);padding:7px 0}
.pp-rec:last-child{border-bottom:none}
.pp-rec .t{font-size:12.5px;display:flex;align-items:center;gap:6px}
.pp-rec .s{font-size:11.5px;color:var(--muted);margin-top:2px}
/* 窄屏：属性面板标签列收窄，值列仍占满；顶部关键信息带自动换行 */
@media(max-width:560px){.pp-k{flex:0 0 74px;font-size:12px}.pp-row{gap:8px}}
/* ==========================================================================
   v0.38 · iOS 皮肤（覆盖层）
   —— 只改观感：圆角 / 填充 / 阴影 / 层级 / 控件形态。**不改任何类名与 DOM 结构**，
      高度类变量保持既有量级，底部留白仍由 fitPageH() 实测兜底
      （真机复验 _scratch/_verify_v036_layout.js）。
      硬编码色（#fff / #d3dae4 / #f7f9fc …）在此统一收口成 token，深色档才跟着走。
   ========================================================================== */
html{color-scheme:light dark}

/* --- 侧栏：iOS 分组导航 --- */
#sidebar{background:var(--panel)}
.sb-logo{border-bottom:1px solid var(--line);padding:15px 17px}
.sb-nav .grp{color:var(--faint);font-size:11px;letter-spacing:.3px;font-weight:600;padding:13px 12px 5px}
.sb-nav a{border-radius:var(--radius-ctl);padding:9px 12px;font-size:14px;gap:11px;color:var(--text)}
.sb-nav a:hover{background:var(--fill-3);color:var(--text)}
.sb-nav a.on{background:var(--accent-fill);color:var(--on-accent)}
.sb-nav a.on .cnt{background:rgba(255,255,255,.25);color:var(--on-accent)}
.sb-nav a .cnt{background:var(--fill-2);color:var(--muted);border-radius:999px;font-weight:600;font-size:10.5px}
.sb-foot{border-top:1px solid var(--line)}

/* --- 顶栏 / 全局筛选栏 --- */
header.stick{background:var(--panel);border-bottom:1px solid var(--line)}
#topbar{border-bottom:1px solid var(--line-2);padding:0 20px}
#topbar .ttl{font-size:19px;font-weight:700;letter-spacing:-.3px}
#topbar .sub{font-size:12px;color:var(--faint)}
.hamb{border:0;background:var(--fill-2);border-radius:var(--radius-ctl);padding:6px 11px;font-size:16px}
#gfilter{background:var(--panel);border-bottom:1px solid var(--line)}
.gf-label{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:0}
.gf input,.gf select{border:0;background:var(--fill-2);border-radius:var(--radius-ctl);padding:6px 10px}
.gf input:focus,.gf select:focus{outline:none;background:var(--panel);box-shadow:0 0 0 3.5px var(--primary-soft)}

/* --- 分段控件：iOS Segmented Control --- */
.seg{border:0;background:var(--fill-2);border-radius:var(--radius-ctl);padding:2px;gap:2px}
.seg button{border-right:0;border-radius:calc(var(--radius-ctl) - 3px);color:var(--text);
  transition:background var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
.seg button:hover{background:transparent;color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow-1)}
@media (prefers-color-scheme: dark){ .seg button.on{background:#48484a} }

/* --- 按钮 --- */
.btn{border:0;background:var(--fill-2);color:var(--text);border-radius:var(--radius-ctl);
  padding:7px 14px;font-size:13.5px;font-weight:500;box-shadow:none}
.btn:hover{background:var(--fill-1);color:var(--text)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-fill);filter:brightness(1.08)}
.btn.danger{background:transparent;color:var(--red-600)}
.btn.danger:hover{background:var(--red-soft);color:var(--red-600);border-color:transparent}
.btn.sm{border-radius:var(--radius-ctl);padding:4px 11px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* --- 卡片：iOS 分组卡片 --- */
.card{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);background:var(--panel)}
.card .hd{border-bottom:1px solid var(--line-2);padding:12px 16px}
.card .hd h3{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.card .bd{padding:16px}
.sec{color:var(--faint);font-weight:600;letter-spacing:.2px;font-size:12px}
.hint{background:var(--inset-bg);border:1px solid var(--line-2);border-radius:var(--radius-ctl)}

/* --- 标签 / 徽标 --- */
.tag{border-radius:999px;padding:2px 10px;font-weight:600;font-size:11px}
.tag.solid-primary{background:var(--accent-fill);color:var(--on-accent)}
.tag.solid-green{background:var(--fill-green);color:var(--on-accent)}
.tag.solid-red{background:var(--fill-red);color:var(--on-accent)}
.tag.solid-slate{background:var(--fill-slate);color:var(--on-accent)}
.rank{border-radius:6px}
.rank.r1{background:var(--rank1-bg);color:var(--rank1-fg)}
.rank.r2{background:var(--rank2-bg);color:var(--rank2-fg)}
.rank.r3{background:var(--rank3-bg);color:var(--rank3-fg)}

/* --- 表格：iOS 内嵌列表 --- */
th{background:var(--line-2);color:var(--muted);font-weight:600;letter-spacing:0}
th,td{border-bottom:1px solid var(--line-2)}
tbody tr:hover{background:var(--row-hover)}
.al:hover{background:var(--row-hover)}
.cfrow:hover{background:var(--row-hover)}

/* --- 输入控件 --- */
.fld label{font-size:11.5px;color:var(--faint);font-weight:600}
.fld input,.fld select,.fld textarea{border:0;background:var(--fill-2);border-radius:var(--radius-ctl);padding:8px 11px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:transparent;background:var(--panel);
  box-shadow:0 0 0 3.5px var(--primary-soft)}
.fld input[readonly]{background:var(--fill-3);color:var(--muted)}
.fld.err input,.fld.err select,.fld.err textarea{background:var(--err-bg);box-shadow:inset 0 0 0 1.5px var(--red)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary)}
.calcbox{border:0;background:var(--line-2);border-radius:var(--radius-ctl)}
.planbar{border:0;background:var(--inset-bg);border-radius:var(--radius-ctl)}
code{background:var(--fill-2);border-radius:5px;padding:1px 6px}
.selbar{border-color:var(--selbar-line)}
.cond select:hover,.msel-btn:hover{border-color:var(--line-hover)}
.cfgentry.warn{border-color:var(--warn-line);color:var(--red-600)}
.chip{border:0;background:var(--fill-2);border-radius:999px}
.chip:hover{background:var(--fill-1);color:var(--text)}
.chip.on{background:var(--accent-fill);color:var(--on-accent)}
.pg2.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}

/* --- 抽屉 / 分屏 --- */
#mask{background:var(--scrim)}
#sheet{border-radius:20px 0 0 20px;box-shadow:var(--shadow-3);background:var(--bg)}
#sheet .hd,#dpane .hd{background:var(--panel);border-bottom:1px solid var(--line)}
#dpane{background:var(--bg)}
#main.split #dpane{border-left:1px solid var(--line);background:var(--bg)}
.close{background:var(--fill-2);border-radius:999px;width:28px;height:28px;display:flex;
  align-items:center;justify-content:center;font-size:16px;padding:0}
.close:hover{background:var(--fill-1);color:var(--text)}
.dz::before{background:var(--fill-1)}
.dz:hover::before,.dz.on::before{background:var(--primary)}
.drop{border:1.5px dashed var(--drop-line);background:var(--drop-bg);border-radius:var(--radius-ctl)}
.fprev{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius-ctl)}
.totop{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-2);
  width:40px;height:40px;border-radius:999px}
.totop:hover{color:var(--primary-600);border-color:var(--primary)}

/* --- 说明图标 / 气泡 --- */
.ii{border:0;background:var(--fill-2);color:var(--muted);font-size:10px}
.ii:hover,.ii.on{background:var(--primary-soft);color:var(--primary-600)}
.ii.warn{background:var(--red-soft);color:var(--red-600)}
.ii.warn:hover,.ii.warn.on{background:var(--fill-red);color:var(--on-accent)}
.ii-t{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-ctl);box-shadow:var(--shadow-2)}
.toast{background:var(--toast-bg);color:var(--toast-fg);border-radius:var(--radius-ctl);box-shadow:var(--shadow-2)}
#tip{background:var(--toast-bg);color:var(--toast-fg);border-radius:8px}

/* --- 图表 / 进度 / 时间轴 --- */
.pbar{background:var(--fill-2)}
.gl-legend i{box-shadow:0 0 0 1px var(--line-2)}
.vlog{border-left-color:var(--line)}
.vitem::before{background:var(--panel);border-color:var(--decor)}
.hrow{border-bottom:1px solid var(--line-2)}
.note,.mc-line{color:var(--muted)}

/* --- v0.38 · 智能录入助手 --- */
.nlacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:6px 18px}
.nlrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;
  padding:7px 0;border-bottom:1px solid var(--line-2)}
.nlrow .nlk{font-size:11.5px;color:var(--faint);font-weight:600;padding-top:10px}
.nlrow .nlv{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nlrow input,.nlrow select{flex:1 1 130px;min-width:0;border:0;background:var(--fill-2);
  border-radius:var(--radius-ctl);padding:7px 10px;height:var(--ctl-h);font-size:13.5px;color:var(--text)}
.nlrow input:focus,.nlrow select:focus{outline:none;background:var(--panel);box-shadow:0 0 0 3.5px var(--primary-soft)}
.nlrow.bad .nlk{color:var(--red-600)}
.nlrow.bad input,.nlrow.bad select{background:var(--err-bg);box-shadow:inset 0 0 0 1.5px var(--red)}
.nlok{font-size:12px;color:var(--green-600);font-variant-numeric:tabular-nums}
.nlcand{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.nlpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px}
.nlmini{font-size:11.5px;color:var(--faint);width:100%;line-height:1.6}
textarea#nlIn{width:100%;border:0;background:var(--fill-2);border-radius:var(--radius-ctl);
  padding:10px 12px;line-height:1.7;resize:vertical;min-height:76px;color:var(--text)}
textarea#nlIn:focus{outline:none;background:var(--panel);box-shadow:0 0 0 3.5px var(--primary-soft)}
@media(max-width:560px){.nlrow{grid-template-columns:1fr;gap:2px}.nlrow .nlk{padding-top:0}}

/* ==========================================================================
   v0.43 · 排产单号（一订单 → N 单号）
   1) chips 多值输入：订单表单里录入多个排产单号
   2) 待排产标记：已签约但一条排产记录都没有
   3) 重复单号提示条：单号要求全局唯一，检出重复只提示、不改数据
   ========================================================================== */
.mo-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);
  border-radius:var(--radius-ctl);padding:5px 7px;min-height:var(--ctl-h);background:var(--panel)}
.mo-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.mo-box input{flex:1 1 130px;min-width:110px;border:0;outline:0;background:transparent;
  font-size:13.5px;height:22px;padding:0;color:var(--text)}
.mo-chip{display:inline-flex;align-items:center;gap:2px;background:var(--fill-2);border:1px solid var(--line);
  border-radius:8px;padding:2px 3px 2px 8px;font-size:12.5px;font-weight:600;max-width:100%}
.mo-chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.mo-chip .mo-x{border:0;background:transparent;cursor:pointer;color:var(--faint);
  font-size:14px;line-height:1;padding:0 3px;border-radius:5px}
.mo-chip .mo-x:hover{background:var(--red-soft);color:var(--red)}
.mo-hint{color:var(--faint);font-size:12.5px}
.tag.t-need{background:transparent;color:var(--orange-600);border:1px dashed var(--orange)}
.dupbanner{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--warn-line);
  background:var(--red-soft);color:var(--red-600);border-radius:var(--radius-ctl);
  padding:8px 11px;font-size:12.5px;margin:0 0 10px;line-height:1.7}
.dupbanner b{font-weight:700}
.dupbanner .dp-list{margin-top:3px;display:flex;flex-direction:column;gap:3px}
.dupbanner .dp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dupbanner .mo-jump{cursor:pointer;color:var(--primary);font-weight:600}
.dupbanner .mo-jump:hover{text-decoration:underline}
.dupbanner .dp-ords{color:var(--muted)}
.dupbanner .dp-ign{margin-top:4px;font-size:11.5px;color:var(--muted)}
.dupbanner .dp-ign .btn{margin-left:4px}
/* 全部被忽略时的极简回执 —— 留一条恢复入口，否则用户再也没有地方把它放回来 */
.dupbanner.quiet{border-color:var(--line);background:var(--slate-soft);color:var(--muted)}
.fld.locked > input{background:var(--slate-soft);color:var(--faint);cursor:not-allowed}
.pp-v .mo-jump{cursor:pointer;color:var(--primary);font-weight:600}
.pp-v .mo-jump:hover{text-decoration:underline}

/* ==========================================================================
   v0.47 · 产品库：列表缩略图 / 详情画廊 / 表单图片网格
   ========================================================================== */
.pth{cursor:pointer;user-select:none;white-space:nowrap}
.pth .sarrow{display:inline-block;min-width:9px;color:var(--faint);font-size:10px;margin-left:2px}
.pth.on,.pth.on .sarrow{color:var(--accent-fill)}
/* 产品图列：宽度必须钉死 —— table-layout 是 auto，只给 width 会被内容挤扁，
   表现成「无图」两个字被压成竖排。min/max 一起写才能稳住。 */
.pcell{width:56px;min-width:56px;max-width:56px;padding:6px 4px 6px 10px !important}
.pthumb{width:40px;height:40px;flex:none;border-radius:8px;overflow:hidden;background:var(--fill-3);
  display:flex;align-items:center;justify-content:center}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .pnoimg{font-size:9px;line-height:1;color:var(--decor);white-space:nowrap}
.pnm{font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmdl{font-variant-numeric:tabular-nums}
.punit{font-size:11px;margin-left:3px}
/* 详情画廊：左侧主图 + 右侧缩略图条 */
.pgallery{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.pmain{width:240px;height:240px;border-radius:var(--radius);overflow:hidden;background:var(--fill-3);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pmain img{width:100%;height:100%;object-fit:contain;display:block}
.pnoimg.big{font-size:12px;color:var(--faint);text-align:center;line-height:1.7}
.pstrip{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;max-width:440px}
.pstrip-i{width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;
  background:var(--fill-3);padding:0;cursor:pointer}
.pstrip-i.on{border-color:var(--accent-fill)}
.pstrip-i img{width:100%;height:100%;object-fit:cover;display:block}
/* 表单图片网格 */
.pimgrid{display:flex;flex-wrap:wrap;gap:8px}
.pimg{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;
  background:var(--fill-3);border:1px solid var(--line-2)}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pmainbadge{position:absolute;left:0;bottom:0;background:var(--accent-fill);color:var(--on-accent);
  font-size:10px;padding:1px 6px;border-radius:0 6px 0 6px}
.pimgx{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0}
.pimgx:hover{background:var(--red)}
.pimgup{position:absolute;left:0;bottom:0;width:100%;border:0;background:rgba(0,0,0,.5);color:#fff;
  font-size:10px;padding:2px 0;cursor:pointer;opacity:0;transition:opacity .15s}
.pimg:hover .pimgup{opacity:1}
.pimgadd{width:88px;height:88px;border-radius:10px;border:1px dashed var(--line);background:transparent;
  color:var(--faint);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;padding:0}
.pimgadd span{font-size:11px}
.pimgadd:hover{border-color:var(--accent-fill);color:var(--accent-fill)}
.pimg-broken{opacity:.25}
.pkbox{display:flex;flex-direction:column;gap:8px}
.fhint-s{font-weight:400;color:var(--faint);font-size:11px;margin-left:4px}

/* ---------- v0.48 · 产品表文字对齐（左 / 中 / 右，整表切换并记忆） ----------
   特异性 (0,1,2) 高于 .num 的 (0,1,0)，所以数字列也会跟着对齐走 —— 用户手动选的
   对齐方式优先于「数字默认右对齐」这条历史约定。缩略图是 flex 子项，text-align
   管不到，单独补 margin。 */
table[data-al] th,table[data-al] td{text-align:left}
table[data-al="center"] th,table[data-al="center"] td{text-align:center}
table[data-al="right"] th,table[data-al="right"] td{text-align:right}
table[data-al="center"] .pcell .pthumb{margin:0 auto}
table[data-al="right"] .pcell .pthumb{margin-left:auto}
/* 导入 / 导出下拉：工具栏里只占一个按钮位 */
.iomenu{position:relative;display:inline-block}
.iomenu-bd{position:absolute;right:0;top:calc(100% + 4px);z-index:40;min-width:248px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;
  box-shadow:0 10px 28px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:1px}
.iomenu-bd[hidden]{display:none}
.iomenu-bd button{display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:7px 10px;border-radius:5px;font-size:12.5px;color:var(--text);cursor:pointer}
.iomenu-bd button:hover{background:var(--fill-2)}
.iomenu-bd .io-tip{padding:7px 10px 3px;font-size:11px;color:var(--faint);
  border-top:1px solid var(--line-2);margin-top:2px;line-height:1.5}
/* 产品图网格接收拖拽时的高亮；add 按钮里补一行小字说明可拖入 / 粘贴 */
.pimgrid.dz{outline:2px dashed var(--accent-fill);outline-offset:3px;border-radius:var(--radius)}
.pimgadd em{font-style:normal;font-size:10px;color:var(--faint);line-height:1.25}

/* ---------- v0.51 · 产品图放大预览 ----------
   遮罩用 position:fixed + 高层级，不被 .tw / .card 的 overflow 裁掉。
   可点的三处只给「图片本身」上放大镜光标 —— 列表里没图的那格是 span，不该暗示能点。
   点击判定走【捕获阶段】：列表行自己绑了 tr.onclick=打开详情，冒泡阶段再拦已经晚了。 */
.pthumb img,.pmain img,.pimg img{cursor:zoom-in}
body.zooming{cursor:zoom-out}
#imgZoom{position:fixed;inset:0;z-index:120;background:rgba(10,15,24,.86);
  display:none;align-items:center;justify-content:center;padding:32px 24px 56px}
#imgZoom.on{display:flex}
#imgZoom img{max-width:92vw;max-height:calc(100dvh - 112px);object-fit:contain;
  background:var(--panel);border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,.46);cursor:zoom-out}
#imgZoom .iz-x{position:absolute;top:16px;right:18px;width:32px;height:32px;border:0;
  border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#imgZoom .iz-x:hover{background:rgba(255,255,255,.3)}
#imgZoom .iz-tip{position:absolute;left:0;right:0;bottom:18px;text-align:center;
  font-size:12px;color:rgba(255,255,255,.66);pointer-events:none;letter-spacing:.2px}

/* --- v0.54 · 顶栏当日日期（星期） --- */
#topbar .today{display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:5px 10px;border-radius:999px;background:var(--fill-2);color:var(--muted);
  font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.2px}
#topbar .today .dt-dow{color:var(--faint);font-weight:500}
#topbar .today .dt-short,#topbar .today .dt-min{display:none}
#topbar .today.today-red .dt-dow,#topbar .today.today-red .dt-min{color:var(--red-600)}
@media (max-width:1080px){
  #topbar .today{padding:4px 8px;font-size:11px;gap:4px}
  #topbar .today .dt-long{display:none}
  #topbar .today .dt-short{display:inline}
}
/* 430px 级别的手机上「10-20 周二」会挤掉页面标题（实测只剩一个字），再收一档只留星期 */
@media (max-width:600px){
  #topbar .today{padding:3px 6px;font-size:10.5px;gap:0}
  #topbar .today .dt-short{display:none}
  #topbar .today .dt-min{display:inline}
  /* 日期胶囊占的位置只能从别处省：智能录入收成图标（与 btnRefresh 同一招，title 已带说明），
     否则 375px 下标题容器会被压到 0 宽、一个字都看不见 */
  #topbar #btnAssist{font-size:0;padding:4px 9px}
  #topbar #btnAssist::before{content:"✨";font-size:13px;line-height:1}
  #topbar #btnNew{padding:4px 10px;font-size:12px}
}
/* 375px（iPhone SE 级别）标题只剩 75px，19px 四个字差一点点 → 降一档字号，保住完整页名 */
@media (max-width:400px){
  #topbar .ttl{font-size:16px}
}

/* --- v0.54 · 侧栏工作台名：可重命名 --- */
.sb-logo .sb-name{flex:1 1 auto;min-width:0}
.sb-logo .sb-ren{flex:none;border:0;background:transparent;color:var(--faint);
  width:24px;height:24px;border-radius:var(--radius-ctl);cursor:pointer;
  font-size:13px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s,background .15s}
.sb-logo:hover .sb-ren,.sb-logo .sb-ren:focus-visible{opacity:1}
.sb-logo .sb-ren:hover{background:var(--fill-2);color:var(--text)}
.sb-logo .t[data-ren]{cursor:text}
@media (hover:none), (max-width:820px){ .sb-logo .sb-ren{opacity:.55} }
/* --- v0.55 · 回款流水（汇总条 / 明细列表 / 发货进度） --- */
.payhd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 12px;margin-bottom:12px;
  border:1px solid var(--line-2);border-radius:var(--radius);background:var(--fill-3)}
.payhd .pk{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.payhd .pk em{font-style:normal;font-size:11.5px;color:var(--faint)}
.payhd .pk b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.payhd .pk b.green{color:var(--green-600)}
.payhd .pk b.red{color:var(--red-600)}
.paylist{max-height:38vh;overflow:auto;border:1px solid var(--line-2);border-radius:var(--radius);padding:2px 12px}
.paylist .empty{padding:16px 0}
/* 发货进度条：与排产进度同形，超发时用琥珀色告警 */
.shipsum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 10px;margin-bottom:8px;
  border-radius:var(--radius-ctl);background:var(--fill-3);font-size:12px;color:var(--muted)}
.shipsum b{color:var(--text);font-variant-numeric:tabular-nums}
.shipsum .pbar{flex:1;min-width:80px}
.shipsum.over{background:var(--amber-soft)}
.shipsum.over b{color:var(--amber-600)}
